dialogue:[
{speaker:"A",c:"你嚟中國學習都已經一年幾喇，對中國文化有乜嘢最深刻嘅感受啊？",j:"nei5 lai4 zung1 gwok3 hok6 zaap6 dou1 ji5 ging1 jat1 nin4 gei2 laa3, deoi3 zung1 gwok3 man4 faa3 jau5 mat1 je5 zeoi3 sam1 hak1 ge3 gam2 sau6 aa3",e:"You have been studying in China for over a year now. What has been your deepest impression of Chinese culture?"},
{speaker:"B",c:"我覺得中國文化真係好重視「人際關係」同埋「禮節」。無論喺家庭、學校定係社會上，都好講求尊重長輩，同埋互相關心照顧。好似平時同人見面要主動打招呼、食飯嗰陣會幫人夾餸、過時過節又會問候親戚朋友，呢啲細節都令我感受到中國人好重感情。",j:"ngo5 gok3 dak1 zung1 gwok3 man4 faa3 zan1 hai6 hou2 zung6 si6 jan4 zai3 gwaan1 hai6 tung4 maai4 lai5 zit3. mou4 leon6 hai2 gaa1 ting4, hok6 haau6 ding6 hai6 se5 wui2 soeng6, dou1 hou2 gong2 kau4 zyun1 zung6 zoeng2 bui3, tung4 maai4 wu6 soeng1 gwaan1 sam1 ziu3 gu3. hou2 ci5 ping4 si4 tung4 jan4 gin3 min6 jiu3 zyu2 dung6 daa2 ziu1 fu1, sik6 faan6 go2 zan6 wui5 bong1 jan4 gaap3 sung3, gwo3 si4 gwo3 zit3 jau6 wui5 man6 hau6 can1 cik1 pang4 jau5, ne1 di1 sai3 zit3 dou1 ling6 ngo5 gam2 sau6 dou3 zung1 gwok3 jan4 hou2 zung6 gam2 cing4",e:"I think Chinese culture really values interpersonal relationships and etiquette. Whether in the family, at school, or in society, there is a strong emphasis on respecting elders and caring for each other. For example, greeting people proactively when meeting, helping serve food during meals, and visiting relatives and friends during festivals — these details make me feel Chinese people place great importance on emotions and relationships."},
{speaker:"A",c:"的確係咁，其實好多外國人初初接觸中國文化嘅時候，都會對呢方面印象特別深。咁呢一點同你哋國家有乜嘢唔同啊？",j:"dik1 kok3 hai6 gam2, kei4 sat6 hou2 do1 ngoi6 gwok3 jan4 co1 co1 zip3 zyu1 zung1 gwok3 man4 faa3 ge3 si4 hau6, dou1 wui5 deoi3 ne1 fong1 min6 jan3 zoeng6 dak6 bit6 sam1. gam2 ne1 jat1 dim2 tung4 nei5 dei6 gwok3 gaa1 jau5 mat1 je5 m4 tung4 aa3",e:"Indeed. Actually many foreigners, when first exposed to Chinese culture, are especially impressed by this aspect. How is this different from your country?"},
{speaker:"B",c:"喺我哋國家，大家通常會比較重視個人空間同埋個人自由。好多時每個人都有自己嘅生活節奏，唔會太干涉對方。但喺中國，人哋更加強調集體意識同家庭觀念，做乜嘢事都會先考慮身邊人嘅感受，尤其係家人嘅意見。",j:"hai2 ngo5 dei6 gwok3 gaa1, daai6 gaa1 tung1 soeng4 wui5 bei2 gaau3 zung6 si6 go3 jan4 hung1 gaan1 tung4 maai4 go3 jan4 zi6 jau4. hou2 do1 si4 mui5 go3 jan4 dou1 jau5 zi6 gei2 ge3 sang1 wut6 zit3 zau3, m4 wui5 taai3 gon1 sip6 deoi3 fong1. daan6 hai2 zung1 gwok3, jan4 dei6 gang3 gaa1 koeng4 diu6 zaap6 tai2 ji3 sik1 tung4 gaa1 ting4 gun1 nim3, zou6 mat1 je5 si6 dou1 wui5 sin1 haau2 leoi6 san1 bin1 jan4 ge3 gam2 sau6, jau4 kei4 hai6 gaa1 jan4 ge3 ji3 gin3",e:"In my country, people generally value personal space and personal freedom more. Often everyone has their own life rhythm and does not interfere too much with others. But in China, people emphasize collective consciousness and family values more — whatever they do, they first consider the feelings of those around them, especially family members' opinions."},
{speaker:"A",c:"例如呢？你有冇遇過一啲特別深刻嘅情況？",j:"lai6 jyu4 ne1? nei5 jau5 mou5 jyu6 gwo3 jat1 di1 dak6 bit6 sam1 hak1 ge3 cing4 fong3",e:"For example? Have you encountered any particularly memorable situations?"},
{speaker:"B",c:"有啊。例如有一次我同中國同學一齊做小組報告，大家會一齊討論到好夜，仲會互相幫忙修改內容。我本來以為做完自己部分就可以，但佢哋覺得團隊合作好重要，要一齊完成先算真正做好件事。雖然一開始我有少少唔習慣，但慢慢開始明白點解中國人咁重視集體合作。",j:"jau5 aa3. lai6 jyu4 jau5 jat1 ci3 ngo5 tung4 zung1 gwok3 tung4 hok6 jat1 cai4 zou6 siu2 zou2 bou3 gou3, daai6 gaa1 wui5 jat1 cai4 tou2 leon6 dou3 hou2 je6, zung6 wui5 wu6 soeng1 bong1 mong4 sau1 goi2 noi4 jung4. ngo5 bun2 loi4 ji5 wai4 zou6 jyun4 zi6 gei2 bou6 fan6 zau6 ho2 ji5, daan6 keoi5 dei6 gok3 dak1 tyun4 dei6 hap6 zok3 hou2 zung6 jiu3, jiu3 jat1 cai4 jyun4 sing4 sin1 syun3 zan1 zing3 zou6 hou2 gin6 si6. seoi1 jin4 jat1 hoi1 ci2 ngo5 jau5 siu2 siu2 m4 zaap6 gwaan3, daan6 maan6 maan2 hoi1 ci2 ming4 baak6 dim2 gaai2 zung1 gwok3 jan4 gam3 zung6 si6 zaap6 tai2 hap6 zok3",e:"Yes. For example, once when I was doing a group presentation with Chinese classmates, everyone discussed late into the night and helped each other revise the content. I originally thought finishing my own part would be enough, but they felt teamwork was very important — it only truly counted if everyone completed it together. Although at first I was a bit unaccustomed, I gradually started to understand why Chinese people value collective cooperation so much."},
{speaker:"A",c:"聽落你都學到唔少嘢喎。咁你而家適應咗呢種文化嘅差異未啊？",j:"teng1 lok6 nei5 dou1 hok6 dou2 m4 siu2 je5 wo3. gam2 nei5 ji4 gaa1 sik1 jing3 zo2 ne1 zung2 man4 faa3 ge3 caa1 ji3 mei6 aa3",e:"It sounds like you have learned quite a lot. So have you adapted to this cultural difference now?"},
{speaker:"B",c:"而家已經適應咗好多喇，不過一開始真係有少少唔習慣。例如過節嗰陣，要去探親戚朋友，又或者成日有聚會。我以前比較鍾意安靜，同埋習慣自己一個人生活，所以初初覺得有啲熱鬧得滯。",j:"ji4 gaa1 ji5 ging1 sik1 jing3 zo2 hou2 do1 laa3, bat1 gwo3 jat1 hoi1 ci2 zan1 hai6 jau5 siu2 siu2 m4 zaap6 gwaan3. lai6 jyu4 gwo3 zit3 go2 zan6, jiu3 heoi3 taam3 can1 cik1 pang4 jau5, jau6 waak6 ze2 sing4 jat6 jau5 zeoi6 wui6. ngo5 ji5 cin4 bei2 gaau3 zung1 ji3 on1 zing6, tung4 maai4 zaap6 gwaan3 zi6 gei2 jat1 go3 jan4 sang1 wut6, so2 ji5 co1 co1 gok3 dak1 jau5 di1 jit6 naau6 dak1 zai6",e:"I have adapted a lot now, but at first I really was a bit unaccustomed. For example, during festivals I would have to visit relatives and friends, or there would be constant gatherings. I used to prefer quiet and was used to living alone, so at first I found it a bit too lively."},
{speaker:"A",c:"哈哈，咁而家呢？",j:"haa1 haa1, gam2 ji4 gaa1 ne1",e:"Haha, and now?"},
{speaker:"B",c:"而家反而開始享受呢種感覺。尤其係過農曆新年嗰陣，我第一次同中國朋友一齊食團年飯、睇春晚、放煙花，氣氛真係好熱鬧。我發現大家聚埋一齊食飯、傾偈，其實真係可以拉近人與人之間嘅距離，令人覺得好有歸屬感。",j:"ji4 gaa1 faan2 ji4 hoi1 ci2 hoeng2 sau6 ne1 zung2 gam2 gok3. jau4 kei4 hai6 gwo3 nung4 lik6 san1 nin4 go2 zan6, ngo5 dai6 jat1 ci3 tung4 zung1 gwok3 pang4 jau5 jat1 cai4 sik6 tyun4 nin4 faan6, tai2 ceon1 maan5, fong3 jin1 faa1, hei3 fan1 zan1 hai6 hou2 jit6 naau6. ngo5 faat3 jin6 daai6 gaa1 zeoi6 maai4 jat1 cai4 sik6 faan6, king1 gai2, kei4 sat6 zan1 hai6 ho2 ji5 laa1 gan6 jan4 jyu5 jan4 zi1 gaan1 ge3 kui5 lei5, ling6 jan4 gok3 dak1 hou2 jau5 gwai1 suk6 gam2",e:"Now I have actually started to enjoy this feeling. Especially during Lunar New Year — the first time I ate reunion dinner, watched the Spring Festival Gala, and set off fireworks with Chinese friends, the atmosphere was truly lively. I discovered that gathering together to eat and chat can really bridge the distance between people and gives you a strong sense of belonging."},
{speaker:"A",c:"咁睇嚟你已經慢慢融入咗中國嘅生活方式。",j:"gam2 tai2 lai4 nei5 ji5 ging1 maan6 maan2 jung4 jap6 zo2 zung1 gwok3 ge3 sang1 wut6 fong1 sik1",e:"It seems you have gradually integrated into the Chinese way of life."},
{speaker:"B",c:"係啊，而且我覺得中國人一般都好熱情。當我遇到困難嘅時候，老師同同學都會主動幫我。例如我啱啱嚟中國嗰陣，對好多生活習慣都唔熟悉，連點樣用手機支付都唔係好識，身邊啲朋友就會耐心教我，所以我真係好感激。",j:"hai6 aa3, ji4 ce2 ngo5 gok3 dak1 zung1 gwok3 jan4 jat1 bun1 dou1 hou2 jit6 cing4. dong1 ngo5 jyu6 dou2 kwan3 naan4 ge3 si4 hau6, lou5 si1 tung4 tung4 hok6 dou1 wui5 zyu2 dung6 bong1 ngo5. lai6 jyu4 ngo5 ngaam1 ngaam1 lai4 zung1 gwok3 go2 zan6, deoi3 hou2 do1 sang1 wut6 zaap6 gwaan3 dou1 m4 suk6 zik1, lin4 dim2 joeng6 jung6 sau2 gei1 zi1 fu6 dou1 m4 hai6 hou2 sik1, san1 bin6 di1 pang4 jau5 zau6 wui5 noi6 sam1 gaau3 ngo5, so2 ji5 ngo5 zan1 hai6 hou2 gam2 gik1",e:"Yes, and I think Chinese people are generally very warm. When I encountered difficulties, teachers and classmates would proactively help me. For example, when I first arrived in China, I was unfamiliar with many lifestyle habits — I did not even know how to use mobile payment well — but friends around me would patiently teach me. So I am truly very grateful."},
{speaker:"A",c:"除咗日常生活之外，你最鍾意中國文化入面邊一部分啊？",j:"ceoi4 zo2 jat6 soeng4 sang1 wut6 zi1 ngoi6, nei5 zeoi3 zung1 ji3 zung1 gwok3 man4 faa3 jap6 min6 bin1 jat1 bou6 fan6 aa3",e:"Besides daily life, which part of Chinese culture do you like the most?"},
{speaker:"B",c:"我好鍾意中國嘅書法同埋茶文化。我覺得書法唔單止係寫字，仲好似一門藝術。每次見到啲毛筆字，我都覺得好有美感，而且寫字嗰陣可以令人平靜落嚟。至於茶文化，就令我感受到中國人嗰種慢慢享受生活嘅態度。",j:"ngo5 hou2 zung1 ji3 zung1 gwok3 ge3 syu1 faat3 tung4 maai4 caa4 man4 faa3. ngo5 gok3 dak1 syu1 faat3 m4 daan1 zi2 hai6 se2 zi6, zung6 hou2 ci5 jat1 mun4 ngai6 seot6. mui5 ci3 gin3 dou3 di1 mou4 bat1 zi6, ngo5 dou1 gok3 dak1 hou2 jau5 mei5 gam2, ji4 ce2 se2 zi6 go2 zan6 ho2 ji5 ling6 jan4 ping4 zing6 lok6 lai4. zi3 jyu1 caa4 man4 faa3, zau6 ling6 ngo5 gam2 sau6 dou3 zung1 gwok3 jan4 go2 zung2 maan6 maan2 hoeng2 sau6 sang1 wut6 ge3 taai3 dou6",e:"I really like Chinese calligraphy and tea culture. I think calligraphy is not just writing — it is like an art form. Every time I see brush calligraphy, I find it very beautiful, and writing can help calm me down. As for tea culture, it makes me feel the Chinese attitude of slowly enjoying life."},
{speaker:"A",c:"你平時會自己練書法或者飲茶㗎？",j:"nei5 ping4 si4 wui5 zi6 gei2 lin6 syu1 faat3 waak6 ze2 jam2 caa4 gaa3",e:"Do you practice calligraphy or drink tea yourself in daily life?"},
{speaker:"B",c:"會啊。我有時放學之後會跟老師學下寫毛筆字，雖然而家仲寫得唔算好，但我覺得個過程幾有意思。另外，我讀書壓力大嗰陣，都會沖杯茶畀自己放鬆下心情。",j:"wui5 aa3. ngo5 jau5 si4 fong3 hok6 zi1 hau6 wui5 gan1 lou5 si1 hok6 haa5 se2 mou4 bat1 zi6, seoi1 jin4 ji4 gaa1 zung6 se2 dak1 m4 syun3 hou2, daan6 ngo5 gok3 dak1 go3 gwo3 cing4 gei2 jau5 ji3 si1. ling6 ngoi6, ngo5 duk6 syu1 aat3 lik6 daai6 go2 zan6, dou1 wui5 cung1 bui1 caa4 bei2 zi6 gei2 fong3 sung1 haa5 sam1 cing4",e:"Yes. Sometimes after class I learn brush calligraphy from a teacher. Although I am still not very good at it, I find the process quite interesting. Also, when I feel stressed from studying, I brew a cup of tea to relax my mood."},
{speaker:"A",c:"咁學習呢啲文化對你有乜嘢幫助啊？",j:"gam2 hok6 zaap6 ne1 di1 man4 faa3 deoi3 nei5 jau5 mat1 je5 bong1 zo6 aa3",e:"How has learning these cultural aspects helped you?"},
{speaker:"B",c:"幫助真係好大。佢令我唔單止學識咗語言，仲更加理解中國人嘅思維方式同生活態度。我以前學中文嘅時候，只係記生字同文法，但而家我明白，如果想真正學好一種語言，就一定要了解背後嘅文化。",j:"bong1 zo6 zan1 hai6 hou2 daai6. keoi5 ling6 ngo5 m4 daan1 zi2 hok6 sik1 zo2 jyu5 jin4, zung6 gang3 gaa1 lei5 gaai2 zung1 gwok3 jan4 ge3 si1 wai4 fong1 sik1 tung4 sang1 wut6 taai3 dou6. ngo5 ji5 cin4 hok6 zung1 man4 ge3 si4 hau6, zi2 hai6 gei3 saang1 zi6 tung4 man4 faat3, daan6 ji4 gaa1 ngo5 ming4 baak6, jyu4 gwo2 soeng2 zan1 zing3 hok6 hou2 jat1 zung2 jyu5 jin4, zau6 jat1 ding6 jiu3 liu5 gaai2 bui3 hau6 ge3 man4 faa3",e:"The help has been enormous. It has made me not only learn the language but also better understand Chinese people way of thinking and attitude toward life. When I studied Chinese before, I just memorized vocabulary and grammar. But now I understand — if you truly want to learn a language well, you must understand the culture behind it."},
{speaker:"A",c:"你講得好有道理。",j:"nei5 gong2 dak1 hou2 jau5 dou6 lei5",e:"You make a very good point."},
{speaker:"B",c:"係啊，因為了解文化之後，我發現自己同中國人溝通自然順利咗好多。有時甚至連一句說話背後嘅意思、禮貌方式，或者表達感情嘅方法，我都可以理解得更加深入。所以我覺得，呢一年幾嘅留學生活真係令我成長咗好多。",j:"hai6 aa3, jan1 wai6 liu5 gaai2 man4 faa3 zi1 hau6, ngo5 faat3 jin6 zi6 gei2 tung4 zung1 gwok3 jan4 kau1 tung1 zi6 jin4 seon6 lei6 zo2 hou2 do1. jau5 si4 sam6 zi6 lin4 jat1 geoi3 syut3 waa6 bui3 hau6 ge3 ji3 si1, lai5 maau6 fong1 sik1, waak6 ze2 biu2 daat6 gam2 cing4 ge3 fong1 faat3, ngo5 dou1 ho2 ji5 lei5 gaai2 dak1 gang3 gaa1 sam1 jap6. so2 ji5 ngo5 gok3 dak1, ne1 jat1 nin4 gei2 ge3 lau4 hok6 sang1 wut6 zan1 hai6 ling6 ngo5 sing4 coeng2 zo2 hou2 do1",e:"Yes, because after understanding the culture, I found that my communication with Chinese people became much smoother naturally. Sometimes I can even understand the meaning behind a sentence, politeness conventions, or ways of expressing emotions much more deeply. So I feel this past year of studying abroad has really made me grow a lot."}
],
grammar:[
{pattern:"嘅 (ge3) — possessive/modifier particle",desc:"Links a modifier to a noun — similar to in Mandarin",ex:"我嘅國家 (ngo5 ge3 gwok3 gaa1)",en:"my country"},
{pattern:"咗 (zo2) — perfective aspect",desc:"Indicates an action has been completed",ex:"學習咗一年幾 (hok6 zaap6 zo2 jat1 nin4 gei2)",en:"has studied for over a year"},
{pattern:"緊 (gan2) — progressive aspect",desc:"Indicates an action is in progress",ex:"食緊飯 (sik6 gan2 faan6)",en:"eating a meal"},
{pattern:"哋 (dei6) — pluralizer for pronouns",desc:"Makes pronouns plural — 我哋, 你哋, 佢哋",ex:"我哋 (ngo5 dei6)",en:"we / us"},
{pattern:"Sentence-final particles — 喇/㗎/喎 (laa3/gaa3/wo3)",desc:"喇 — change of state; 㗎 — emphasis/question; 喎 — soft assertion",ex:"一年幾喇 / 你會自己練書法㗎？/ 聽落你都學到唔少嘢喎 (jat1 nin4 gei2 laa3 / nei5 wui5 zi6 gei2 lin6 syu1 faat3 gaa3? / teng1 lok6 nei5 dou1 hok6 dou2 m4 siu2 je5 wo3)",en:"already over a year / Do you practice calligraphy yourself? / It sounds like you have learned a lot!"}
],

{speaker:"B",c:"我有啲病，想食淡啲，唔好太辣。",j:"ngo5 jau5 di1 beng6, soeng2 sik6 taam5 di1, m4 hou2 taai3 laat6.",e:"I'm a bit sick — I want mild food, not too spicy."},
{speaker:"A",c:"冇問題。食完我陪你去藥房。",j:"mou5 man6 tai4. sik6 jyun4 ngo5 pui4 nei5 heoi3 joek6 fong4.",e:"No problem. After eating I'll go with you to the pharmacy."},
{speaker:"B",c:"唔該。其實我想休息兩日，放假去旅行都好。",j:"m4 goi1. kei4 sat6 ngo5 soeng2 jau1 sik1 loeng5 jat6, fong3 gaa3 heoi3 leoi5 hang4 dou1 hou2.",e:"Thanks. I actually want two days' rest — a holiday trip would be nice too."},
{speaker:"A",c:"如果去旅行，機場遠唔遠？",j:"jyu4 gwo2 heoi3 leoi5 hang4, gei1 coeng4 jyun5 m4 jyun5 aa3?",e:"If we travel, is the airport far?"},
{speaker:"B",c:"唔遠，轉一次車就到。到時我哋先問路。",j:"m4 jyun5, zyun3 jat1 ci3 ce1 zau6 dou3. dou3 si4 ngo5 dei6 sin1 man6 lou6.",e:"Not far — one transfer and we're there. We can ask for directions then."}
],
grammar:[
{pattern:"唔使 (m4 sai2)",desc:"No need to…",ex:"唔使預約 (m4 sai2 jyu6 joek3)",en:"No need to book."},
{pattern:"如果…就… (jyu4 gwo2… zau6…)",desc:"If… then…",ex:"如果落雨我哋就叫外賣 (jyu4 gwo2 lok6 jyu5 ngo5 dei6 zau6 giu3 ngoi6 maai6)",en:"If it rains we'll get takeaway."},

{speaker:"B",c:"租金平，不過有啲嘈。交通倒係好方便。",j:"zou1 gam1 peng4, bat1 gwo3 jau5 di1 cou4. gaau1 tung1 dou3 hai6 hou2 fong1 bin6.",e:"Rent is cheap, but it's a bit noisy. Transport is actually convenient."},
{speaker:"A",c:"我寧願貴少少，住得安靜啲。",j:"ngo5 ning4 jyun3 gwai3 siu2 siu2, zyu6 dak1 on1 zing6 di1.",e:"I'd rather pay a bit more and live somewhere quieter."},
{speaker:"B",c:"其實呢度環境唔錯，而且越嚟越方便。",j:"kei4 sat6 ni1 dou6 waan4 ging2 m4 co3, ji4 ce2 jyut6 lai4 jyut6 fong1 bin6.",e:"The area's actually not bad, and it's getting more convenient."},

{speaker:"B",c:"得。唔單止睇屋，仲要比較租金同交通，然後先決定。",j:"dak1. m4 daan1 zi2 tai2 uk1, zung6 jiu3 bei2 gaau3 zou1 gam1 tung4 gaau1 tung1, jin4 hau6 sin1 kyut3 ding6.",e:"OK. Not just look at flats — also compare rent and transport, then decide."}
],

{id:105,title:"L5 聲調",subtitle:"Tones · pitch changes the meaning",
vocab:[
{c:"聲調",j:"sing1 diu6",e:"tone (pitch)"},
{c:"詩",j:"si1",e:"poem (tone 1 — high level)"},
{c:"史",j:"si2",e:"history (tone 2 — high rising)"},
{c:"試",j:"si3",e:"to try (tone 3 — mid level)"},
{c:"時",j:"si4",e:"time (tone 4 — low falling)"},
{c:"市",j:"si5",e:"market (tone 5 — low rising)"},
{c:"事",j:"si6",e:"matter / thing (tone 6 — low level)"},
{c:"買",j:"maai5",e:"to buy (tone 5)"},
{c:"賣",j:"maai6",e:"to sell (tone 6)"},
{c:"街市",j:"gaai1 si5",e:"wet market"},
{c:"餸",j:"sung3",e:"groceries / dishes with rice"},
{c:"意思",j:"ji3 si3",e:"meaning"},
{c:"唔同",j:"m4 tung4",e:"not the same"},
{c:"以為",j:"ji5 wai4",e:"to think (mistakenly)"},
{c:"原來",j:"jyun4 loi4",e:"so it turns out / actually"},
{c:"頭先",j:"tau4 sin1",e:"just now"},
{c:"讀",j:"duk6",e:"to read / pronounce"},
{c:"啱",j:"ngaam1",e:"correct; suitable"},
{c:"跟住",j:"gan1 zyu6",e:"and then; follow"},
{c:"每日",j:"mui5 jat6",e:"every day"}
],
dialogue:[
{speaker:"A",c:"你聽日去唔去街市啊？",j:"nei5 ting1 jat6 heoi3 m4 heoi3 gaai1 si5 aa3?",e:"Are you going to the wet market tomorrow?"},
{speaker:"B",c:"去啊，我想買餸。",j:"heoi3 aa3, ngo5 soeng2 maai5 sung3.",e:"Yes — I want to buy groceries."},
{speaker:"A",c:"我頭先以為你講有事，原來係街市。",j:"ngo5 tau4 sin1 ji5 wai4 nei5 gong2 jau5 si6, jyun4 loi4 hai6 gaai1 si5.",e:"Just now I thought you said you had something (si6). Turns out it was the market (si5)."},
{speaker:"B",c:"哈哈，聲調差少少，意思完全唔同。",j:"haa1 haa1, sing1 diu6 caa1 siu2 siu2, ji3 si3 jyun4 cyun4 m4 tung4.",e:"Haha — a tiny tone difference, completely different meaning."},
{speaker:"A",c:"好似買同賣咁，一個係買入，一個係賣出。",j:"hou2 ci5 maai5 tung4 maai6 gam2, jat1 go3 hai6 maai5 jap6, jat1 go3 hai6 maai6 ceot1.",e:"Like buy (maai5) and sell (maai6) — one is buying in, one is selling out."},
{speaker:"B",c:"你教我點讀呢六個音？詩、史、試、時、市、事。",j:"nei5 gaau3 ngo5 dim2 duk6 ni1 luk6 go3 jam1? si1, si2, si3, si4, si5, si6.",e:"Teach me how to say these six sounds? Poem, history, try, time, market, matter."},
{speaker:"A",c:"你試下讀：詩、史、試、時、市、事。",j:"nei5 si3 haa5 duk6: si1, si2, si3, si4, si5, si6.",e:"Try reading them: si1 si2 si3 si4 si5 si6."},
{speaker:"B",c:"詩、史、試、時、市、事。我讀得啱唔啱啊？",j:"si1, si2, si3, si4, si5, si6. ngo5 duk6 dak1 ngaam1 m4 ngaam1 aa3?",e:"Si1 si2 si3 si4 si5 si6. Did I say them right?"},
{speaker:"A",c:"差唔多！再聽我讀多次，然後你跟住讀。",j:"caa1 m4 do1! zoi3 ting1 ngo5 duk6 do1 ci3, jin4 hau6 nei5 gan1 zyu6 duk6.",e:"Pretty close! Listen to me a few more times, then you follow."},
{speaker:"B",c:"好，我每日都練習。",j:"hou2, ngo5 mui5 jat6 dou1 lin6 zaap6.",e:"OK — I'll practice every day."}
],
grammar:[
{pattern:"六聲 (luk6 sing1)",desc:"Cantonese has 6 tones. The number after a Jyutping syllable is the tone: si1 si2 si3 si4 si5 si6.",ex:"詩 si1 · 史 si2 · 試 si3 · 時 si4 · 市 si5 · 事 si6",en:"Same letters, six meanings — only pitch changes."},
{pattern:"Tone 1 / 2 / 3",desc:"1 high and flat. 2 rises (like asking 'huh?'). 3 mid and flat — shorter, plainer.",ex:"新 san1 (new) · 好 hou2 (good) · 去 heoi3 (go)",en:"High level, rising, mid level."},
{pattern:"Tone 4 / 5 / 6",desc:"The low tones. 4 falls and is breathy. 5 rises from low. 6 is low and flat.",ex:"人 jan4 (person) · 我 ngo5 (I) · 食 sik6 (eat)",en:"Low falling, low rising, low level."},
{pattern:"買 maai5 vs 賣 maai6",desc:"Minimal pair. Tone 5 vs 6 is easy to mix up — and it swaps buy/sell.",ex:"我想買餸，唔係賣餸。(ngo5 soeng2 maai5 sung3, m4 hai6 maai6 sung3)",en:"I want to buy groceries, not sell them."},
{pattern:"市 si5 vs 事 si6",desc:"Another daily pair. 街市 = wet market. 有事 = something's up / I'm busy.",ex:"我頭先以為你講有事，原來係街市。(ngo5 tau4 sin1 ji5 wai4 nei5 gong2 jau5 si6, jyun4 loi4 hai6 gaai1 si5)",en:"I thought you had something going on — it was the market."}
],
quiz:[
{q:"Cantonese has how many tones?",opts:["4","5","6","8"],ans:2},
{q:'The number in Jyutping (si5) tells you the:',opts:["word class","tone","speed","dialect"],ans:1},
{q:'"詩" si1 is tone:',opts:["1 high level","2 rising","5 low rising","6 low level"],ans:0},
{q:'"市" (si5) means:',opts:["poem","to try","market","matter"],ans:2},
{q:'"事" (si6) means:',opts:["market","matter / thing","to buy","history"],ans:1},
{q:'"買" vs "賣" is:',opts:["maai5 buy vs maai6 sell","maai6 buy vs maai5 sell","same tone","not a tone pair"],ans:0},
{q:'A misheard 街市 as:',opts:["tea","有事 (something's up)","a bus","tomorrow"],ans:1},
{q:"Best daily practice for tones:",opts:["Skip Jyutping","Read si1–si6 every day out loud","Only study characters","Ignore pitch"],ans:1}
]},

dialogue:[
{speaker:"A",c:"呢啲橙幾多錢一斤啊？",j:"ni1 di1 caang2 gei2 do1 cin2 jat1 gan1 aa3?",e:"How much are these oranges per catty?"},
{speaker:"B",c:"十二蚊一斤。",j:"sap6 ji6 man1 jat1 gan1.",e:"Twelve dollars a catty."},
{speaker:"A",c:"咁貴嘅？有冇平啲啊？",j:"gam3 gwai3 ge2? jau5 mou5 peng4 di1 aa3?",e:"That expensive? Got anything cheaper?"},
{speaker:"B",c:"嗰啲細啲，十蚊一斤。",j:"go2 di1 sai3 di1, sap6 man1 jat1 gan1.",e:"Those smaller ones — ten dollars a catty."},
{speaker:"A",c:"好，我要兩斤。一共幾多錢？",j:"hou2, ngo5 jiu3 loeng5 gan1. jat1 gung6 gei2 do1 cin2?",e:"OK, I want two catties. How much in total?"},
{speaker:"B",c:"二十蚊。八達通定現金？",j:"ji6 sap6 man1. baat3 daat6 tung1 ding6 jin6 gam1?",e:"Twenty dollars. Octopus or cash?"},
{speaker:"A",c:"現金。我俾五十蚊你。",j:"jin6 gam1. ngo5 bei2 ng5 sap6 man1 nei5.",e:"Cash. Here's fifty."},
{speaker:"B",c:"找你三十蚊。唔該晒。",j:"zaau2 nei5 saam1 sap6 man1. m4 goi1 saai3.",e:"Thirty dollars change. Thanks a lot."}
],
grammar:[
{pattern:"兩 vs 二 (loeng5 vs ji6)",desc:"兩 before a classifier (兩斤, 兩個人). 二 inside numbers (十二, 二十, 第二).",ex:"我要兩斤。一共二十蚊。(ngo5 jiu3 loeng5 gan1. jat1 gung6 ji6 sap6 man1)",en:"I want two catties. Twenty dollars in total."},
{pattern:"幾多錢？(gei2 do1 cin2?)",desc:"How much? Put the unit after: 幾多錢一斤 / 幾多錢一件.",ex:"呢啲橙幾多錢一斤啊？(ni1 di1 caang2 gei2 do1 cin2 jat1 gan1 aa3?)",en:"How much are these oranges per catty?"},
{pattern:"蚊 (man1)",desc:"Spoken HKD. 十二蚊 = $12. Formal 塊 is Mandarin; in HK say 蚊.",ex:"十蚊一斤 (sap6 man1 jat1 gan1)",en:"Ten dollars a catty."},
{pattern:"定 (ding6)",desc:"Or. A 定 B — often 定係.",ex:"八達通定現金？(baat3 daat6 tung1 ding6 jin6 gam1?)",en:"Octopus or cash?"},
{pattern:"俾…你 (bei2… nei5)",desc:"Give / pay someone. 我俾五十蚊你.",ex:"我俾五十蚊你。找你三十蚊。(ngo5 bei2 ng5 sap6 man1 nei5. zaau2 nei5 saam1 sap6 man1)",en:"I give you fifty. Thirty change."}

{speaker:"A",c:"咁你呢？單身定有人啊？",j:"gam2 nei5 ne1? daan1 san1 ding6 jau5 jan4 aa3?",e:"What about you? Single or seeing someone?"},
{speaker:"B",c:"而家單身。你呢？",j:"ji4 gaa1 daan1 san1. nei5 ne1?",e:"Single at the moment. You?"},
{speaker:"A",c:"我有個女朋友，我哋一齊住。",j:"ngo5 jau5 go3 neoi5 pang4 jau5, ngo5 dei6 jat1 cai4 zyu6.",e:"I have a girlfriend. We live together."},
{speaker:"B",c:"你哋識咗幾耐啊？",j:"nei5 dei6 sik1 zo2 gei2 noi6 aa3?",e:"How long have you known each other?"},
{speaker:"A",c:"三年喇。遲啲想結婚。",j:"saam1 nin4 laa3. ci4 di1 soeng2 git3 fan1.",e:"Three years. Thinking of getting married later."},
{speaker:"B",c:"恭喜你啊！",j:"gung1 hei2 nei5 aa3!",e:"Congrats!"}
],
grammar:[
{pattern:"屋企 (uk1 kei2)",desc:"Home / family. 屋企人 = the people in your household. More natural than 家.",ex:"你屋企有幾多個人啊？(nei5 uk1 kei2 jau5 gei2 do1 go3 jan4 aa3?)",en:"How many people in your family?"},
{pattern:"未啊？(mei6 aa3?)",desc:"…yet? End of yes/no about something expected.",ex:"你家姐結婚未啊？(nei5 gaa1 ze1 git3 fan1 mei6 aa3?)",en:"Is your older sister married yet?"},
{pattern:"結咗喇 (git3 zo2 laa3)",desc:"咗 = done. 喇 = already / new situation. Together: it's already happened.",ex:"結咗喇，仲有個兩歲仔。(git3 zo2 laa3, zung6 jau5 go3 loeng5 seoi3 zai2)",en:"Already married, and there's a two-year-old boy too."},
{pattern:"你呢？(nei5 ne1?)",desc:"What about you? 呢 parks a topic and tosses it back.",ex:"而家單身。你呢？(ji4 gaa1 daan1 san1. nei5 ne1?)",en:"Single now. You?"},
{pattern:"識咗幾耐 (sik1 zo2 gei2 noi6)",desc:"How long have you known…? 識 = know a person. 幾耐 = how long.",ex:"你哋識咗幾耐啊？(nei5 dei6 sik1 zo2 gei2 noi6 aa3?)",en:"How long have you two known each other?"}
],

{q:"They have known each other:",opts:["three months","ten years","three years","since childhood"],ans:2},

{id:108,title:"L8 飲茶",subtitle:"Yum cha · dim sum, the bill, treating",
vocab:[
{c:"飲茶",j:"jam2 caa4",e:"yum cha (dim sum meal)"},
{c:"點心",j:"dim2 sam1",e:"dim sum"},
{c:"蝦餃",j:"haa1 gaau2",e:"shrimp dumpling"},
{c:"腸粉",j:"coeng4 fan2",e:"rice noodle roll"},
{c:"叉燒包",j:"caa1 siu1 baau1",e:"BBQ pork bun"},
{c:"燒賣",j:"siu1 maai6",e:"siu mai (pork dumpling)"},
{c:"籠",j:"lung4",e:"bamboo steamer (classifier)"},
{c:"奶茶",j:"naai5 caa4",e:"milk tea"},
{c:"凍檸茶",j:"dung3 ning2 caa4",e:"iced lemon tea"},
{c:"咖啡",j:"gaa3 fe1",e:"coffee"},
{c:"好味",j:"hou2 mei6",e:"tasty; delicious"},
{c:"夠晒",j:"gau3 saai3",e:"plenty / that's enough"},
{c:"再加",j:"zoi3 gaa1",e:"add more"},
{c:"埋單",j:"maai4 daan1",e:"the bill / to pay"},
{c:"請",j:"ceng2",e:"to treat (pay for someone)"},
{c:"爭",j:"zang1",e:"to fight over (the bill)"},
{c:"樣樣",j:"joeng6 joeng6",e:"every kind; all of them"},
{c:"熱",j:"jit6",e:"hot"},
{c:"凍",j:"dung3",e:"cold / iced"},
{c:"今次",j:"gam1 ci3",e:"this time"}
],
dialogue:[
{speaker:"A",c:"今日去飲茶好唔好？",j:"gam1 jat6 heoi3 jam2 caa4 hou2 m4 hou2?",e:"Shall we go for yum cha today?"},
{speaker:"B",c:"好啊，我好耐冇食點心。",j:"hou2 aa3, ngo5 hou2 noi6 mou5 sik6 dim2 sam1.",e:"Yes! I haven't had dim sum in ages."},
{speaker:"A",c:"你想要咩？",j:"nei5 soeng2 jiu3 me1?",e:"What do you want?"},
{speaker:"B",c:"蝦餃、腸粉、叉燒包，樣樣都要。",j:"haa1 gaau2, coeng4 fan2, caa1 siu1 baau1, joeng6 joeng6 dou1 jiu3.",e:"Har gow, rice rolls, char siu bao — I want them all."},
{speaker:"A",c:"我哋叫多籠燒賣都得。你飲奶茶定咖啡？",j:"ngo5 dei6 giu3 do1 lung4 siu1 maai6 dou1 dak1. nei5 jam2 naai5 caa4 ding6 gaa3 fe1?",e:"We can order a steamer of siu mai too. Milk tea or coffee?"},
{speaker:"B",c:"熱奶茶。你呢？",j:"jit6 naai5 caa4. nei5 ne1?",e:"Hot milk tea. You?"},
{speaker:"A",c:"我要凍檸茶。",j:"ngo5 jiu3 dung3 ning2 caa4.",e:"I'll have iced lemon tea."},
{speaker:"B",c:"呢籠蝦餃好味喎。",j:"ni1 lung4 haa1 gaau2 hou2 mei6 wo3.",e:"This steamer of har gow is really good."},
{speaker:"A",c:"夠晒未啊？要唔要再加？",j:"gau3 saai3 mei6 aa3? jiu3 m4 jiu3 zoi3 gaa1?",e:"Had enough? Want to add more?"},
{speaker:"B",c:"夠喇。唔該埋單！",j:"gau3 laa3. m4 goi1 maai4 daan1!",e:"Enough. Bill please!"},
{speaker:"A",c:"今次我請，你唔好同我爭。",j:"gam1 ci3 ngo5 ceng2, nei5 m4 hou2 tung4 ngo5 zang1.",e:"This one's on me — don't fight me for the bill."}
],
grammar:[
{pattern:"飲茶 (jam2 caa4)",desc:"Not just 'drink tea' — it means the whole dim sum meal, often morning or lunch.",ex:"今日去飲茶好唔好？(gam1 jat6 heoi3 jam2 caa4 hou2 m4 hou2?)",en:"Shall we go for yum cha today?"},
{pattern:"籠 (lung4)",desc:"Classifier for a steamer of dim sum. 一籠蝦餃, 呢籠燒賣.",ex:"呢籠蝦餃好味喎。(ni1 lung4 haa1 gaau2 hou2 mei6 wo3)",en:"This steamer of har gow is tasty."},
{pattern:"埋單 (maai4 daan1)",desc:"Ask for the bill. Call it out: 唔該埋單！",ex:"夠喇。唔該埋單！(gau3 laa3. m4 goi1 maai4 daan1!)",en:"That's enough. Bill please!"},
{pattern:"請 (ceng2)",desc:"Treat someone (you pay). Different from 請問 cing2 man6 (excuse me / ask).",ex:"今次我請 (gam1 ci3 ngo5 ceng2)",en:"This time I treat."},
{pattern:"唔好同我爭 (m4 hou2 tung4 ngo5 zang1)",desc:"Don't compete with me — classic bill-fight line after 我請.",ex:"你唔好同我爭 (nei5 m4 hou2 tung4 ngo5 zang1)",en:"Don't fight me (for the bill)."}
],
quiz:[
{q:'"飲茶" in HK usually means:',opts:["go for dim sum","only drink tea at home","a tea ceremony","coffee break"],ans:0},
{q:'"蝦餃" is:',opts:["pork bun","rice roll","shrimp dumpling","egg tart"],ans:2},
{q:'"腸粉" Jyutping is:',opts:["coeng2 fan2","coeng1 fan2","zoeng2 fan2","coeng4 fan2"],ans:3},
{q:'"埋單" means:',opts:["order food","split the table","the bill / to pay","reserve"],ans:2},
{q:'"我請" means:',opts:["I invite you to speak","please sit","I order","this is on me"],ans:3},
{q:"A drinks:",opts:["hot milk tea","coffee","iced lemon tea","water"],ans:2},
{q:'"夠晒" means:',opts:["plenty / that's enough","not enough","too spicy","too expensive"],ans:0},
{q:'"籠" here is:',opts:["a dragon","the kitchen","a steamer basket (classifier)","a plate"],ans:2}
]},

{id:109,title:"L9 問路",subtitle:"Directions · left, right, MTR, getting lost",
vocab:[
{c:"邊度",j:"bin1 dou6",e:"where"},
{c:"點去",j:"dim2 heoi3",e:"how to get (there)"},
{c:"左邊",j:"zo2 bin6",e:"left side"},
{c:"右邊",j:"jau6 bin6",e:"right side"},
{c:"前面",j:"cin4 min6",e:"in front"},
{c:"後面",j:"hau6 min6",e:"behind"},
{c:"直行",j:"zik6 haang4",e:"go straight"},
{c:"轉右",j:"zyun3 jau6",e:"turn right"},
{c:"轉左",j:"zyun3 zo2",e:"turn left"},
{c:"對面",j:"deoi3 min6",e:"opposite"},
{c:"隔離",j:"gaak3 lei4",e:"next to / beside"},
{c:"附近",j:"fu6 gan6",e:"nearby"},
{c:"出口",j:"ceot1 hau2",e:"exit"},
{c:"地鐵站",j:"dei6 tit3 zaam6",e:"MTR station"},
{c:"紅綠燈",j:"hung4 luk6 dang1",e:"traffic light"},
{c:"過馬路",j:"gwo3 maa5 lou6",e:"to cross the road"},
{c:"迷路",j:"mai4 lou6",e:"to get lost"},
{c:"搵",j:"wan2",e:"to look for / find"},
{c:"請問",j:"cing2 man6",e:"excuse me (to ask)"},
{c:"唔使客氣",j:"m4 sai2 haak3 hei3",e:"you're welcome / don't mention it"}
],
dialogue:[
{speaker:"A",c:"唔該，請問地鐵站喺邊度啊？",j:"m4 goi1, cing2 man6 dei6 tit3 zaam6 hai2 bin1 dou6 aa3?",e:"Excuse me, where's the MTR station?"},
{speaker:"B",c:"你而家喺呢度。直行大約三分鐘，到紅綠燈就轉右。",j:"nei5 ji4 gaa1 hai2 ni1 dou6. zik6 haang4 daai6 joek3 saam1 fan1 zung1, dou3 hung4 luk6 dang1 zau6 zyun3 jau6.",e:"You're here. Go straight about three minutes; at the lights, turn right."},
{speaker:"A",c:"轉右之後呢？",j:"zyun3 jau6 zi1 hau6 ne1?",e:"And after turning right?"},
{speaker:"B",c:"對面就係出口。地鐵站就喺隔離。",j:"deoi3 min6 zau6 hai6 ceot1 hau2. dei6 tit3 zaam6 zau6 hai2 gaak3 lei4.",e:"The exit is opposite. The station is right next to it."},
{speaker:"A",c:"遠唔遠啊？我有啲迷路。",j:"jyun5 m4 jyun5 aa3? ngo5 jau5 di1 mai4 lou6.",e:"Is it far? I'm a bit lost."},
{speaker:"B",c:"唔遠，五分鐘就到。唔難搵。",j:"m4 jyun5, ng5 fan1 zung1 zau6 dou3. m4 naan4 wan2.",e:"Not far — five minutes and you're there. Easy to find."},
{speaker:"A",c:"係咪附近嗰間商場隔離？",j:"hai6 mai6 fu6 gan6 go2 gaan1 soeng1 coeng4 gaak3 lei4?",e:"Is it next to that mall nearby?"},
{speaker:"B",c:"係啊，商場後面就係。",j:"hai6 aa3, soeng1 coeng4 hau6 min6 zau6 hai6.",e:"Yes — it's behind the mall."},
{speaker:"A",c:"唔該晒！",j:"m4 goi1 saai3!",e:"Thanks so much!"},
{speaker:"B",c:"唔使客氣，小心過馬路。",j:"m4 sai2 haak3 hei3, siu2 sam1 gwo3 maa5 lou6.",e:"You're welcome. Careful crossing the road."}
],
grammar:[
{pattern:"喺邊度？(hai2 bin1 dou6?)",desc:"Where is…? 喺 marks location. 邊度 = where.",ex:"地鐵站喺邊度啊？(dei6 tit3 zaam6 hai2 bin1 dou6 aa3?)",en:"Where's the MTR station?"},
{pattern:"直行…就… (zik6 haang4… zau6…)",desc:"Go straight… then… 就 = and then / that's when.",ex:"直行大約三分鐘，到紅綠燈就轉右。(zik6 haang4 daai6 joek3 saam1 fan1 zung1, dou3 hung4 luk6 dang1 zau6 zyun3 jau6)",en:"Go straight about three minutes; at the lights, turn right."},
{pattern:"之後呢？(zi1 hau6 ne1?)",desc:"And then? / After that? 呢 invites the next step.",ex:"轉右之後呢？(zyun3 jau6 zi1 hau6 ne1?)",en:"And after turning right?"},
{pattern:"係咪…？(hai6 mai6…?)",desc:"Is it…? Checking a guess. Never hai6 mi1.",ex:"係咪附近嗰間商場隔離？(hai6 mai6 fu6 gan6 go2 gaan1 soeng1 coeng4 gaak3 lei4?)",en:"Is it next to that mall nearby?"},
{pattern:"唔該 vs 唔該晒 vs 唔使客氣",desc:"唔該 = thanks / excuse me (service). 唔該晒 = thanks a lot. Reply: 唔使客氣.",ex:"唔該晒！唔使客氣。(m4 goi1 saai3! m4 sai2 haak3 hei3)",en:"Thanks so much! Don't mention it."}
],
quiz:[
{q:'"邊度" means:',opts:["who","when","why","where"],ans:3},
{q:'"直行" means:',opts:["go straight","turn back","run","stop"],ans:0},
{q:'"轉右" means:',opts:["turn left","go up","turn right","go down"],ans:2},
{q:'"隔離" here means:',opts:["quarantine only","far away","inside","next to / beside"],ans:3},
{q:"At the traffic light they should:",opts:["turn left","stop forever","go home","turn right"],ans:3},
{q:'"迷路" means:',opts:["ask the way","cross the road","get lost","take the MTR"],ans:2},
{q:'"係咪" is pronounced:',opts:["hai6 mi1","hai6 mei1","hai6 mai6","si6 mai6"],ans:2},
{q:'"唔使客氣" is a reply to thanks meaning:',opts:["please sit","excuse me","I'm sorry","you're welcome"],ans:3}
]},

{id:110,title:"L10 約出嚟",subtitle:"Making plans · when, where, running late",
vocab:[
{c:"約",j:"joek3",e:"to arrange to meet"},
{c:"出街",j:"ceot1 gaai1",e:"to go out"},
{c:"幾時",j:"gei2 si4",e:"when"},
{c:"幾點",j:"gei2 dim2",e:"what time"},
{c:"邊度見",j:"bin1 dou6 gin3",e:"where shall we meet"},
{c:"今晚",j:"gam1 maan5",e:"tonight"},
{c:"聽朝",j:"ting1 ziu1",e:"tomorrow morning"},
{c:"銅鑼灣",j:"tung4 lo4 waan1",e:"Causeway Bay"},
{c:"出口",j:"ceot1 hau2",e:"exit"},
{c:"到時見",j:"dou3 si4 gin3",e:"see you then"},
{c:"塞車",j:"sak1 ce1",e:"traffic jam"},
{c:"遲到",j:"ci4 dou3",e:"to be late"},
{c:"嚟緊",j:"lai4 gan2",e:"on the way / coming"},
{c:"等",j:"dang2",e:"to wait"},
{c:"著",j:"zoek3",e:"to wear"},
{c:"藍色",j:"laam4 sik1",e:"blue"},
{c:"唔緊要",j:"m4 gan2 jiu3",e:"never mind / it's OK"},
{c:"改期",j:"goi2 kei4",e:"to reschedule"},
{c:"取消",j:"ceoi2 siu1",e:"to cancel"},
{c:"打電話",j:"daa2 din6 waa2",e:"to call (phone)"}
],
dialogue:[
{speaker:"A",c:"今晚得唔得閒出街啊？",j:"gam1 maan5 dak1 m4 dak1 haan4 ceot1 gaai1 aa3?",e:"Free to go out tonight?"},
{speaker:"B",c:"得。約幾點？邊度見？",j:"dak1. joek3 gei2 dim2? bin1 dou6 gin3?",e:"Yes. What time? Where do we meet?"},
{speaker:"A",c:"七點，銅鑼灣地鐵站A出口。",j:"cat1 dim2, tung4 lo4 waan1 dei6 tit3 zaam6 A ceot1 hau2.",e:"Seven, Causeway Bay MTR exit A."},
{speaker:"B",c:"得，到時見。",j:"dak1, dou3 si4 gin3.",e:"OK, see you then."},
{speaker:"A",c:"對唔住，我塞車，會遲十分鐘。",j:"deoi3 m4 zyu6, ngo5 sak1 ce1, wui5 ci4 sap6 fan1 zung1.",e:"Sorry — traffic jam. I'll be ten minutes late."},
{speaker:"B",c:"冇問題，我喺度等你。",j:"mou5 man6 tai4, ngo5 hai2 dou6 dang2 nei5.",e:"No problem, I'll wait here."},
{speaker:"A",c:"我而家嚟緊，五分鐘到。",j:"ngo5 ji4 gaa1 lai4 gan2, ng5 fan1 zung1 dou3.",e:"I'm on my way now — five minutes."},
{speaker:"B",c:"見到你喇。我著藍色衫。",j:"gin3 dou2 nei5 laa3. ngo5 zoek3 laam4 sik1 saam1.",e:"I see you. I'm wearing a blue shirt."},
{speaker:"A",c:"見到。對唔住，遲到。",j:"gin3 dou2. deoi3 m4 zyu6, ci4 dou3.",e:"See you. Sorry I'm late."},
{speaker:"B",c:"唔緊要，去食飯啦。",j:"m4 gan2 jiu3, heoi3 sik6 faan6 laa1.",e:"Don't worry — let's go eat."}
],
grammar:[
{pattern:"得唔得閒 (dak1 m4 dak1 haan4)",desc:"Are you free? A-not-A of 得閒. Answer 得 or 唔得.",ex:"今晚得唔得閒出街啊？(gam1 maan5 dak1 m4 dak1 haan4 ceot1 gaai1 aa3?)",en:"Free to go out tonight?"},
{pattern:"約幾點？邊度見？",desc:"The two questions that close a plan: when and where.",ex:"約幾點？邊度見？(joek3 gei2 dim2? bin1 dou6 gin3?)",en:"What time? Where do we meet?"},
{pattern:"會遲 (wui5 ci4)",desc:"會 = will (not wui6 'meeting'). 遲 = late. 會遲十分鐘.",ex:"我塞車，會遲十分鐘。(ngo5 sak1 ce1, wui5 ci4 sap6 fan1 zung1)",en:"I'm in traffic — I'll be ten minutes late."},
{pattern:"嚟緊 (lai4 gan2)",desc:"緊 = in progress. 嚟緊 = I'm coming / on the way.",ex:"我而家嚟緊，五分鐘到。(ngo5 ji4 gaa1 lai4 gan2, ng5 fan1 zung1 dou3)",en:"I'm on the way now, five minutes."},
{pattern:"著 (zoek3)",desc:"To wear. Not zyu3. 著藍色衫, 著褲, 著鞋.",ex:"我著藍色衫。(ngo5 zoek3 laam4 sik1 saam1)",en:"I'm wearing a blue shirt."}
],
quiz:[
{q:'"出街" means:',opts:["leave Hong Kong","go to work","go out (into town)","go home"],ans:2},
{q:'"約" means:',opts:["arrange to meet","maybe","cancel","wait"],ans:0},
{q:"They meet at:",opts:["6 at Central","8 at home","noon at work","7 at Causeway Bay exit A"],ans:3},
{q:'"塞車" means:',opts:["the car is broken","no parking","traffic jam","a taxi"],ans:2},
{q:'"嚟緊" means:',opts:["already here","cancelled","lost","on the way"],ans:3},
{q:'"著" (to wear) is:',opts:["zyu3","zoek6","zoek3","zyu6"],ans:2},
{q:'"唔緊要" means:',opts:["never mind / it's OK","very important","hurry up","I disagree"],ans:0},
{q:'"會" meaning "will" is tone:',opts:["wui6","wui2","wui1","wui5"],ans:3}
]},

dialogue:[

{speaker:"A",c:"咁早？我八點半先至起身。",j:"gam3 zou2? ngo5 baat3 dim2 bun3 sin1 zi3 hei2 san1.",e:"That early? I don't get up until 8:30."},
{speaker:"B",c:"你唔使返工咩？",j:"nei5 m4 sai2 faan1 gung1 me1?",e:"You don't have to go to work?"},
{speaker:"A",c:"我返夜晚，晏晝先至出。",j:"ngo5 faan1 je6 maan5, aan3 zau3 sin1 zi3 ceot1.",e:"I work nights — I don't go out until the afternoon."},
{speaker:"B",c:"放工之後做咩啊？",j:"fong3 gung1 zi1 hau6 zou6 me1 aa3?",e:"What do you do after work?"},
{speaker:"A",c:"返屋企煮飯，睇下戲，十一點瞓。",j:"faan1 uk1 kei2 zyu2 faan6, tai2 haa5 hei3, sap6 jat1 dim2 fan3.",e:"Go home, cook, watch a bit of something, sleep at eleven."},
{speaker:"B",c:"我返到屋企已經好攰，沖完涼就瞓。",j:"ngo5 faan1 dou3 uk1 kei2 ji5 ging1 hou2 gui6, cung1 jyun4 loeng4 zau6 fan3.",e:"By the time I'm home I'm exhausted — shower and sleep."},
{speaker:"A",c:"你有冇時間運動啊？",j:"nei5 jau5 mou5 si4 gaan3 wan6 dung6 aa3?",e:"Do you have time to exercise?"},
{speaker:"B",c:"有時週末先有。平時真係好忙。",j:"jau5 si4 zau1 mut6 sin1 jau5. ping4 si4 zan1 hai6 hou2 mong4.",e:"Sometimes only at the weekend. Weekdays I'm really busy."}
],
grammar:[
{pattern:"平時 (ping4 si4)",desc:"Usually / in normal times. Contrast with 有時 (sometimes).",ex:"你平時幾點起身啊？(nei5 ping4 si4 gei2 dim2 hei2 san1 aa3?)",en:"What time do you usually get up?"},
{pattern:"先至 (sin1 zi3)",desc:"Not until… / only then. The thing happens later than you'd think.",ex:"我八點半先至起身。(ngo5 baat3 dim2 bun3 sin1 zi3 hei2 san1)",en:"I don't get up until 8:30."},
{pattern:"返 (faan1)",desc:"Return / go to (a usual place). 返工, 返屋企, 返夜晚. Tone 1 — not faan2.",ex:"返屋企煮飯 (faan1 uk1 kei2 zyu2 faan6)",en:"Go home and cook."},
{pattern:"沖完涼 (cung1 jyun4 loeng4)",desc:"Verb + 完 = after finishing. 沖涼 = shower, so 沖完涼 = after showering.",ex:"沖完涼就瞓 (cung1 jyun4 loeng4 zau6 fan3)",en:"After showering, (I) sleep."},
{pattern:"唔使…咩？(m4 sai2… me1?)",desc:"You don't need to…? 咩 adds surprise.",ex:"你唔使返工咩？(nei5 m4 sai2 faan1 gung1 me1?)",en:"You don't have to work (or what)?"}
],
quiz:[
{q:'"起身" means:',opts:["get up","sit down","lie down","go out"],ans:0},
{q:'"晏晝" means:',opts:["morning","midnight","afternoon","weekend"],ans:2},
{q:'"沖涼" means:',opts:["wash clothes","swim","drink cold water","shower"],ans:3},
{q:'"瞓覺" means:',opts:["wake up","exercise","sleep","cook"],ans:2},
{q:'"先至" means:',opts:["already","never","always","not until / only then"],ans:3},
{q:'"攰" means:',opts:["hungry","happy","busy","tired"],ans:3},
{q:"A works:",opts:["early mornings","weekends only","nights","from home at 7"],ans:2},
{q:'"返" (go back / to work) is:',opts:["faan2","faan4","faan1","faan6"],ans:2}
]},

{id:112,title:"L12 身體感覺",subtitle:"Body and feelings · sick, tired, angry, worried",
vocab:[
{c:"身體",j:"san1 tai2",e:"body; health"},
{c:"唔舒服",j:"m4 syu1 fuk6",e:"unwell / not comfortable"},
{c:"頭痛",j:"tau4 tung3",e:"headache"},
{c:"肚痛",j:"tou5 tung3",e:"stomach ache"},
{c:"發燒",j:"faat3 siu1",e:"to have a fever"},
{c:"攰",j:"gui6",e:"tired"},
{c:"精神",j:"zing1 san4",e:"energetic; in good spirits"},
{c:"嬲",j:"nau1",e:"angry"},
{c:"擔心",j:"daam1 sam1",e:"to worry"},
{c:"怕",j:"paa3",e:"to be afraid"},
{c:"辛苦",j:"san1 fu2",e:"tough; having a hard time"},
{c:"暈",j:"wan4",e:"dizzy"},
{c:"痛",j:"tung3",e:"painful; to hurt"},
{c:"面色",j:"min6 sik1",e:"complexion / how you look"},
{c:"睇醫生",j:"tai2 ji1 sang1",e:"to see a doctor"},
{c:"食藥",j:"sik6 joek6",e:"to take medicine"},
{c:"請假",j:"cing2 gaa3",e:"to ask for leave"},
{c:"好返",j:"hou2 faan1",e:"to get better"},
{c:"休息",j:"jau1 sik1",e:"to rest"},
{c:"打俾",j:"daa2 bei2",e:"to call (someone)"}
],
dialogue:[
{speaker:"A",c:"你今日點啊？睇你面色唔係幾好。",j:"nei5 gam1 jat6 dim2 aa3? tai2 nei5 min6 sik1 m4 hai6 gei2 hou2.",e:"How are you today? You don't look great."},
{speaker:"B",c:"我有啲唔舒服，頭痛同埋好攰。",j:"ngo5 jau5 di1 m4 syu1 fuk6, tau4 tung3 tung4 maai4 hou2 gui6.",e:"I'm a bit unwell — headache and really tired."},
{speaker:"A",c:"有冇發燒啊？",j:"jau5 mou5 faat3 siu1 aa3?",e:"Got a fever?"},
{speaker:"B",c:"冇，不過肚都有啲痛。",j:"mou5, bat1 gwo3 tou5 dou1 jau5 di1 tung3.",e:"No, but my stomach hurts a bit too."},
{speaker:"A",c:"你請假未啊？應該去睇醫生。",j:"nei5 cing2 gaa3 mei6 aa3? jing1 goi1 heoi3 tai2 ji1 sang1.",e:"Have you taken leave yet? You should see a doctor."},
{speaker:"B",c:"我請咗假。而家返咗屋企休息。",j:"ngo5 cing2 zo2 gaa3. ji4 gaa1 faan1 zo2 uk1 kei2 jau1 sik1.",e:"I already took leave. I'm home resting now."},
{speaker:"A",c:"有冇食藥？要唔要我買嘢畀你？",j:"jau5 mou5 sik6 joek6? jiu3 m4 jiu3 ngo5 maai5 je5 bei2 nei5?",e:"Taken medicine? Want me to buy you anything?"},
{speaker:"B",c:"食咗喇。唔使，多謝你擔心。",j:"sik6 zo2 laa3. m4 sai2, do1 ze6 nei5 daam1 sam1.",e:"Already have. No need — thanks for worrying."},
{speaker:"A",c:"你好返先出街。有事打俾我。",j:"nei5 hou2 faan1 sin1 ceot1 gaai1. jau5 si6 daa2 bei2 ngo5.",e:"Only go out once you're better. Call me if anything."},
{speaker:"B",c:"得，我休息兩日應該得。",j:"dak1, ngo5 jau1 sik1 loeng5 jat6 jing1 goi1 dak1.",e:"OK. Two days' rest should do it."}
],
grammar:[
{pattern:"今日點啊？(gam1 jat6 dim2 aa3?)",desc:"How are you today? 點 = how. Casual check-in.",ex:"你今日點啊？睇你面色唔係幾好。(nei5 gam1 jat6 dim2 aa3? tai2 nei5 min6 sik1 m4 hai6 gei2 hou2)",en:"How are you today? You don't look so good."},
{pattern:"請假 (cing2 gaa3)",desc:"Ask for time off. 假 is gaa3 (leave), not gaa2 (fake).",ex:"我請咗假。(ngo5 cing2 zo2 gaa3)",en:"I've taken leave."},
{pattern:"好返先… (hou2 faan1 sin1…)",desc:"Only after recovering, then… 返 = back to a good state.",ex:"你好返先出街。(nei5 hou2 faan1 sin1 ceot1 gaai1)",en:"Only go out once you're better."},
{pattern:"打俾 (daa2 bei2)",desc:"Call (someone). 打俾我 / 打俾佢. Same 俾 as 'give'.",ex:"有事打俾我。(jau5 si6 daa2 bei2 ngo5)",en:"If anything comes up, call me."},
{pattern:"有啲 + adjective",desc:"A bit… 有啲唔舒服, 有啲痛, 有啲攰.",ex:"我有啲唔舒服。(ngo5 jau5 di1 m4 syu1 fuk6)",en:"I'm a bit unwell."}
],
quiz:[
{q:'"唔舒服" means:',opts:["unwell","uncomfortable chair","unhappy only","busy"],ans:0},
{q:'"攰" means:',opts:["hungry","cold","tired","bored"],ans:2},
{q:'"請假" — 假 is pronounced:',opts:["gaa2 (fake)","haa6","gaa1","gaa3 (leave)"],ans:3},
{q:'"睇醫生" means:',opts:["become a doctor","visit a friend","see a doctor","buy medicine"],ans:2},
{q:'"好返" means:',opts:["go home","return a gift","look good","get better"],ans:3},
{q:"B has:",opts:["only a fever","a broken arm","headache, tired, some stomach pain","nothing wrong"],ans:2},
{q:'"嬲" means:',opts:["shy","sleepy","hungry","angry"],ans:3},
{q:'"打俾我" means:',opts:["hit me","give me money","call me","wait for me"],ans:2}
]},

{id:113,title:"L13 語氣助詞",subtitle:"Particles · 喇啦喎啫咩嘅咋啩囉 — the soul of Cantonese",
vocab:[
{c:"啊",j:"aa3",e:"softens a sentence (very common)"},
{c:"喇",j:"laa3",e:"already / a new situation"},
{c:"啦",j:"laa1",e:"suggestion · come on / let's"},
{c:"喎",j:"wo3",e:"new info / mild surprise"},
{c:"啫",j:"ze1",e:"merely / just (downplaying)"},
{c:"咩",j:"me1",e:"surprised question"},
{c:"嘅",j:"ge2",e:"how come? (puzzled)"},
{c:"咋",j:"zaa3",e:"only / that's all"},
{c:"啩",j:"gwaa3",e:"I guess / probably"},
{c:"囉",j:"lo1",e:"obvious / as you know"},
{c:"㗎",j:"gaa3",e:"assertive 'it is so'"},
{c:"添",j:"tim1",e:"even / on top of that"},
{c:"呢",j:"ne1",e:"what about…? (topic)"},
{c:"吓",j:"haa5",e:"a little / try doing"}
],
dialogue:[
{speaker:"A",c:"你食飯喇未？",j:"nei5 sik6 faan6 laa3 mei6?",e:"Have you eaten yet?"},
{speaker:"B",c:"食咗喇。",j:"sik6 zo2 laa3.",e:"Already have."},
{speaker:"A",c:"咁早嘅？而家先六點喎。",j:"gam3 zou2 ge2? ji4 gaa1 sin1 luk6 dim2 wo3.",e:"How come so early? It's only six, you know."},
{speaker:"B",c:"今日放得早啫，做咗六個鐘咋。",j:"gam1 jat6 fong3 dak1 zou2 ze1, zou6 zo2 luk6 go3 zung1 zaa3.",e:"Just got off early today — only worked six hours."},
{speaker:"A",c:"你唔使加班咩？",j:"nei5 m4 sai2 gaa1 baan1 me1?",e:"You don't have to do overtime?"},
{speaker:"B",c:"唔使喎，老闆冇嚟。",j:"m4 sai2 wo3, lou5 baan2 mou5 lai4.",e:"Turns out no — the boss didn't come in."},
{speaker:"A",c:"咁好㗎。我仲要做到九點添。",j:"gam3 hou2 gaa3. ngo5 zung6 jiu3 zou6 dou3 gau2 dim2 tim1.",e:"That's so nice. I even have to work until nine."},
{speaker:"B",c:"你做完就快啲返屋企啦。",j:"nei5 zou6 jyun4 zau6 faai3 di1 faan1 uk1 kei2 laa1.",e:"When you're done, hurry home."},
{speaker:"A",c:"得囉。聽日約唔約得啊？",j:"dak1 lo1. ting1 jat6 joek3 m4 joek3 dak1 aa3?",e:"Alright then. Can we meet tomorrow?"},
{speaker:"B",c:"應該得啩。到時覆你。",j:"jing1 goi1 dak1 gwaa3. dou3 si4 fuk1 nei5.",e:"Should be OK, I guess. I'll reply then."}
],
grammar:[
{pattern:"喇 laa3 vs 啦 laa1",desc:"喇 = already / change of state (食咗喇). 啦 = suggestion or softening (去啦, 返屋企啦).",ex:"食咗喇。快啲返屋企啦。(sik6 zo2 laa3. faai3 di1 faan1 uk1 kei2 laa1)",en:"Already eaten. Hurry home, eh."},
{pattern:"喎 (wo3)",desc:"Marks news or a small contradiction. 'I'll have you know… / turns out…'",ex:"而家先六點喎。唔使喎。(ji4 gaa1 sin1 luk6 dim2 wo3. m4 sai2 wo3)",en:"It's only six, you know. Oh — no need, actually."},
{pattern:"啫 ze1 / 咋 zaa3",desc:"啫 downplays (it's just…). 咋 = only that much. Don't over-claim.",ex:"放得早啫，做咗六個鐘咋。(fong3 dak1 zou2 ze1, zou6 zo2 luk6 go3 zung1 zaa3)",en:"Just got off early — only six hours."},
{pattern:"咩 me1 / 嘅 ge2",desc:"咩 = surprised question (唔使咩？). 嘅 ge2 = how come? (咁早嘅？) Not possessive ge3.",ex:"咁早嘅？你唔使加班咩？(gam3 zou2 ge2? nei5 m4 sai2 gaa1 baan1 me1?)",en:"How come so early? You don't have OT?"},
{pattern:"啩 gwaa3 / 囉 lo1 / 㗎 gaa3 / 添 tim1",desc:"啩 = I guess. 囉 = obviously / closing the point. 㗎 = I assert. 添 = even, on top.",ex:"咁好㗎。應該得啩。得囉。做到九點添。(gam3 hou2 gaa3. jing1 goi1 dak1 gwaa3. dak1 lo1. zou6 dou3 gau2 dim2 tim1)",en:"That's so nice. Should be OK I guess. Alright. Even until nine."}
],
quiz:[
{q:'"食咗喇" means:',opts:["let's eat","don't eat","already eaten","eat later"],ans:2},
{q:'"去啦" is mainly:',opts:["a suggestion: come on, let's go","already gone","a question","anger"],ans:0},
{q:'"喎" often marks:',opts:["past tense","a command","plural","new info / mild surprise"],ans:3},
{q:'"啫" downplays, like:',opts:["definitely","never","just / merely","please"],ans:2},
{q:'"咋" means:',opts:["only / that's all","too much","hurry","maybe"],ans:0},
{q:'"啩" means:',opts:["definitely","never","thanks","I guess / probably"],ans:3},
{q:'"咁早嘅？" — 嘅 is:',opts:["ge3 possessive","gaa3 assertive","ge2 how come?","gwaa3 guess"],ans:2},
{q:'"添" in 做到九點添 means:',opts:["add food","already","please","even / on top of that"],ans:3}
]},

{id:114,title:"L14 做咗做緊",subtitle:"Aspect · done, doing, ever, will",
vocab:[
{c:"咗",j:"zo2",e:"completed (did / have done)"},
{c:"緊",j:"gan2",e:"in progress (doing)"},
{c:"過",j:"gwo3",e:"ever experienced"},
{c:"會",j:"wui5",e:"will (future)"},
{c:"住",j:"zyu6",e:"continuous state (hold / wait)"},
{c:"完",j:"jyun4",e:"finished (verb+完)"},
{c:"已經",j:"ji5 ging1",e:"already"},
{c:"啱啱",j:"ngaam1 ngaam1",e:"just now"},
{c:"打算",j:"daa2 syun3",e:"to plan to"},
{c:"差唔多",j:"caa1 m4 do1",e:"almost / more or less"},
{c:"先至",j:"sin1 zi3",e:"not until"},
{c:"做緊",j:"zou6 gan2",e:"doing (right now)"},
{c:"做咗",j:"zou6 zo2",e:"did / have done"},
{c:"做過",j:"zou6 gwo3",e:"have done before"},
{c:"食緊",j:"sik6 gan2",e:"eating (now)"},
{c:"寫緊",j:"se2 gan2",e:"writing (now)"},
{c:"開會",j:"hoi1 wui2",e:"to have a meeting"},
{c:"跑步",j:"paau2 bou6",e:"to run / jogging"},
{c:"報告",j:"bou3 gou3",e:"a report"},
{c:"等住",j:"dang2 zyu6",e:"waiting (for someone)"}
],
dialogue:[
{speaker:"A",c:"你食咗飯未啊？",j:"nei5 sik6 zo2 faan6 mei6 aa3?",e:"Have you eaten yet?"},
{speaker:"B",c:"我食緊。你呢？",j:"ngo5 sik6 gan2. nei5 ne1?",e:"I'm eating. You?"},
{speaker:"A",c:"我啱啱食完。你今日做過啲咩？",j:"ngo5 ngaam1 ngaam1 sik6 jyun4. nei5 gam1 jat6 zou6 gwo3 di1 me1?",e:"I just finished eating. What have you done today?"},
{speaker:"B",c:"朝早開咗會，而家寫緊報告。",j:"ziu1 zou2 hoi1 zo2 wui2, ji4 gaa1 se2 gan2 bou3 gou3.",e:"Had a meeting this morning, writing a report now."},
{speaker:"A",c:"你做完會去邊啊？",j:"nei5 zou6 jyun4 wui5 heoi3 bin1 aa3?",e:"Where will you go when you're done?"},
{speaker:"B",c:"打算去跑步。你有冇跑過步啊？",j:"daa2 syun3 heoi3 paau2 bou6. nei5 jau5 mou5 paau2 gwo3 bou6 aa3?",e:"Planning to go for a run. Have you ever gone running?"},
{speaker:"A",c:"跑過，不過好耐冇跑。",j:"paau2 gwo3, bat1 gwo3 hou2 noi6 mou5 paau2.",e:"I have — but not for a long time."},
{speaker:"B",c:"一齊去啦，我差唔多寫完。",j:"jat1 cai4 heoi3 laa1, ngo5 caa1 m4 do1 se2 jyun4.",e:"Come with me — I'm almost done writing."},
{speaker:"A",c:"我等你。你寫完先至出？",j:"ngo5 dang2 nei5. nei5 se2 jyun4 sin1 zi3 ceot1?",e:"I'll wait. You won't leave until you finish writing?"},
{speaker:"B",c:"係，十分鐘。你喺度等住我。",j:"hai6, sap6 fan1 zung1. nei5 hai2 dou6 dang2 zyu6 ngo5.",e:"Yes, ten minutes. Wait here for me."}
],
grammar:[
{pattern:"咗 (zo2) vs 完 (jyun4)",desc:"咗 = the action happened. 完 = it is finished through. 食咗 = have eaten; 食完 = finished eating.",ex:"我啱啱食完。你食咗飯未？(ngo5 ngaam1 ngaam1 sik6 jyun4. nei5 sik6 zo2 faan6 mei6?)",en:"I just finished eating. Have you eaten?"},
{pattern:"緊 (gan2)",desc:"Right now in progress. 食緊, 寫緊, 嚟緊. Put after the verb.",ex:"我食緊。而家寫緊報告。(ngo5 sik6 gan2. ji4 gaa1 se2 gan2 bou3 gou3)",en:"I'm eating. Writing a report now."},
{pattern:"過 (gwo3)",desc:"Have you ever…? Experience, not 'just now'. 有冇跑過步, 去過日本.",ex:"你有冇跑過步啊？跑過，不過好耐冇跑。(nei5 jau5 mou5 paau2 gwo3 bou6 aa3? paau2 gwo3, bat1 gwo3 hou2 noi6 mou5 paau2)",en:"Have you ever gone running? I have, but not for ages."},
{pattern:"會 (wui5)",desc:"Will. Tone 5 — not wui6 (a club / meeting). 會去邊, 會遲.",ex:"你做完會去邊啊？(nei5 zou6 jyun4 wui5 heoi3 bin1 aa3?)",en:"Where will you go when you're done?"},
{pattern:"住 (zyu6)",desc:"Hold a state. 等住 = keep waiting. 拎住 = holding. Not the same as 住 'to live'.",ex:"你喺度等住我。(nei5 hai2 dou6 dang2 zyu6 ngo5)",en:"Wait here for me."}
],
quiz:[
{q:'"食緊" means:',opts:["already ate","will eat","eating now","never eats"],ans:2},
{q:'"食咗" means:',opts:["have eaten / ate","eating now","please eat","won't eat"],ans:0},
{q:'"跑過" means:',opts:["running now","will run","can't run","have run before (ever)"],ans:3},
{q:'"會" (will) is:',opts:["wui6","wui2","wui5","wui1"],ans:2},
{q:'"啱啱" means:',opts:["almost","always","just now","never"],ans:2},
{q:'"差唔多" means:',opts:["exactly","too much","never","almost / more or less"],ans:3},
{q:'"等住" means:',opts:["lived there","give up","keep waiting","sit down"],ans:2},
{q:"B will go running:",opts:["yesterday","never","in the meeting","after finishing the report"],ans:3}
]},

{speaker:"B",c:"你件衫好靚喎，邊度買啊？",j:"nei5 gin6 saam1 hou2 leng3 wo3, bin1 dou6 maai5 aa3?",e:"That shirt of yours is nice — where did you buy it?"},
{speaker:"A",c:"隔籬間舖。平過百貨公司好多。",j:"gaak3 lei4 gaan1 pou3. peng4 gwo3 baak3 fo3 gung1 si1 hou2 do1.",e:"The shop next door. Much cheaper than the department store."},
{speaker:"B",c:"我想買兩件。有冇其他顏色？",j:"ngo5 soeng2 maai5 loeng5 gin6. jau5 mou5 kei4 taa1 ngaan4 sik1?",e:"I want to buy two. Any other colours?"},
{speaker:"A",c:"有啊。嗰件黑色都好睇。",j:"jau5 aa3. go2 gin6 hak1 sik1 dou1 hou2 tai2.",e:"Yes. That black one looks good too."},
{speaker:"B",c:"我哋去睇下。你帶咗把遮未？而家好似要落雨。",j:"ngo5 dei6 heoi3 tai2 haa5. nei5 daai3 zo2 baa2 ze1 mei6? ji4 gaa1 hou2 ci5 jiu3 lok6 jyu5.",e:"Let's go look. Did you bring an umbrella? Looks like rain."},
{speaker:"A",c:"帶咗。仲有本雜誌想喺咖啡店睇。",j:"daai3 zo2. zung6 jau5 bun2 zaap6 zi3 soeng2 hai2 gaa3 fe1 dim3 tai2.",e:"Got it. I've also got a magazine I want to read at the café."},
{speaker:"B",c:"得，買完衫去飲咖啡。",j:"dak1, maai5 jyun4 saam1 heoi3 jam2 gaa3 fe1.",e:"OK — after buying clothes, coffee."}
],
grammar:[
{pattern:"number + classifier + noun",desc:"Cantonese almost never says 一衫. It's 一件衫, 一碗麵, 一杯茶.",ex:"一杯凍咖啡、一碗麵、一碟青菜 (jat1 bui1 dung3 gaa3 fe1, jat1 wun2 min6, jat1 dip6 ceng1 coi3)",en:"A cup of iced coffee, a bowl of noodles, a plate of greens."},
{pattern:"間 (gaan1)",desc:"Buildings, shops, rooms. 一間舖, 呢間屋, 嗰間商場. Not haan4.",ex:"隔籬間舖 (gaak3 lei4 gaan1 pou3)",en:"The shop next door."},
{pattern:"件 (gin6)",desc:"Clothes and 'matters'. 一件衫, 呢件事. 兩件 = two pieces.",ex:"我想買兩件。嗰件黑色都好睇。(ngo5 soeng2 maai5 loeng5 gin6. go2 gin6 hak1 sik1 dou1 hou2 tai2)",en:"I want to buy two. That black one looks good too."},
{pattern:"把 / 本 (baa2 / bun2)",desc:"把: umbrellas, knives, chairs (一把遮). 本: books and magazines (一本雜誌).",ex:"你帶咗把遮未？仲有本雜誌。(nei5 daai3 zo2 baa2 ze1 mei6? zung6 jau5 bun2 zaap6 zi3)",en:"Did you bring an umbrella? I've also got a magazine."},
{pattern:"平過 (peng4 gwo3)",desc:"Cheaper than… 過 after an adjective = than. 靚過, 貴過, 遠過.",ex:"平過百貨公司好多 (peng4 gwo3 baak3 fo3 gung1 si1 hou2 do1)",en:"Much cheaper than the department store."}
],
quiz:[
{q:"A cup of coffee is:",opts:["一個咖啡","一隻咖啡","一杯咖啡","一件咖啡"],ans:2},
{q:"A shirt uses classifier:",opts:["隻","條","本","件"],ans:3},
{q:"A shop / building uses:",opts:["間 gaan1","個","隻","把"],ans:0},
{q:"An umbrella uses:",opts:["本","件","把","碗"],ans:2},
{q:"A magazine / book uses:",opts:["張","隻","間","本"],ans:3},
{q:'"靚" means:',opts:["cheap","far","good-looking","hot"],ans:2},
{q:'"平過" means:',opts:["cheaper than","flatter than","nearer than","later than"],ans:0},

]}

{id:116,title:"L16 問句",subtitle:"Questions · 邊個幾時點解點樣幾多 有冇",
vocab:[
{c:"邊個",j:"bin1 go3",e:"who"},
{c:"邊度",j:"bin1 dou6",e:"where"},
{c:"幾時",j:"gei2 si4",e:"when"},
{c:"點解",j:"dim2 gaai2",e:"why"},
{c:"點樣",j:"dim2 joeng2",e:"how (in what way)"},
{c:"幾多",j:"gei2 do1",e:"how many / how much"},
{c:"做咩",j:"zou6 me1",e:"what are you doing; why (casual)"},
{c:"有冇",j:"jau5 mou5",e:"have you / is there (yes-no)"},
{c:"可唔可以",j:"ho2 m4 ho2 ji5",e:"can I / may I"},
{c:"會唔會",j:"wui5 m4 wui5",e:"will you / would you"},
{c:"想唔想",j:"soeng2 m4 soeng2",e:"do you want to"},
{c:"係咪",j:"hai6 mai6",e:"is it…? / right?"},
{c:"邊個電話",j:"bin1 go3 din6 waa2",e:"whose phone (lit. which person's)"},
{c:"點去",j:"dim2 heoi3",e:"how do you get there"},
{c:"為咗",j:"wai6 zo2",e:"for (the sake of)"},
{c:"所以",j:"so2 ji5",e:"so / therefore"},
{c:"因為",j:"jan1 wai6",e:"because"},
{c:"聚會",j:"zeoi6 wui2",e:"get-together / gathering"},
{c:"參加",j:"caam1 gaa1",e:"to join / take part"},
{c:"得唔得",j:"dak1 m4 dak1",e:"is it OK / can we"}
],
dialogue:[
{speaker:"A",c:"聽日邊個聚會啊？",j:"ting1 jat6 bin1 go3 zeoi6 wui2 aa3?",e:"Whose gathering is it tomorrow?"},
{speaker:"B",c:"阿明嘅。你會唔會嚟啊？",j:"aa3 ming4 ge3. nei5 wui5 m4 wui5 lai4 aa3?",e:"Ming's. Will you come?"},
{speaker:"A",c:"想啊。幾時開始？邊度啊？",j:"soeng2 aa3. gei2 si4 hoi1 ci2? bin1 dou6 aa3?",e:"I want to. What time does it start? Where?"},
{speaker:"B",c:"八點，旺角。你知唔知點去？",j:"baat3 dim2, wong6 gok3. nei5 zi1 m4 zi1 dim2 heoi3?",e:"Eight, Mong Kok. Do you know how to get there?"},
{speaker:"A",c:"知。點解咁夜啊？",j:"zi1. dim2 gaai2 gam3 je6 aa3?",e:"Yes. Why so late?"},
{speaker:"B",c:"因為佢放工遲。你可唔可以早啲到幫下手？",j:"jan1 wai6 keoi5 fong3 gung1 ci4. nei5 ho2 m4 ho2 ji5 zou2 di1 dou3 bong1 haa5 sau2?",e:"Because he gets off work late. Can you arrive a bit early and help?"},
{speaker:"A",c:"得。有冇人帶嘢食？",j:"dak1. jau5 mou5 jan4 daai3 je5 sik6?",e:"OK. Is anyone bringing food?"},
{speaker:"B",c:"有。你想唔想買飲品？",j:"jau5. nei5 soeng2 m4 soeng2 maai5 jam2 ban2?",e:"Yes. Do you want to buy drinks?"},
{speaker:"A",c:"得，我買。咁一共幾多人啊？",j:"dak1, ngo5 maai5. gam2 jat1 gung6 gei2 do1 jan4 aa3?",e:"Sure, I'll buy them. So how many people in total?"},
{speaker:"B",c:"大概八個。你唔好遲到啊。",j:"daai6 koi3 baat3 go3. nei5 m4 hou2 ci4 dou3 aa3.",e:"About eight. Don't be late."}
],
grammar:[
{pattern:"Question word stays in place",desc:"Don't move 邊個 / 幾時 / 邊度 to the front like English. 聽日邊個聚會 / 你幾時嚟.",ex:"幾時開始？邊度啊？(gei2 si4 hoi1 ci2? bin1 dou6 aa3?)",en:"What time does it start? Where?"},
{pattern:"A-not-A (會唔會 / 想唔想 / 可唔可以)",desc:"Verb + 唔 + verb = yes/no. Answer with the verb: 會 / 唔會, 想 / 唔想, 可以 / 唔可以.",ex:"你會唔會嚟啊？想啊。(nei5 wui5 m4 wui5 lai4 aa3? soeng2 aa3)",en:"Will you come? I want to."},
{pattern:"有冇 (jau5 mou5)",desc:"Have you / is there. Don't say 有沒有. Answer 有 or 冇.",ex:"有冇人帶嘢食？有。(jau5 mou5 jan4 daai3 je5 sik6? jau5)",en:"Is anyone bringing food? Yes."},
{pattern:"點解…因為… (dim2 gaai2… jan1 wai6…)",desc:"Why… because…",ex:"點解咁夜啊？因為佢放工遲。(dim2 gaai2 gam3 je6 aa3? jan1 wai6 keoi5 fong3 gung1 ci4)",en:"Why so late? Because he gets off work late."},
{pattern:"做咩 (zou6 me1)",desc:"Casual 'what are you doing?' or 'why on earth…?'. 你做咩啊？ / 做咩唔覆我？",ex:"你做咩啊？(nei5 zou6 me1 aa3?)",en:"What are you up to?"}
],
quiz:[
{q:'"點解" means:',opts:["how","where","why","when"],ans:2},
{q:'"幾時" means:',opts:["when","how many","who","why"],ans:0},
{q:'"邊個" means:',opts:["where","which exit","how","who"],ans:3},
{q:'"有冇" is answered with:',opts:["yes / no (English)","係咪","有 or 冇","OK"],ans:2},
{q:'"可唔可以" means:',opts:["can I / may I","must I","did I","won't I"],ans:0},
{q:"The party is at:",opts:["7 in Central","9 at home","noon in Causeway Bay","8 in Mong Kok"],ans:3},
{q:'A-not-A questions repeat the:',opts:["noun","adjective only","English word","verb (會唔會, 想唔想)"],ans:3},
{q:'"點樣" means:',opts:["how (in what way)","why","how much","who"],ans:0}
]},

{id:117,title:"L17 覆訊",subtitle:"Phone and messages · 打俾、覆、聽唔到",
vocab:[
{c:"電話",j:"din6 waa2",e:"phone; phone call"},
{c:"打俾",j:"daa2 bei2",e:"to call (someone)"},
{c:"覆",j:"fuk1",e:"to reply (a message)"},
{c:"訊息",j:"seon3 sik1",e:"message"},
{c:"未睇",j:"mei6 tai2",e:"haven't read / seen yet"},
{c:"出咗街",j:"ceot1 zo2 gaai1",e:"already gone out"},
{c:"聽唔到",j:"teng1 m4 dou2",e:"can't hear"},
{c:"收線",j:"sau1 sin3",e:"to hang up"},
{c:"留言",j:"lau4 jin4",e:"to leave a message; a voicemail"},
{c:"訊號",j:"seon3 hou6",e:"signal (phone/network)"},
{c:"數據",j:"sou3 geoi3",e:"mobile data"},
{c:"WiFi",j:"waai1 faai1",e:"Wi‑Fi"},
{c:"語音",j:"jyu5 jam1",e:"voice message"},
{c:"截圖",j:"zit6 tou4",e:"screenshot"},
{c:"得閒先覆",j:"dak1 haan4 sin1 fuk1",e:"I'll reply when I'm free"},
{c:"打錯",j:"daa2 co3",e:"to dial the wrong number"},
{c:"聽電話",j:"teng1 din6 waa2",e:"to answer the phone"},
{c:"唔方便",j:"m4 fong1 bin6",e:"not convenient (can't talk)"},
{c:"遲啲打返",j:"ci4 di1 daa2 faan1",e:"I'll call back later"},
{c:"見到",j:"gin3 dou2",e:"got it / I see (your message)"}
],
dialogue:[
{speaker:"A",c:"你做咩唔覆我啊？我打咗兩次俾你。",j:"nei5 zou6 me1 m4 fuk1 ngo5 aa3? ngo5 daa2 zo2 loeng5 ci3 bei2 nei5.",e:"Why didn't you reply? I called you twice."},
{speaker:"B",c:"對唔住，我出咗街，訊號好差，聽唔到。",j:"deoi3 m4 zyu6, ngo5 ceot1 zo2 gaai1, seon3 hou6 hou2 caa1, teng1 m4 dou2.",e:"Sorry — I was out, signal was terrible, I couldn't hear."},
{speaker:"A",c:"你而家方便聽電話未啊？",j:"nei5 ji4 gaa1 fong1 bin6 teng1 din6 waa2 mei6 aa3?",e:"Are you free to take a call now?"},
{speaker:"B",c:"唔方便，我喺地鐵。得閒先覆你。",j:"m4 fong1 bin6, ngo5 hai2 dei6 tit3. dak1 haan4 sin1 fuk1 nei5.",e:"Not convenient — I'm on the MTR. I'll reply when I'm free."},
{speaker:"A",c:"得。我留咗語音，你出到去再聽。",j:"dak1. ngo5 lau4 zo2 jyu5 jam1, nei5 ceot1 dou3 heoi3 zoi3 teng1.",e:"OK. I left a voice message — listen when you're out."},
{speaker:"B",c:"見到。係咪今晚仲係七點見？",j:"gin3 dou2. hai6 mai6 gam1 maan5 zung6 hai6 cat1 dim2 gin3?",e:"Got it. Are we still meeting at seven tonight?"},
{speaker:"A",c:"係。我截圖咗地址俾你。",j:"hai6. ngo5 zit6 tou4 zo2 dei6 zi2 bei2 nei5.",e:"Yes. I screenshotted the address for you."},
{speaker:"B",c:"收到。地鐵冇WiFi，我用緊數據。",j:"sau1 dou3. dei6 tit3 mou5 waai1 faai1, ngo5 jung6 gan2 sou3 geoi3.",e:"Received. No Wi‑Fi on the MTR — I'm on data."},
{speaker:"A",c:"唔使而家覆。到咗打俾我。",j:"m4 sai2 ji4 gaa1 fuk1. dou3 zo2 daa2 bei2 ngo5.",e:"No need to reply now. Call me when you arrive."},
{speaker:"B",c:"得。遲啲打返俾你。",j:"dak1. ci4 di1 daa2 faan1 bei2 nei5.",e:"OK. I'll call you back later."}
],
grammar:[
{pattern:"做咩唔… (zou6 me1 m4…)",desc:"Why didn't you…? Mild complaint. 做咩唔覆我 / 做咩唔嚟.",ex:"你做咩唔覆我啊？(nei5 zou6 me1 m4 fuk1 ngo5 aa3?)",en:"Why didn't you reply to me?"},
{pattern:"聽唔到 (teng1 m4 dou2)",desc:"Verb + 唔 + 到 = can't succeed. 聽唔到, 睇唔到, 搵唔到.",ex:"訊號好差，聽唔到。(seon3 hou6 hou2 caa1, teng1 m4 dou2)",en:"Signal is bad — I can't hear."},
{pattern:"得閒先覆 (dak1 haan4 sin1 fuk1)",desc:"I'll reply when I'm free. Extremely common text. 先 = only then.",ex:"我喺地鐵。得閒先覆你。(ngo5 hai2 dei6 tit3. dak1 haan4 sin1 fuk1 nei5)",en:"I'm on the MTR. I'll reply when free."},
{pattern:"見到 / 收到",desc:"Text acknowledgements. 見到 = I saw it. 收到 = received.",ex:"見到。收到。(gin3 dou2. sau1 dou3)",en:"Got it. Received."},
{pattern:"打返俾你 (daa2 faan1 bei2 nei5)",desc:"Call you back. 返 = back (return the call).",ex:"遲啲打返俾你。(ci4 di1 daa2 faan1 bei2 nei5)",en:"I'll call you back later."}
],
quiz:[
{q:'"覆" in messaging means:',opts:["reply","cover","repeat a class","hang up"],ans:0},
{q:'"聽唔到" means:',opts:["don't want to hear","heard already","can't hear","hang up"],ans:2},
{q:'"得閒先覆" means:',opts:["reply immediately","never reply","reply in English","I'll reply when I'm free"],ans:3},
{q:'"打俾你" means:',opts:["hit you","text you","hang up on you","call you"],ans:3},
{q:"B can't talk because:",opts:["asleep","in a meeting","on the MTR","no phone"],ans:2},
{q:'"截圖" means:',opts:["screenshot","map","ticket","photo album"],ans:0},
{q:'"收到" as a reply means:',opts:["I'm rich","come here","hang up","received / got it"],ans:3},
{q:'"遲啲打返" means:',opts:["I'll call back later","call someone else","don't call","lost the phone"],ans:0}
]},

{id:118,title:"L18 天氣",subtitle:"Weather · 熱凍落雨颱風 着多件",
vocab:[
{c:"天氣",j:"tin1 hei3",e:"weather"},
{c:"熱",j:"jit6",e:"hot"},
{c:"凍",j:"dung3",e:"cold"},
{c:"暖",j:"nyun5",e:"warm"},
{c:"涼",j:"loeng4",e:"cool"},
{c:"落雨",j:"lok6 jyu5",e:"to rain"},
{c:"出太陽",j:"ceot1 taai3 joeng4",e:"the sun's out"},

{c:"潮濕",j:"ciu4 sap1",e:"humid"},

{c:"除衫",j:"ceoi4 saam1",e:"to take off a layer / clothes"},
{c:"遮",j:"ze1",e:"umbrella"},
{c:"天氣預報",j:"tin1 hei3 jyu6 bou3",e:"weather forecast"},
{c:"悶熱",j:"mun6 jit6",e:"muggy / stuffy-hot"},
{c:"大風",j:"daai6 fung1",e:"strong wind"},
{c:"取消",j:"ceoi2 siu1",e:"to cancel"},
{c:"喺屋企",j:"hai2 uk1 kei2",e:"at home"}
],
dialogue:[
{speaker:"A",c:"今日天氣好悶熱，出唔出街啊？",j:"gam1 jat6 tin1 hei3 hou2 mun6 jit6, ceot1 m4 ceot1 gaai1 aa3?",e:"It's so muggy today — going out?"},
{speaker:"B",c:"我想出，不過天氣預報話會落雨。",j:"ngo5 soeng2 ceot1, bat1 gwo3 tin1 hei3 jyu6 bou3 waa6 wui5 lok6 jyu5.",e:"I want to, but the forecast says rain."},
{speaker:"A",c:"真係？我都冇帶遮。",j:"zan1 hai6? ngo5 dou1 mou5 daai3 ze1.",e:"Really? I didn't bring an umbrella either."},
{speaker:"B",c:"聽日更加差，話有颱風，可能掛波。",j:"ting1 jat6 gang3 gaa1 caa1, waa6 jau5 toi4 fung1, ho2 nang4 gwaa3 bo1.",e:"Tomorrow's worse — they say a typhoon, maybe a signal."},
{speaker:"A",c:"如果掛波，我哋聽日取消得唔得？",j:"jyu4 gwo2 gwaa3 bo1, ngo5 dei6 ting1 jat6 ceoi2 siu1 dak1 m4 dak1?",e:"If there's a signal, can we cancel tomorrow?"},
{speaker:"B",c:"得。掛波就喺屋企，開冷氣睇戲。",j:"dak1. gwaa3 bo1 zau6 hai2 uk1 kei2, hoi1 laang5 hei3 tai2 hei3.",e:"Yes. Signal up, stay home, air-con and a film."},
{speaker:"A",c:"而家都好潮濕。你着多件啦，夜晚會涼。",j:"ji4 gaa1 dou1 hou2 ciu4 sap1. nei5 zoek3 do1 gin6 laa1, je6 maan5 wui5 loeng4.",e:"It's humid now too. Put on an extra layer — it'll be cool at night."},
{speaker:"B",c:"我怕熱，除咗件外套。",j:"ngo5 paa3 jit6, ceoi4 zo2 gin6 ngoi6 tou3.",e:"I run hot — I took the jacket off."},
{speaker:"A",c:"出到太陽又熱，落雨又凍，香港天氣真係癲。",j:"ceot1 dou3 taai3 joeng4 jau6 jit6, lok6 jyu5 jau6 dung3, hoeng1 gong2 tin1 hei3 zan1 hai6 din1.",e:"Sun and it's hot, rain and it's cold — HK weather is wild."},
{speaker:"B",c:"係囉。咁而家去食個雪糕先。",j:"hai6 lo1. gam2 ji4 gaa1 heoi3 sik6 go3 syut3 gou1 sin1.",e:"Right. Let's get an ice cream first then."}
],
grammar:[
{pattern:"出唔出街 (ceot1 m4 ceot1 gaai1)",desc:"A-not-A with 出. Same pattern: 熱唔熱, 落唔落雨.",ex:"今日天氣好悶熱，出唔出街啊？(gam1 jat6 tin1 hei3 hou2 mun6 jit6, ceot1 m4 ceot1 gaai1 aa3?)",en:"So muggy today — going out or not?"},
{pattern:"話會… (waa6 wui5…)",desc:"They say it will… 話 = say (report). 天氣預報話會落雨.",ex:"天氣預報話會落雨。(tin1 hei3 jyu6 bou3 waa6 wui5 lok6 jyu5)",en:"The forecast says it will rain."},
{pattern:"掛波 (gwaa3 bo1)",desc:"Typhoon signal is up. HK daily life. 掛八號波 = T8, stay home.",ex:"如果掛波，我哋聽日取消。(jyu4 gwo2 gwaa3 bo1, ngo5 dei6 ting1 jat6 ceoi2 siu1)",en:"If there's a typhoon signal, we cancel tomorrow."},
{pattern:"着多件 (zoek3 do1 gin6)",desc:"Put on an extra piece. 着 = wear (zoek3). 除 = take off.",ex:"你着多件啦，夜晚會涼。(nei5 zoek3 do1 gin6 laa1, je6 maan5 wui5 loeng4)",en:"Put on an extra layer — night will be cool."},
{pattern:"又…又… (jau6… jau6…)",desc:"Both… and… 出太陽又熱，落雨又凍.",ex:"出到太陽又熱，落雨又凍。(ceot1 dou3 taai3 joeng4 jau6 jit6, lok6 jyu5 jau6 dung3)",en:"Sun and it's hot; rain and it's cold."}
],

{c:"醜",j:"cau2",e:"ugly"},
{c:"快",j:"faai3",e:"fast"},
{c:"慢",j:"maan6",e:"slow"},
{c:"多",j:"do1",e:"many / much"},
{c:"少",j:"siu2",e:"few / little"},
{c:"遠",j:"jyun5",e:"far"},
{c:"近",j:"kan5",e:"near"},
{c:"比較",j:"bei2 gaau3",e:"to compare"},
{c:"最",j:"zeoi3",e:"the most"},
{c:"一樣",j:"jat1 joeng6",e:"the same"},
{c:"唔同",j:"m4 tung4",e:"different"}
],
dialogue:[
{speaker:"A",c:"呢兩部電話你覺得邊部靚啲？",j:"ni1 loeng5 bou6 din6 waa2 nei5 gok3 dak1 bin1 bou6 leng3 di1?",e:"These two phones — which do you think looks nicer?"},
{speaker:"B",c:"黑色嗰部新啲，不過貴好多。",j:"hak1 sik1 go2 bou6 san1 di1, bat1 gwo3 gwai3 hou2 do1.",e:"The black one is newer, but much more expensive."},
{speaker:"A",c:"白色嗰部細啲，放袋好啲。",j:"baak6 sik1 go2 bou6 sai3 di1, fong3 doi2 hou2 di1.",e:"The white one is smaller — better in a pocket."},
{speaker:"B",c:"我寧願大啲。螢幕大，睇嘢快。",j:"ngo5 ning4 jyun3 daai6 di1. jing4 mok6 daai6, tai2 je5 faai3.",e:"I'd rather a bigger one. Big screen, faster to look at stuff."},
{speaker:"A",c:"舊嗰部都仲用得。唔使最貴嗰個。",j:"gau6 go2 bou6 dou1 zung6 jung6 dak1. m4 sai2 zeoi3 gwai3 go2 go3.",e:"The old one still works. No need for the most expensive."},
{speaker:"B",c:"係。兩部其實差唔多樣。",j:"hai6. loeng5 bou6 kei4 sat6 caa1 m4 do1 joeng6.",e:"Yeah. The two are actually almost the same."},
{speaker:"A",c:"電器舖近唔近啊？",j:"din6 hei3 pou3 kan5 m4 kan5 aa3?",e:"Is the electronics shop close?"},
{speaker:"B",c:"唔遠，行五分鐘。比商場平。",j:"m4 jyun5, haang4 ng5 fan1 zung1. bei2 soeng1 coeng4 peng4.",e:"Not far — five minutes' walk. Cheaper than the mall."},
{speaker:"A",c:"咁去睇下。我最怕買錯。",j:"gam2 heoi3 tai2 haa5. ngo5 zeoi3 paa3 maai5 co3.",e:"Then let's go look. I hate buying the wrong one most."},
{speaker:"B",c:"得。慢慢比較，唔好太快決定。",j:"dak1. maan6 maan2 bei2 gaau3, m4 hou2 taai3 faai3 kyut3 ding6.",e:"OK. Compare slowly — don't decide too fast."}
],
grammar:[
{pattern:"Adj + 啲 (di1)",desc:"-er / a bit more. 靚啲, 新啲, 大啲, 平啲. The everyday comparative.",ex:"邊部靚啲？黑色嗰部新啲。(bin1 bou6 leng3 di1? hak1 sik1 go2 bou6 san1 di1)",en:"Which looks nicer? The black one is newer."},
{pattern:"Adj + 好多 (hou2 do1)",desc:"Much more… 貴好多, 快好多, 遠好多.",ex:"不過貴好多。(bat1 gwo3 gwai3 hou2 do1)",en:"But much more expensive."},
{pattern:"最 (zeoi3)",desc:"The most. 最貴, 最怕, 最好.",ex:"唔使最貴嗰個。我最怕買錯。(m4 sai2 zeoi3 gwai3 go2 go3. ngo5 zeoi3 paa3 maai5 co3)",en:"No need for the most expensive. What I fear most is buying wrong."},
{pattern:"比 (bei2)",desc:"A 比 B + adj. 比商場平 = cheaper than the mall.",ex:"行五分鐘。比商場平。(haang4 ng5 fan1 zung1. bei2 soeng1 coeng4 peng4)",en:"Five minutes' walk. Cheaper than the mall."},
{pattern:"大/細 vs 高/矮 vs 長/短",desc:"大細 = size. 高矮 = height of people. 長短 = length. Don't mix.",ex:"白色嗰部細啲。我寧願大啲。(baak6 sik1 go2 bou6 sai3 di1. ngo5 ning4 jyun3 daai6 di1)",en:"The white one is smaller. I'd rather bigger."}
],
quiz:[
{q:'"細" means:',opts:["big","tall","small","old"],ans:2},
{q:'"舊" for objects means:',opts:["old (thing)","old (person)","new","cheap"],ans:0},
{q:'"靚啲" means:',opts:["the ugliest","not nice","too nice","a bit nicer / nicer"],ans:3},
{q:'"最" means:',opts:["the most","a bit","not","than"],ans:0},
{q:'"比商場平" means:',opts:["the mall is cheaper","same as the mall","cheaper than the mall","inside the mall"],ans:2},
{q:"B prefers a phone that is:",opts:["smaller","the most expensive","white","bigger"],ans:3},
{q:'People\'s height uses:',opts:["大 / 細","長 / 短","高 / 矮","新 / 舊"],ans:2},
{q:'"差唔多樣" means:',opts:["almost the same","completely different","very expensive","too far"],ans:0}
]},

{id:120,title:"L20 開口講",subtitle:"Survival lines · slow down, how do I say, 即係",
vocab:[
{c:"唔該借借",j:"m4 goi1 ze3 ze3",e:"excuse me (passing through)"},
{c:"我唔識講",j:"ngo5 m4 sik1 gong2",e:"I don't know how to say it"},
{c:"講慢啲",j:"gong2 maan6 di1",e:"speak a bit slower"},
{c:"再講一次",j:"zoi3 gong2 jat1 ci3",e:"say it again"},
{c:"點講",j:"dim2 gong2",e:"how do you say…"},
{c:"即係",j:"zik1 hai6",e:"that is / you mean…"},
{c:"係咪咁解",j:"hai6 mai6 gam2 gaai2",e:"is that what it means?"},
{c:"我聽唔明",j:"ngo5 teng1 m4 ming4",e:"I don't understand (what I heard)"},
{c:"我睇唔明",j:"ngo5 tai2 m4 ming4",e:"I don't understand (what I read)"},
{c:"英文得唔得",j:"jing1 man2 dak1 m4 dak1",e:"is English OK?"},
{c:"等等",j:"dang2 dang2",e:"wait a second"},
{c:"差唔多",j:"caa1 m4 do1",e:"almost; more or less"},
{c:"唔好意思",j:"m4 hou2 ji3 si1",e:"excuse me / sorry (polite)"},
{c:"麻煩你",j:"maa4 faan4 nei5",e:"could I trouble you to…"},
{c:"得唔得啊",j:"dak1 m4 dak1 aa3",e:"is that OK?"},
{c:"我學緊粵語",j:"ngo5 hok6 gan2 jyut6 jyu5",e:"I'm learning Cantonese"},
{c:"唔該你幫我",j:"m4 goi1 nei5 bong1 ngo5",e:"please help me"},
{c:"呢個叫咩",j:"ni1 go3 giu3 me1",e:"what's this called"},
{c:"可唔可以寫低",j:"ho2 m4 ho2 ji5 se2 dai1",e:"can you write it down"},
{c:"多謝指教",j:"do1 ze6 zi2 gaau3",e:"thanks for teaching me"}
],
dialogue:[
{speaker:"A",c:"唔好意思，可唔可以講慢啲？我學緊粵語。",j:"m4 hou2 ji3 si1, ho2 m4 ho2 ji5 gong2 maan6 di1? ngo5 hok6 gan2 jyut6 jyu5.",e:"Sorry — can you speak a bit slower? I'm learning Cantonese."},
{speaker:"B",c:"得得得。你聽唔明邊句啊？",j:"dak1 dak1 dak1. nei5 teng1 m4 ming4 bin1 geoi3 aa3?",e:"Sure sure. Which sentence didn't you get?"},
{speaker:"A",c:"頭先嗰句。即係點解啊？",j:"tau4 sin1 go2 geoi3. zik1 hai6 dim2 gaai2 aa3?",e:"The one just now. So what does it mean?"},
{speaker:"B",c:"即係叫你轉右。係咪咁解？",j:"zik1 hai6 giu3 nei5 zyun3 jau6. hai6 mai6 gam2 gaai2?",e:"It means turn right. Is that what you thought?"},
{speaker:"A",c:"差唔多。『轉右』英文點講我知，粵語我唔識講。",j:"caa1 m4 do1. zyun3 jau6 jing1 man2 dim2 gong2 ngo5 zi1, jyut6 jyu5 ngo5 m4 sik1 gong2.",e:"Almost. I know 'turn right' in English — I just can't say it in Cantonese."},
{speaker:"B",c:"你跟我講：轉右。",j:"nei5 gan1 ngo5 gong2: zyun3 jau6.",e:"Say it after me: zyun3 jau6."},
{speaker:"A",c:"轉右。啱唔啱啊？",j:"zyun3 jau6. ngaam1 m4 ngaam1 aa3?",e:"Zyun3 jau6. Is that right?"},
{speaker:"B",c:"啱。可唔可以寫低俾你？",j:"ngaam1. ho2 m4 ho2 ji5 se2 dai1 bei2 nei5?",e:"Correct. Want me to write it down for you?"},
{speaker:"A",c:"唔該你幫我。英文得唔得？我怕睇唔明。",j:"m4 goi1 nei5 bong1 ngo5. jing1 man2 dak1 m4 dak1? ngo5 paa3 tai2 m4 ming4.",e:"Please. Is English OK? I'm afraid I won't understand the writing."},
{speaker:"B",c:"得。慢慢嚟。多謝你肯開口講。",j:"dak1. maan6 maan2 lai4. do1 ze6 nei5 hang2 hoi1 hau2 gong2.",e:"Yes. Take it slow. Thanks for being willing to speak."}
],
grammar:[
{pattern:"可唔可以 + verb",desc:"Can you…? The polite request workhorse.",ex:"可唔可以講慢啲？可唔可以寫低？(ho2 m4 ho2 ji5 gong2 maan6 di1? ho2 m4 ho2 ji5 se2 dai1?)",en:"Can you speak slower? Can you write it down?"},
{pattern:"即係 (zik1 hai6)",desc:"That is / you mean… Use it to check meaning. 即係點解 / 即係轉右.",ex:"即係叫你轉右。即係點解啊？(zik1 hai6 giu3 nei5 zyun3 jau6. zik1 hai6 dim2 gaai2 aa3?)",en:"It means turn right. So what does it mean?"},
{pattern:"聽唔明 / 睇唔明",desc:"Don't understand what you hear vs what you read. 明 = understand.",ex:"我聽唔明。我怕睇唔明。(ngo5 teng1 m4 ming4. ngo5 paa3 tai2 m4 ming4)",en:"I don't understand (heard). I'm afraid I won't understand (written)."},
{pattern:"點講 (dim2 gong2)",desc:"How do you say…? X 點講？ / 粵語點講？",ex:"『轉右』英文點講我知 (zyun3 jau6 jing1 man2 dim2 gong2 ngo5 zi1)",en:"I know how to say turn-right in English."},
{pattern:"開口講 (hoi1 hau2 gong2)",desc:"Open your mouth and speak. The whole point of this lesson.",ex:"多謝你肯開口講。(do1 ze6 nei5 hang2 hoi1 hau2 gong2)",en:"Thanks for being willing to speak."}
],
quiz:[
{q:'"講慢啲" means:',opts:["speak a bit slower","speak faster","don't speak","speak English"],ans:0},
{q:'"即係" means:',opts:["because","never","please","that is / you mean"],ans:3},
{q:'"聽唔明" means:',opts:["can't see","can't walk","don't understand (heard)","don't want to"],ans:2},
{q:'"睇唔明" is about:',opts:["reading / seeing","hearing","smelling","money"],ans:0},
{q:'"唔該借借" is for:',opts:["thanking a gift","ordering food","saying sorry for being late","passing through a crowd"],ans:3},
{q:'"我學緊粵語" means:',opts:["I teach Cantonese","I forgot Cantonese","I'm learning Cantonese","I hate Cantonese"],ans:2},
{q:'"再講一次" means:',opts:["say it again","don't repeat","say it faster","write it"],ans:0},
{q:'"係咪咁解" checks:',opts:["the bill","the time","the weather","whether that's the meaning"],ans:3}
]}
,
{id:121,title:"L21 茶餐廳",subtitle:"Cha chaan teng · 常餐、加底、少甜、打包",
vocab:[
{c:"茶餐廳",j:"caa4 caan1 teng1",e:"Hong Kong diner (cha chaan teng)"},

{c:"麵",j:"min6",e:"noodles"},
{c:"飯",j:"faan6",e:"rice / a meal"},

{c:"西多士",j:"sai1 do1 si2",e:"French toast (HK style)"},

{c:"奶茶",j:"naai5 caa4",e:"milk tea"},
{c:"檸茶",j:"ning2 caa4",e:"lemon tea"},
{c:"少甜",j:"siu2 tim4",e:"less sugar"},
{c:"走甜",j:"zau2 tim4",e:"no sugar"},

{c:"快啲",j:"faai3 di1",e:"hurry up / quicker"},

],
dialogue:[
{speaker:"A",c:"唔該，有位未啊？兩個人。",j:"m4 goi1, jau5 wai2 mei6 aa3? loeng5 go3 jan4.",e:"Excuse me, any seats? Two of us."},
{speaker:"B",c:"有，呢邊坐。飲咩啊？",j:"jau5, ni1 bin1 co5. jam2 me1 aa3?",e:"Yes, sit here. What are you drinking?"},
{speaker:"A",c:"我要杯熱奶茶少甜。佢要凍檸茶走甜。",j:"ngo5 jiu3 bui1 jit6 naai5 caa4 siu2 tim4. keoi5 jiu3 dung3 ning2 caa4 zau2 tim4.",e:"Hot milk tea, less sugar. Iced lemon tea, no sugar for them."},
{speaker:"B",c:"食咩常餐？",j:"sik6 me1 soeng4 caan1?",e:"Which set meal?"},
{speaker:"A",c:"一個豬扒飯加底，一個西多士。",j:"jat1 go3 zyu1 paa2 faan6 gaa1 dai2, jat1 go3 sai1 do1 si2.",e:"One pork-chop rice with extra rice, one French toast."},
{speaker:"B",c:"西多士要茄汁定糖漿？",j:"sai1 do1 si2 jiu3 ke2 zap1 ding6 tong4 zoeng1?",e:"French toast — ketchup or syrup?"},
{speaker:"A",c:"糖漿。快唔快啊？我趕時間。",j:"tong4 zoeng1. faai3 m4 faai3 aa3? ngo5 gon2 si4 gaan3.",e:"Syrup. Is it quick? I'm in a hurry."},
{speaker:"B",c:"快。等陣好咗叫你。",j:"faai3. dang2 zan6 hou2 zo2 giu3 nei5.",e:"Fast. I'll call you when it's ready."},
{speaker:"A",c:"呢個打包得唔得？食唔晒。",j:"ni1 go3 daa2 baau1 dak1 m4 dak1? sik6 m4 saai3.",e:"Can I take this away? I can't finish it."},
{speaker:"B",c:"得。唔該埋單，五十蚊。",j:"dak1. m4 goi1 maai4 daan1, ng5 sap6 man1.",e:"Yes. Bill — fifty dollars."}
],
grammar:[
{pattern:"少甜 / 走甜 (siu2 tim4 / zau2 tim4)",desc:"Drink customisation. 少 = less. 走 = hold / without. Also 走冰, 走青.",ex:"熱奶茶少甜。凍檸茶走甜。(jit6 naai5 caa4 siu2 tim4. dung3 ning2 caa4 zau2 tim4)",en:"Hot milk tea less sugar. Iced lemon tea no sugar."},
{pattern:"加底 (gaa1 dai2)",desc:"Extra base (rice or noodles) in a set. Classic cha chaan teng.",ex:"豬扒飯加底 (zyu1 paa2 faan6 gaa1 dai2)",en:"Pork-chop rice with extra rice."},
{pattern:"有位未？(jau5 wai2 mei6?)",desc:"Any seats yet? 位 is wai2 (seat). Don't say wai6.",ex:"唔該，有位未啊？兩個人。(m4 goi1, jau5 wai2 mei6 aa3? loeng5 go3 jan4)",en:"Excuse me, any seats? Two people."},
{pattern:"打包 (daa2 baau1)",desc:"Take away. 呢個打包 / 打包返屋企.",ex:"呢個打包得唔得？食唔晒。(ni1 go3 daa2 baau1 dak1 m4 dak1? sik6 m4 saai3)",en:"Can I take this away? I can't finish it."},
{pattern:"食唔晒 (sik6 m4 saai3)",desc:"Can't finish it all. 晒 = completely. Verb + 唔 + 晒.",ex:"食唔晒。(sik6 m4 saai3)",en:"I can't finish it."}
],

{id:122,title:"L22 鐘點",subtitle:"Clock time · 點、半、個字、差、朝早夜晚",
vocab:[
{c:"幾點",j:"gei2 dim2",e:"what time"},
{c:"點鐘",j:"dim2 zung1",e:"o'clock"},
{c:"半",j:"bun3",e:"half (past)"},
{c:"個字",j:"go3 zi6",e:"five minutes (on the clock)"},
{c:"差",j:"caa1",e:"to / short of (time)"},
{c:"朝早",j:"ziu1 zou2",e:"morning"},
{c:"中午",j:"zung1 ng5",e:"noon (also 晏晝)"},
{c:"夜晚",j:"je6 maan5",e:"evening / night"},
{c:"凌晨",j:"ling4 san4",e:"after midnight / small hours"},
{c:"準時",j:"zeon2 si4",e:"on time"},
{c:"早到",j:"zou2 dou3",e:"arrive early"},
{c:"遲到",j:"ci4 dou3",e:"arrive late"},
{c:"趕",j:"gon2",e:"to rush; to be in a hurry"},
{c:"嚟得切",j:"lai4 dak1 cit3",e:"to make it in time"},
{c:"嚟唔切",j:"lai4 m4 cit3",e:"won't make it in time"},
{c:"開始",j:"hoi1 ci2",e:"to start"},
{c:"完",j:"jyun4",e:"to finish"},
{c:"今日",j:"gam1 jat6",e:"today"},
{c:"聽日",j:"ting1 jat6",e:"tomorrow"},
{c:"尋日",j:"cam4 jat6",e:"yesterday"}
],
dialogue:[
{speaker:"A",c:"而家幾點啊？",j:"ji4 gaa1 gei2 dim2 aa3?",e:"What time is it now?"},
{speaker:"B",c:"十點三個字。即係十點十五分。",j:"sap6 dim2 saam1 go3 zi6. zik1 hai6 sap6 dim2 sap6 ng5 fan1.",e:"Ten and three 'characters' — that's 10:15."},
{speaker:"A",c:"電影十點半開始。我哋嚟唔切啊？",j:"din6 jing2 sap6 dim2 bun3 hoi1 ci2. ngo5 dei6 lai4 m4 cit3 aa3?",e:"The film starts at 10:30. Will we not make it?"},
{speaker:"B",c:"而家去就嚟得切。差廿分鐘。",j:"ji4 gaa1 heoi3 zau6 lai4 dak1 cit3. caa1 jaa6 fan1 zung1.",e:"If we go now we'll make it. Twenty minutes short."},
{speaker:"A",c:"我最怕遲到。不如早到十分鐘。",j:"ngo5 zeoi3 paa3 ci4 dou3. bat1 jyu4 zou2 dou3 sap6 fan1 zung1.",e:"I hate being late. Let's arrive ten minutes early."},
{speaker:"B",c:"得。你朝早定夜晚睇戲好啲？",j:"dak1. nei5 ziu1 zou2 ding6 je6 maan5 tai2 hei3 hou2 di1?",e:"OK. Morning or evening — which is better for films?"},
{speaker:"A",c:"夜晚。朝早我趕住返工。",j:"je6 maan5. ziu1 zou2 ngo5 gon2 zyu6 faan1 gung1.",e:"Evening. In the morning I'm rushing to work."},
{speaker:"B",c:"尋日我睇咗凌晨場，準時到。",j:"cam4 jat6 ngo5 tai2 zo2 ling4 san4 coeng4, zeon2 si4 dou3.",e:"Yesterday I did a late-night showing — got there on time."},
{speaker:"A",c:"咁癲。聽日七點半見得唔得？",j:"gam3 din1. ting1 jat6 cat1 dim2 bun3 gin3 dak1 m4 dak1?",e:"That's wild. Meet at 7:30 tomorrow?"},
{speaker:"B",c:"七點半早啲。八點得唔得？",j:"cat1 dim2 bun3 zou2 di1. baat3 dim2 dak1 m4 dak1?",e:"7:30 is a bit early. Is 8 OK?"}
],
grammar:[
{pattern:"X點Y分 / X點半",desc:"10:00 十點. 10:30 十點半. 10:15 十點十五分.",ex:"電影十點半開始。(din6 jing2 sap6 dim2 bun3 hoi1 ci2)",en:"The film starts at 10:30."},
{pattern:"個字 (go3 zi6)",desc:"Old HK clock-speak: 1 個字 = 5 minutes. 三個字 = 15 min. Still heard.",ex:"十點三個字。即係十點十五分。(sap6 dim2 saam1 go3 zi6. zik1 hai6 sap6 dim2 sap6 ng5 fan1)",en:"Ten and three marks — that's 10:15."},

let studyMode=localStorage.getItem('cantonese-mode')||'levels';
let LESSONS=(studyMode==='course'?COURSE:LEVELS).filter(Boolean);

const INTERVALS=[0,86400000,259200000,604800000,1209600000];
const BOX_COLORS=['var(--red)','var(--yellow)','var(--blue)','var(--green)','var(--accent2)'];
const BOX_LABELS=['Box 1 — New','Box 2 — Soon','Box 3 — Familiar','Box 4 — Known','Box 5 — Mastered'];

let progress=loadProgress();
let currentLesson=0;
let showJp=false,showEn=false;
let currentSection='dialogue';
let fcMode='due',fcQueue=[],fcQueuePos=0,fcFlipped=false,fcSessionDone=false;
let fcSessionCorrect=0,fcSessionWrong=0,fcMistakes=[];
let quizMode='meaning',quizQuestions=[],quizAnswered=0,quizCorrect=0;

function loadProgress(){
  try{
    const raw=localStorage.getItem('cantonese-progress')||localStorage.getItem('cantonese"progress');
    const d=JSON.parse(raw);
    if(d&&d.version===1){if(!d.quizzes)d.quizzes={};return d}
  }catch(e){}
  return{version:1,streak:{lastDate:'',count:0},words:{},quizzes:{}};
}
function saveProgress(){localStorage.setItem('cantonese-progress',JSON.stringify(progress))}

function markWord(char,correct){
  if(!progress.words[char])progress.words[char]={box:1,lastReview:0,nextReview:0,correct:0,wrong:0};
  const w=progress.words[char];
  w.lastReview=Date.now();
  if(correct){w.box=Math.min(5,w.box+1);w.correct++}
  else{w.box=1;w.wrong++}
  w.nextReview=INTERVALS[w.box-1]===0?0:w.lastReview+INTERVALS[w.box-1];
  updateStreak();
  saveProgress();
}

function isDue(char){
  const w=progress.words[char];
  if(!w)return true;
  return Date.now()>=w.nextReview;
}

function getBox(char){
  const w=progress.words[char];
  return w?w.box:0;
}

function updateStreak(){
  const today=new Date().toDateString();
  const s=progress.streak;
  if(s.lastDate===today)return;
  const yesterday=new Date(Date.now()-86400000).toDateString();
  s.count=s.lastDate===yesterday?s.count+1:1;
  s.lastDate=today;
  saveProgress();
}

function masteryDots(char){
  const box=getBox(char);
  let h='<div class="mastery-dots">';
  for(let i=1;i<=5;i++){
    h+='<div class="dot'+(i<=box?' f'+box:'')+'"></div>';
  }
  return h+'</div>';
}

function getLessonStats(L){
  const boxes=[0,0,0,0,0];
  let newC=0;
  L.vocab.forEach(v=>{
    const w=progress.words[v.c];
    if(!w)newC++;else boxes[w.box-1]++;
  });
  return{total:L.vocab.length,new:newC,learning:boxes[0]+boxes[1]+boxes[2],mastered:boxes[3]+boxes[4],boxes};
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function lessonDone(id){
  return !!(progress.quizzes&&progress.quizzes[id]);
}
function persistLesson(){

function jumpStudy(i,section){

function setMode(m){

function switchLesson(i){

let dialogueMode=localStorage.getItem('dialogueMode')||'full';

function speak(text){
  if(window.speechSynthesis.speaking){window.speechSynthesis.cancel();return}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-HK';u.rate=0.85;
  u.onend=()=>{document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'))};
  u.onerror=()=>{document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'))};
  document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'));
  const btns=[...document.querySelectorAll('.speak-btn')].filter(b=>{const s=b.dataset.speak;return s===text||s===text.replace(/[，。？！、；：！？]/g,'')});
  btns.forEach(b=>b.classList.add('speaking'));
  speechSynthesis.speak(u);
}

      for(let i=1;i<sents.length;i++){
        h+='<div class="sentence-card"><div class="sn-num">'+(++sn)+'</div><div class="sn-text"><div class="sn-zh">'+sents[i]+'<button class="speak-btn" data-speak="'+sents[i].replace(/"/g,'&quot;')+'" onclick="speak(this.dataset.speak)" title="Listen">🔊</button></div><div class="sn-jp" style="display:'+(showJp?'block':'none')+'">'+colorJyutping(jsents[i]||'')+'</div><div class="sn-en" style="display:'+(showEn?'block':'none')+'">'+(esents[i]||'')+'</div></div></div>';
