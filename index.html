{id:170,title:"L70 助詞2",subtitle:"More particles · 喎噃㗎喇吓之嘛",
vocab:[
{c:"喎",j:"wo3",e:"new info / contrary to what you thought"},
{c:"噃",j:"bo3",e:"I told you so / see?"},
{c:"㗎",j:"gaa3",e:"assertion (嘅+啊)"},
{c:"之嘛",j:"zi1 maa3",e:"that's all / merely"},
{c:"咋嘛",j:"zaa3 maa3",e:"that's all there is to it"},
{c:"啫",j:"ze1",e:"just / no big deal"},
{c:"吓",j:"haa5",e:"a little; try"},
{c:"啦吓",j:"laa1 haa2",e:"soft suggestion check"},
{c:"嘅啫",j:"ge3 ze1",e:"it's just that…"},
{c:"呢噃",j:"ne1 bo3",e:"see? (pointing out)"},
{c:"囉喎",j:"lo1 wo3",e:"as you'd expect, you know"},
{c:"添",j:"tim1",e:"even / on top"},
{c:"咩話",j:"me1 waa2",e:"pardon? / what did you say?"},
{c:"係咪呀",j:"hai6 mai6 aa3",e:"is that so?"},
{c:"唔係啩",j:"m4 hai6 gwaa3",e:"it can't be, can it?"},
{c:"好話之",j:"hou2 waa6 zi1",e:"luckily / it's a good thing that"},
{c:"都話",j:"dou1 waa6",e:"I told you"},
{c:"你睇",j:"nei5 tai2",e:"see? / look"},
{c:"話之你",j:"waa6 zi1 nei5",e:"suit yourself"},
{c:"就算啦",j:"zau6 syun3 laa1",e:"forget it then"}
],
dialogue:[
{speaker:"A",c:"你話今日唔落雨㗎。而家落緊添。",j:"nei5 waa6 gam1 jat6 m4 lok6 jyu5 gaa3. ji4 gaa1 lok6 gan2 tim1.",e:"You said it wouldn't rain. And now it's raining on top of that."},
{speaker:"B",c:"天氣預報講喎。又唔係我控制。",j:"tin1 hei3 jyu6 bou3 gong2 wo3. jau6 m4 hai6 ngo5 hung3 zai3.",e:"That's what the forecast said, you know. I don't control it."},
{speaker:"A",c:"都話帶遮。你唔聽噃。",j:"dou1 waa6 daai3 ze1. nei5 m4 teng1 bo3.",e:"I told you to bring an umbrella. See, you didn't listen."},
{speaker:"B",c:"少少雨之嘛。唔使咁緊張。",j:"siu2 siu2 jyu5 zi1 maa3. m4 sai2 gam3 gan2 zoeng1.",e:"It's just a little rain. No need to be so tense."},
{speaker:"A",c:"唔係啩？你件衫濕晒。",j:"m4 hai6 gwaa3? nei5 gin6 saam1 sap1 saai3.",e:"Surely not? Your shirt's soaked."},
{speaker:"B",c:"好話之我着深色。你睇，唔顯。",j:"hou2 waa6 zi1 ngo5 zoek3 sam1 sik1. nei5 tai2, m4 hin2.",e:"Luckily I'm in dark colours. See? Doesn't show."},
{speaker:"A",c:"係咪呀。話之你。我入去等吓。",j:"hai6 mai6 aa3. waa6 zi1 nei5. ngo5 jap6 heoi3 dang2 haa5.",e:"Is that so. Suit yourself. I'll wait inside a bit."},
{speaker:"B",c:"咩話？風太大聽唔到。",j:"me1 waa2? fung1 taai3 daai6 teng1 m4 dou2.",e:"Pardon? Wind's too strong, I can't hear."},
{speaker:"A",c:"算啦。就算啦，一齊避吓。",j:"syun3 laa1. zau6 syun3 laa1, jat1 cai4 bei6 haa5.",e:"Forget it. Just forget it — let's take shelter a bit."},
{speaker:"B",c:"得囉喎。你都好啫。",j:"dak1 lo1 wo3. nei5 dou1 hou2 ze1.",e:"Alright then. You're fine too, it's just that."}
],
grammar:[
{pattern:"㗎 vs 喎 vs 噃",desc:"㗎 asserts (you said it). 喎 marks news. 噃 is 'see, I was right'.",ex:"你話唔落雨㗎。天氣預報講喎。你唔聽噃。(nei5 waa6 m4 lok6 jyu5 gaa3. tin1 hei3 jyu6 bou3 gong2 wo3. nei5 m4 teng1 bo3)",en:"You said it wouldn't rain. That's what the forecast said. See, you didn't listen."},
{pattern:"之嘛 / 啫",desc:"Downplay. 少少雨之嘛 = it's only a little rain.",ex:"少少雨之嘛。你都好啫。(siu2 siu2 jyu5 zi1 maa3. nei5 dou1 hou2 ze1)",en:"It's just a little rain. You're fine too."},
{pattern:"都話…噃",desc:"I told you… and see? The I-told-you-so pair.",ex:"都話帶遮。你唔聽噃。(dou1 waa6 daai3 ze1. nei5 m4 teng1 bo3)",en:"I told you to bring an umbrella. See, you didn't listen."},
{pattern:"唔係啩 / 係咪呀",desc:"It can't be, can it? / Oh is that so? Pushback particles.",ex:"唔係啩？係咪呀。(m4 hai6 gwaa3? hai6 mai6 aa3)",en:"Surely not? Is that so."},
{pattern:"話之你",desc:"Suit yourself. Letting go, slightly cool.",ex:"話之你。我入去等吓。(waa6 zi1 nei5. ngo5 jap6 heoi3 dang2 haa5)",en:"Suit yourself. I'll wait inside a bit."}
],
quiz:[
{q:'"噃" often means:',opts:["please","see / I told you so","thank you","wait"],ans:1},
{q:'"之嘛" downplays, like:',opts:["definitely","that's all / merely","never","hurry"],ans:1},
{q:'"都話" means:',opts:["never said","I told you","please sit","how much"],ans:1},
{q:'"話之你" means:',opts:["I agree fully","suit yourself","come here","I'm sorry"],ans:1},
{q:'"唔係啩" expresses:',opts:["certainty","disbelief (it can't be)","thanks","hunger"],ans:1},
{q:'"咩話" means:',opts:["delicious","pardon? / what did you say?","goodbye","maybe"],ans:1},
{q:'"好話之" means:',opts:["unfortunately","luckily / it's a good thing","never","always"],ans:1},
{q:'"添" in 落緊添 means:',opts:["add sugar","even / on top of that","already finished","please"],ans:1}
]},

{id:171,title:"L71 量詞2",subtitle:"More classifiers · 餐場 ply 封 串",

{c:"封",j:"fung1",e:"classifier for letters"},
{c:"串",j:"cyun3",e:"classifier for skewers / a string of"},
{c:"排",j:"paai4",e:"row; classifier for rows"},

{c:"滴",j:"dik6",e:"drop (of liquid)"},

{c:"啖",j:"daam6",e:"a sip / bite"},
{c:"戶",j:"wu6",e:"household (classifier)"},
{c:"檔",j:"dong3",e:"stall"},

dialogue:[
{speaker:"A",c:"食咗幾餐未啊今日？",j:"sik6 zo2 gei2 caan1 mei6 aa3 gam1 jat6?",e:"How many meals have you had today?"},
{speaker:"B",c:"兩餐。夜晚再食一餐得。",j:"loeng5 caan1. je6 maan5 zoi3 sik6 jat1 caan1 dak1.",e:"Two. One more tonight is enough."},
{speaker:"A",c:"聽晚有場波。你去唔去？",j:"teng1 maan5 jau5 coeng4 bo1. nei5 heoi3 m4 heoi3?",e:"There's a match tomorrow night. Going?"},
{speaker:"B",c:"去。你寫咗封信未？",j:"heoi3. nei5 se2 zo2 fung1 seon3 mei6?",e:"Yes. Have you written the letter?"},
{speaker:"A",c:"寫咗。仲有串魚蛋想食。",j:"se2 zo2. zung6 jau5 cyun3 jyu4 daan2 soeng2 sik6.",e:"Yes. And I want a skewer of fish balls."},
{speaker:"B",c:"嗰排檔好味。坐前排睇波。",j:"go2 paai4 dong3 hou2 mei6. co5 cin4 paai4 tai2 bo1.",e:"That stall's good. Sit in the front row for the match."},
{speaker:"A",c:"呢層樓有幾戶？",j:"ni1 cang4 lau2 jau5 gei2 wu6?",e:"How many households on this floor?"},
{speaker:"B",c:"四戶。等陣落去買。落兩滴雨都得。",j:"sei3 wu6. dang2 zan6 lok6 heoi3 maai5. lok6 loeng5 dik6 jyu5 dou1 dak1.",e:"Four. We'll go down in a bit. A couple drops of rain is fine."},
{speaker:"A",c:"飲啖茶先。一口熱茶。",j:"jam2 daam6 caa4 sin1. jat1 hau2 jit6 caa4.",e:"Have a sip of tea first. One mouthful of hot tea."},
{speaker:"B",c:"得。一陣出發。",j:"dak1. jat1 zan6 ceot1 faat3.",e:"OK. Head out in a bit."}
],
grammar:[
{pattern:"餐 for meals",desc:"一餐飯, 兩餐. Not 頓 in speech as much.",ex:"食咗幾餐未？兩餐。(sik6 zo2 gei2 caan1 mei6? loeng5 caan1)",en:"How many meals have you had? Two."},
{pattern:"場 for events",desc:"一場波, 一場戲, 一場雨.",ex:"聽晚有場波。(teng1 maan5 jau5 coeng4 bo1)",en:"There's a match tomorrow night."},
{pattern:"封 / 串",desc:"封 letters. 串 skewers or things on a string.",ex:"寫咗封信。一串魚蛋。(se2 zo2 fung1 seon3. jat1 cyun3 jyu4 daan2)",en:"Wrote a letter. A skewer of fish balls."},
{pattern:"層 / 排",desc:"Storeys and rows. 呢層樓, 前排.",ex:"呢層樓有幾戶？坐前排。(ni1 cang4 lau2 jau5 gei2 wu6? co5 cin4 paai4)",en:"How many households on this floor? Sit in the front row."},
{pattern:"陣 / 啖 / 滴",desc:"A while / a sip / a drop. Small amounts of time and stuff.",ex:"等陣。飲啖茶。兩滴雨。(dang2 zan6. jam2 daam6 caa4. loeng5 dik6 jyu5)",en:"In a bit. Have a sip of tea. Two drops of rain."}
],

{id:174,title:"L74 道歉",subtitle:"Sorry · 對唔住、唔好意思、原諒",
vocab:[
{c:"對唔住",j:"deoi3 m4 zyu6",e:"sorry (stronger)"},
{c:"唔好意思",j:"m4 hou2 ji3 si1",e:"excuse me / sorry (lighter)"},
{c:"抱歉",j:"pou5 hip3",e:"sorry (more formal)"},
{c:"原諒",j:"jyun4 loeng6",e:"to forgive"},
{c:"唔好介意",j:"m4 hou2 gaai3 ji3",e:"don't take it to heart"},
{c:"我唔係有心",j:"ngo5 m4 hai6 jau5 sam1",e:"I didn't mean it"},
{c:"下次唔會",j:"haa6 ci3 m4 wui5",e:"won't happen next time"},
{c:"遲咗",j:"ci4 zo2",e:"late (already)"},
{c:"搞錯",j:"gaau2 co3",e:"got it wrong"},
{c:"撞到",j:"zong6 dou2",e:"bumped into"},
{c:"踩到",j:"caai2 dou2",e:"stepped on"},
{c:"唔該借借",j:"m4 goi1 ze3 ze3",e:"excuse me (passing)"},
{c:"冇事",j:"mou5 si6",e:"it's fine / nothing's wrong"},
{c:"唔緊要",j:"m4 gan2 jiu3",e:"never mind"},
{c:"小事",j:"siu2 si6",e:"no big deal"},
{c:"接受",j:"zip3 sau6",e:"to accept"},
{c:"道歉",j:"dou6 hip3",e:"to apologise"},
{c:"認真",j:"jing6 zan1",e:"sincere / serious"},
{c:"再犯",j:"zoi3 faan6",e:"to do it again (an offence)"},
{c:"當冇事",j:"dong3 mou5 si6",e:"act as if nothing happened"}
],
dialogue:[
{speaker:"A",c:"對唔住，我遲咗。塞車。",j:"deoi3 m4 zyu6, ngo5 ci4 zo2. sak1 ce1.",e:"Sorry I'm late. Traffic."},
{speaker:"B",c:"小事。下次早啲出就得。",j:"siu2 si6. haa6 ci3 zou2 di1 ceot1 zau6 dak1.",e:"No big deal. Leave earlier next time."},
{speaker:"A",c:"頭先撞到你。我唔係有心。",j:"tau4 sin1 zong6 dou2 nei5. ngo5 m4 hai6 jau5 sam1.",e:"I bumped you just now. I didn't mean it."},
{speaker:"B",c:"冇事。唔好意思我都企得差。",j:"mou5 si6. m4 hou2 ji3 si1 ngo5 dou1 kei5 dak1 caa1.",e:"It's fine. Sorry, I was standing badly too."},
{speaker:"A",c:"我搞錯日子。可唔可以原諒？",j:"ngo5 gaau2 co3 jat6 zi2. ho2 m4 ho2 ji5 jyun4 loeng6?",e:"I got the date wrong. Can you forgive me?"},
{speaker:"B",c:"接受。唔好介意。認真就得。",j:"zip3 sau6. m4 hou2 gaai3 ji3. jing6 zan1 zau6 dak1.",e:"Accepted. Don't take it to heart. Sincere is enough."},
{speaker:"A",c:"下次唔會再犯。",j:"haa6 ci3 m4 wui5 zoi3 faan6.",e:"Won't happen again."},
{speaker:"B",c:"得。當冇事。去食飯。",j:"dak1. dong3 mou5 si6. heoi3 sik6 faan6.",e:"OK. Act like nothing happened. Let's eat."},
{speaker:"A",c:"抱歉今日搞到你等。",j:"pou5 hip3 gam1 jat6 gaau2 dou3 nei5 dang2.",e:"Sorry I made you wait today."},
{speaker:"B",c:"唔緊要。走啦。",j:"m4 gan2 jiu3. zau2 laa1.",e:"Never mind. Let's go."}
],
grammar:[
{pattern:"對唔住 vs 唔好意思 vs 抱歉",desc:"對唔住 hits harder. 唔好意思 is daily. 抱歉 is a bit formal.",ex:"對唔住，我遲咗。唔好意思我都企得差。抱歉今日搞到你等。(deoi3 m4 zyu6, ngo5 ci4 zo2. m4 hou2 ji3 si1 ngo5 dou1 kei5 dak1 caa1. pou5 hip3 gam1 jat6 gaau2 dou3 nei5 dang2)",en:"Sorry I'm late. Sorry I stood badly too. Sorry I made you wait."},
{pattern:"我唔係有心",desc:"I didn't mean it. The intent defence.",ex:"頭先撞到你。我唔係有心。(tau4 sin1 zong6 dou2 nei5. ngo5 m4 hai6 jau5 sam1)",en:"I bumped you. I didn't mean it."},
{pattern:"下次唔會再犯",desc:"Won't do it again. Closing an apology.",ex:"下次唔會再犯。(haa6 ci3 m4 wui5 zoi3 faan6)",en:"Won't happen again."},
{pattern:"當冇事",desc:"Pretend / treat it as nothing. Move on.",ex:"當冇事。去食飯。(dong3 mou5 si6. heoi3 sik6 faan6)",en:"Act like nothing happened. Let's eat."},
{pattern:"唔好介意",desc:"Don't take it personally.",ex:"接受。唔好介意。(zip3 sau6. m4 hou2 gaai3 ji3)",en:"Accepted. Don't take it to heart."}
],
quiz:[
{q:'The stronger everyday sorry is:',opts:["唔好意思","對唔住","拜拜","唔該"],ans:1},
{q:'"我唔係有心" means:',opts:["I meant it","I didn't mean it","I'm angry","I'm late"],ans:1},
{q:'"原諒" means:',opts:["blame","forgive","forget a bag","pay"],ans:1},
{q:'"小事" as a reply means:',opts:["this is serious","no big deal","wait","come here"],ans:1},
{q:'"搞錯" means:',opts:["got it right","got it wrong","got a gift","got paid"],ans:1},
{q:'"撞到" means:',opts:["called","bumped into","emailed","ignored"],ans:1},
{q:'"當冇事" means:',opts:["make a fuss","act as if nothing happened","call the police","write a letter"],ans:1},
{q:'"唔好介意" means:',opts:["please mind","don't take it to heart","hurry up","sit down"],ans:1}
]}

{id:175,title:"L75 祝福",subtitle:"Wishes · 生日快樂、早日康復、一路順風",

{c:"工作順利",j:"gung1 zok3 seon6 lei6",e:"smooth work"},

dialogue:[
{speaker:"A",c:"今日你生日。生日快樂。",j:"gam1 jat6 nei5 saang1 jat6. saang1 jat6 faai3 lok6.",e:"It's your birthday today. Happy birthday."},
{speaker:"B",c:"多謝。乾杯。",j:"do1 ze6. gon1 bui1.",e:"Thanks. Cheers."},
{speaker:"A",c:"你聽日飛。一路順風。保重。",j:"nei5 ting1 jat6 fei1. jat1 lou6 seon6 fung1. bou2 zung6.",e:"You fly tomorrow. Bon voyage. Take care."},
{speaker:"B",c:"你都小心。工作順利。",j:"nei5 dou1 siu2 sam1. gung1 zok3 seon6 lei6.",e:"You take care too. Smooth work."},
{speaker:"A",c:"阿文新婚。恭喜。新婚快樂。",j:"aa3 man4 san1 fan1. gung1 hei2. san1 fan1 faai3 lok6.",e:"Man just got married. Congrats. Happy wedding."},
{speaker:"B",c:"祝佢哋幸福。身體健康。",j:"zuk1 keoi5 dei6 hang6 fuk1. san1 tai2 gin6 hong1.",e:"Wish them happiness. Good health."},
{speaker:"A",c:"考試加油。學業進步。",j:"haau2 si3 gaa1 jau4. hok6 jip6 zeon3 bou6.",e:"All the best for the exam. Progress in studies."},
{speaker:"B",c:"你都心想事成。萬事如意。",j:"nei5 dou1 sam1 soeng2 si6 sing4. maan6 si6 jyu4 ji3.",e:"May your wishes come true too. All as you wish."},
{speaker:"A",c:"佢病咗。早日康復。平安。",j:"keoi5 beng6 zo2. zou2 jat6 hong1 fuk6. ping4 on1.",e:"He's ill. Get well soon. Safety."},
{speaker:"B",c:"早晨。今晚早啲瞓。晚安。",j:"zou2 san4. gam1 maan5 zou2 di1 fan3. maan5 on1.",e:"Morning. Sleep earlier tonight. Good night."}
],

{pattern:"加油 for exams and work",desc:"Not just sports. 考試加油.",ex:"考試加油。學業進步。(haau2 si3 gaa1 jau4. hok6 jip6 zeon3 bou6)",en:"All the best for the exam. Progress in studies."},
{pattern:"早晨 not 早安",desc:"HK morning is 早晨. 晚安 exists but is less daily than 早啲瞓.",ex:"早晨。晚安。(zou2 san4. maan5 on1)",en:"Good morning. Good night."}
],

{id:176,title:"L76 季節",subtitle:"Seasons · 春夏秋冬 潮濕",
vocab:[
{c:"春天",j:"ceon1 tin1",e:"spring"},
{c:"夏天",j:"haa6 tin1",e:"summer"},
{c:"秋天",j:"cau1 tin1",e:"autumn"},
{c:"冬天",j:"dung1 tin1",e:"winter"},
{c:"季節",j:"gwai3 zit3",e:"season"},
{c:"潮濕",j:"ciu4 sap1",e:"humid"},
{c:"冷氣",j:"laang5 hei3",e:"air-con"},
{c:"落雪",j:"lok6 syut3",e:"to snow"},
{c:"度",j:"dou6",e:"degree (temperature)"},
{c:"左右",j:"zo2 jau6",e:"around / approximately"},

{c:"短",j:"dyun2",e:"short"},

{c:"日本",j:"jat6 bun2",e:"Japan"},
{c:"旅行",j:"leoi5 hang4",e:"to travel"},

{c:"着多件",j:"zoek3 do1 gin6",e:"put on an extra layer"}
],
dialogue:[
{speaker:"A",c:"香港夏天熱唔熱？",j:"hoeng1 gong2 haa6 tin1 jit6 m4 jit6?",e:"Is HK summer hot?"},
{speaker:"B",c:"熱同潮濕。要開冷氣。",j:"jit6 tung4 ciu4 sap1. jiu3 hoi1 laang5 hei3.",e:"Hot and humid. Need air-con."},
{speaker:"A",c:"冬天呢？會唔會落雪？",j:"dung1 tin1 ne1? wui5 m4 wui5 lok6 syut3?",e:"Winter? Does it snow?"},
{speaker:"B",c:"唔會。最凍十度左右。着多件就得。",j:"m4 wui5. zeoi3 dung3 sap6 dou6 zo2 jau6. zoek3 do1 gin6 zau6 dak1.",e:"No. Coldest around 10 degrees. An extra layer is enough."},
{speaker:"A",c:"春天潮濕到衫都乾唔到。",j:"ceon1 tin1 ciu4 sap1 dou3 saam1 dou1 gon1 m4 dou2.",e:"Spring is so humid clothes won't dry."},
{speaker:"B",c:"係。秋天最舒服。唔熱唔凍。",j:"hai6. cau1 tin1 zeoi3 syu1 fuk6. m4 jit6 m4 dung3.",e:"Yes. Autumn is the most comfortable. Not hot, not cold."},
{speaker:"A",c:"你鍾意邊個季節？",j:"nei5 zung1 ji3 bin1 go3 gwai3 zit3?",e:"Which season do you like?"},
{speaker:"B",c:"秋天。夏天我唔抵得。",j:"cau1 tin1. haa6 tin1 ngo5 m4 dai2 dak1.",e:"Autumn. I can't stand summer."},
{speaker:"A",c:"冬天去唔去旅行？",j:"dung1 tin1 heoi3 m4 heoi3 leoi5 hang4?",e:"Travel in winter?"},
{speaker:"B",c:"去。台灣或者日本。香港冬天太短。",j:"heoi3. toi4 waan1 waak6 ze2 jat6 bun2. hoeng1 gong2 dung1 tin1 taai3 dyun2.",e:"Yes. Taiwan or Japan. HK winter is too short."}
],
grammar:[
{pattern:"熱同潮濕",desc:"Hot and humid — the HK summer pair.",ex:"夏天熱同潮濕。要開冷氣。(haa6 tin1 jit6 tung4 ciu4 sap1. jiu3 hoi1 laang5 hei3)",en:"Summer is hot and humid. Need air-con."},
{pattern:"乾唔到",desc:"Can't get dry. Verb + 唔 + 到.",ex:"潮濕到衫都乾唔到。(ciu4 sap1 dou3 saam1 dou1 gon1 m4 dou2)",en:"So humid clothes won't dry."},
{pattern:"唔熱唔凍",desc:"Neither hot nor cold. Comfortable weather.",ex:"秋天最舒服。唔熱唔凍。(cau1 tin1 zeoi3 syu1 fuk6. m4 jit6 m4 dung3)",en:"Autumn is most comfortable. Not hot, not cold."},
{pattern:"唔抵得",desc:"Can't stand (it). 抵得 = can bear.",ex:"夏天我唔抵得。(haa6 tin1 ngo5 m4 dai2 dak1)",en:"I can't stand summer."},
{pattern:"左右",desc:"Around (a number). 十度左右.",ex:"最凍十度左右。(zeoi3 dung3 sap6 dou6 zo2 jau6)",en:"Coldest around 10 degrees."}
],

{id:177,title:"L77 外套",subtitle:"More clothes · 外套、帽、圍巾、襪",

{c:"大褸",j:"daai6 lau1",e:"overcoat"},
{c:"帽",j:"mou2",e:"hat / cap"},

{c:"手套",j:"sau2 tou3",e:"gloves"},

{c:"鞋",j:"haai4",e:"shoes"},

{c:"袋",j:"doi2",e:"bag"},

dialogue:[
{speaker:"A",c:"凍。外套着唔着好啊？",j:"dung3. ngoi6 tou3 zoek3 m4 zoek3 hou2 aa3?",e:"Cold. Should I wear a jacket?"},
{speaker:"B",c:"着。再戴帽同圍巾。",j:"zoek3. zoi3 daai3 mou2 tung4 wai4 gan1.",e:"Yes. Hat and scarf too."},
{speaker:"A",c:"手套呢？會唔會太多？",j:"sau2 tou3 ne1? wui5 m4 wui5 taai3 do1?",e:"Gloves? Too much?"},
{speaker:"B",c:"出街先戴。入商場就除。",j:"ceot1 gaai1 sin1 daai3. jap6 soeng1 coeng4 zau6 ceoi4.",e:"Wear them outside. Take off in the mall."},
{speaker:"A",c:"呢頂帽襯唔襯我件大褸？",j:"ni1 deng2 mou2 can3 m4 can3 ngo5 gin6 daai6 lau1?",e:"Does this hat match my coat?"},
{speaker:"B",c:"襯。眼鏡都靚。太陽眼鏡就唔使。",j:"can3. ngaan5 geng2 dou1 leng3. taai3 joeng4 ngaan5 geng2 zau6 m4 sai2.",e:"Yes. Glasses look good too. No need for sunglasses."},
{speaker:"A",c:"靴定鞋？落雨着雨衣？",j:"hoe1 ding6 haai4? lok6 jyu5 zoek3 jyu5 ji1?",e:"Boots or shoes? Raincoat if it rains?"},
{speaker:"B",c:"靴。雨衣摺實放袋。",j:"hoe1. jyu5 ji1 zip3 sat6 fong3 doi2.",e:"Boots. Fold the raincoat tight in the bag."},
{speaker:"A",c:"皮帶我唔記得。襪夠。",j:"pei4 daai2 ngo5 m4 gei3 dak1. mat6 gau3.",e:"I forgot the belt. Socks are enough."},
{speaker:"B",c:"返去攞。暖啲先出。",j:"faan1 heoi3 lo2. nyun5 di1 sin1 ceot1.",e:"Go back and get it. Warm up first, then go out."}
],
grammar:[
{pattern:"着 vs 戴",desc:"着 (zoek3) clothes. 戴 (daai3) hat, glasses, gloves, scarf, watch.",ex:"外套着。戴帽同圍巾同手套。(ngoi6 tou3 zoek3. daai3 mou2 tung4 wai4 gan1 tung4 sau2 tou3)",en:"Wear the jacket. Put on hat, scarf and gloves."},
{pattern:"着唔着好",desc:"Should I wear it or not? A-not-A + 好.",ex:"外套着唔着好啊？着。(ngoi6 tou3 zoek3 m4 zoek3 hou2 aa3? zoek3)",en:"Should I wear a jacket? Yes."},
{pattern:"除",desc:"Take off. Opposite of 着/戴.",ex:"入商場就除。(jap6 soeng1 coeng4 zau6 ceoi4)",en:"Take them off in the mall."},
{pattern:"頂 for hats",desc:"一頂帽. Classifier.",ex:"呢頂帽襯唔襯？(ni1 deng2 mou2 can3 m4 can3?)",en:"Does this hat match?"},

],

{id:178,title:"L78 幾耐",subtitle:"Duration · 幾耐、成日、一陣、好耐冇",
vocab:[
{c:"幾耐",j:"gei2 noi6",e:"how long"},
{c:"好耐",j:"hou2 noi6",e:"a long time"},
{c:"好快",j:"hou2 faai3",e:"very soon / quickly"},
{c:"一陣",j:"jat1 zan6",e:"a little while"},
{c:"一陣間",j:"jat1 zan6 gaan1",e:"in a moment"},
{c:"成日",j:"sing4 jat6",e:"all day / always"},
{c:"成晚",j:"seng4 maan5",e:"all evening / all night"},
{c:"成個鐘",j:"seng4 go3 zung1",e:"a whole hour / about an hour"},
{c:"幾個鐘",j:"gei2 go3 zung1",e:"several hours"},
{c:"幾日",j:"gei2 jat6",e:"several days"},
{c:"幾個禮拜",j:"gei2 go3 lai5 baai3",e:"several weeks"},
{c:"幾個月",j:"gei2 go3 jyut6",e:"several months"},
{c:"好耐冇",j:"hou2 noi6 mou5",e:"long time no…"},
{c:"冇幾耐",j:"mou5 gei2 noi6",e:"not long"},
{c:"即刻",j:"zik1 hak1",e:"immediately"},
{c:"遲啲",j:"ci4 di1",e:"later"},
{c:"早啲",j:"zou2 di1",e:"earlier"},
{c:"一直",j:"jat1 zik6",e:"the whole time / continuously"},
{c:"先至",j:"sin1 zi3",e:"only then / not until"},
{c:"已經",j:"ji5 ging1",e:"already"}
],
dialogue:[
{speaker:"A",c:"你等咗幾耐啊？",j:"nei5 dang2 zo2 gei2 noi6 aa3?",e:"How long have you been waiting?"},
{speaker:"B",c:"成個鐘。你好耐冇見。",j:"seng4 go3 zung1. nei5 hou2 noi6 mou5 gin3.",e:"A whole hour. Long time no see."},
{speaker:"A",c:"對唔住。我遲咗。一陣就得。",j:"deoi3 m4 zyu6. ngo5 ci4 zo2. jat1 zan6 zau6 dak1.",e:"Sorry I'm late. Ready in a bit."},
{speaker:"B",c:"冇幾耐都得。唔使即刻。",j:"mou5 gei2 noi6 dou1 dak1. m4 sai2 zik1 hak1.",e:"Not long is fine. No need immediately."},
{speaker:"A",c:"你成晚都喺度？幾點到？",j:"nei5 seng4 maan5 dou1 hai2 dou6? gei2 dim2 dou3?",e:"You've been here all evening? What time did you arrive?"},
{speaker:"B",c:"六點。一直等。好快就七點半。",j:"luk6 dim2. jat1 zik6 dang2. hou2 faai3 zau6 cat1 dim2 bun3.",e:"Six. Waiting the whole time. It'll be 7:30 very soon."},
{speaker:"A",c:"我遲啲請返你。今日早啲散。",j:"ngo5 ci4 di1 ceng2 faan1 nei5. gam1 jat6 zou2 di1 saan3.",e:"I'll treat you back later. Let's wrap up earlier today."},
{speaker:"B",c:"得。呢單已經搞咗幾日。",j:"dak1. ni1 daan1 ji5 ging1 gaau2 zo2 gei2 jat6.",e:"OK. This one's already taken several days."},
{speaker:"A",c:"幾個禮拜先至完都唔出奇。",j:"gei2 go3 lai5 baai3 sin1 zi3 jyun4 dou1 m4 ceot1 kei4.",e:"Wouldn't be surprising if it only finishes in a few weeks."},
{speaker:"B",c:"希望冇幾耐。走啦。",j:"hei1 mong6 mou5 gei2 noi6. zau2 laa1.",e:"Hope it won't be long. Let's go."}
],
grammar:[
{pattern:"等咗幾耐",desc:"How long have you been waiting? 咗 + duration.",ex:"你等咗幾耐啊？成個鐘。(nei5 dang2 zo2 gei2 noi6 aa3? seng4 go3 zung1)",en:"How long have you waited? A whole hour."},
{pattern:"好耐冇見",desc:"Long time no see. 好耐冇 + verb.",ex:"你好耐冇見。(nei5 hou2 noi6 mou5 gin3)",en:"Long time no see."},
{pattern:"冇幾耐",desc:"Not long. Opposite of 好耐.",ex:"冇幾耐都得。希望冇幾耐。(mou5 gei2 noi6 dou1 dak1. hei1 mong6 mou5 gei2 noi6)",en:"Not long is fine. Hope it won't be long."},
{pattern:"成 + measure",desc:"A whole… 成個鐘, 成晚, 成日.",ex:"成個鐘。成晚都喺度。(seng4 go3 zung1. seng4 maan5 dou1 hai2 dou6)",en:"A whole hour. Here all evening."},
{pattern:"先至完",desc:"Only then finishes. Duration until completion.",ex:"幾個禮拜先至完。(gei2 go3 lai5 baai3 sin1 zi3 jyun4)",en:"Only finishes after a few weeks."}
],
quiz:[
{q:'"幾耐" means:',opts:["how much money","how long","how old","where"],ans:1},
{q:'"成個鐘" means:',opts:["five minutes","a whole hour / about an hour","tomorrow","never"],ans:1},
{q:'"好耐冇見" means:',opts:["see you tomorrow","long time no see","never met","just saw you"],ans:1},
{q:'"冇幾耐" means:',opts:["very long","not long","always","never"],ans:1},
{q:'"一陣" means:',opts:["last year","a little while","a century","never"],ans:1},
{q:'"即刻" means:',opts:["later","immediately","yesterday","maybe"],ans:1},
{q:'"一直" means:',opts:["never","the whole time / continuously","once","rarely"],ans:1},
{q:'"成晚" means:',opts:["this morning","all evening / all night","next week","a second"],ans:1}
]},

{id:179,title:"L79 嚟港",subtitle:"A week in HK · review mix for a visiting friend",
vocab:[
{c:"入境",j:"jap6 ging2",e:"enter (the city/country)"},
{c:"過關",j:"gwo3 gwaan1",e:"immigration"},
{c:"地鐵",j:"dei6 tit3",e:"MTR"},
{c:"八達通",j:"baat3 daat6 tung1",e:"Octopus"},
{c:"茶餐廳",j:"caa4 caan1 teng1",e:"cha chaan teng"},
{c:"飲茶",j:"jam2 caa4",e:"yum cha"},
{c:"行山",j:"haang4 saan1",e:"hike"},
{c:"維港",j:"wai4 gong2",e:"Victoria Harbour"},
{c:"夜景",j:"je6 ging2",e:"night view"},
{c:"掃街",j:"sou3 gaai1",e:"wander / eat through the streets"},
{c:"排隊",j:"paai4 deoi2",e:"queue"},
{c:"人多",j:"jan4 do1",e:"crowded"},
{c:"抵",j:"dai2",e:"good value"},
{c:"熱",j:"jit6",e:"hot"},
{c:"潮濕",j:"ciu4 sap1",e:"humid"},
{c:"冷氣",j:"laang5 hei3",e:"air-con"},
{c:"再見",j:"zoi3 gin3",e:"goodbye (see you again)"},
{c:"多謝款待",j:"do1 ze6 fun2 doi6",e:"thanks for having me"},
{c:"慢行",j:"maan6 haang4",e:"take care (when leaving)"},
{c:"下次再嚟",j:"haa6 ci3 zoi3 lai4",e:"come again next time"}
],
dialogue:[
{speaker:"A",c:"過關順唔順？八達通買咗未？",j:"gwo3 gwaan1 seon6 m4 seon6? baat3 daat6 tung1 maai5 zo2 mei6?",e:"Immigration smooth? Got an Octopus yet?"},
{speaker:"B",c:"順。機場已經買。地鐵好易。",j:"seon6. gei1 coeng4 ji5 ging1 maai5. dei6 tit3 hou2 ji6.",e:"Smooth. Bought at the airport. MTR is easy."},
{speaker:"A",c:"朝早茶餐廳，晏晝飲茶，夜晚維港夜景。",j:"ziu1 zou2 caa4 caan1 teng1, aan3 zau3 jam2 caa4, je6 maan5 wai4 gong2 je6 ging2.",e:"Cha chaan teng in the morning, yum cha at lunch, harbour night view in the evening."},
{speaker:"B",c:"熱同潮濕。有冷氣就得。人多要排隊。",j:"jit6 tung4 ciu4 sap1. jau5 laang5 hei3 zau6 dak1. jan4 do1 jiu3 paai4 deoi2.",e:"Hot and humid. Air-con and we're fine. Crowded so we queue."},
{speaker:"A",c:"聽日行山。後日掃街。抵食。",j:"ting1 jat6 haang4 saan1. hau6 jat6 sou3 gaai1. dai2 sik6.",e:"Hike tomorrow. Street-food wander the day after. Good value."},
{speaker:"B",c:"搞掂。我跟你。開口講粵語。",j:"gaau2 dim6. ngo5 gan1 nei5. hoi1 hau2 gong2 jyut6 jyu5.",e:"Sorted. I'll follow you. I'll speak Cantonese."},
{speaker:"A",c:"錯咗唔緊要。敢講就得。",j:"co3 zo2 m4 gan2 jiu3. gam2 gong2 zau6 dak1.",e:"Mistakes don't matter. Dare to speak and that's enough."},
{speaker:"B",c:"禮拜日飛。多謝款待。",j:"lai5 baai3 jat6 fei1. do1 ze6 fun2 doi6.",e:"I fly Sunday. Thanks for having me."},
{speaker:"A",c:"下次再嚟。慢行。",j:"haa6 ci3 zoi3 lai4. maan6 haang4.",e:"Come again. Take care."},
{speaker:"B",c:"再見。我已經識講喂同埋單。",j:"zoi3 gin3. ngo5 ji5 ging1 sik1 gong2 wai3 tung4 maai4 daan1.",e:"Bye. I can already say hello-on-the-phone and ask for the bill."}
],
grammar:[
{pattern:"朝早…晏晝…夜晚…",desc:"A day's itinerary in three chunks. Very HK planning.",ex:"朝早茶餐廳，晏晝飲茶，夜晚維港夜景。(ziu1 zou2 caa4 caan1 teng1, aan3 zau3 jam2 caa4, je6 maan5 wai4 gong2 je6 ging2)",en:"Cha chaan teng morning, yum cha lunch, harbour at night."},
{pattern:"聽日 / 後日",desc:"Tomorrow / the day after tomorrow.",ex:"聽日行山。後日掃街。(ting1 jat6 haang4 saan1. hau6 jat6 sou3 gaai1)",en:"Hike tomorrow. Street food the day after."},
{pattern:"多謝款待",desc:"Thanks for the hospitality. Guest closing.",ex:"多謝款待。下次再嚟。(do1 ze6 fun2 doi6. haa6 ci3 zoi3 lai4)",en:"Thanks for having me. Come again next time."},
{pattern:"慢行",desc:"Take care as you go. Host to leaving guest.",ex:"下次再嚟。慢行。(haa6 ci3 zoi3 lai4. maan6 haang4)",en:"Come again. Take care."},
{pattern:"識講 + phrase",desc:"Know how to say… 識講喂同埋單.",ex:"我已經識講喂同埋單。(ngo5 ji5 ging1 sik1 gong2 wai3 tung4 maai4 daan1)",en:"I can already say 'wai' and 'maai4 daan1'."}
],
quiz:[
{q:'"後日" means:',opts:["yesterday","the day after tomorrow","last week","tonight"],ans:1},
{q:'"掃街" here means:',opts:["clean the street","wander / eat through streets","sweep a tomb","hike"],ans:1},
{q:'"維港" is:',opts:["the airport","Victoria Harbour","an estate","a temple"],ans:1},
{q:'"多謝款待" means:',opts:["how much","thanks for having me","wrong number","the bill"],ans:1},
{q:'"慢行" is said when someone is:',opts:["arriving","leaving (take care)","eating","bargaining"],ans:1},
{q:'"敢講" means:',opts:["refuse to speak","dare to speak","speak English","whisper"],ans:1},
{q:'"埋單" means:',opts:["order food","ask for the bill","reserve","leave"],ans:1},
{q:'Planning a day, HK chunks are:',opts:["only night","朝早 / 晏晝 / 夜晚","only Mandarin time words","no words for this"],ans:1}
]}
,
{id:180,title:"L80 商場",subtitle:"Indoors · 扶手電梯、試身、廁所邊",
vocab:[
{c:"商場",j:"soeng1 coeng4",e:"mall"},
{c:"扶手電梯",j:"fu4 sau2 din6 tai1",e:"escalator"},
{c:"電梯",j:"din6 tai1",e:"lift"},
{c:"目錄",j:"muk6 luk6",e:"directory"},
{c:"樓層",j:"lau2 cang4",e:"floor (in a mall)"},
{c:"廁所",j:"ci3 so2",e:"toilet"},
{c:"試身室",j:"si3 san1 sat1",e:"fitting room"},
{c:"收銀處",j:"sau1 ngan4 cyu3",e:"cashier"},
{c:"顧客",j:"gu3 haak3",e:"customer"},
{c:"店員",j:"dim3 jyun4",e:"shop assistant"},
{c:"舖頭",j:"pou3 tau2",e:"shop"},
{c:"食肆",j:"sik6 si3",e:"eatery"},
{c:"美食廣場",j:"mei6 sik6 gwong2 coeng4",e:"food court"},
{c:"停車場",j:"ting4 ce1 coeng4",e:"car park"},
{c:"出口",j:"ceot1 hau2",e:"exit"},
{c:"入口",j:"jap6 hau2",e:"entrance"},
{c:"排隊",j:"paai4 deoi2",e:"queue"},
{c:"人龍",j:"jan4 lung4",e:"a long queue (dragon of people)"},
{c:"搵唔到",j:"wan2 m4 dou2",e:"can't find"},
{c:"問人",j:"man6 jan4",e:"ask someone"}
],
dialogue:[
{speaker:"A",c:"廁所喺邊層？目錄睇過未？",j:"ci3 so2 hai2 bin1 cang4? muk6 luk6 tai2 gwo3 mei6?",e:"Which floor is the toilet? Checked the directory?"},
{speaker:"B",c:"三樓。搭扶手電梯快過電梯。",j:"saam1 lau2. daap3 fu4 sau2 din6 tai1 faai3 gwo3 din6 tai1.",e:"3/F. Escalator is faster than the lift."},
{speaker:"A",c:"試身室喺舖入面。店員話有人龍。",j:"si3 san1 sat1 hai2 pou3 jap6 min6. dim3 jyun4 waa6 jau5 jan4 lung4.",e:"Fitting room is inside the shop. Staff said there's a long queue."},
{speaker:"B",c:"我去美食廣場等你。搵唔到就問人。",j:"ngo5 heoi3 mei6 sik6 gwong2 coeng4 dang2 nei5. wan2 m4 dou2 zau6 man6 jan4.",e:"I'll wait at the food court. If I can't find you I'll ask."},
{speaker:"A",c:"收銀處喺出口隔離。顧客好多。",j:"sau1 ngan4 cyu3 hai2 ceot1 hau2 gaak3 lei4. gu3 haak3 hou2 do1.",e:"Cashier is next to the exit. Lots of customers."},
{speaker:"B",c:"停車場滿未？定搭地鐵走？",j:"ting4 ce1 coeng4 mun5 mei6? ding6 daap3 dei6 tit3 zau2?",e:"Car park full? Or we take the MTR out?"},
{speaker:"A",c:"地鐵。入口喺地下。",j:"dei6 tit3. jap6 hau2 hai2 dei6 haa2.",e:"MTR. Entrance on the ground floor."},
{speaker:"B",c:"食肆幾點閂？我想食。",j:"sik6 si3 gei2 dim2 saan1? ngo5 soeng2 sik6.",e:"What time do the eateries close? I want to eat."},
{speaker:"A",c:"十點。而家八點，趕得切。",j:"sap6 dim2. ji4 gaa1 baat3 dim2, gon2 dak1 cit3.",e:"Ten. It's eight now — we'll make it."},
{speaker:"B",c:"走。排隊先。",j:"zau2. paai4 deoi2 sin1.",e:"Let's go. Queue first."}
],
grammar:[
{pattern:"邊層",desc:"Which floor (of a mall/building). 層 more than 樓 in malls sometimes.",ex:"廁所喺邊層？三樓。(ci3 so2 hai2 bin1 cang4? saam1 lau2)",en:"Which floor is the toilet? 3/F."},
{pattern:"扶手電梯 vs 電梯",desc:"Escalator vs lift.",ex:"搭扶手電梯快過電梯。(daap3 fu4 sau2 din6 tai1 faai3 gwo3 din6 tai1)",en:"Escalator is faster than the lift."},
{pattern:"人龍",desc:"A dragon of people = a long queue. Very visual HK.",ex:"店員話有人龍。(dim3 jyun4 waa6 jau5 jan4 lung4)",en:"Staff said there's a long queue."},
{pattern:"搵唔到就問人",desc:"If you can't find it, ask. Survival mall line.",ex:"搵唔到就問人。(wan2 m4 dou2 zau6 man6 jan4)",en:"If you can't find (me/it), ask someone."},
{pattern:"趕得切",desc:"We'll make it in time. From L22.",ex:"而家八點，趕得切。(ji4 gaa1 baat3 dim2, gon2 dak1 cit3)",en:"It's eight now — we'll make it."}
],

]},

{id:181,title:"L81 羨慕",subtitle:"Feelings 2 · 羨慕、妒忌、不值、放心",
vocab:[
{c:"羨慕",j:"sin6 mou6",e:"to envy (admiring)"},
{c:"妒忌",j:"dou3 gei6",e:"to be jealous"},
{c:"不值",j:"bat1 zik6",e:"not worth it (emotionally)"},
{c:"放心",j:"fong3 sam1",e:"to feel at ease; don't worry"},
{c:"擔心",j:"daam1 sam1",e:"to worry"},
{c:"後悔",j:"hau6 fui3",e:"to regret"},
{c:"驕傲",j:"giu1 ngou6",e:"proud (can be good or arrogant)"},
{c:"自卑",j:"zi6 bei1",e:"feel inferior"},
{c:"安心",j:"on1 sam1",e:"peace of mind"},
{c:"心淡",j:"sam1 taam5",e:"disheartened"},
{c:"心急",j:"sam1 gap1",e:"impatient / anxious"},
{c:"心寒",j:"sam1 hon4",e:"chilled / appalled"},
{c:"心痛",j:"sam1 tung3",e:"heartache"},
{c:"開心",j:"hoi1 sam1",e:"happy"},
{c:"唔開心",j:"m4 hoi1 sam1",e:"unhappy"},
{c:"感動",j:"gam2 dung6",e:"moved"},
{c:"失望",j:"sat1 mong6",e:"disappointed"},
{c:"滿足",j:"mun5 zuk1",e:"content / satisfied"},
{c:"計較",j:"gai3 gaau3",e:"to fuss / hold a grudge over"},
{c:"看開啲",j:"hon3 hoi1 di1",e:"let it go a bit (also 睇開啲)"}
],
dialogue:[
{speaker:"A",c:"我好羨慕你去旅行。",j:"ngo5 hou2 sin6 mou6 nei5 heoi3 leoi5 hang4.",e:"I really envy you going travelling."},
{speaker:"B",c:"唔使妒忌。你都有你嘅好。",j:"m4 sai2 dou3 gei6. nei5 dou1 jau5 nei5 ge3 hou2.",e:"No need to be jealous. You've got your good things too."},
{speaker:"A",c:"我有啲自卑。又心急自己唔進步。",j:"ngo5 jau5 di1 zi6 bei1. jau6 sam1 gap1 zi6 gei2 m4 zeon3 bou6.",e:"I feel a bit inferior. And impatient that I'm not improving."},
{speaker:"B",c:"睇開啲。唔好成日計較。",j:"tai2 hoi1 di1. m4 hou2 sing4 jat6 gai3 gaau3.",e:"Let it go a bit. Don't fuss all the time."},
{speaker:"A",c:"我後悔冇早啲開始。心淡。",j:"ngo5 hau6 fui3 mou5 zou2 di1 hoi1 ci2. sam1 taam5.",e:"I regret not starting earlier. Disheartened."},
{speaker:"B",c:"唔值。你已經好掂。放心。",j:"m4 zik6. nei5 ji5 ging1 hou2 dim6. fong3 sam1.",e:"Not worth it. You're already doing great. Relax."},
{speaker:"A",c:"聽你咁講我感動。安心啲。",j:"teng1 nei5 gam2 gong2 ngo5 gam2 dung6. on1 sam1 di1.",e:"I'm moved hearing you say that. More at ease."},
{speaker:"B",c:"失望就休息。滿足就繼續。",j:"sat1 mong6 zau6 jau1 sik1. mun5 zuk1 zau6 gai3 zuk6.",e:"If you're disappointed, rest. If you're content, continue."},
{speaker:"A",c:"心痛嗰陣你陪我。",j:"sam1 tung3 go2 zan6 nei5 pui4 ngo5.",e:"When it hurts, you stay with me."},
{speaker:"B",c:"一定。唔好心寒。我喺度。",j:"jat1 ding6. m4 hou2 sam1 hon4. ngo5 hai2 dou6.",e:"Always. Don't go cold. I'm here."}
],
grammar:[
{pattern:"羨慕 vs 妒忌",desc:"羨慕 is warmer envy. 妒忌 is jealous. Don't mix.",ex:"我好羨慕你。唔使妒忌。(ngo5 hou2 sin6 mou6 nei5. m4 sai2 dou3 gei6)",en:"I envy you. No need to be jealous."},
{pattern:"心X compounds",desc:"心淡 disheartened, 心急 impatient, 心寒 chilled, 心痛 ache, 安心 at ease.",ex:"心淡。心急。安心啲。(sam1 taam5. sam1 gap1. on1 sam1 di1)",en:"Disheartened. Impatient. More at ease."},
{pattern:"睇開啲",desc:"Let it go a bit. Also written 看開; say 睇開.",ex:"睇開啲。唔好成日計較。(tai2 hoi1 di1. m4 hou2 sing4 jat6 gai3 gaau3)",en:"Let it go a bit. Don't fuss all the time."},
{pattern:"唔值",desc:"Not worth (the emotion). 唔值生氣.",ex:"唔值。你已經好掂。放心。(m4 zik6. nei5 ji5 ging1 hou2 dim6. fong3 sam1)",en:"Not worth it. You're already great. Relax."},
{pattern:"失望就…滿足就…",desc:"If disappointed, rest; if content, continue. Parallel 就.",ex:"失望就休息。滿足就繼續。(sat1 mong6 zau6 jau1 sik1. mun5 zuk1 zau6 gai3 zuk6)",en:"Disappointed, rest. Content, continue."}

{speaker:"A",c:"文件要印幾份？影印定掃描？",j:"man4 gin6 jiu3 jan3 gei2 fan6? jing2 jan3 ding6 sou3 miu4?",e:"How many copies to print? Photocopy or scan?"},

{id:183,title:"L83 全部",subtitle:"Quantity words · 全部、有啲、大部分、冇",
vocab:[

{c:"小部分",j:"siu2 bou6 fan6",e:"a small part"},
{c:"冇",j:"mou5",e:"none / don't have"},

{c:"唔全部",j:"m4 cyun4 bou6",e:"not all"},
{c:"幾乎",j:"gei1 fu1",e:"almost (more formal)"},

dialogue:[
{speaker:"A",c:"全部人嚟齊未？",j:"cyun4 bou6 jan4 lai4 cai4 mei6?",e:"Is everyone here?"},
{speaker:"B",c:"大部分到。有啲遲。冇人話唔嚟。",j:"daai6 bou6 fan6 dou3. jau5 di1 ci4. mou5 jan4 waa6 m4 lai4.",e:"Most have arrived. Some are late. Nobody said they wouldn't come."},
{speaker:"A",c:"唔全部都識粵語。淨係幾個。",j:"m4 cyun4 bou6 dou1 sik1 jyut6 jyu5. zing6 hai6 gei2 go3.",e:"Not all of them know Cantonese. Only a few."},
{speaker:"B",c:"至少講慢啲。連我都聽得明。",j:"zi3 siu2 gong2 maan6 di1. lin4 ngo5 dou1 teng1 dak1 ming4.",e:"At least speak slower. Even I can understand."},
{speaker:"A",c:"每個都有份。太多就唔好。",j:"mui5 go3 dou1 jau5 fan6. taai3 do1 zau6 m4 hou2.",e:"Each gets a share. Too many is no good."},
{speaker:"B",c:"最多十個。超過就分兩枱。",j:"zeoi3 do1 sap6 go3. ciu1 gwo3 zau6 fan1 loeng5 toi2.",e:"At most ten. Over that, split two tables."},
{speaker:"A",c:"差唔多全部準備好。",j:"caa1 m4 do1 cyun4 bou6 zeon2 bei6 hou2.",e:"Almost everything is ready."},
{speaker:"B",c:"小部分未。唔夠杯。",j:"siu2 bou6 fan6 mei6. m4 gau3 bui1.",e:"A small part isn't. Not enough cups."},
{speaker:"A",c:"任何問題而家問。",j:"jam6 ho4 man6 tai4 ji4 gaa1 man6.",e:"Any questions, ask now."},
{speaker:"B",c:"所有嘢我搞得掂。放心。",j:"so2 jau5 je5 ngo5 gaau2 dak1 dim6. fong3 sam1.",e:"I can handle all of it. Relax."}
],
grammar:[
{pattern:"全部 / 大部分 / 有啲 / 冇",desc:"All / most / some / none. The quantity ladder.",ex:"全部人嚟齊未？大部分到。有啲遲。冇人話唔嚟。(cyun4 bou6 jan4 lai4 cai4 mei6? daai6 bou6 fan6 dou3. jau5 di1 ci4. mou5 jan4 waa6 m4 lai4)",en:"Everyone here? Most arrived. Some late. Nobody said no."},
{pattern:"唔全部都",desc:"Not all. Don't say 全部唔.",ex:"唔全部都識粵語。(m4 cyun4 bou6 dou1 sik1 jyut6 jyu5)",en:"Not all of them know Cantonese."},
{pattern:"連…都",desc:"Even…. 連我都聽得明.",ex:"連我都聽得明。(lin4 ngo5 dou1 teng1 dak1 ming4)",en:"Even I can understand."},
{pattern:"至少 / 最多",desc:"At least / at most.",ex:"至少講慢啲。最多十個。(zi3 siu2 gong2 maan6 di1. zeoi3 do1 sap6 go3)",en:"At least speak slower. At most ten."},
{pattern:"每個都",desc:"Each and every one. 每個都有份.",ex:"每個都有份。(mui5 go3 dou1 jau5 fan6)",en:"Each gets a share."}
],

{speaker:"B",c:"皮蛋瘦肉粥，大碗。加蛋。",j:"pei4 daan2 sau3 juk6 zuk1, daai6 wun2. gaa1 daan2.",e:"Century-egg pork congee, large. Add egg."},
{speaker:"A",c:"我要乾炒牛河。唔要湯。",j:"ngo5 jiu3 gon1 caau2 ngau4 ho4. m4 jiu3 tong1.",e:"Dry-fried beef ho fun. No soup."},
{speaker:"B",c:"撈麵定湯麵？我撈。",j:"lou1 min6 ding6 tong1 min6? ngo5 lou1.",e:"Tossed or soup noodles? Tossed for me."},

{speaker:"A",c:"烏冬同拉麵你鍾意邊樣？",j:"wu1 dung1 tung4 laai1 min6 nei5 zung1 ji3 bin1 joeng6?",e:"Udon or ramen — which do you like?"},

{pattern:"加蛋",desc:"Add an egg. Default upgrade.",ex:"皮蛋瘦肉粥，加蛋。(pei4 daan2 sau3 juk6 zuk1, gaa1 daan2)",en:"Century-egg pork congee, add egg."},

{id:185,title:"L85 應該",subtitle:"Modals · 應該、一定、可能、未必",
vocab:[
{c:"應該",j:"jing1 goi1",e:"should"},
{c:"一定",j:"jat1 ding6",e:"must / definitely"},
{c:"可能",j:"ho2 nang4",e:"maybe / possible"},
{c:"未必",j:"mei6 bit1",e:"not necessarily"},
{c:"可以",j:"ho2 ji5",e:"can / may"},
{c:"唔可以",j:"m4 ho2 ji5",e:"must not / cannot"},
{c:"要",j:"jiu3",e:"need to / want to"},
{c:"唔使",j:"m4 sai2",e:"no need"},
{c:"最好",j:"zeoi3 hou2",e:"had better"},
{c:"寧可",j:"ning4 ho2",e:"would rather (more formal)"},
{c:"寧願",j:"ning4 jyun3",e:"would rather"},
{c:"不得不",j:"bat1 dak1 bat1",e:"have no choice but to (formal)"},
{c:"唯有",j:"wai4 jau5",e:"the only thing is to"},
{c:"差啲",j:"caa1 di1",e:"almost (did)"},
{c:"險啲",j:"him2 di1",e:"nearly (dangerously)"},
{c:"梗係",j:"gang2 hai6",e:"of course"},
{c:"當然",j:"dong1 jin4",e:"of course"},
{c:"未必得",j:"mei6 bit1 dak1",e:"might not work"},
{c:"一定得",j:"jat1 ding6 dak1",e:"will definitely work"},
{c:"睇吓先",j:"tai2 haa5 sin1",e:"see first / wait and see"}
],
dialogue:[
{speaker:"A",c:"我應該去唔去啊？",j:"ngo5 jing1 goi1 heoi3 m4 heoi3 aa3?",e:"Should I go or not?"},
{speaker:"B",c:"最好去。一定有用。",j:"zeoi3 hou2 heoi3. jat1 ding6 jau5 jung6.",e:"Better go. Definitely useful."},
{speaker:"A",c:"可能下雨。未必得閒。",j:"ho2 nang4 lok6 jyu5. mei6 bit1 dak1 haan4.",e:"Might rain. Might not be free."},
{speaker:"B",c:"梗係帶遮。唔使怕。",j:"gang2 hai6 daai3 ze1. m4 sai2 paa3.",e:"Of course bring an umbrella. No need to fear."},
{speaker:"A",c:"我可以遲到？",j:"ngo5 ho2 ji5 ci4 dou3?",e:"Can I be late?"},
{speaker:"B",c:"唔可以。你要準時。",j:"m4 ho2 ji5. nei5 jiu3 zeon2 si4.",e:"No. You need to be on time."},
{speaker:"A",c:"差啲唔記得。險啲遲到。",j:"caa1 di1 m4 gei3 dak1. him2 di1 ci4 dou3.",e:"Almost forgot. Nearly late."},
{speaker:"B",c:"唯有而家出。睇吓先。",j:"wai4 jau5 ji4 gaa1 ceot1. tai2 haa5 sin1.",e:"Only thing is to leave now. See how it goes."},
{speaker:"A",c:"一定得㗎？",j:"jat1 ding6 dak1 gaa3?",e:"It'll definitely work?"},
{speaker:"B",c:"當然。去啦。",j:"dong1 jin4. heoi3 laa1.",e:"Of course. Go."}
],
grammar:[
{pattern:"應該 / 最好 / 一定 / 可能 / 未必",desc:"Should / had better / definitely / maybe / not necessarily. The modal ladder.",ex:"應該去。最好去。一定有用。可能下雨。未必得閒。(jing1 goi1 heoi3. zeoi3 hou2 heoi3. jat1 ding6 jau5 jung6. ho2 nang4 lok6 jyu5. mei6 bit1 dak1 haan4)",en:"Should go. Better go. Definitely useful. Might rain. Might not be free."},
{pattern:"可以 vs 唔可以 vs 要 vs 唔使",desc:"May / must not / need to / no need.",ex:"我可以遲到？唔可以。你要準時。唔使怕。(ngo5 ho2 ji5 ci4 dou3? m4 ho2 ji5. nei5 jiu3 zeon2 si4. m4 sai2 paa3)",en:"Can I be late? No. You need to be on time. No need to fear."},
{pattern:"梗係 / 當然",desc:"Of course. 梗係 is more spoken.",ex:"梗係帶遮。當然。(gang2 hai6 daai3 ze1. dong1 jin4)",en:"Of course bring an umbrella. Of course."},
{pattern:"差啲 / 險啲",desc:"Almost. 險啲 is closer to 'narrowly / dangerously almost'.",ex:"差啲唔記得。險啲遲到。(caa1 di1 m4 gei3 dak1. him2 di1 ci4 dou3)",en:"Almost forgot. Nearly late."},
{pattern:"唯有",desc:"The only option left. 唯有而家出.",ex:"唯有而家出。睇吓先。(wai4 jau5 ji4 gaa1 ceot1. tai2 haa5 sin1)",en:"Only thing is leave now. See first."}
],
quiz:[
{q:'"應該" means:',opts:["must not","should","never","already"],ans:1},

let studyMode=localStorage.getItem('cantonese-mode')||'levels';
let LESSONS=(studyMode==='course'?COURSE:LEVELS).filter(Boolean);

const INTERVALS=[0,86400000,259200000,604800000,1209600000];
const BOX_COLORS=['var(--red)','var(--yellow)','var(--blue)','var(--green)','var(--accent2)'];
const BOX_LABELS=['Box 1 — New','Box 2 — Soon','Box 3 — Familiar','Box 4 — Known','Box 5 — Mastered'];

let currentLesson=0;
let lessonBand=0;
let showJp=false,showEn=false;
let currentSection='dialogue';
let fcMode='due',fcQueue=[],fcQueuePos=0,fcFlipped=false,fcSessionDone=false;
let fcSessionCorrect=0,fcSessionWrong=0,fcMistakes=[];

function loadProgress(){
  try{
    const raw=localStorage.getItem('cantonese-progress')||localStorage.getItem('cantonese"progress');
    const d=JSON.parse(raw);
    if(d&&d.version===1){if(!d.quizzes)d.quizzes={};return d}
  }catch(e){}
  return{version:1,streak:{lastDate:'',count:0},words:{},quizzes:{}};
}
function saveProgress(){localStorage.setItem('cantonese-progress',JSON.stringify(progress))}

function markWord(char,correct){
  if(!progress.words[char])progress.words[char]={box:1,lastReview:0,nextReview:0,correct:0,wrong:0};
  const w=progress.words[char];
  w.lastReview=Date.now();
  if(correct){w.box=Math.min(5,w.box+1);w.correct++}
  else{w.box=1;w.wrong++}
  w.nextReview=INTERVALS[w.box-1]===0?0:w.lastReview+INTERVALS[w.box-1];
  updateStreak();
  saveProgress();
}

function isDue(char){
  const w=progress.words[char];
  if(!w)return true;
  return Date.now()>=w.nextReview;
}

function getBox(char){
  const w=progress.words[char];
  return w?w.box:0;
}

function updateStreak(){
  const today=new Date().toDateString();
  const s=progress.streak;
  if(s.lastDate===today)return;
  const yesterday=new Date(Date.now()-86400000).toDateString();
  s.count=s.lastDate===yesterday?s.count+1:1;
  s.lastDate=today;
  saveProgress();
}

function masteryDots(char){
  const box=getBox(char);
  let h='<div class="mastery-dots">';
  for(let i=1;i<=5;i++){
    h+='<div class="dot'+(i<=box?' f'+box:'')+'"></div>';
  }
  return h+'</div>';
}

function getLessonStats(L){
  const boxes=[0,0,0,0,0];
  let newC=0;
  L.vocab.forEach(v=>{
    const w=progress.words[v.c];
    if(!w)newC++;else boxes[w.box-1]++;
  });
  return{total:L.vocab.length,new:newC,learning:boxes[0]+boxes[1]+boxes[2],mastered:boxes[3]+boxes[4],boxes};
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function lessonDone(id){
  return !!(progress.quizzes&&progress.quizzes[id]);
}
function persistLesson(){
  localStorage.setItem('cantonese-lesson',JSON.stringify({mode:studyMode,i:currentLesson}));
}
function jumpStudy(i,section){

    studyMode='levels';
    localStorage.setItem('cantonese-mode','levels');
    LESSONS=LEVELS.filter(Boolean);
    document.getElementById('mode-levels').classList.toggle('active',true);
    document.getElementById('mode-course').classList.toggle('active',false);
  }
  currentSection=section||'flashcards';
  switchLesson(i);
}
function dueCount(L){
  return L.vocab.filter(v=>isDue(v.c)).length;
}
function rebuildTabs(){
  const bandEl=document.getElementById('lessonBand');
  if(bandEl){
    if(studyMode==='levels'){
      const bands=Math.ceil(LESSONS.length/10);
      lessonBand=Math.max(0,Math.min(bands-1,Math.floor(currentLesson/10)));
      bandEl.style.display='flex';
      bandEl.innerHTML='';
      for(let b=0;b<bands;b++){
        const t=document.createElement('div');
        const from=b*10+1,to=Math.min((b+1)*10,LESSONS.length);
        t.className='tab'+(b===lessonBand?' active':'');
        t.textContent='L'+from+'–'+to;
        t.onclick=()=>{currentLesson=b*10;switchLesson(currentLesson);};
        bandEl.appendChild(t);
      }
    }else{
      bandEl.style.display='none';
      bandEl.innerHTML='';
    }
  }
  const tabs=document.getElementById('lessonTabs');
  tabs.innerHTML='';
  LESSONS.forEach((l,i)=>{
    if(studyMode==='levels'&&(i<lessonBand*10||i>=lessonBand*10+10))return;
    const t=document.createElement('div');
    t.className='tab'+(i===currentLesson?' active':'')+(lessonDone(l.id)?' done':'');
    t.textContent=(lessonDone(l.id)?'✓ ':'')+l.title;
    t.onclick=()=>switchLesson(i);
    tabs.appendChild(t);
  });
  const active=tabs.querySelector('.tab.active');
  if(active) active.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'});
}
function lessonNav(){
  const i=currentLesson,n=LESSONS.length;
  let h='<div class="lesson-nav">';
  h+=i>0?'<button class="action-btn" onclick="switchLesson('+(i-1)+')">← '+LESSONS[i-1].title+'</button>':'<span></span>';
  h+=i<n-1?'<button class="action-btn" onclick="switchLesson('+(i+1)+')">'+LESSONS[i+1].title+' →</button>':'<span></span>';
  return h+'</div><div class="kb-hint" style="margin-top:8px">[ and ] : previous / next lesson</div>';
}
function setMode(m){
  if(studyMode===m)return;

  LESSONS=(m==='course'?COURSE:LEVELS).filter(Boolean);
  document.getElementById('mode-levels').classList.toggle('active',m==='levels');
  document.getElementById('mode-course').classList.toggle('active',m==='course');

  showJp=false;showEn=false;

function init(){
  document.getElementById('mode-levels').classList.toggle('active',studyMode==='levels');
  document.getElementById('mode-course').classList.toggle('active',studyMode==='course');
  try{
    const s=JSON.parse(localStorage.getItem('cantonese-lesson')||'null');
    if(s&&s.mode===studyMode&&typeof s.i==='number'&&s.i>=0&&s.i<LESSONS.length) currentLesson=s.i;
  }catch(e){}
  rebuildTabs();
  initFcSession();
  quizQuestions=LESSONS[currentLesson].quiz.map(q=>({...q}));
  render();
}

function switchLesson(i){
  currentLesson=i;
  persistLesson();
  document.querySelectorAll('#lessonTabs .tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));

}

let dialogueMode=localStorage.getItem('dialogueMode')||'full';
let speakRate=parseFloat(localStorage.getItem('cantonese-rate')||'0.85');

function speak(text){
  if(window.speechSynthesis.speaking){window.speechSynthesis.cancel();return}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-HK';u.rate=speakRate;
  u.onend=()=>{document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'))};
  u.onerror=()=>{document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'))};
  document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'));
  const btns=[...document.querySelectorAll('.speak-btn')].filter(b=>{const s=b.dataset.speak;return s===text||s===text.replace(/[，。？！、；：！？]/g,'')});
  btns.forEach(b=>b.classList.add('speaking'));
  speechSynthesis.speak(u);
}

  const L=LESSONS[currentLesson];
  fcMode=mode;fcFlipped=false;fcSessionDone=false;
  fcSessionCorrect=0;fcSessionWrong=0;fcMistakes=[];
  if(mode==='due'){
    fcQueue=[];
    L.vocab.forEach((v,i)=>{if(isDue(v.c))fcQueue.push(i)});
  }else{
    fcQueue=[...Array(L.vocab.length).keys()];
  }
  fcQueue=shuffle(fcQueue);
  fcQueuePos=0;
  document.getElementById('sec-flashcards').innerHTML=renderFlashcards(L);
}

function startFcMistakes(){
  if(fcMistakes.length===0)return;
  const L=LESSONS[currentLesson];
  fcQueue=shuffle(fcMistakes);
  fcMistakes=[];
  fcQueuePos=0;fcFlipped=false;fcSessionDone=false;
  fcSessionCorrect=0;fcSessionWrong=0;
  document.getElementById('sec-flashcards').innerHTML=renderFlashcards(L);
}

function renderFlashcards(L){
  const dueCount=L.vocab.filter(v=>isDue(v.c)).length;
  const totalCount=L.vocab.length;

  let h='<div class="fc-mode-row">'+
    '<button class="toggle-btn'+(fcMode==='due'?' on':'')+'" onclick="startFcSession(\'due\')">📋 Due ('+dueCount+')</button>'+
    '<button class="toggle-btn'+(fcMode==='all'?' on':'')+'" onclick="startFcSession(\'all\')">📚 All ('+totalCount+')</button>'+
    '</div>';

  if(fcQueue.length===0&&fcMode==='due'){
    h+='<div class="session-summary"><h3>All caught up!</h3><p style="color:var(--text2);margin:12px 0">No cards due for review right now. Great work!</p><div class="fc-controls" style="justify-content:center"><button class="fc-btn got-it" onclick="startFcSession(\'all\')">Review All</button></div></div>';
    return h;
  }

  if(fcSessionDone){
    const pct=fcQueue.length>0?Math.round(fcSessionCorrect/fcQueue.length*100):0;
    h+='<div class="session-summary"><h3>Session Complete!</h3><div class="session-stats">'+
      '<div class="stat"><div class="num" style="color:var(--green)">'+fcSessionCorrect+'</div><div class="label">Correct</div></div>'+
      '<div class="stat"><div class="num" style="color:var(--red)">'+fcSessionWrong+'</div><div class="label">Need Practice</div></div>'+
      '<div class="stat"><div class="num" style="color:var(--accent)">'+pct+'%</div><div class="label">Accuracy</div></div>'+
      '</div><div class="fc-controls" style="justify-content:center;gap:10px">';
    if(fcSessionWrong>0)h+='<button class="fc-btn skip" onclick="startFcMistakes()">Review Mistakes ('+fcSessionWrong+')</button>';
    h+='<button class="fc-btn got-it" onclick="startFcSession(\''+fcMode+'\')">Start Over</button></div></div>';
    return h;
  }

  const vi=fcQueue[fcQueuePos];
  const v=L.vocab[vi];
  const w=progress.words[v.c];
  const box=w?w.box:0;

  h+='<div class="flashcard-area"><div class="fc-counter">'+(fcQueuePos+1)+' / '+fcQueue.length+'</div>'+
    masteryDots(v.c)+
    '<div class="flashcard'+(fcFlipped?' flipped':'')+'" onclick="fcFlip(this)"><div class="flashcard-inner">'+
    '<div class="flashcard-face flashcard-front"><div class="big">'+v.c+'</div><div class="hint">Click to reveal</div></div>'+
    '<div class="flashcard-face flashcard-back"><div class="big">'+v.j+'</div><div class="sub">'+v.e+'</div>'+(function(){const ex=exampleFor(L,v.c);return ex?'<div class="hint" style="margin-top:8px">'+ex.c+'</div>':'';})()+'</div>'+
    '</div></div>'+
    '<div class="fc-controls">'+
    '<button class="fc-btn skip" onclick="fcAnswer(false)"'+(fcFlipped?'':' disabled')+'>Don\'t Know</button>'+
    '<button class="fc-btn got-it" onclick="fcAnswer(true)"'+(fcFlipped?'':' disabled')+'>Got It</button>'+
    '</div><div class="kb-hint">Space: flip &middot; &larr; Don\'t Know &middot; &rarr; Got It</div></div>';
  return h;
}

function fcFlip(el){fcFlipped=!fcFlipped;el.classList.toggle('flipped',fcFlipped)}

function fcAnswer(correct){
  if(!fcFlipped||fcSessionDone)return;
  const L=LESSONS[currentLesson];
  const vi=fcQueue[fcQueuePos];
  const v=L.vocab[vi];
  markWord(v.c,correct);
  if(correct)fcSessionCorrect++;else{fcSessionWrong++;fcMistakes.push(vi)}
  fcQueuePos++;fcFlipped=false;
  if(fcQueuePos>=fcQueue.length)fcSessionDone=true;
  document.getElementById('sec-flashcards').innerHTML=renderFlashcards(L);
}

function renderGrammar(L){
  return L.grammar.map(g=>'<div class="grammar-card"><div class="pattern">'+g.pattern+'</div><div class="explanation">'+g.desc+'</div><div class="example">'+g.ex+'<br><span style="color:var(--yellow);font-size:.9em">'+g.en+'</span></div></div>').join('');
}

function generateAutoQuiz(L,mode){
  const picked=shuffle([...Array(L.vocab.length).keys()]).slice(0,10);
  return picked.map(vi=>{
    const v=L.vocab[vi];
    const others=shuffle(L.vocab.filter((_,j)=>j!==vi)).slice(0,3);
    let opts,q;
    if(mode==='reverse'){
      q='Which Cantonese word means "'+v.e+'"?';
      opts=[v.c,...others.map(d=>d.c)];
    }else if(mode==='typejp'){
      q=v.c;
      opts=[v.j];
    }else{
      q='What is the Jyutping for "'+v.c+'"?';
      opts=[v.j,...others.map(d=>d.j)];
    }
    const correctOpt=opts[0];
    const shuffled=shuffle(opts);
    return{q,opts:shuffled,ans:shuffled.indexOf(correctOpt),wordKey:v.c};
  });
}

function setQuizMode(mode){
  quizMode=mode;quizAnswered=0;quizCorrect=0;
  const L=LESSONS[currentLesson];
  quizQuestions=mode==='meaning'?L.quiz.map(q=>({...q})):generateAutoQuiz(L,mode);
  document.getElementById('sec-quiz').innerHTML=renderQuiz(L);
}

function renderQuiz(L){
  let h='<div class="quiz-modes">'+
    '<button class="qmode-btn'+(quizMode==='meaning'?' active':'')+'" onclick="setQuizMode(\'meaning\')">Cantonese → English</button>'+
    '<button class="qmode-btn'+(quizMode==='reverse'?' active':'')+'" onclick="setQuizMode(\'reverse\')">English → Cantonese</button>'+
    '<button class="qmode-btn'+(quizMode==='jyutping'?' active':'')+'" onclick="setQuizMode(\'jyutping\')">Jyutping Match</button>'+
    '</div>';

  if(quizQuestions.length===0)return h+'<p style="color:var(--text2)">Select a quiz mode above.</p>';

  h+='<div class="score-bar"><span class="score">'+quizCorrect+'</span><span class="total">/ '+quizQuestions.length+'</span><div class="progress"><div class="progress-fill" style="width:'+quizAnswered/quizQuestions.length*100+'%"></div></div>';
  if(quizAnswered>=quizQuestions.length&&quizMode!=='meaning')h+='<button class="action-btn" onclick="setQuizMode(\''+quizMode+'\')" style="margin-left:auto;font-size:.8em">New Set</button>';
  h+='</div><div class="quiz-container">';

  quizQuestions.forEach((q,qi)=>{
    const answered=qi<quizAnswered;
    if(quizMode==='typejp'){
      h+='<div class="quiz-q"><div class="q-text">'+(qi+1)+'. Type the Jyutping for: <b>'+q.q+'</b></div><input class="quiz-input" id="qj-'+qi+'" placeholder="e.g. '+q.opts[0]+'" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--surface2);background:var(--surface);color:var(--text);font-size:1em" onkeydown="if(event.keyCode==13)answerQuiz(this.dataset.qi,-1)" data-qi="'+qi+'"></div>';
      return;
    }
    h+='<div class="quiz-q"><div class="q-text">'+(qi+1)+'. '+q.q+'</div><div class="quiz-options">';
    q.opts.forEach((o,oi)=>{
      let cls='quiz-opt';
      if(answered){cls+=' disabled';if(oi===q.ans)cls+=' correct'}
      h+='<div class="'+cls+'" onclick="answerQuiz('+qi+','+oi+')">'+o+'</div>';
    });
    h+='</div></div>';
  });
  return h+'</div>';
}

function answerQuiz(qi,oi){
  if(qi<quizAnswered)return;
  const q=quizQuestions[qi];
  let correct;
  if(quizMode==='typejp'){
    const input=document.getElementById('qj-'+qi);
    if(!input)return;
    const val=input.value.trim().toLowerCase().replace(/\s+/g,'');
    correct=val===q.opts[0].toLowerCase().replace(/\s+/g,'');
    input.style.borderColor=correct?'var(--green)':'var(--red)';
    input.disabled=true;
  }else{
    correct=oi===q.ans;
  }
  if(correct)quizCorrect++;
  quizAnswered++;
  if(q.wordKey)markWord(q.wordKey,correct);
  const L=LESSONS[currentLesson];
  const sec=document.getElementById('sec-quiz');
  const opts=sec.querySelectorAll('.quiz-q:nth-child('+(qi+1)+') .quiz-opt');
  opts.forEach((o,i)=>{o.classList.add('disabled');if(i===q.ans)o.classList.add('correct');if(i===oi&&!correct)o.classList.add('wrong')});
  const bar=sec.querySelector('.progress-fill');
  if(bar)bar.style.width=quizAnswered/quizQuestions.length*100+'%';
  const score=sec.querySelector('.score');
  if(score)score.textContent=quizCorrect;
  if(quizAnswered>=quizQuestions.length && quizCorrect>=Math.ceil(quizQuestions.length*0.7)){
    progress.quizzes=progress.quizzes||{};
    progress.quizzes[LESSONS[currentLesson].id]=true;
    saveProgress();
    rebuildTabs();
  }
}

function renderProgress(L){
  const st=getLessonStats(L);
  const units=allUnits();
  const allTotal=units.reduce((s,l)=>s+l.vocab.length,0);
  const allMastered=units.reduce((s,l)=>s+getLessonStats(l).mastered,0);
  const allWords={};
  units.forEach(l=>l.vocab.forEach(v=>{const w=progress.words[v.c];if(w)allWords[v.c]=w}));
  const allUnique=Object.keys(allWords).length;

  let h='<h2>📊 Progress — '+L.title+'</h2>';

  h+='<div class="stats-grid">'+
    '<div class="stat-card accent"><div class="num">'+st.total+'</div><div class="label">Total Words</div></div>'+
    '<div class="stat-card green"><div class="num">'+st.mastered+'</div><div class="label">Mastered (Box 4-5)</div></div>'+
    '<div class="stat-card yellow"><div class="num">'+st.learning+'</div><div class="label">Learning (Box 1-3)</div></div>'+
    '<div class="stat-card blue"><div class="num">'+st.new+'</div><div class="label">Not Seen Yet</div></div>'+
    '</div>';

  const sk=progress.streak;
  h+='<div class="streak-display"><span class="fire">🔥</span><span class="count">'+sk.count+'</span><span class="label">day streak</span></div>';

  if(studyMode==='levels'){
    const dueTotal=LEVELS.reduce((s,l)=>s+dueCount(l),0);
    h+='<div class="mastery-chart"><h3>Due today — tap a lesson to drill</h3>';
    h+='<p style="color:var(--text2);font-size:.85em;margin-bottom:10px">'+dueTotal+' cards waiting across everyday lessons.</p>';
    LEVELS.forEach((l,i)=>{
      const n=dueCount(l);
      h+='<div class="due-row" onclick="jumpStudy('+i+',\'flashcards\')"><span>'+(lessonDone(l.id)?'✓ ':'')+l.title+'</span><span class="due-n'+(n===0?' zero':'')+'">'+(n?n+' due':'caught up')+'</span></div>';
    });
    h+='</div>';
  }

  h+='<div class="mastery-chart"><h3>Mastery Distribution</h3>';
  const maxBox=Math.max(...st.boxes,1);
  for(let i=0;i<5;i++){
    const pct=Math.round(st.boxes[i]/maxBox*100);
    h+='<div class="chart-row"><div class="box-label">'+BOX_LABELS[i]+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+BOX_COLORS[i]+'"></div></div><div class="count">'+st.boxes[i]+'</div></div>';
  }
  h+='</div>';

  h+='<p style="color:var(--text2);margin-bottom:20px;font-size:.9em">Across all lessons: '+allMastered+' mastered out of '+allTotal+' total words ('+allUnique+' unique words studied).</p>';

  h+='<div class="action-row">'+
    '<button class="action-btn" onclick="exportProgress()">📥 Export Progress</button>'+
    '<button class="action-btn" onclick="document.getElementById(\'importFile\').click()">📤 Import Progress</button>'+
    '<button class="action-btn danger" onclick="resetProgress()">🗑 Reset All Progress</button>'+
    '<input type="file" id="importFile" class="hidden-input" accept=".json" onchange="importProgress(this)">'+
    '</div>';

  return h;
}

function exportProgress(){
  const blob=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='cantonese-progress-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

function importProgress(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const d=JSON.parse(e.target.result);
      if(d.version===1&&d.words){
        progress=d;saveProgress();
        initFcSession();
        quizQuestions=LESSONS[currentLesson].quiz.map(q=>({...q}));
        quizAnswered=0;quizCorrect=0;
        render();
      }else{alert('Invalid file format')}
    }catch(err){alert('Invalid file format')}
  };
  reader.readAsText(file);
}

function resetProgress(){
  if(!confirm('Reset all learning progress? This cannot be undone.'))return;
  progress={version:1,streak:{lastDate:'',count:0},words:{},quizzes:{}};
  saveProgress();
  initFcSession();
  quizQuestions=LESSONS[currentLesson].quiz.map(q=>({...q}));
  quizAnswered=0;quizCorrect=0;
  render();
}

document.addEventListener('keydown',function(e){
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  if(e.key==='['&&currentLesson>0){e.preventDefault();switchLesson(currentLesson-1);return;}
  if(e.key===']'&&currentLesson<LESSONS.length-1){e.preventDefault();switchLesson(currentLesson+1);return;}
  const fc=document.getElementById('sec-flashcards');
  if(!fc||!fc.classList.contains('active'))return;
  if((e.key===' '||e.key==='Enter')&&!fcSessionDone&&fcQueue.length>0){
    e.preventDefault();
    const card=fc.querySelector('.flashcard');
    if(card)fcFlip(card);
  }else if(e.key==='ArrowRight'&&fcFlipped&&!fcSessionDone){
    e.preventDefault();fcAnswer(true);
  }else if(e.key==='ArrowLeft'&&fcFlipped&&!fcSessionDone){
    e.preventDefault();fcAnswer(false);
  }
});


// ── Matching Game ──
let matchData = [], matchSelected = null, matchMatched = 0, matchAttempts = 0, matchLocked = false;
function initMatch(){
  const L = LESSONS[currentLesson];
  const picked = shuffle(L.vocab).slice(0, 8);
  matchData = picked.map(v => ({id: v.c, text: v.c, pair: v.e, type: 'cn'}))
    .concat(picked.map(v => ({id: v.c, text: v.e, pair: v.c, type: 'en'})));
  matchData = shuffle(matchData);
  matchSelected = null; matchMatched = 0; matchAttempts = 0; matchLocked = false;
  const el = document.getElementById('sec-match');
  if(el) el.innerHTML = renderMatch(L);
}
function renderMatch(L){
  const total = matchData.length / 2;
  let h = '<div class="match-score"><span><span class="pairs">' + matchMatched + '/' + total + '</span> matched</span><span class="attempts">Attempts: ' + matchAttempts + '</span></div>';
  h += '<div class="match-grid"><div class="match-col"><h3>Cantonese</h3>';
  matchData.filter(d => d.type === 'cn').forEach(d => {
    const cls = 'match-card' + (d._matched ? ' matched' : '') + (matchSelected === d.id && !d._matched ? ' selected' : '');
    h += '<div class="' + cls + '" data-id="' + d.id + '" data-pair="' + d.pair + '" onclick="pickMatch(this)">' + d.text + '</div>';
  });
  h += '</div><div class="match-col"><h3>English</h3>';
  matchData.filter(d => d.type === 'en').forEach(d => {
    const cls = 'match-card' + (d._matched ? ' matched' : '') + (matchSelected === d.id && !d._matched ? ' selected' : '');
    h += '<div class="' + cls + '" data-id="' + d.id + '" data-pair="' + d.pair + '" onclick="pickMatch(this)">' + d.text + '</div>';
  });
  h += '</div></div>';
  if(matchMatched === total && total > 0) h += '<div class="session-summary"><h3>🎉 All matched!</h3><p style="color:var(--text2);margin:8px 0">' + matchAttempts + ' attempts</p><button class="fc-btn got-it" onclick="initMatch()">Play Again</button></div>';
  return h;
}
function pickMatch(el){
  if(matchLocked || el.classList.contains('matched')) return;
  if(!matchSelected){ matchSelected = el.dataset.id; el.classList.add('selected'); return; }
  if(matchSelected === el.dataset.id){ el.classList.remove('selected'); matchSelected = null; return; }
  matchLocked = true; matchAttempts++;
  const first = document.querySelector('.match-card[data-id="' + matchSelected + '"]');
  const correct = el.dataset.pair === first.dataset.id;
  if(correct){
    el.classList.add('correct'); first.classList.add('correct');
    setTimeout(() => {
      el.classList.add('matched'); first.classList.add('matched');
      el.classList.remove('correct','selected'); first.classList.remove('correct','selected');
      matchData.forEach(d => { if(d.id === el.dataset.id || d.id === matchSelected) d._matched = true; });
      matchMatched++; matchSelected = null; matchLocked = false;
      const sec = document.getElementById('sec-match');
      if(sec) sec.innerHTML = renderMatch(LESSONS[currentLesson]);
    }, 400);
  } else {
    el.classList.add('wrong'); first.classList.add('wrong');
    setTimeout(() => { el.classList.remove('wrong'); first.classList.remove('wrong','selected'); matchSelected = null; matchLocked = false; }, 500);
  }
}

// ── Writing Grid Modal ──
function showCharModal(ch){
  const modal = document.getElementById('writingModal');
  const inner = document.getElementById('modalInner');
  if(!modal || !inner) return;
  let ctx = '', jp = '', en = '';
  for(const L of allUnits()){ for(const v of L.vocab){ if(v.c.includes(ch)){ ctx = v.c; jp = v.j; en = v.e; break; } } if(ctx) break; }
  let grid = '<div class="modal-grid-big">';
  grid += '<div class="modal-cell-big ref">' + ch + '</div>';
  for(let i = 0; i < 15; i++) grid += '<div class="modal-cell-big prac"></div>';
  grid += '</div>';
  inner.innerHTML = '<h3 style="font-size:2.4em;margin-bottom:2px;color:var(--text)">' + ch + '</h3>' +
    '<div class="sub" style="margin-bottom:4px">' + (ctx ? ctx + ' [' + jp + ']' : '') + '</div>' +
    '<div style="font-size:.75em;color:var(--text2);margin-bottom:14px;font-style:italic">' + (en || '') + '</div>' +
    grid +
    '<div style="margin-top:8px;color:var(--text2);font-size:.7em">Trace the character above, then practice below</div>' +
    '<button class="modal-close-btn" onclick="document.getElementById(\'writingModal\').classList.remove(\'open\')">Close</button>';
  modal.classList.add('open');
}
function closeModal(e){
  if(e && e.target !== document.getElementById('writingModal') && e.target.closest('.modal-content')) return;
  document.getElementById('writingModal').classList.remove('open');
}

// ── Writing Game ──
const practicedChars = new Set(JSON.parse(localStorage.getItem('cantonese-practiced') || '[]'));
function renderGame(L){
  let h = '<div class="match-score"><span><span class="pairs">' + L.vocab.length + '</span> words to practice</span><span class="attempts">Click gray character to see expanded grid</span></div>';
  L.vocab.forEach(v => {
    h += '<div class="word-section">';
    h += '<div class="word-header"><span class="ch">' + v.c + '</span><span class="jp">[' + v.j + ']</span></div>';
    h += '<div class="word-meaning">' + v.e + '</div>';
    // For each character in the word, show 1 ref + 6 practice cells
    v.c.split('').forEach(ch => {
      h += '<div class="char-row">';
      h += '<div class="write-cell ref" onclick="showCharModal(\'' + ch + '\')">' + ch + '</div>';
      for(let i = 0; i < 6; i++) h += '<div class="write-cell prac"></div>';
      h += '</div>';
    });
    h += '<div class="write-hint">click the gray character \u2192 expanded practice</div></div>';
  });
  h += '<div style="text-align:center;color:var(--text2);font-size:.75em;padding:8px">Practice writing each character - trace the gray reference, then write in blank cells</div>';
  return h;
}

// ── Achievements ──
function renderAchievements(){
  const allWords = {}; allUnits().forEach(l => l.vocab.forEach(v => { if(progress.words[v.c]) allWords[v.c] = progress.words[v.c]; }));
  const stats = { total: Object.keys(allWords).length, mastered: Object.values(allWords).filter(w => w.box >= 4).length, streak: progress.streak.count, practiced: practicedChars.size };
  const achs = [
    { icon: '🌱', name: 'First Steps', desc: 'Study 1 word', check: stats.total >= 1 },
    { icon: '📖', name: 'Getting Started', desc: 'Study 10 words', check: stats.total >= 10 },
    { icon: '📚', name: 'Dedicated', desc: 'Study 50 words', check: stats.total >= 50 },
    { icon: '⭐', name: 'Star Student', desc: 'Master 5 words', check: stats.mastered >= 5 },
    { icon: '🌟', name: 'Word Master', desc: 'Master 10 words', check: stats.mastered >= 10 },
    { icon: '🔥', name: 'On Fire', desc: '3-day streak', check: stats.streak >= 3 },
    { icon: '💪', name: 'Consistent', desc: '7-day streak', check: stats.streak >= 7 },
    { icon: '✍️', name: 'Penman', desc: 'Practice 5 chars', check: stats.practiced >= 5 },
    { icon: '🖌️', name: 'Calligrapher', desc: 'Practice 20 chars', check: stats.practiced >= 20 },
    { icon: '🏆', name: 'Explorer', desc: 'Finish 5 lesson quizzes', check: Object.keys(progress.quizzes||{}).length>=5 },
    { icon: '🎓', name: 'Graduate', desc: 'Finish 15 lesson quizzes', check: Object.keys(progress.quizzes||{}).length>=15 },
  ];
  const unlocked = achs.filter(a => a.check).length;
  let h = '<div class="match-score" style="margin-top:24px"><span><span class="pairs">' + unlocked + '/' + achs.length + '</span> achievements</span></div>';
  h += '<div class="achievement-grid">';
  achs.forEach(a => { h += '<div class="achievement' + (a.check ? ' unlocked' : ' locked') + '"><div class="icon">' + a.icon + '</div><div class="name">' + a.name + '</div><div class="desc">' + a.desc + '</div></div>'; });
  return h + '</div>';
}

// Patch renderProgress to include achievements
{ const _orig = renderProgress; renderProgress = function(L){ return _orig(L) + '<h2 style="margin-top:24px;margin-bottom:12px">🏅 Achievements</h2>' + renderAchievements(); }; }

init();
