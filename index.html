dialogue:[
{speaker:"A",c:"最近你好似有啲煩喎，成個人都有啲悶悶不樂咁，係咪喺人際關係方面遇到啲乜嘢問題啊？",j:"zeoi3 gan6 nei5 hou2 ci5 jau5 di1 faan4 wo3 seng4 go3 jan4 dou1 jau5 di1 mun6 mun6 bat1 lok6 gam3 hai6 mi1 hai2 jan4 zai3 gwaan1 hai6 fong1 min6 jyu6 dou3 di1 mat1 je5 man6 tai4 aa3",e:"Recently you seem a bit troubled, you seem unhappy. Have you encountered some problem in interpersonal relationships?"},
{speaker:"B",c:"係啊，最近同啲同事相處嗰陣，間中都會覺得有啲壓力，都唔係好知道點樣先可以拿捏好分寸，驚講多錯多。",j:"hai6 aa3 zeoi3 gan6 tung4 di1 tung4 si6 soeng1 cyu3 go2 zan6 gaan3 zung1 dou1 wui2 gok3 dak1 jau5 di1 aat3 lik6 dou1 m4 hai6 hou2 zi1 dou3 dim2 joeng2 sin1 ho2 ji5 naa4 nip6 hou2 fan1 cyun3 ging1 gong2 do1 co3 do1",e:"Yes, recently when getting along with colleagues I sometimes feel pressure. I don't really know how to judge the appropriate limits — afraid the more I speak, the more mistakes."},
{speaker:"A",c:"咁係邊一方面令到你覺得最困擾呢？係溝通嘅問題定係大家做嘢方式唔同嘅問題？",j:"gam3 hai6 bin1 jat1 fong1 min6 ling6 dou3 nei5 gok3 dak1 zeoi3 kwan3 jiu5 ne1 hai6 kau1 tung1 ge3 man6 tai4 ding6 hai6 daai6 gaa1 zou6 je5 fong1 sik1 m4 tung4 ge3 man6 tai4",e:"So which aspect troubles you most? Is it a communication problem, or different ways of doing things?"},
{speaker:"B",c:"主要係有啲同事講嘢比較直接，有時語氣比較衝，我就會喺度諗，佢哋係咪針對緊我呢，搞到自己心入面有啲唔舒服，甚至會亂咁諗嘢。",j:"zyu2 jiu3 hai6 jau5 di1 tung4 si6 gong2 je5 bei2 gaau3 zik6 zip3 jau5 si4 jyu5 hei3 bei2 gaau3 cung1 ngo5 zau6 wui2 hai2 dou6 nam2 keoi5 dei6 hai6 mi1 zam1 deoi3 gan2 ngo5 ne1 gaau2 dou3 zi6 gei2 sam1 jap6 min6 jau5 di1 m4 syu1 fuk6 sam6 zi3 wui2 lyun6 gam3 nam2 je5",e:"Mainly some colleagues speak quite directly, sometimes their tone is blunt. I wonder if they're targeting me, making myself uncomfortable inside, even overthinking things."},
{speaker:"A",c:"首先我會試下先令自己冷靜落嚟，唔好即刻有情緒反應，然後試下企喺對方嘅立場諗一諗。後來發現，其實好多時候都只係因為工作需要，講嘢直接啲，未必真係有惡意。",j:"sau2 sin1 ngo5 wui2 si3 haa6 sin1 ling6 zi6 gei2 laang5 zing6 lok6 lai4 m4 hou2 zik1 hak1 jau5 cing4 seoi5 faan2 jing3 jin4 hau6 si3 haa6 kei5 hai2 deoi3 fong1 ge3 lap6 coeng4 nam2 jat1 nam2 hau6 loi4 faat3 jin6 kei4 sat6 hou2 do1 si4 hau6 dou1 zi2 hai6 jan1 wai6 gung1 zok3 seoi1 jiu3 gong2 je5 zik6 zip3 di1 mei6 bit1 zan1 hai6 jau5 ok3 ji3",e:"First I'd try to calm down, not react emotionally, then try to stand in their position. Later I discovered most of the time it's just work needs — speaking directly doesn't necessarily mean ill will."},
{speaker:"B",c:"我覺得最重要係尊重同埋理解，大家都要試下企喺對方嘅角度諗下。另外都要保持真誠，唔好一味迎合或者討好人，咁樣反而唔長久。",j:"ngo5 gok3 dak1 zeoi3 zung6 jiu3 hai6 zyun1 zung6 tung4 maai4 lei5 gaai2 daai6 gaa1 dou1 jiu3 si3 haa6 kei5 hai2 deoi3 fong1 ge3 gok3 dou6 nam2 haa6 ling6 ngoi6 dou1 jiu3 bou2 ci4 zan1 sing4 m4 hou2 jat1 mei6 jing4 hap6 waak6 ze2 tou2 hou2 jan4 gam3 joeng6 faan2 ji4 m4 zoeng6 gau2",e:"I think the most important things are respect and understanding. Everyone needs to try thinking from the other's perspective. Also maintain sincerity — don't just cater to or flatter people, that won't last."},
{speaker:"A",c:"我覺得逃避只會令到問題越嚟越大，不如適當咁溝通，大家坦白啲講出自己嘅諗法，再互相包容同體諒，反而可以令關係變得更加穩固。",j:"ngo5 gok3 dak1 tou4 bei6 zi2 wui2 ling6 dou3 man6 tai4 jyut6 lai4 jyut6 daai6 bat1 jyu4 sik1 dong3 gam3 kau1 tung1 daai6 gaa1 taan2 baak6 di1 gong2 ceot1 zi6 gei2 ge3 nam2 faat3 zoi3 wu6 soeng1 baau1 jung4 tung4 tai2 loeng6 faan2 ji4 ho2 ji5 ling6 gwaan1 hai6 bin3 dak1 gang3 gaa1 wan2 gu3",e:"I think avoiding only makes problems bigger. Better to communicate appropriately, everyone speak frankly about their thoughts, then mutually tolerate and empathize — this can instead make the relationship more stable."},
{speaker:"B",c:"冇錯，真係要慢慢累積經驗，先會做得越嚟越好。",j:"mou5 co3 zan1 hai6 jiu3 maan6 maan2 leoi6 zik1 ging1 jim6 sin1 wui2 zou6 dak1 jyut6 lai4 jyut6 hou2",e:"That's right. You really need to slowly accumulate experience before you can do better and better."}
],

{pattern:"只會令到... (zi2 wui5 ling6 dou3)",desc:"will only make... — negative consequence",ex:"逃避只會令到問題越嚟越大 (tou4 bei6 zi2 wui2 ling6 dou3 man6 tai4 jyut6 lai4 jyut6 daai6)",en:"Avoiding will only make the problem bigger"}
],

{c:"禮貌",j:"lai5 maau6",e:"etiquette, politeness",summary:"Real etiquette comes from the heart (發自內心 faat3 zi6 noi6 sam1), not from going through motions | Stay calm when facing rudeness; responding with emotion escalates conflict | 奔同而止 (sik1 ho2 ji4 zi2) — stop before going too far; avoid emotional confrontations | Respecting others is also protecting yourself — it prevents unnecessary escalation",intro:"True politeness comes from the heart, not from a rulebook. This lesson examines workplace etiquette, the difference between surface-level courtesy and genuine respect, and how handling disagreements calmly builds lasting professional relationships.",summary:"Real etiquette comes from the heart, not from going through motions | Stay calm when facing rudeness | Respecting others protects yourself from escalation | 體諒 builds lasting professional relationships"},

dialogue:[
{speaker:"A",c:"最近我哋部門嚟咗唔少新同事，你覺得平時同人相處嘅時候，最重要嘅係乜嘢啊？",j:"zeoi3 gan6 ngo5 dei6 bou6 mun4 lai4 zo2 m4 siu2 san1 tung4 si6 nei5 gok3 dak1 ping4 si4 tung4 jan4 soeng1 cyu3 ge3 si4 hau6 zeoi3 zung6 jiu3 ge3 hai6 mat1 je5 aa3",e:"Recently our department has gotten quite a few new colleagues. What do you think is the most important thing when getting along with people?"},
{speaker:"B",c:"我覺得禮貌同尊重真係好重要，尤其係喺工作環境入面。大家一齊做嘢，如果冇基本嘅尊重，其實好難合作得順利。",j:"ngo5 gok3 dak1 lai5 maau6 tung4 zyun1 zung6 zan1 hai6 hou2 zung6 jiu3 jau4 kei4 hai6 hai2 gung1 zok3 waan4 ging2 jap6 min6 daai6 gaa1 jat1 cai4 zou6 je5 jyu4 gwo2 mou5 gei1 bun2 ge3 zyun1 zung6 kei4 sat6 hou2 naan4 hap6 zok3 dak1 seon6 lei6",e:"Etiquette and respect are really important, especially at work. Without basic respect, it's hard to cooperate smoothly."},
{speaker:"B",c:"因為每個人嘅背景、性格同埋做嘢方式都唔一樣，有啲人做嘢快，有啲人就比較謹慎。如果缺乏尊重，好容易就會出現誤會，甚至引起衝突，影響成個團隊嘅氣氛。",j:"jan1 wai6 mui5 go3 jan4 ge3 bui3 ging2 sing3 gaak3 tung4 maai4 zou6 je5 fong1 sik1 dou1 m4 jat1 joeng6 jau5 di1 jan4 zou6 je5 faai3 jau5 di1 jan4 zau6 bei2 gaau3 gan2 san6 jyu4 gwo2 kyut3 fat6 zyun1 zung6 hou2 jung4 ji6 zau6 wui2 ceot1 jin6 ng6 wui6 sam6 zi3 jan5 hei2 cung1 dat6 jing2 hoeng2 seng4 go3 tyun4 deoi2 ge3 hei3 fan1",e:"Everyone's background, personality, and work style are different. Without respect, misunderstandings and conflicts easily arise, affecting the team atmosphere."},
{speaker:"B",c:"例如同同事傾偈嘅時候，我會特別注意語氣，盡量唔好太衝或者太直接；同時都會認真聽對方講嘢，唔會打斷人。就算我唔同意對方嘅意見，我都會先表示理解，再慢慢講返自己嘅睇法。",j:"lai6 jyu4 tung4 tung4 si6 king1 gai2 ge3 si4 hau6 ngo5 wui2 dak6 bit6 zyu3 ji3 jyu5 hei3 zeon6 loeng6 m4 hou2 taai3 cung1 waak6 ze2 taai3 zik6 zip3 tung4 si4 dou1 wui2 jing6 zan1 ting3 deoi3 fong1 gong2 je5 m4 wui2 daa2 dyun6 jan4 zau6 syun3 ngo5 m4 tung4 ji3 deoi3 fong1 ge3 ji3 gin3 ngo5 dou1 wui2 sin1 biu2 si6 lei5 gaai2 zoi3 maan6 maan2 gong2 faan2 zi6 gei2 ge3 tai2 faat3",e:"For example, I pay attention to my tone, listen without interrupting. Even if I disagree, I first show understanding, then share my view."},
{speaker:"B",c:"我通常都會盡量保持冷靜，用比較平和嘅方式回應，唔會用情緒去對抗情緒。因為一旦雙方都情緒化，事情只會越搞越差。",j:"ngo5 tung1 soeng4 dou1 wui2 zeon6 loeng6 bou2 ci4 laang5 zing6 jung6 bei2 gaau3 ping4 wo4 ge3 fong1 sik1 wui4 jing3 m4 wui2 jung6 cing4 seoi5 heoi3 deoi3 kong3 cing4 seoi5 jan1 wai6 jat1 daan3 soeng1 fong1 dou1 cing4 seoi5 faa3 si6 cing4 zi2 wui2 jyut6 gaau2 jyut6 caa1",e:"I stay calm and respond peacefully. If both sides get emotional, things only get worse."},
{speaker:"B",c:"真正嘅禮貌其實係發自內心嘅尊重，而唔係敷衍或者做戲。如果只係表面客氣，但內心唔尊重人，其實對方都感受到，反而會影響信任。",j:"zan1 zing3 ge3 lai5 maau6 kei4 sat6 hai6 faat3 zi6 noi6 sam1 ge3 zyun1 zung6 ji4 m4 hai6 fu1 hin2 waak6 ze2 zou6 hei3 jyu4 gwo2 zi2 hai6 biu2 min6 haak3 hei3 daan6 noi6 sam1 m4 zyun1 zung6 jan4 kei4 sat6 deoi3 fong1 dou1 gam2 sau6 dou3 faan2 ji4 wui2 jing2 hoeng2 seon3 jam6",e:"Real etiquette comes from the heart, not half-hearted actions. Superficial politeness without real respect destroys trust."}
],

{pattern:"就算...都... (zau6 syun3...dou1...)",desc:"even if... still... — concessive structure",ex:"就算我唔同意，我都會先表示理解 (zau6 syun3 ngo5 m4 tung4 ji3 ngo5 dou1 wui2 sin1 biu2 si6 lei5 gaai2)",en:"Even if I don't agree, I still first express understanding"},

dialogue:[
{speaker:"A",c:"最近開會嘅時候，我發現自己有啲諗法講得唔夠清楚，成日都好似表達唔到重點，搞到溝通效果唔係幾理想，有時仲會畀人誤會。",j:"zeoi3 gan6 hoi1 wui2 ge3 si4 hau6 ngo5 faat3 jin6 zi6 gei2 jau5 di1 nam2 faat3 gong2 dak1 m4 gau3 cing1 co2 sing4 jat6 dou1 hou2 ci5 biu2 daat6 m4 dou3 zung6 dim2 gaau2 dou3 kau1 tung1 haau6 gwo2 m4 hai6 gei2 lei5 soeng2 jau5 si4 zung6 wui2 bei2 jan4 ng6 wui6",e:"Lately during meetings, I've noticed my ideas aren't expressed clearly. It always feels like I can't get to the point, making communication less effective, and sometimes I even get misunderstood."},
{speaker:"B",c:"我都好有同感，其實好多時唔係我哋啲內容有問題，而係表達方式影響咗人哋點樣理解。如果講得唔夠清晰，對方好容易捉錯重點。",j:"ngo5 dou1 hou2 jau5 tung4 gam2 kei4 sat6 hou2 do1 si4 m4 hai6 ngo5 dei6 di1 noi6 jung4 jau5 man6 tai4 ji4 hai6 biu2 daat6 fong1 sik1 jing2 hoeng2 zo2 jan4 dei6 dim2 joeng2 lei5 gaai2 jyu4 gwo2 gong2 dak1 m4 gau3 cing1 sik1 deoi3 fong1 hou2 jung4 ji6 zuk1 co3 zung6 dim2",e:"I totally relate. A lot of times it's not that our content is wrong, but the way we express affects how people understand. If you don't speak clearly enough, the other person easily misses the point."},
{speaker:"A",c:"咁你覺得要提升溝通能力，最關鍵係乜嘢？",j:"gam3 nei5 gok3 dak1 jiu3 tai4 sing1 kau1 tung1 nang4 lik6 zeoi3 gwaan1 gin6 hai6 mat1 je5",e:"So what do you think is most crucial for improving communication skills?"},
{speaker:"B",c:"我覺得第一步一定要搞清楚自己嘅目的，即係你想對方明白啲乜嘢，而唔係諗到邊講到邊。如果冇方向，點講都會亂。",j:"ngo5 gok3 dak1 dai6 jat1 bou6 jat1 ding6 jiu3 gaau2 cing1 co2 zi6 gei2 ge3 muk6 dik1 zik1 hai6 nei5 soeng2 deoi3 fong1 ming4 baak6 di1 mat1 je5 ji4 m4 hai6 nam2 dou3 bin1 gong2 dou3 bin1 jyu4 gwo2 mou5 fong1 hoeng3 dim2 gong2 dou1 wui2 lyun6",e:"I think the first step is to be clear about your own purpose — what exactly you want the other person to understand — rather than just rambling. Without direction, no matter how you speak it'll be messy."},
{speaker:"A",c:"聽落好似好簡單，但實際做起上嚟真係唔容易，有時一緊張就亂曬。",j:"ting3 lok6 hou2 ci5 hou2 gaan2 daan1 daan6 sat6 zai3 zou6 hei2 soeng5 lei4 zan1 hai6 m4 jung4 ji6 jau5 si4 jat1 gan2 zoeng1 zau6 lyun6 saai3",e:"That sounds simple enough, but in practice it's really not easy. Sometimes as soon as you get nervous, everything falls apart."},
{speaker:"B",c:"我慢慢學識喺開口之前先整理好思路，例如諗清楚最重要嘅觀點係乜嘢，先講重點，再補充細節。另外我都會留意對方嘅反應，例如佢有冇跟得上，會唔會露出疑惑嘅表情。",j:"ngo5 maan6 maan2 hok6 sik1 hai2 hoi1 hau2 zi1 cin4 sin1 zing2 lei5 hou2 si1 lou6 lai6 jyu4 nam2 cing1 co2 zeoi3 zung6 jiu3 ge3 gun1 dim2 hai6 mat1 je5 sin1 gong2 zung6 dim2 zoi3 bou2 cung1 sai3 zit3 ling6 ngoi6 ngo5 dou1 wui2 lau4 ji3 deoi3 fong1 ge3 faan2 jing3 lai6 jyu4 keoi5 jau5 mou5 gan1 dak1 soeng5 wui2 m4 wui2 lou6 ceot1 ji4 waak6 ge3 biu2 cing4",e:"I gradually learned to organize my thoughts before opening my mouth — figuring out what the most important point is first, then adding details. I also pay attention to the other person's reactions, like whether they're keeping up or showing confused expressions."},
{speaker:"A",c:"咁如果對方嘅諗法同你唔一樣，甚至有啲分歧，你會點處理？",j:"gam3 jyu4 gwo2 deoi3 fong1 ge3 nam2 faat3 tung4 nei5 m4 jat1 joeng6 sam6 zi3 jau5 di1 fan1 kei4 nei5 wui2 dim2 cyu5 lei5",e:"So if the other person thinks differently from you, or there's even some disagreement, how do you handle it?"},
{speaker:"B",c:"我通常會先耐心聽對方講曬，了解清楚佢嘅立場同原因，之後先再回應，而唔會一聽到唔同意就即刻反駁。咁樣大家都會覺得被尊重，氣氛都會好啲。溝通係雙向嘅，如果只係顧住自己講而唔理對方點諗，其實好難達到真正理解。只有建立喺尊重同理解嘅基礎上，表達先會真正發揮到作用。",j:"ngo5 tung1 soeng4 wui2 sin1 noi6 sam1 ting3 deoi3 fong1 gong2 saai3 liu5 gaai2 cing1 co2 keoi5 ge3 lap6 coeng4 tung4 jyun4 jan1 zi1 hau6 sin1 zoi3 wui4 jing1 ji4 m4 wui2 jat1 ting3 dou3 m4 tung4 ji3 zau6 zik1 hak1 faan2 bok3 gam3 joeng6 daai6 gaa1 dou1 wui2 gok3 dak1 bei6 zyun1 zung6 hei3 fan1 dou1 wui2 hou2 di1 kau1 tung1 hai6 soeng1 hoeng3 ge3 jyu4 gwo2 zi2 hai6 gu3 zyu6 zi6 gei2 gong2 ji4 m4 lei5 deoi3 fong1 dim2 nam2 kei4 sat6 hou2 naan4 daat6 dou3 zan1 zing3 lei5 gaai2 zi2 jau5 gin3 lap6 hai2 zyun1 zung6 tung4 lei5 gaai2 ge3 gei1 co2 soeng6 biu2 daat6 sin1 wui2 zan1 zing3 faat3 fai1 dou3 zok3 jung6",e:"I usually first listen to the other person fully, understand their position and reasons, and only then respond — rather than rebutting as soon as I hear disagreement. That way everyone feels respected and the atmosphere improves. Communication is two-way — if you only focus on yourself and ignore what the other person thinks, it's really hard to reach true understanding. Only when expression is built on a foundation of respect and understanding can it truly serve its purpose."}
],
grammar:[
{pattern:"而唔係 (ji4 m4 hai6)",desc:"but rather / not... but... — contrast structure",ex:"表達方式影響咗人哋點樣理解，而唔係內容有問題 (biu2 daat6 fong1 sik1 jing2 hoeng2 zo2 jan4 dei6 dim2 joeng2 lei5 gaai2 ji4 m4 hai6 noi6 jung4 jau5 man6 tai4)",en:"It is how we express that affects understanding, not that the content is wrong"},
{pattern:"搞到 + result (gaau2 dou3)",desc:"causing / making it so that... — negative consequence",ex:"表達唔到重點，搞到溝通效果唔係幾理想 (biu2 daat6 m4 dou3 zung6 dim2 gaau2 dou3 kau1 tung1 haau6 gwo2 m4 hai6 gei2 lei5 soeng2)",en:"Can't express the point clearly, making communication less effective"},
{pattern:"喺...之前先... (hai2...zi1 cin4 sin1...)",desc:"before... first... — preparation emphasis",ex:"喺開口之前先整理好思路 (hai2 hoi1 hau2 zi1 cin4 sin1 zing2 lei5 hou2 si1 lou6)",en:"First organize your thoughts before opening your mouth"},
{pattern:"一...就... (jat1...zau6...)",desc:"as soon as... then... — immediate consequence",ex:"一緊張就亂曬 (jat1 gan2 zoeng1 zau6 lyun6 saai3)",en:"As soon as you get nervous, everything falls apart"},
{pattern:"唔會一聽到...就... (m4 wui2 jat1 ting3 dou3...zau6...)",desc:"won't immediately... upon hearing... — deliberate restraint",ex:"唔會一聽到唔同意就即刻反駁 (m4 wui2 jat1 ting3 dou3 m4 tung4 ji3 zau6 zik1 hak1 faan2 bok3)",en:"Won't immediately rebut upon hearing disagreement"},
{pattern:"只有...先會... (zi2 jau5...sin1 wui6...)",desc:"only when... then will... — strong conditional",ex:"只有建立喺尊重同理解嘅基礎上，表達先會真正發揮到作用 (zi2 jau5 gin3 lap6 hai2 zyun1 zung6 tung4 lei5 gaai2 ge3 gei1 co2 soeng6 biu2 daat6 sin1 wui2 zan1 zing3 faat3 fai1 dou3 zok3 jung6)",en:"Only when expression is built on respect and understanding can it truly serve its purpose"}
],

  return{version:1,streak:{lastDate:'',count:0},words:{}};
}
function saveProgress(){localStorage.setItem('cantonese"progress',JSON.stringify(progress))}

function markWord(char,correct){
  if(!progress.words[char])progress.words[char]={box:1,lastReview:0,nextReview:0,correct:0,wrong:0};
  const w=progress.words[char];
  w.lastReview=Date.now();
  if(correct){w.box=Math.min(5,w.box+1);w.correct++}
  else{w.box=1;w.wrong++}
  w.nextReview=INTERVALS[w.box-1]===0?0:w.lastReview+INTERVALS[w.box-1];
  updateStreak();
  saveProgress();
}

function isDue(char){
  const w=progress.words[char];
  if(!w)return true;
  return Date.now()>=w.nextReview;
}

function getBox(char){
  const w=progress.words[char];
  return w?w.box:0;
}

function updateStreak(){
  const today=new Date().toDateString();
  const s=progress.streak;
  if(s.lastDate===today)return;
  const yesterday=new Date(Date.now()-86400000).toDateString();
  s.count=s.lastDate===yesterday?s.count+1:1;
  s.lastDate=today;
  saveProgress();
}

function masteryDots(char){
  const box=getBox(char);
  let h='<div class="mastery-dots">';
  for(let i=1;i<=5;i++){
    h+='<div class="dot'+(i<=box?' f'+box:'')+'"></div>';
  }
  return h+'</div>';
}

function getLessonStats(L){
  const boxes=[0,0,0,0,0];
  let newC=0;
  L.vocab.forEach(v=>{
    const w=progress.words[v.c];
    if(!w)newC++;else boxes[w.box-1]++;
  });
  return{total:L.vocab.length,new:newC,learning:boxes[0]+boxes[1]+boxes[2],mastered:boxes[3]+boxes[4],boxes};
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

let dialogueMode=localStorage.getItem('dialogueMode')||'full';

function speak(text){
  if(window.speechSynthesis.speaking){window.speechSynthesis.cancel();return}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-HK';u.rate=0.85;
  u.onend=()=>{document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'))};
  u.onerror=()=>{document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'))};
  document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'));
  const btns=[...document.querySelectorAll('.speak-btn')].filter(b=>{const s=b.dataset.speak;return s===text||s===text.replace(/[，。？！、；：！？]/g,'')});
  btns.forEach(b=>b.classList.add('speaking'));
  speechSynthesis.speak(u);
}

function colorJyutping(jp){
  return jp.replace(/([a-z]+)([1-6])/g,'<span class="tone-$2">$1$2</span>');
}
function splitSentences(text){
  const parts=text.split(/(?<=[。？！，])/);
  return parts.filter(p=>p.trim());
}
function renderDialogue(L){
  let h='<div class="toggle-row"><button id="btn-jp" class="toggle-btn'+(showJp?' on':'')+'" onclick="toggleJp()">Jyutping</button><button id="btn-en" class="toggle-btn'+(showEn?' on':'')+'" onclick="toggleEn()">English</button><button class="toggle-btn" onclick="toggleJp();toggleEn()">Toggle All</button></div>';
  h+='<div class="sentence-mode-row"><button class="sentence-mode-btn'+(dialogueMode==='full'?' active':'')+'" onclick="setDialogueMode(\'full\')">Full</button><button class="sentence-mode-btn'+(dialogueMode==='sentence'?' active':'')+'" onclick="setDialogueMode(\'sentence\')">Sentence by Sentence</button></div>';
  if(dialogueMode==='sentence'){
    let sn=0;
    L.dialogue.forEach(d=>{
      const sents=splitSentences(d.c);
      const jsents=splitSentences(d.j);
      const esents=splitSentences(d.e);
      h+='<div class="sentence-card"><div class="sn-num">'+(++sn)+'</div><div class="sn-text"><div class="sn-zh"><span style="font-weight:700;color:var(--accent2)">'+d.speaker+':</span> '+sents[0]+'<button class="speak-btn" data-speak="'+sents[0].replace(/"/g,'&quot;')+'" onclick="speak(this.dataset.speak)" title="Listen">🔊</button></div><div class="sn-jp" style="display:'+(showJp?'block':'none')+'">'+colorJyutping(jsents[0]||d.j)+'</div><div class="sn-en" style="display:'+(showEn?'block':'none')+'">'+(esents[0]||d.e)+'</div></div></div>';
      for(let i=1;i<sents.length;i++){
        h+='<div class="sentence-card"><div class="sn-num">'+(++sn)+'</div><div class="sn-text"><div class="sn-zh">'+sents[i]+'<button class="speak-btn" data-speak="'+sents[i].replace(/"/g,'&quot;')+'" onclick="speak(this.dataset.speak)" title="Listen">🔊</button></div><div class="sn-jp" style="display:'+(showJp?'block':'none')+'">'+colorJyutping(jsents[i]||'')+'</div><div class="sn-en" style="display:'+(showEn?'block':'none')+'">'+(esents[i]||'')+'</div></div></div>';
      }
    });
  }else{
    L.dialogue.forEach(d=>{
      h+='<div class="dialogue-line"><div class="speaker"><span class="spk-'+d.speaker.toLowerCase()+'">'+d.speaker+'</span> <button class="speak-btn" data-speak="'+d.c.replace(/"/g,'&quot;')+'" onclick="speak(this.dataset.speak)" title="Listen">🔊</button></div><div class="cantonese">'+d.c+'</div><div class="jyutping" style="display:'+(showJp?'block':'none')+'">'+colorJyutping(d.j)+'</div><div class="english" style="display:'+(showEn?'block':'none')+'">'+d.e+'</div></div>';
    });

}


function markDirect(c){
  const box=(progress.words[c]&&progress.words[c].box)||0;
  const newBox=box>=4?5:box+2;
  recordWord(c,newBox>4);
  const L=LESSONS[currentLesson];
  const sec=document.getElementById('sec-vocab');
  if(sec)sec.innerHTML=renderVocab(L);
}
function renderVocab(L){
  let h='<p style="color:var(--text2);margin-bottom:12px">Click a card to see the English meaning</p><div class="vocab-grid">';
  L.vocab.forEach(v=>{
    h+='<div class="vocab-card" onclick="this.classList.toggle(\'flipped\')"><div class="front"><div class="word">'+v.c.split('').map(c=>'<span class="char-link" onclick="event.stopPropagation();showCharModal(\''+c+'\')">'+c+'</span>').join('')+' <button class="speak-btn" data-speak="'+v.c.replace(/"/g,'&quot;')+'" onclick="event.stopPropagation();speak(this.dataset.speak)" title="Listen">🔊</button></div><div class="jp">'+colorJyutping(v.j)+'</div>'+masteryDots(v.c)+'<div class="tag">click to flip</div></div><div class="back"><div class="word" style="color:var(--yellow)">'+v.e+'</div><div class="jp">'+v.c+'</div><div class="meaning">'+v.j+'</div></div></div>';
  });

}

function initFcSession(){
  const L=LESSONS[currentLesson];
  fcMode='due';fcFlipped=false;fcSessionDone=false;
  fcSessionCorrect=0;fcSessionWrong=0;fcMistakes=[];
  fcQueue=[];
  L.vocab.forEach((v,i)=>{if(isDue(v.c))fcQueue.push(i)});
  fcQueue=shuffle(fcQueue);
  fcQueuePos=0;
}

function startFcSession(mode){
  const L=LESSONS[currentLesson];
  fcMode=mode;fcFlipped=false;fcSessionDone=false;
  fcSessionCorrect=0;fcSessionWrong=0;fcMistakes=[];
  if(mode==='due'){
    fcQueue=[];
    L.vocab.forEach((v,i)=>{if(isDue(v.c))fcQueue.push(i)});
  }else{
    fcQueue=[...Array(L.vocab.length).keys()];
  }
  fcQueue=shuffle(fcQueue);
  fcQueuePos=0;
  document.getElementById('sec-flashcards').innerHTML=renderFlashcards(L);
}

function startFcMistakes(){
  if(fcMistakes.length===0)return;
  const L=LESSONS[currentLesson];
  fcQueue=shuffle(fcMistakes);
  fcMistakes=[];
  fcQueuePos=0;fcFlipped=false;fcSessionDone=false;
  fcSessionCorrect=0;fcSessionWrong=0;
  document.getElementById('sec-flashcards').innerHTML=renderFlashcards(L);
}

function renderFlashcards(L){
  const dueCount=L.vocab.filter(v=>isDue(v.c)).length;
  const totalCount=L.vocab.length;

  let h='<div class="fc-mode-row">'+
    '<button class="toggle-btn'+(fcMode==='due'?' on':'')+'" onclick="startFcSession(\'due\')">📋 Due ('+dueCount+')</button>'+
    '<button class="toggle-btn'+(fcMode==='all'?' on':'')+'" onclick="startFcSession(\'all\')">📚 All ('+totalCount+')</button>'+
    '</div>';

  if(fcQueue.length===0&&fcMode==='due'){
    h+='<div class="session-summary"><h3>All caught up!</h3><p style="color:var(--text2);margin:12px 0">No cards due for review right now. Great work!</p><div class="fc-controls" style="justify-content:center"><button class="fc-btn got-it" onclick="startFcSession(\'all\')">Review All</button></div></div>';
    return h;
  }

  if(fcSessionDone){
    const pct=fcQueue.length>0?Math.round(fcSessionCorrect/fcQueue.length*100):0;
    h+='<div class="session-summary"><h3>Session Complete!</h3><div class="session-stats">'+
      '<div class="stat"><div class="num" style="color:var(--green)">'+fcSessionCorrect+'</div><div class="label">Correct</div></div>'+
      '<div class="stat"><div class="num" style="color:var(--red)">'+fcSessionWrong+'</div><div class="label">Need Practice</div></div>'+
      '<div class="stat"><div class="num" style="color:var(--accent)">'+pct+'%</div><div class="label">Accuracy</div></div>'+
      '</div><div class="fc-controls" style="justify-content:center;gap:10px">';
    if(fcSessionWrong>0)h+='<button class="fc-btn skip" onclick="startFcMistakes()">Review Mistakes ('+fcSessionWrong+')</button>';
    h+='<button class="fc-btn got-it" onclick="startFcSession(\''+fcMode+'\')">Start Over</button></div></div>';
    return h;
  }

  const vi=fcQueue[fcQueuePos];
  const v=L.vocab[vi];
  const w=progress.words[v.c];
  const box=w?w.box:0;

  h+='<div class="flashcard-area"><div class="fc-counter">'+(fcQueuePos+1)+' / '+fcQueue.length+'</div>'+
    masteryDots(v.c)+
    '<div class="flashcard'+(fcFlipped?' flipped':'')+'" onclick="fcFlip(this)"><div class="flashcard-inner">'+
    '<div class="flashcard-face flashcard-front"><div class="big">'+v.c+'</div><div class="hint">Click to reveal</div></div>'+
    '<div class="flashcard-face flashcard-back"><div class="big">'+v.j+'</div><div class="sub">'+v.e+'</div></div>'+
    '</div></div>'+
    '<div class="fc-controls">'+
    '<button class="fc-btn skip" onclick="fcAnswer(false)"'+(fcFlipped?'':' disabled')+'>Don\'t Know</button>'+
    '<button class="fc-btn got-it" onclick="fcAnswer(true)"'+(fcFlipped?'':' disabled')+'>Got It</button>'+
    '</div><div class="kb-hint">Space: flip &middot; &larr; Don\'t Know &middot; &rarr; Got It</div></div>';
  return h;
}

function fcFlip(el){fcFlipped=!fcFlipped;el.classList.toggle('flipped',fcFlipped)}

function fcAnswer(correct){
  if(!fcFlipped||fcSessionDone)return;
  const L=LESSONS[currentLesson];
  const vi=fcQueue[fcQueuePos];
  const v=L.vocab[vi];
  markWord(v.c,correct);
  if(correct)fcSessionCorrect++;else{fcSessionWrong++;fcMistakes.push(vi)}
  fcQueuePos++;fcFlipped=false;
  if(fcQueuePos>=fcQueue.length)fcSessionDone=true;
  document.getElementById('sec-flashcards').innerHTML=renderFlashcards(L);
}

function renderGrammar(L){
  return L.grammar.map(g=>'<div class="grammar-card"><div class="pattern">'+g.pattern+'</div><div class="explanation">'+g.desc+'</div><div class="example">'+g.ex+'<br><span style="color:var(--yellow);font-size:.9em">'+g.en+'</span></div></div>').join('');
}

function generateAutoQuiz(L,mode){
  const picked=shuffle([...Array(L.vocab.length).keys()]).slice(0,10);
  return picked.map(vi=>{
    const v=L.vocab[vi];
    const others=shuffle(L.vocab.filter((_,j)=>j!==vi)).slice(0,3);
    let opts,q;
    if(mode==='reverse'){
      q='Which Cantonese word means "'+v.e+'"?';
      opts=[v.c,...others.map(d=>d.c)];
    }else if(mode==='typejp'){
      q=v.c;
      opts=[v.j];
    }else{
      q='What is the Jyutping for "'+v.c+'"?';
      opts=[v.j,...others.map(d=>d.j)];
    }
    const correctOpt=opts[0];
    const shuffled=shuffle(opts);
    return{q,opts:shuffled,ans:shuffled.indexOf(correctOpt),wordKey:v.c};
  });
}

function setQuizMode(mode){
  quizMode=mode;quizAnswered=0;quizCorrect=0;
  const L=LESSONS[currentLesson];
  quizQuestions=mode==='meaning'?L.quiz.map(q=>({...q})):generateAutoQuiz(L,mode);
  document.getElementById('sec-quiz').innerHTML=renderQuiz(L);
}

function renderQuiz(L){
  let h='<div class="quiz-modes">'+
    '<button class="qmode-btn'+(quizMode==='meaning'?' active':'')+'" onclick="setQuizMode(\'meaning\')">Cantonese → English</button>'+
    '<button class="qmode-btn'+(quizMode==='reverse'?' active':'')+'" onclick="setQuizMode(\'reverse\')">English → Cantonese</button>'+
    '<button class="qmode-btn'+(quizMode==='jyutping'?' active':'')+'" onclick="setQuizMode(\'jyutping\')">Jyutping Match</button>'+
    '</div>';

  if(quizQuestions.length===0)return h+'<p style="color:var(--text2)">Select a quiz mode above.</p>';

  h+='<div class="score-bar"><span class="score">'+quizCorrect+'</span><span class="total">/ '+quizQuestions.length+'</span><div class="progress"><div class="progress-fill" style="width:'+quizAnswered/quizQuestions.length*100+'%"></div></div>';
  if(quizAnswered>=quizQuestions.length&&quizMode!=='meaning')h+='<button class="action-btn" onclick="setQuizMode(\''+quizMode+'\')" style="margin-left:auto;font-size:.8em">New Set</button>';
  h+='</div><div class="quiz-container">';

  quizQuestions.forEach((q,qi)=>{
    const answered=qi<quizAnswered;
    if(quizMode==='typejp'){
      h+='<div class="quiz-q"><div class="q-text">'+(qi+1)+'. Type the Jyutping for: <b>'+q.q+'</b></div><input class="quiz-input" id="qj-'+qi+'" placeholder="e.g. '+q.opts[0]+'" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--surface2);background:var(--surface);color:var(--text);font-size:1em" onkeydown="if(event.keyCode==13)answerQuiz(this.dataset.qi,-1)" data-qi="'+qi+'"></div>';
      return;
    }
    h+='<div class="quiz-q"><div class="q-text">'+(qi+1)+'. '+q.q+'</div><div class="quiz-options">';
    q.opts.forEach((o,oi)=>{
      let cls='quiz-opt';
      if(answered){cls+=' disabled';if(oi===q.ans)cls+=' correct'}
      h+='<div class="'+cls+'" onclick="answerQuiz('+qi+','+oi+')">'+o+'</div>';
    });
    h+='</div></div>';
  });
  return h+'</div>';
}

function answerQuiz(qi,oi){
  if(qi<quizAnswered)return;
  const q=quizQuestions[qi];
  let correct;
  if(quizMode==='typejp'){
    const input=document.getElementById('qj-'+qi);
    if(!input)return;
    const val=input.value.trim().toLowerCase().replace(/\s+/g,'');
    correct=val===q.opts[0].toLowerCase().replace(/\s+/g,'');
    input.style.borderColor=correct?'var(--green)':'var(--red)';
    input.disabled=true;
  }else{
    correct=oi===q.ans;
  }
  if(correct)quizCorrect++;
  quizAnswered++;
  if(q.wordKey)markWord(q.wordKey,correct);
  const L=LESSONS[currentLesson];
  const sec=document.getElementById('sec-quiz');
  const opts=sec.querySelectorAll('.quiz-q:nth-child('+(qi+1)+') .quiz-opt');
  opts.forEach((o,i)=>{o.classList.add('disabled');if(i===q.ans)o.classList.add('correct');if(i===oi&&!correct)o.classList.add('wrong')});
  const bar=sec.querySelector('.progress-fill');
  if(bar)bar.style.width=quizAnswered/quizQuestions.length*100+'%';
  const score=sec.querySelector('.score');
  if(score)score.textContent=quizCorrect;
}

    '<div class="stat-card accent"><div class="num">'+st.total+'</div><div class="label">Total Words</div></div>'+

    '<div class="stat-card blue"><div class="num">'+st.new+'</div><div class="label">Not Seen Yet</div></div>'+

    '<button class="action-btn" onclick="exportProgress()">📥 Export Progress</button>'+
    '<button class="action-btn" onclick="document.getElementById(\'importFile\').click()">📤 Import Progress</button>'+
    '<button class="action-btn danger" onclick="resetProgress()">🗑 Reset All Progress</button>'+
    '<input type="file" id="importFile" class="hidden-input" accept=".json" onchange="importProgress(this)">'+
    '</div>';

  return h;
}

function exportProgress(){
  const blob=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='cantonese-progress-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

function importProgress(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const d=JSON.parse(e.target.result);
      if(d.version===1&&d.words){
        progress=d;saveProgress();
        initFcSession();
        quizQuestions=LESSONS[currentLesson].quiz.map(q=>({...q}));
        quizAnswered=0;quizCorrect=0;
        render();
      }else{alert('Invalid file format')}
    }catch(err){alert('Invalid file format')}
  };
  reader.readAsText(file);
}

function resetProgress(){
  if(!confirm('Reset all learning progress? This cannot be undone.'))return;
  progress={version:1,streak:{lastDate:'',count:0},words:{}};
  saveProgress();
  initFcSession();
  quizQuestions=LESSONS[currentLesson].quiz.map(q=>({...q}));
  quizAnswered=0;quizCorrect=0;
  render();
}

document.addEventListener('keydown',function(e){
  const fc=document.getElementById('sec-flashcards');
  if(!fc||!fc.classList.contains('active'))return;
  if((e.key===' '||e.key==='Enter')&&!fcSessionDone&&fcQueue.length>0){
    e.preventDefault();
    const card=fc.querySelector('.flashcard');
    if(card)fcFlip(card);
  }else if(e.key==='ArrowRight'&&fcFlipped&&!fcSessionDone){
    e.preventDefault();fcAnswer(true);
  }else if(e.key==='ArrowLeft'&&fcFlipped&&!fcSessionDone){
    e.preventDefault();fcAnswer(false);
  }
});


// ── Matching Game ──
let matchData = [], matchSelected = null, matchMatched = 0, matchAttempts = 0, matchLocked = false;
function initMatch(){
  const L = LESSONS[currentLesson];
  const picked = shuffle(L.vocab).slice(0, 8);
  matchData = picked.map(v => ({id: v.c, text: v.c, pair: v.e, type: 'cn'}))
    .concat(picked.map(v => ({id: v.c, text: v.e, pair: v.c, type: 'en'})));
  matchData = shuffle(matchData);
  matchSelected = null; matchMatched = 0; matchAttempts = 0; matchLocked = false;
  const el = document.getElementById('sec-match');
  if(el) el.innerHTML = renderMatch(L);
}
function renderMatch(L){
  const total = matchData.length / 2;
  let h = '<div class="match-score"><span><span class="pairs">' + matchMatched + '/' + total + '</span> matched</span><span class="attempts">Attempts: ' + matchAttempts + '</span></div>';
  h += '<div class="match-grid"><div class="match-col"><h3>Cantonese</h3>';
  matchData.filter(d => d.type === 'cn').forEach(d => {
    const cls = 'match-card' + (d._matched ? ' matched' : '') + (matchSelected === d.id && !d._matched ? ' selected' : '');
    h += '<div class="' + cls + '" data-id="' + d.id + '" data-pair="' + d.pair + '" onclick="pickMatch(this)">' + d.text + '</div>';
  });
  h += '</div><div class="match-col"><h3>English</h3>';
  matchData.filter(d => d.type === 'en').forEach(d => {
    const cls = 'match-card' + (d._matched ? ' matched' : '') + (matchSelected === d.id && !d._matched ? ' selected' : '');
    h += '<div class="' + cls + '" data-id="' + d.id + '" data-pair="' + d.pair + '" onclick="pickMatch(this)">' + d.text + '</div>';
  });
  h += '</div></div>';
  if(matchMatched === total && total > 0) h += '<div class="session-summary"><h3>🎉 All matched!</h3><p style="color:var(--text2);margin:8px 0">' + matchAttempts + ' attempts</p><button class="fc-btn got-it" onclick="initMatch()">Play Again</button></div>';
  return h;
}
function pickMatch(el){
  if(matchLocked || el.classList.contains('matched')) return;
  if(!matchSelected){ matchSelected = el.dataset.id; el.classList.add('selected'); return; }
  if(matchSelected === el.dataset.id){ el.classList.remove('selected'); matchSelected = null; return; }
  matchLocked = true; matchAttempts++;
  const first = document.querySelector('.match-card[data-id="' + matchSelected + '"]');
  const correct = el.dataset.pair === first.dataset.id;
  if(correct){
    el.classList.add('correct'); first.classList.add('correct');
    setTimeout(() => {
      el.classList.add('matched'); first.classList.add('matched');
      el.classList.remove('correct','selected'); first.classList.remove('correct','selected');
      matchData.forEach(d => { if(d.id === el.dataset.id || d.id === matchSelected) d._matched = true; });
      matchMatched++; matchSelected = null; matchLocked = false;
      const sec = document.getElementById('sec-match');
      if(sec) sec.innerHTML = renderMatch(LESSONS[currentLesson]);
    }, 400);
  } else {
    el.classList.add('wrong'); first.classList.add('wrong');
    setTimeout(() => { el.classList.remove('wrong'); first.classList.remove('wrong','selected'); matchSelected = null; matchLocked = false; }, 500);
  }
}

// ── Writing Grid Modal ──
function showCharModal(ch){
  const modal = document.getElementById('writingModal');
  const inner = document.getElementById('modalInner');
  if(!modal || !inner) return;
  let ctx = '', jp = '', en = '';
  for(const L of LESSONS){ for(const v of L.vocab){ if(v.c.includes(ch)){ ctx = v.c; jp = v.j; en = v.e; break; } } if(ctx) break; }
  let grid = '<div class="modal-grid-big">';
  grid += '<div class="modal-cell-big ref">' + ch + '</div>';
  for(let i = 0; i < 15; i++) grid += '<div class="modal-cell-big prac"></div>';
  grid += '</div>';
  inner.innerHTML = '<h3 style="font-size:2.4em;margin-bottom:2px;color:var(--text)">' + ch + '</h3>' +
    '<div class="sub" style="margin-bottom:4px">' + (ctx ? ctx + ' [' + jp + ']' : '') + '</div>' +
    '<div style="font-size:.75em;color:var(--text2);margin-bottom:14px;font-style:italic">' + (en || '') + '</div>' +
    grid +
    '<div style="margin-top:8px;color:var(--text2);font-size:.7em">Trace the character above, then practice below</div>' +
    '<button class="modal-close-btn" onclick="document.getElementById(\'writingModal\').classList.remove(\'open\')">Close</button>';
  modal.classList.add('open');
}
function closeModal(e){
  if(e && e.target !== document.getElementById('writingModal') && e.target.closest('.modal-content')) return;
  document.getElementById('writingModal').classList.remove('open');
}

// ── Writing Game ──
const practicedChars = new Set(JSON.parse(localStorage.getItem('cantonese-practiced') || '[]'));
function renderGame(L){
  let h = '<div class="match-score"><span><span class="pairs">' + L.vocab.length + '</span> words to practice</span><span class="attempts">Click gray character to see expanded grid</span></div>';
  L.vocab.forEach(v => {
    h += '<div class="word-section">';
    h += '<div class="word-header"><span class="ch">' + v.c + '</span><span class="jp">[' + v.j + ']</span></div>';
    h += '<div class="word-meaning">' + v.e + '</div>';
    // For each character in the word, show 1 ref + 6 practice cells
    v.c.split('').forEach(ch => {
      h += '<div class="char-row">';
      h += '<div class="write-cell ref" onclick="showCharModal(\'' + ch + '\')">' + ch + '</div>';
      for(let i = 0; i < 6; i++) h += '<div class="write-cell prac"></div>';
      h += '</div>';
    });
    h += '<div class="write-hint">click the gray character \u2192 expanded practice</div></div>';
  });
  h += '<div style="text-align:center;color:var(--text2);font-size:.75em;padding:8px">Practice writing each character - trace the gray reference, then write in blank cells</div>';
  return h;
}

// ── Achievements ──
function renderAchievements(){
  const allWords = {}; LESSONS.forEach(l => l.vocab.forEach(v => { if(progress.words[v.c]) allWords[v.c] = progress.words[v.c]; }));
  const stats = { total: Object.keys(allWords).length, mastered: Object.values(allWords).filter(w => w.box >= 4).length, streak: progress.streak.count, practiced: practicedChars.size };
  const achs = [
    { icon: '🌱', name: 'First Steps', desc: 'Study 1 word', check: stats.total >= 1 },
    { icon: '📖', name: 'Getting Started', desc: 'Study 10 words', check: stats.total >= 10 },
    { icon: '📚', name: 'Dedicated', desc: 'Study 50 words', check: stats.total >= 50 },
    { icon: '⭐', name: 'Star Student', desc: 'Master 5 words', check: stats.mastered >= 5 },
    { icon: '🌟', name: 'Word Master', desc: 'Master 10 words', check: stats.mastered >= 10 },
    { icon: '🔥', name: 'On Fire', desc: '3-day streak', check: stats.streak >= 3 },
    { icon: '💪', name: 'Consistent', desc: '7-day streak', check: stats.streak >= 7 },
    { icon: '✍️', name: 'Penman', desc: 'Practice 5 chars', check: stats.practiced >= 5 },
    { icon: '🖌️', name: 'Calligrapher', desc: 'Practice 20 chars', check: stats.practiced >= 20 },
    { icon: '🏆', name: 'Explorer', desc: 'Open all 10 lessons', check: true },
  ];
  const unlocked = achs.filter(a => a.check).length;
  let h = '<div class="match-score" style="margin-top:24px"><span><span class="pairs">' + unlocked + '/' + achs.length + '</span> achievements</span></div>';
  h += '<div class="achievement-grid">';
  achs.forEach(a => { h += '<div class="achievement' + (a.check ? ' unlocked' : ' locked') + '"><div class="icon">' + a.icon + '</div><div class="name">' + a.name + '</div><div class="desc">' + a.desc + '</div></div>'; });
  return h + '</div>';
}

// Patch renderProgress to include achievements
{ const _orig = renderProgress; renderProgress = function(L){ return _orig(L) + '<h2 style="margin-top:24px;margin-bottom:12px">🏅 Achievements</h2>' + renderAchievements(); }; }

init();
</script>
