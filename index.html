{c:"笑",j:"siu3",e:"to laugh / smile"},
{c:"喊",j:"haam3",e:"to cry"},
{c:"唔緊要",j:"m4 gan2 jiu3",e:"it's OK / never mind"}
],
dialogue:[
{speaker:"A",c:"你今日心情好唔好啊？",j:"nei5 gam1 jat6 sam1 cing4 hou2 m4 hou2 aa3?",e:"How's your mood today?"},
{speaker:"B",c:"冇心情。返工好辛苦，返到嚟好悶。",j:"mou5 sam1 cing4. faan1 gung1 hou2 san1 fu2, faan1 dou3 lai4 hou2 mun6.",e:"Not in the mood. Work was hard, and I'm bored now I'm back."},
{speaker:"A",c:"做咩唔開心？有人嬲你？",j:"zou6 me1 m4 hoi1 sam1? jau5 jan4 nau1 nei5?",e:"Why unhappy? Did someone get angry at you?"},
{speaker:"B",c:"老闆有啲嬲。我怕佢失望。",j:"lou5 baan2 jau5 di1 nau1. ngo5 paa3 keoi5 sat1 mong6.",e:"The boss was a bit angry. I'm afraid he's disappointed."},
{speaker:"A",c:"唔緊要。你已經好盡力。放鬆啲啦。",j:"m4 gan2 jiu3. nei5 ji5 ging1 hou2 zeon6 lik6. fong3 sung1 di1 laa1.",e:"It's OK. You already tried hard. Relax a bit."},
{speaker:"B",c:"我知。不過我仲好緊張聽日個會。",j:"ngo5 zi1. bat1 gwo3 ngo5 zung6 hou2 gan2 zoeng1 ting1 jat6 go3 wui2.",e:"I know. But I'm still nervous about tomorrow's meeting."},
{speaker:"A",c:"一齊出街行下，開心啲。唔好喺屋企悶。",j:"jat1 cai4 ceot1 gaai1 haang4 haa5, hoi1 sam1 di1. m4 hou2 hai2 uk1 kei2 mun6.",e:"Let's go walk around — cheer up. Don't stay home bored."},
{speaker:"B",c:"我而家冇心情笑。想喊多過想出街。",j:"ngo5 ji4 gaa1 mou5 sam1 cing4 siu3. soeng2 haam3 do1 gwo3 soeng2 ceot1 gaai1.",e:"I'm not in the mood to smile. I'd rather cry than go out."},
{speaker:"A",c:"喊得就喊。我陪你。之後再輕鬆。",j:"haam3 dak1 zau6 haam3. ngo5 pui4 nei5. zi1 hau6 zoi3 hing1 sung1.",e:"If you need to cry, cry. I'll stay with you. Relax after."},
{speaker:"B",c:"多謝你。有你喺度我舒服啲。",j:"do1 ze6 nei5. jau5 nei5 hai2 dou6 ngo5 syu1 fuk6 di1.",e:"Thanks. I'm more at ease with you here."}
],
grammar:[
{pattern:"心情好唔好 / 冇心情",desc:"Mood. 冇心情 + verb = not in the mood to…",ex:"你今日心情好唔好啊？我冇心情笑。(nei5 gam1 jat6 sam1 cing4 hou2 m4 hou2 aa3? ngo5 mou5 sam1 cing4 siu3)",en:"How's your mood? I'm not in the mood to smile."},
{pattern:"有啲 + feeling",desc:"A bit angry / worried / nervous. Softens it.",ex:"老闆有啲嬲。我仲好緊張。(lou5 baan2 jau5 di1 nau1. ngo5 zung6 hou2 gan2 zoeng1)",en:"The boss was a bit angry. I'm still very nervous."},
{pattern:"多過 (do1 gwo3)",desc:"Rather… than… 想喊多過想出街.",ex:"想喊多過想出街。(soeng2 haam3 do1 gwo3 soeng2 ceot1 gaai1)",en:"I'd rather cry than go out."},
{pattern:"Adj + 啲 as cheer-up",desc:"開心啲, 放鬆啲, 舒服啲 — a bit more [mood].",ex:"放鬆啲啦。有你喺度我舒服啲。(fong3 sung1 di1 laa1. jau5 nei5 hai2 dou6 ngo5 syu1 fuk6 di1)",en:"Relax a bit. I'm more comfortable with you here."},
{pattern:"唔緊要 (m4 gan2 jiu3)",desc:"Never mind / it's OK. The default comfort line.",ex:"唔緊要。你已經好盡力。(m4 gan2 jiu3. nei5 ji5 ging1 hou2 zeon6 lik6)",en:"It's OK. You already did your best."}
],

{id:126,title:"L26 煮食",subtitle:"Cooking · 切炒煮 好食唔好食",

{c:"煮",j:"zyu2",e:"to cook (in water / in general)"},

{c:"廚房",j:"cyu4 fong2",e:"kitchen"},
{c:"餸",j:"sung3",e:"dishes; groceries for a meal"},
{c:"菜",j:"coi3",e:"vegetables; a dish"},
{c:"肉",j:"juk6",e:"meat"},
{c:"魚",j:"jyu2",e:"fish"},
{c:"鹽",j:"jim4",e:"salt"},
{c:"糖",j:"tong4",e:"sugar"},

{c:"生抽",j:"saang1 cau1",e:"light soy"},
{c:"好食",j:"hou2 sik6",e:"tasty (to eat)"},

{c:"生",j:"saang1",e:"undercooked / raw"},
{c:"熟",j:"suk6",e:"cooked through"},
{c:"滾",j:"gwan2",e:"boiling"},
{c:"熄火",j:"sik1 fo2",e:"turn off the heat"}
],
dialogue:[
{speaker:"A",c:"今晚煮咩餸啊？",j:"gam1 maan5 zyu2 me1 sung3 aa3?",e:"What are we cooking tonight?"},
{speaker:"B",c:"我買咗菜同魚。你切菜，我蒸魚。",j:"ngo5 maai5 zo2 coi3 tung4 jyu2. nei5 cit3 coi3, ngo5 zing1 jyu2.",e:"I bought veg and fish. You cut the veg, I'll steam the fish."},
{speaker:"A",c:"魚洗咗未？",j:"jyu2 sai2 zo2 mei6?",e:"Has the fish been washed?"},
{speaker:"B",c:"洗咗。水滾咗先至落。",j:"sai2 zo2. seoi2 gwan2 zo2 sin1 zi3 lok6.",e:"Yes. Put it in only after the water boils."},
{speaker:"A",c:"我炒菜要幾多鹽？",j:"ngo5 caau2 coi3 jiu3 gei2 do1 jim4?",e:"How much salt for the stir-fry?"},
{speaker:"B",c:"少少就得。落多啲豉油好食啲。",j:"siu2 siu2 zau6 dak1. lok6 do1 di1 si6 jau4 hou2 sik6 di1.",e:"Just a little. A bit more soy sauce tastes better."},
{speaker:"A",c:"會唔會生啊？我怕未熟。",j:"wui5 m4 wui5 saang1 aa3? ngo5 paa3 mei6 suk6.",e:"Will it be undercooked? I'm afraid it's not done."},
{speaker:"B",c:"魚蒸八分鐘就熟。之後熄火。",j:"jyu2 zing1 baat3 fan1 zung1 zau6 suk6. zi1 hau6 sik1 fo2.",e:"Steam the fish eight minutes and it's done. Then turn off the heat."},
{speaker:"A",c:"好香。今晚一定好食。",j:"hou2 hoeng1. gam1 maan5 jat1 ding6 hou2 sik6.",e:"Smells good. Tonight will definitely be tasty."},
{speaker:"B",c:"你煮飯，我搞餸。分工合作。",j:"nei5 zyu2 faan6, ngo5 gaau2 sung3. fan1 gung1 hap6 zok3.",e:"You cook the rice, I'll do the dishes. Split the work."}
],
grammar:[
{pattern:"煮 vs 炒 vs 蒸",desc:"煮 = cook/boil (and 煮飯). 炒 = stir-fry. 蒸 = steam. HK home trio.",ex:"你切菜，我蒸魚。你煮飯。(nei5 cit3 coi3, ngo5 zing1 jyu2. nei5 zyu2 faan6)",en:"You cut veg, I steam fish. You cook rice."},
{pattern:"水滾咗先至落",desc:"Only after the water has boiled, then put (it) in. 先至 again.",ex:"水滾咗先至落。(seoi2 gwan2 zo2 sin1 zi3 lok6)",en:"Put it in only after the water boils."},
{pattern:"好食 (hou2 sik6)",desc:"Tastes good. Not 好吃. Opposite 唔好食. 好飲 for drinks.",ex:"落多啲豉油好食啲。(lok6 do1 di1 si6 jau4 hou2 sik6 di1)",en:"A bit more soy sauce tastes better."},
{pattern:"生 vs 熟 (saang1 / suk6)",desc:"Raw or undercooked vs cooked through. 怕未熟.",ex:"會唔會生啊？我怕未熟。(wui5 m4 wui5 saang1 aa3? ngo5 paa3 mei6 suk6)",en:"Will it be undercooked? I'm afraid it's not done."},
{pattern:"搞餸 (gaau2 sung3)",desc:"Handle the dishes (the cooking). Casual and very HK.",ex:"你煮飯，我搞餸。(nei5 zyu2 faan6, ngo5 gaau2 sung3)",en:"You cook rice, I'll do the dishes."}
],

{q:'"炒" means:',opts:["steam","stir-fry","bake","wash"],ans:1},

{q:'"好食" means:',opts:["good at eating","tasty","hungry","raw"],ans:1},

{q:"Fish is steamed for:",opts:["2 minutes","8 minutes","30 minutes","1 hour"],ans:1},

{c:"洗錢",j:"sai2 cin2",e:"to spend money (not the crime, in speech)"},
{c:"夠唔夠",j:"gau3 m4 gau3",e:"is it enough"},
{c:"唔夠",j:"m4 gau3",e:"not enough"},
{c:"貴",j:"gwai3",e:"expensive"},

dialogue:[
{speaker:"A",c:"你出糧未啊？我租金都未交。",j:"nei5 ceot1 loeng4 mei6 aa3? ngo5 zou1 gam1 dou1 mei6 gaau1.",e:"Got paid yet? I haven't paid rent."},
{speaker:"B",c:"出咗。你去櫃員機提款定轉賬？",j:"ceot1 zo2. nei5 heoi3 gwai6 jyun4 gei1 tai4 fun2 ding6 zyun3 zoeng3?",e:"Yes. You going to the ATM to withdraw, or transfer?"},
{speaker:"A",c:"轉賬平啲，慳手續費。不過我密碼唔記得。",j:"zyun3 zoeng3 peng4 di1, haan1 sau2 zuk1 fai3. bat1 gwo3 ngo5 mat6 maa5 m4 gei3 dak1.",e:"Transfer is cheaper — saves the fee. But I forgot my PIN."},
{speaker:"B",c:"去銀行重設。帶身份證同卡。",j:"heoi3 ngan4 hong4 cung4 cit3. daai3 san1 fan2 zing3 tung4 kaat1.",e:"Reset it at the bank. Bring ID and the card."},
{speaker:"A",c:"今個月洗錢洗得太多。學費都貴。",j:"gam1 go3 jyut6 sai2 cin2 sai2 dak1 taai3 do1. hok6 fai3 dou1 gwai3.",e:"I spent too much this month. Tuition is expensive too."},
{speaker:"B",c:"慳啲啦。出糧唔等於夠洗。",j:"haan1 di1 laa1. ceot1 loeng4 m4 dang2 jyu1 gau3 sai2.",e:"Save a bit. Payday doesn't mean it's enough to spend."},
{speaker:"A",c:"今個月錢夠唔夠交租啊？",j:"gam1 go3 jyut6 cin2 gau3 m4 gau3 gaau1 zou1 aa3?",e:"Enough money this month to pay rent?"},
{speaker:"B",c:"你租金貴過我好多。要唔要搬？",j:"nei5 zou1 gam1 gwai3 gwo3 ngo5 hou2 do1. jiu3 m4 jiu3 bun1?",e:"Your rent is much more expensive than mine. Want to move?"},
{speaker:"A",c:"暫時唔搬。月結單我未簽。",j:"zaam6 si4 m4 bun1. jyut6 git3 daan1 ngo5 mei6 cim1.",e:"Not moving for now. I haven't signed the statement yet."},
{speaker:"B",c:"數要準時交。遲咗就罰。",j:"sou3 jiu3 zeon2 si4 gaau1. ci4 zo2 zau6 fat6.",e:"Pay bills on time. Late and you get fined."}
],
grammar:[
{pattern:"出糧 (ceot1 loeng4)",desc:"Get paid. 糧 = salary (rice-money). 出咗糧未？",ex:"你出糧未啊？出咗。(nei5 ceot1 loeng4 mei6 aa3? ceot1 zo2)",en:"Got paid yet? Yes."},
{pattern:"洗錢 (sai2 cin2) in speech",desc:"Spend money. Not the crime. 今個月洗錢洗得太多.",ex:"今個月洗錢洗得太多。(gam1 go3 jyut6 sai2 cin2 sai2 dak1 taai3 do1)",en:"I spent too much this month."},
{pattern:"慳 (haan1)",desc:"Save / be sparing. 慳啲, 慳手續費.",ex:"轉賬平啲，慳手續費。慳啲啦。(zyun3 zoeng3 peng4 di1, haan1 sau2 zuk1 fai3. haan1 di1 laa1)",en:"Transfer is cheaper, saves the fee. Save a bit."},
{pattern:"貴過 (gwai3 gwo3)",desc:"More expensive than. Same 過 as 平過.",ex:"你租金貴過我好多。(nei5 zou1 gam1 gwai3 gwo3 ngo5 hou2 do1)",en:"Your rent is much more expensive than mine."},
{pattern:"夠唔夠 (gau3 m4 gau3)",desc:"Enough or not. Answer 夠 / 唔夠.",ex:"出糧唔等於夠洗。(ceot1 loeng4 m4 dang2 jyu1 gau3 sai2)",en:"Payday doesn't mean it's enough to spend."}
],
quiz:[
{q:'"出糧" means:',opts:["get paid","buy rice","leave the bank","spend"],ans:0},
{q:'"櫃員機" is an:',opts:["elevator","octopus","ATM","office"],ans:2},
{q:'"提款" means:',opts:["deposit","transfer","sign","withdraw cash"],ans:3},
{q:'"慳" means:',opts:["save / be sparing","spend freely","borrow","owe"],ans:0},
{q:'Spoken "洗錢" here means:',opts:["money laundering only","wash coins","spend money","get a raise"],ans:2},
{q:'"轉賬" means:',opts:["open an account","count cash","close the bank","transfer money"],ans:3},
{q:'"租金" means:',opts:["rent","salary","tuition","a fine"],ans:0},
{q:'"密碼" means:',opts:["ID card","receipt","bank","PIN / password"],ans:3}
]},

{id:128,title:"L28 睇醫生",subtitle:"Clinic · 掛號、症、藥、病假",
vocab:[
{c:"診所",j:"can2 so2",e:"clinic"},
{c:"掛號",j:"gwaa3 hou6",e:"to register (at clinic/hospital)"},
{c:"症",j:"zing3",e:"a condition / case"},
{c:"睇症",j:"tai2 zing3",e:"to see the doctor (for a case)"},
{c:"問症",j:"man6 zing3",e:"the doctor taking your history"},
{c:"發燒",j:"faat3 siu1",e:"fever"},
{c:"咳",j:"kat1",e:"to cough"},
{c:"喉嚨痛",j:"hau4 lung4 tung3",e:"sore throat"},
{c:"流鼻水",j:"lau4 bei6 seoi2",e:"runny nose"},
{c:"處方",j:"cyu2 fong1",e:"prescription"},
{c:"藥",j:"joek6",e:"medicine"},
{c:"食藥",j:"sik6 joek6",e:"to take medicine"},
{c:"病假",j:"beng6 gaa3",e:"sick leave"},
{c:"紙",j:"zi2",e:"a certificate / note (病假紙)"},
{c:"過敏",j:"gwo3 man5",e:"allergy; allergic"},
{c:"打針",j:"daa2 zam1",e:"to get an injection"},
{c:"驗血",j:"jim6 hyut3",e:"blood test"},
{c:"好返",j:"hou2 faan1",e:"to get better"},
{c:"嚴重",j:"jim4 zung6",e:"serious"},
{c:"休息",j:"jau1 sik1",e:"to rest"}
],
dialogue:[
{speaker:"A",c:"我喉嚨痛同埋咳。可唔可以掛號睇症？",j:"ngo5 hau4 lung4 tung3 tung4 maai4 kat1. ho2 m4 ho2 ji5 gwaa3 hou6 tai2 zing3?",e:"Sore throat and a cough. Can I register to see the doctor?"},
{speaker:"B",c:"得。你有冇發燒？有冇過敏？",j:"dak1. nei5 jau5 mou5 faat3 siu1? jau5 mou5 gwo3 man5?",e:"Yes. Fever? Any allergies?"},
{speaker:"A",c:"朝早量過，三十七度半。花生過敏。",j:"ziu1 zou2 loeng4 gwo3, saam1 sap6 cat1 dou6 bun3. faa1 sang1 gwo3 man5.",e:"Measured this morning, 37.5. Allergic to peanuts."},
{speaker:"B",c:"唔嚴重。我畀處方你，去隔離藥房攞藥。",j:"m4 jim4 zung6. ngo5 bei2 cyu2 fong1 nei5, heoi3 gaak3 lei4 joek6 fong4 lo2 joek6.",e:"Not serious. I'll give you a prescription — get it at the pharmacy next door."},
{speaker:"A",c:"一日食幾次藥啊？",j:"jat1 jat6 sik6 gei2 ci3 joek6 aa3?",e:"How many times a day do I take the medicine?"},
{speaker:"B",c:"三次，食完飯食。要休息，唔好捱夜。",j:"saam1 ci3, sik6 jyun4 faan6 sik6. jiu3 jau1 sik1, m4 hou2 ngaai4 je6.",e:"Three times, after meals. Rest — don't stay up late."},
{speaker:"A",c:"可唔可以開病假紙？聽日要返工。",j:"ho2 m4 ho2 ji5 hoi1 beng6 gaa3 zi2? ting1 jat6 jiu3 faan1 gung1.",e:"Can you write a sick-leave note? I have work tomorrow."},
{speaker:"B",c:"開兩日。你好返先返工。",j:"hoi1 loeng5 jat6. nei5 hou2 faan1 sin1 faan1 gung1.",e:"Two days. Only go back to work once you're better."},
{speaker:"A",c:"要唔要打針或者驗血？",j:"jiu3 m4 jiu3 daa2 zam1 waak6 ze2 jim6 hyut3?",e:"Need a jab or a blood test?"},
{speaker:"B",c:"而家唔使。如果仲咳就返嚟。",j:"ji4 gaa1 m4 sai2. jyu4 gwo2 zung6 kat1 zau6 faan1 lai4.",e:"Not now. If you're still coughing, come back."}
],
grammar:[
{pattern:"睇症 / 掛號",desc:"睇症 = see the doctor for your case. 掛號 = register at the counter first.",ex:"可唔可以掛號睇症？(ho2 m4 ho2 ji5 gwaa3 hou6 tai2 zing3?)",en:"Can I register to see the doctor?"},
{pattern:"有冇 + symptom",desc:"有冇發燒 / 有冇過敏 / 有冇咳.",ex:"你有冇發燒？有冇過敏？(nei5 jau5 mou5 faat3 siu1? jau5 mou5 gwo3 man5?)",en:"Got a fever? Any allergies?"},
{pattern:"病假紙 (beng6 gaa3 zi2)",desc:"Sick-leave certificate. 開紙 = write/issue the note.",ex:"可唔可以開病假紙？開兩日。(ho2 m4 ho2 ji5 hoi1 beng6 gaa3 zi2? hoi1 loeng5 jat6)",en:"Can you issue a sick note? Two days."},
{pattern:"食完飯食 (sik6 jyun4 faan6 sik6)",desc:"Take (it) after eating. Stacked 食: finish meal, then take medicine.",ex:"三次，食完飯食。(saam1 ci3, sik6 jyun4 faan6 sik6)",en:"Three times, take after meals."},
{pattern:"好返先 + verb",desc:"Only after recovering, then… Same as L12.",ex:"你好返先返工。(nei5 hou2 faan1 sin1 faan1 gung1)",en:"Only go back to work once you're better."}
],
quiz:[
{q:'"掛號" at a clinic means:',opts:["register","make a phone call","hang a picture","pay rent"],ans:0},
{q:'"咳" means:',opts:["fever","rash","cough","dizzy"],ans:2},
{q:'"處方" means:',opts:["waiting room","injection","blood test","prescription"],ans:3},
{q:'"病假紙" is:',opts:["a sick-leave note","a tissue","a bill","an X-ray"],ans:0},
{q:'"過敏" means:',opts:["exercise","appetite","a cold","allergy"],ans:3},
{q:"Medicine is taken:",opts:["once a week","only at night","three times, after meals","never with food"],ans:2},
{q:'"打針" means:',opts:["get an injection","draw blood","take pills","rest"],ans:0},
{q:'"開兩日" here means:',opts:["open at 2","work two days","wait two hours","issue two days of leave"],ans:3}
]},

{id:129,title:"L29 返工",subtitle:"At work · 開會、交、加班、請假",
vocab:[
{c:"返工",j:"faan1 gung1",e:"go to work"},
{c:"放工",j:"fong3 gung1",e:"get off work"},
{c:"加班",j:"gaa1 baan1",e:"overtime"},
{c:"開會",j:"hoi1 wui2",e:"have a meeting"},
{c:"交",j:"gaau1",e:"to submit / hand in"},
{c:"報告",j:"bou3 gou3",e:"report"},
{c:"deadline",j:"ded1 laan4",e:"deadline (loanword)"},
{c:"同事",j:"tung4 si6",e:"colleague"},
{c:"上司",j:"soeng6 si1",e:"boss / superior"},
{c:"忙",j:"mong4",e:"busy"},
{c:"得閒",j:"dak1 haan4",e:"free"},
{c:"請假",j:"cing2 gaa3",e:"ask for leave"},
{c:"年假",j:"nin4 gaa3",e:"annual leave"},
{c:"加班費",j:"gaa1 baan1 fai3",e:"overtime pay"},
{c:"會議",j:"wui6 ji5",e:"a meeting (noun)"},
{c:"電郵",j:"din6 jau4",e:"email"},
{c:"覆",j:"fuk1",e:"reply"},
{c:"搞掂",j:"gaau2 dim6",e:"done / sorted"},
{c:"未搞掂",j:"mei6 gaau2 dim6",e:"not done yet"},
{c:"辛苦",j:"san1 fu2",e:"tough going"}
],
dialogue:[
{speaker:"A",c:"你今日幾點放工啊？",j:"nei5 gam1 jat6 gei2 dim2 fong3 gung1 aa3?",e:"What time do you get off today?"},
{speaker:"B",c:"唔知。報告未搞掂，可能要加班。",j:"m4 zi1. bou3 gou3 mei6 gaau2 dim6, ho2 nang4 jiu3 gaa1 baan1.",e:"Dunno. Report isn't done — might have to OT."},
{speaker:"A",c:"Deadline幾時？上司有冇催？",j:"ded1 laan4 gei2 si4? soeng6 si1 jau5 mou5 ceoi1?",e:"When's the deadline? Boss chasing you?"},
{speaker:"B",c:"聽日朝早。同事肯幫我就搞得掂。",j:"ting1 jat6 ziu1 zou2. tung4 si6 hang2 bong1 ngo5 zau6 gaau2 dak1 dim6.",e:"Tomorrow morning. If a colleague is willing to help I'll get it done."},
{speaker:"A",c:"你覆咗電郵未？開會係三點。",j:"nei5 fuk1 zo2 din6 jau4 mei6? hoi1 wui2 hai6 saam1 dim2.",e:"Replied to the email yet? Meeting's at three."},
{speaker:"B",c:"覆咗。我請假聽日晏晝得唔得？",j:"fuk1 zo2. ngo5 cing2 gaa3 ting1 jat6 aan3 zau3 dak1 m4 dak1?",e:"Yes. Can I take tomorrow afternoon off?"},
{speaker:"A",c:"交完報告先至請。年假仲有冇？",j:"gaau1 jyun4 bou3 gou3 sin1 zi3 cing2. nin4 gaa3 zung6 jau5 mou5?",e:"Hand in the report first, then ask. Any annual leave left?"},
{speaker:"B",c:"仲有三日。加班有冇加班費啊？",j:"zung6 jau5 saam1 jat6. gaa1 baan1 jau5 mou5 gaa1 baan1 fai3 aa3?",e:"Three days left. OT paid?"},
{speaker:"A",c:"有。不過你都幾辛苦。返屋企早啲啦。",j:"jau5. bat1 gwo3 nei5 dou1 gei2 san1 fu2. faan1 uk1 kei2 zou2 di1 laa1.",e:"Yes. But you're having a rough time. Go home earlier."},
{speaker:"B",c:"得。搞掂就走。",j:"dak1. gaau2 dim6 zau6 zau2.",e:"OK. Once it's done, I leave."}
],
grammar:[
{pattern:"搞掂 (gaau2 dim6)",desc:"Sorted / done. The HK completion verb. 未搞掂, 搞得掂, 搞掂就走.",ex:"報告未搞掂。搞掂就走。(bou3 gou3 mei6 gaau2 dim6. gaau2 dim6 zau6 zau2)",en:"The report isn't done. Once it's done, I leave."},
{pattern:"交完…先至…",desc:"Only after handing in… then…",ex:"交完報告先至請。(gaau1 jyun4 bou3 gou3 sin1 zi3 cing2)",en:"Only ask for leave after submitting the report."},
{pattern:"肯 (hang2)",desc:"Willing to. 同事肯幫我.",ex:"同事肯幫我就搞得掂。(tung4 si6 hang2 bong1 ngo5 zau6 gaau2 dak1 dim6)",en:"If a colleague is willing to help I'll get it done."},
{pattern:"有冇加班費",desc:"有冇 + noun. Same 有冇 as existence.",ex:"加班有冇加班費啊？有。(gaa1 baan1 jau5 mou5 gaa1 baan1 fai3 aa3? jau5)",en:"Is there OT pay? Yes."},
{pattern:"Deadline as a loanword",desc:"HK offices say deadline. You can also 截止日期, but spoken is deadline.",ex:"Deadline幾時？(ded1 laan4 gei2 si4?)",en:"When is the deadline?"}
],
quiz:[
{q:'"搞掂" means:',opts:["sorted / done","start","fail","meeting"],ans:0},

{q:'"放工" means:',opts:["go to work","overtime","resign","get off work"],ans:3},

{q:'"請假" — 假 is:',opts:["gaa2 fake","haa6","gaa1","gaa3 leave"],ans:3},
{q:'"肯" means:',opts:["refuse","already","never","willing to"],ans:3},
{q:"B's report is due:",opts:["tonight","next month","tomorrow morning","never"],ans:2},

]},

{speaker:"A",c:"成日宅會悶。不如brunch然後行街？",j:"sing4 jat6 zaak6 wui5 mun6. bat1 jyu4 ban1 ci2 jin4 hau6 haang4 gaai1?",e:"Staying in every day gets boring. How about brunch then a wander?"},

{id:131,title:"L31 口頭禪",subtitle:"Fillers · 即係、嗰個、然後、真係、唔係呀嘛",
vocab:[
{c:"即係",j:"zik1 hai6",e:"that is / I mean"},
{c:"然後",j:"jin4 hau6",e:"and then"},
{c:"其實",j:"kei4 sat6",e:"actually"},
{c:"咁",j:"gam2",e:"so / then / like that"},
{c:"嗰個",j:"go2 go3",e:"that (filler while thinking)"},
{c:"呢",j:"ne1",e:"y'know / as for…"},
{c:"嚇",j:"haak3",e:"to scare (also 吓 haa5 wait)"},
{c:"真係",j:"zan1 hai6",e:"really"},
{c:"唔係呀嘛",j:"m4 hai6 aa3 maa3",e:"no way / you're kidding"},
{c:"係咪先",j:"hai6 mai6 sin1",e:"right? (seeking agreement)"},
{c:"得唔得㗎",j:"dak1 m4 dak1 gaa3",e:"is that even OK?"},
{c:"冇理由",j:"mou5 lei5 jau4",e:"there's no way / that's unreasonable"},
{c:"講真",j:"gong2 zan1",e:"to be honest"},
{c:"唔好意思",j:"m4 hou2 ji3 si1",e:"sorry / excuse me"},
{c:"等陣",j:"dang2 zan6",e:"hang on a sec"},
{c:"差唔多啦",j:"caa1 m4 do1 laa1",e:"that's about enough / more or less"},
{c:"算啦",j:"syun3 laa1",e:"forget it / never mind"},
{c:"得啦",j:"dak1 laa1",e:"OK that's enough"},
{c:"係囉",j:"hai6 lo1",e:"exactly / right"},
{c:"吓",j:"haa2",e:"huh? / as a tag"}
],
dialogue:[
{speaker:"A",c:"即係…你聽日嚟唔嚟得啊？",j:"zik1 hai6… nei5 ting1 jat6 lai4 m4 lai4 dak1 aa3?",e:"I mean… can you come tomorrow?"},
{speaker:"B",c:"等陣。其實我…嗰個…未肯定。",j:"dang2 zan6. kei4 sat6 ngo5… go2 go3… mei6 hang2 ding6.",e:"Hang on. Actually I… um… I'm not sure yet."},
{speaker:"A",c:"真係？你尋日話得㗎。",j:"zan1 hai6? nei5 cam4 jat6 waa6 dak1 gaa3.",e:"Really? Yesterday you said yes."},
{speaker:"B",c:"唔係呀嘛。我有講過？",j:"m4 hai6 aa3 maa3. ngo5 jau5 gong2 gwo3?",e:"No way. I said that?"},
{speaker:"A",c:"有啊。然後你話準時到。係咪先？",j:"jau5 aa3. jin4 hau6 nei5 waa6 zeon2 si4 dou3. hai6 mai6 sin1?",e:"Yes. Then you said you'd be on time. Right?"},
{speaker:"B",c:"講真，我記錯。冇理由我唔記得。",j:"gong2 zan1, ngo5 gei3 co3. mou5 lei5 jau4 ngo5 m4 gei3 dak1.",e:"Honestly, I remembered wrong. There's no way I'd forget…"},
{speaker:"A",c:"得啦，唔好解釋。嚟得就嚟。",j:"dak1 laa1, m4 hou2 gaai2 sik1. lai4 dak1 zau6 lai4.",e:"Enough, don't explain. Come if you can."},
{speaker:"B",c:"算啦，我嚟。差唔多啦，唔好嬲。",j:"syun3 laa1, ngo5 lai4. caa1 m4 do1 laa1, m4 hou2 nau1.",e:"Fine, I'll come. That's about it — don't be mad."},
{speaker:"A",c:"係囉。咁聽日見。",j:"hai6 lo1. gam2 ting1 jat6 gin3.",e:"Exactly. See you tomorrow then."},
{speaker:"B",c:"吓？幾點啊？我又唔記得。",j:"haa2? gei2 dim2 aa3? ngo5 jau6 m4 gei3 dak1.",e:"Huh? What time? I forgot again."}
],
grammar:[
{pattern:"即係 / 嗰個 as stalling",desc:"Buy time. English 'like / I mean / um'. Don't overuse 嗰個 but you will hear it constantly.",ex:"即係…你聽日嚟唔嚟得啊？其實我…嗰個…未肯定。(zik1 hai6… nei5 ting1 jat6 lai4 m4 lai4 dak1 aa3? kei4 sat6 ngo5… go2 go3… mei6 hang2 ding6)",en:"I mean… can you come tomorrow? Actually I… um… not sure."},
{pattern:"唔係呀嘛 (m4 hai6 aa3 maa3)",desc:"Disbelief. 'You're kidding.' Not a real 唔係.",ex:"真係？唔係呀嘛。我有講過？(zan1 hai6? m4 hai6 aa3 maa3. ngo5 jau5 gong2 gwo3?)",en:"Really? No way. I said that?"},
{pattern:"係咪先 / 係囉",desc:"係咪先 seeks agreement. 係囉 closes: 'exactly.'",ex:"然後你話準時到。係咪先？係囉。(jin4 hau6 nei5 waa6 zeon2 si4 dou3. hai6 mai6 sin1? hai6 lo1)",en:"Then you said you'd be on time. Right? Exactly."},
{pattern:"得啦 / 算啦 / 差唔多啦",desc:"Conversation brakes. 得啦 = enough. 算啦 = forget it / fine. 差唔多啦 = that's about enough.",ex:"得啦，唔好解釋。算啦，我嚟。(dak1 laa1, m4 hou2 gaai2 sik1. syun3 laa1, ngo5 lai4)",en:"Enough, don't explain. Fine, I'll come."},
{pattern:"吓？ (haa2)",desc:"Huh? Didn't catch it / surprise. Different from 吓 haa5 'a bit'.",ex:"吓？幾點啊？(haa2? gei2 dim2 aa3?)",en:"Huh? What time?"}
],
quiz:[
{q:'"即係" is used to:',opts:["mean 'I mean / that is'","say goodbye","count money","order food"],ans:0},
{q:'"唔係呀嘛" expresses:',opts:["thanks","disbelief / no way","the time","hunger"],ans:1},
{q:'"算啦" means:',opts:["calculate","forget it / fine","hurry","please sit"],ans:1},
{q:'"係囉" means:',opts:["maybe","exactly / right","never","sorry"],ans:1},
{q:'"嗰個" in the middle of a sentence often:',opts:["means a shop","fills thinking time (um)","means today","is a number"],ans:1},
{q:'"得啦" is a way to:',opts:["start a speech","stop someone / say enough","ask a price","open a door"],ans:1},
{q:'"吓？" (haa2) means:',opts:["delicious","huh?","yes sir","tomorrow"],ans:1},
{q:'"講真" means:',opts:["lie","to be honest","count","run"],ans:1}
]},

{id:132,title:"L32 否定",subtitle:"Saying no · 唔、冇、未、咪、唔好",
vocab:[
{c:"唔",j:"m4",e:"not (before verbs/adj)"},
{c:"冇",j:"mou5",e:"not have / there isn't"},
{c:"未",j:"mei6",e:"not yet"},
{c:"唔好",j:"m4 hou2",e:"don't"},
{c:"咪",j:"mai5",e:"don't (casual)"},
{c:"唔使",j:"m4 sai2",e:"no need"},
{c:"唔得",j:"m4 dak1",e:"not OK / cannot"},
{c:"唔係",j:"m4 hai6",e:"is not / no"},
{c:"唔識",j:"m4 sik1",e:"don't know (how / a person)"},
{c:"唔知",j:"m4 zi1",e:"don't know (a fact)"},
{c:"唔記得",j:"m4 gei3 dak1",e:"forget / don't remember"},
{c:"唔該",j:"m4 goi1",e:"please / thanks (not a negative!)"},
{c:"冇人",j:"mou5 jan4",e:"nobody"},

{c:"未得",j:"mei6 dak1",e:"not ready yet"},
{c:"唔可以",j:"m4 ho2 ji5",e:"cannot / must not"},
{c:"唔准",j:"m4 zeon2",e:"not allowed"},
{c:"唔關事",j:"m4 gwaan1 si6",e:"none of (my/your) business; irrelevant"},

{c:"冇所謂",j:"mou5 so2 wai6",e:"doesn't matter"}
],
dialogue:[
{speaker:"A",c:"你食咗飯未？",j:"nei5 sik6 zo2 faan6 mei6?",e:"Have you eaten yet?"},
{speaker:"B",c:"未。不過我唔想食。冇胃口。",j:"mei6. bat1 gwo3 ngo5 m4 soeng2 sik6. mou5 wai6 hau2.",e:"Not yet. But I don't want to. No appetite."},
{speaker:"A",c:"唔好唔食。身體會冇力。",j:"m4 hou2 m4 sik6. san1 tai2 wui5 mou5 lik6.",e:"Don't skip eating. You'll have no energy."},
{speaker:"B",c:"咪煩啦。我冇嘢，真係。",j:"mai5 faan4 laa1. ngo5 mou5 je5, zan1 hai6.",e:"Stop nagging. I'm fine, really."},
{speaker:"A",c:"你唔使同我客氣。有冇藥食？",j:"nei5 m4 sai2 tung4 ngo5 haak3 hei3. jau5 mou5 joek6 sik6?",e:"You don't need to be polite with me. Taken any medicine?"},
{speaker:"B",c:"冇。我唔識買邊種。",j:"mou5. ngo5 m4 sik1 maai5 bin1 zung2.",e:"No. I don't know which kind to buy."},
{speaker:"A",c:"我幫你買。你唔准出街。",j:"ngo5 bong1 nei5 maai5. nei5 m4 zeon2 ceot1 gaai1.",e:"I'll buy it. You're not allowed out."},
{speaker:"B",c:"唔得。我唔係小朋友。唔關你事。",j:"m4 dak1. ngo5 m4 hai6 siu2 pang4 jau5. m4 gwaan1 nei5 si6.",e:"No. I'm not a kid. None of your business."},
{speaker:"A",c:"得，冇所謂。你唔舒服就講。",j:"dak1, mou5 so2 wai6. nei5 m4 syu1 fuk6 zau6 gong2.",e:"Fine, whatever. If you're unwell, say so."},
{speaker:"B",c:"對唔住。我唔係有心。多謝你。",j:"deoi3 m4 zyu6. ngo5 m4 hai6 jau5 sam1. do1 ze6 nei5.",e:"Sorry. I didn't mean it. Thanks."}
],
grammar:[
{pattern:"唔 vs 冇 vs 未",desc:"唔 + verb/adj = not. 冇 = don't have / there isn't. 未 = not yet (still expected).",ex:"我唔想食。未食。冇胃口。(ngo5 m4 soeng2 sik6. mei6 sik6. mou5 wai6 hau2)",en:"I don't want to eat. Haven't eaten yet. No appetite."},
{pattern:"唔好 vs 咪",desc:"Don't. 唔好 is the default. 咪 is snappier: 咪煩啦.",ex:"唔好唔食。咪煩啦。(m4 hou2 m4 sik6. mai5 faan4 laa1)",en:"Don't skip eating. Stop nagging."},
{pattern:"唔識 vs 唔知",desc:"唔識 = don't know how / don't know a person. 唔知 = don't know a fact.",ex:"我唔識買邊種。我唔知佢喺邊。(ngo5 m4 sik1 maai5 bin1 zung2)",en:"I don't know which kind to buy."},
{pattern:"唔使 / 唔得 / 唔准",desc:"No need / not allowed-to-work / forbidden. Three flavours of no.",ex:"你唔使同我客氣。唔得。你唔准出街。(nei5 m4 sai2 tung4 ngo5 haak3 hei3. m4 dak1. nei5 m4 zeon2 ceot1 gaai1)",en:"No need to be polite. No. You're not allowed out."},
{pattern:"冇嘢 / 冇所謂",desc:"冇嘢 = nothing / I'm fine. 冇所謂 = I don't mind.",ex:"我冇嘢，真係。冇所謂。(ngo5 mou5 je5, zan1 hai6. mou5 so2 wai6)",en:"I'm fine, really. Doesn't matter."}
],
quiz:[
{q:'"未" means:',opts:["never","not yet","don't have","don't"],ans:1},
{q:'"冇" means:',opts:["not (before a verb)","don't have / there isn't","please","later"],ans:1},
{q:'"唔好" means:',opts:["not good-looking only","don't","thanks","already"],ans:1},
{q:'"咪煩" means:',opts:["come here","stop nagging","eat more","sit down"],ans:1},
{q:'"唔識" vs "唔知": 唔識 is more:',opts:["don't know a fact","don't know how / a person","the same always","please"],ans:1},
{q:'"唔使" means:',opts:["must","no need","cannot","not yet"],ans:1},
{q:'"冇所謂" means:',opts:["very important","doesn't matter","no money","no people"],ans:1},
{q:'"唔該" is actually:',opts:["a negative","please / thanks (not 'not')","don't","not yet"],ans:1}
]},

dialogue:[
{speaker:"A",c:"你點解遲到？",j:"nei5 dim2 gaai2 ci4 dou3?",e:"Why are you late?"},
{speaker:"B",c:"因為塞車，所以遲咗。不過我已經盡力。",j:"jan1 wai6 sak1 ce1, so2 ji5 ci4 zo2. bat1 gwo3 ngo5 ji5 ging1 zeon6 lik6.",e:"Because of traffic, so I was late. But I already tried."},
{speaker:"A",c:"雖然你盡力，但係我哋等咗半個鐘。",j:"seoi1 jin4 nei5 zeon6 lik6, daan6 hai6 ngo5 dei6 dang2 zo2 bun3 go3 zung1.",e:"Although you tried, we waited half an hour."},
{speaker:"B",c:"如果早知，我就搭地鐵。",j:"jyu4 gwo2 zou2 zi1, ngo5 zau6 daap3 dei6 tit3.",e:"If I'd known earlier, I'd have taken the MTR."},
{speaker:"A",c:"無論搭咩，都要預多啲時間。否則又遲到。",j:"mou4 leon6 daap3 me1, dou1 jiu3 jyu6 do1 di1 si4 gaan3. fau2 zak1 jau6 ci4 dou3.",e:"No matter what you take, leave extra time. Otherwise you'll be late again."},
{speaker:"B",c:"得。之後我早出。另外，今晚我請食飯。",j:"dak1. zi1 hau6 ngo5 zou2 ceot1. ling6 ngoi6, gam1 maan5 ngo5 ceng2 sik6 faan6.",e:"OK. After this I'll leave earlier. Also, dinner's on me tonight."},
{speaker:"A",c:"唔使。就算你請，我都未必得閒。",j:"m4 sai2. zau6 syun3 nei5 ceng2, ngo5 dou1 mei6 bit1 dak1 haan4.",e:"No need. Even if you treat, I might not be free."},
{speaker:"B",c:"咁就改聽日。定係後日？",j:"gam2 zau6 goi2 ting1 jat6. ding6 hai6 hau6 jat6?",e:"Then move it to tomorrow. Or the day after?"},
{speaker:"A",c:"聽日得。之前嗰次我反而遲到。",j:"ting1 jat6 dak1. zi1 cin4 go2 ci3 ngo5 faan2 ji4 ci4 dou3.",e:"Tomorrow works. Last time I was the one who was late, actually."},
{speaker:"B",c:"係囉。所以大家互相體諒。",j:"hai6 lo1. so2 ji5 daai6 gaa1 wu6 soeng1 tai2 loeng6.",e:"Right. So we cut each other some slack."}
],
grammar:[
{pattern:"因為…所以…",desc:"Because… therefore… You can use either half alone, but together is textbook-clear.",ex:"因為塞車，所以遲咗。(jan1 wai6 sak1 ce1, so2 ji5 ci4 zo2)",en:"Because of traffic, so I was late."},
{pattern:"雖然…但係…",desc:"Although… yet… Don't drop 但係 like English sometimes drops 'but'.",ex:"雖然你盡力，但係我哋等咗半個鐘。(seoi1 jin4 nei5 zeon6 lik6, daan6 hai6 ngo5 dei6 dang2 zo2 bun3 go3 zung1)",en:"Although you tried, we waited half an hour."},
{pattern:"如果…就… / 否則",desc:"If… then… Otherwise…",ex:"如果早知，我就搭地鐵。否則又遲到。(jyu4 gwo2 zou2 zi1, ngo5 zau6 daap3 dei6 tit3. fau2 zak1 jau6 ci4 dou3)",en:"If I'd known, I'd have taken the MTR. Otherwise late again."},
{pattern:"就算…都…",desc:"Even if… still…",ex:"就算你請，我都未必得閒。(zau6 syun3 nei5 ceng2, ngo5 dou1 mei6 bit1 dak1 haan4)",en:"Even if you treat, I might still not be free."},
{pattern:"無論…都…",desc:"No matter… still…",ex:"無論搭咩，都要預多啲時間。(mou4 leon6 daap3 me1, dou1 jiu3 jyu6 do1 di1 si4 gaan3)",en:"No matter what you take, leave extra time."}
],

{speaker:"B",c:"枱上面冇。你睇下袋入面。",j:"toi2 soeng6 min6 mou5. nei5 tai2 haa5 doi2 jap6 min6.",e:"Not on the table. Check inside the bag."},
{speaker:"A",c:"袋入面冇。會唔會喺沙發下面？",j:"doi2 jap6 min6 mou5. wui5 m4 wui5 hai2 saa1 faa3 haa6 min6?",e:"Not in the bag. Could they be under the sofa?"},
{speaker:"B",c:"我幫你睇。出面門口隔離都睇過？",j:"ngo5 bong1 nei5 tai2. ceot1 min6 mun4 hau2 gaak3 lei4 dou1 tai2 gwo3?",e:"I'll look. Did you check outside, next to the door too?"},
{speaker:"A",c:"未。我頭先喺對面舖坐。",j:"mei6. ngo5 tau4 sin1 hai2 deoi3 min6 pou3 co5.",e:"Not yet. I was sitting in the shop opposite earlier."},
{speaker:"B",c:"咁去問。從呢度行過去好近。",j:"gam2 heoi3 man6. cung4 ni1 dou6 haang4 gwo3 heoi3 hou2 kan5.",e:"Then go ask. From here it's very close to walk over."},
{speaker:"A",c:"鎖匙喺舖中間張檯度！",j:"so2 si4 hai2 pou3 zung1 gaan1 zoeng1 toi2 dou6!",e:"The keys are on the table in the middle of the shop!"},
{speaker:"B",c:"得，去攞。之後放返屋企入面固定個位。",j:"dak1, heoi3 lo2. zi1 hau6 fong3 faan1 uk1 kei2 jap6 min6 gu3 ding6 go3 wai2.",e:"OK, go get them. After, put them back in a fixed spot inside the house."},
{speaker:"A",c:"右邊櫃上面得唔得？",j:"jau6 bin6 gwai6 soeng6 min6 dak1 m4 dak1?",e:"On top of the cabinet on the right OK?"},
{speaker:"B",c:"得。唔好再擺下面，睇唔到。",j:"dak1. m4 hou2 zoi3 baai2 haa6 min6, tai2 m4 dou2.",e:"Yes. Don't put them underneath again — you can't see them."}
],
grammar:[
{pattern:"喺 + place + 度",desc:"At / in that place. 喺度 = here (at-this-place). 喺舖中間張檯度.",ex:"你有冇喺度見到？鎖匙喺舖中間張檯度。(nei5 jau5 mou5 hai2 dou6 gin3 dou2? so2 si4 hai2 pou3 zung1 gaan1 zoeng1 toi2 dou6)",en:"Have you seen them here? The keys are on the middle table of the shop."},
{pattern:"上面 / 下面 / 入面 / 出面",desc:"The four you need every day. Noun + 上面 = on the noun.",ex:"枱上面冇。袋入面冇。沙發下面？(toi2 soeng6 min6 mou5. doi2 jap6 min6 mou5. saa1 faa3 haa6 min6?)",en:"Not on the table. Not in the bag. Under the sofa?"},
{pattern:"隔離 / 對面",desc:"Next to vs opposite. Both in L9; now with 出面門口隔離.",ex:"出面門口隔離都睇過？(ceot1 min6 mun4 hau2 gaak3 lei4 dou1 tai2 gwo3?)",en:"Did you also check outside next to the door?"},
{pattern:"從 / 由 … 去",desc:"From … to. Spoken often 由. 從呢度行過去.",ex:"從呢度行過去好近。(cung4 ni1 dou6 haang4 gwo3 heoi3 hou2 kan5)",en:"From here, walking over is very close."},
{pattern:"左邊 / 右邊 + noun + 上面",desc:"Stack location. 右邊櫃上面.",ex:"右邊櫃上面得唔得？(jau6 bin6 gwai6 soeng6 min6 dak1 m4 dak1?)",en:"On top of the right-hand cabinet OK?"}
],

{q:'"隔離" means:',opts:["far away","next to","above","nowhere"],ans:1},
{q:'"呢度" means:',opts:["there","where","here","inside"],ans:2},
{q:'"下面" means:',opts:["on top","underneath / below","outside","left"],ans:1},

]},

{id:135,title:"L35 報數",subtitle:"Phone numbers and counting · 幾號 零 百千萬",

{c:"最後",j:"zeoi3 hau6",e:"last"},
{c:"雙",j:"soeng1",e:"pair; even (雙數)"},
{c:"單",j:"daan1",e:"odd (單數); a bill"},
{c:"幾個",j:"gei2 go3",e:"how many (items)"},
{c:"幾多歲",j:"gei2 do1 seoi3",e:"how old"},

{c:"月",j:"jyut6",e:"month"},
{c:"日",j:"jat6",e:"day"},
{c:"號",j:"hou6",e:"number; date (五號)"},
{c:"讀",j:"duk6",e:"to read (aloud)"},
{c:"再講",j:"zoi3 gong2",e:"say again"},

dialogue:[
{speaker:"A",c:"你電話號碼幾號啊？",j:"nei5 din6 waa2 hou6 maa5 gei2 hou6 aa3?",e:"What's your phone number?"},
{speaker:"B",c:"六零四九 二二五 八八七。",j:"luk6 ling4 sei3 gau2 ji6 ji6 ng5 baat3 baat3 cat1.",e:"6049 225 887."},
{speaker:"A",c:"慢啲。零係咪 O 咁讀？",j:"maan6 di1. ling4 hai6 mai6 ou1 gam2 duk6?",e:"Slower. Is zero read like O?"},
{speaker:"B",c:"香港讀零。再講：六零四九。",j:"hoeng1 gong2 duk6 ling4. zoi3 gong2: luk6 ling4 sei3 gau2.",e:"In HK we say ling4. Again: 6049."},
{speaker:"A",c:"你幾多歲？第幾年嚟香港？",j:"nei5 gei2 do1 seoi3? dai6 gei2 nin4 lai4 hoeng1 gong2?",e:"How old are you? Which year in HK is this for you?"},
{speaker:"B",c:"二十九。今年係第三年。",j:"ji6 sap6 gau2. gam1 nin4 hai6 dai6 saam1 nin4.",e:"Twenty-nine. This is the third year."},
{speaker:"A",c:"生日幾號？",j:"saang1 jat6 gei2 hou6?",e:"What date is your birthday?"},
{speaker:"B",c:"十二月五號。雙數月，單數日。",j:"sap6 ji6 jyut6 ng5 hou6. soeng1 sou3 jyut6, daan1 sou3 jat6.",e:"5 December. Even month, odd day."},
{speaker:"A",c:"一萬蚊租金貴唔貴？",j:"jat1 maan6 man1 zou1 gam1 gwai3 m4 gwai3?",e:"Is ten thousand dollars rent expensive?"},
{speaker:"B",c:"香港嚟講差唔多。最後你自己決定。",j:"hoeng1 gong2 lai4 gong2 caa1 m4 do1. zeoi3 hau6 nei5 zi6 gei2 kyut3 ding6.",e:"For Hong Kong, about average. In the end you decide."}
],
grammar:[
{pattern:"Phone numbers digit by digit",desc:"Read 0 as 零 ling4 (not Mandarin 洞). Group as you like. Repeat with 再講.",ex:"六零四九 二二五 八八七。(luk6 ling4 sei3 gau2 ji6 ji6 ng5 baat3 baat3 cat1)",en:"6049 225 887."},
{pattern:"第 + number",desc:"Ordinal. 第一, 第三年, 第幾.",ex:"今年係第三年。第幾年嚟香港？(gam1 nin4 hai6 dai6 saam1 nin4. dai6 gei2 nin4 lai4 hoeng1 gong2?)",en:"This is the third year. Which year in HK?"},
{pattern:"X月Y號",desc:"Dates. 十二月五號 = 5 Dec. 號 not 日 in speech for the calendar day.",ex:"生日幾號？十二月五號。(saang1 jat6 gei2 hou6? sap6 ji6 jyut6 ng5 hou6)",en:"What date is your birthday? 5 December."},
{pattern:"萬 (maan6)",desc:"10,000. HK rent and salaries live here. 一萬蚊, 兩萬.",ex:"一萬蚊租金貴唔貴？(jat1 maan6 man1 zou1 gam1 gwai3 m4 gwai3?)",en:"Is $10,000 rent expensive?"},
{pattern:"雙 / 單",desc:"Even / odd. Also 一雙鞋 a pair of shoes.",ex:"雙數月，單數日。(soeng1 sou3 jyut6, daan1 sou3 jat6)",en:"Even month, odd day."}
],
quiz:[
{q:'Zero in a HK phone number is read:',opts:["dong4","ling4","zero only","O mandatory"],ans:1},
{q:'"第" makes a number:',opts:["negative","ordinal (first, third…)","a price","a verb"],ans:1},
{q:'"萬" is:',opts:["100","1,000","10,000","1,000,000"],ans:2},
{q:'"幾號" can ask:',opts:["only the time","a number or a calendar date","only age","only price"],ans:1},
{q:'"十二月五號" is:',opts:["12 May","5 December","2 December","15 December"],ans:1},
{q:'"再講" means:',opts:["don't speak","say it again","speak faster","hang up"],ans:1},
{q:'"雙數" means:',opts:["odd number","even number","phone number","zero"],ans:1},
{q:'"第三年" means:',opts:["three years ago","the third year","year 13","never"],ans:1}
]}

{id:136,title:"L36 動詞",subtitle:"Core verbs · 畀拎放擺攞搵用開關",
vocab:[
{c:"畀",j:"bei2",e:"to give; to let; for"},
{c:"拎",j:"ling1",e:"to take / carry (in hand)"},
{c:"放",j:"fong3",e:"to put down"},
{c:"擺",j:"baai2",e:"to place / set out"},
{c:"攞",j:"lo2",e:"to take / get / pick up"},
{c:"搵",j:"wan2",e:"to look for / find"},
{c:"用",j:"jung6",e:"to use"},
{c:"開",j:"hoi1",e:"to open; to turn on"},
{c:"關",j:"gwaan1",e:"to close; to turn off"},
{c:"幫",j:"bong1",e:"to help"},
{c:"等",j:"dang2",e:"to wait"},
{c:"叫",j:"giu3",e:"to call; to order; to be named"},
{c:"問",j:"man6",e:"to ask"},
{c:"答",j:"daap3",e:"to answer"},
{c:"帶",j:"daai3",e:"to bring / take (along)"},
{c:"送",j:"sung3",e:"to send; to give a gift; to see off"},
{c:"借",j:"ze3",e:"to borrow / lend"},
{c:"還",j:"waan4",e:"to return (something)"},
{c:"記得",j:"gei3 dak1",e:"to remember"},
{c:"唔記得",j:"m4 gei3 dak1",e:"to forget"}
],
dialogue:[
{speaker:"A",c:"可唔可以畀支筆我？",j:"ho2 m4 ho2 ji5 bei2 zi1 bat1 ngo5?",e:"Can you give me a pen?"},
{speaker:"B",c:"枱上面有。你自己攞。",j:"toi2 soeng6 min6 jau5. nei5 zi6 gei2 lo2.",e:"There's one on the table. Grab it yourself."},
{speaker:"A",c:"搵唔到。你擺咗邊啊？",j:"wan2 m4 dou2. nei5 baai2 zo2 bin1 aa3?",e:"Can't find it. Where did you put it?"},
{speaker:"B",c:"我拎咗入房。等我幫你攞。",j:"ngo5 ling1 zo2 jap6 fong2. dang2 ngo5 bong1 nei5 lo2.",e:"I carried it into the room. Wait, I'll get it for you."},
{speaker:"A",c:"唔該。用完我會放返原位。",j:"m4 goi1. jung6 jyun4 ngo5 wui5 fong3 faan1 jyun4 wai2.",e:"Thanks. I'll put it back when I'm done."},
{speaker:"B",c:"記得關燈。走之前開咗窗就關返。",j:"gei3 dak1 gwaan1 dang1. zau2 zi1 cin4 hoi1 zo2 coeng1 zau6 gwaan1 faan1.",e:"Remember to turn off the light. If you opened the window before leaving, close it."},
{speaker:"A",c:"得。呢本書可唔可以借？",j:"dak1. ni1 bun2 syu1 ho2 m4 ho2 ji5 ze3?",e:"OK. Can I borrow this book?"},
{speaker:"B",c:"得。聽日還。我要送俾人。",j:"dak1. ting1 jat6 waan4. ngo5 jiu3 sung3 bei2 jan4.",e:"Yes. Return it tomorrow. I need to give it to someone."},
{speaker:"A",c:"你帶埋鎖匙未？我唔記得攞。",j:"nei5 daai3 maai4 so2 si4 mei6? ngo5 m4 gei3 dak1 lo2.",e:"Did you bring the keys too? I forgot to pick them up."},
{speaker:"B",c:"帶咗。走啦。",j:"daai3 zo2. zau2 laa1.",e:"Got them. Let's go."}
],
grammar:[
{pattern:"畀 (bei2)",desc:"Give / let / for. 畀支筆我 = give me a pen. 送俾人 = give to someone. Same word as 俾.",ex:"可唔可以畀支筆我？送俾人。(ho2 m4 ho2 ji5 bei2 zi1 bat1 ngo5? sung3 bei2 jan4)",en:"Can you give me a pen? Give it to someone."},
{pattern:"拎 vs 攞 vs 帶",desc:"拎 = carry in hand. 攞 = pick up / go get. 帶 = bring along with you.",ex:"我拎咗入房。你自己攞。你帶埋鎖匙未？(ngo5 ling1 zo2 jap6 fong2. nei5 zi6 gei2 lo2. nei5 daai3 maai4 so2 si4 mei6?)",en:"I carried it into the room. Grab it yourself. Did you bring the keys?"},
{pattern:"放 vs 擺",desc:"放 = put down / put back. 擺 = place, set (often with more care / arrangement).",ex:"用完放返原位。你擺咗邊啊？(jung6 jyun4 fong3 faan1 jyun4 wai2. nei5 baai2 zo2 bin1 aa3?)",en:"Put it back when done. Where did you place it?"},
{pattern:"開 / 關",desc:"Open or turn on / close or turn off. 開燈關燈, 開窗關窗.",ex:"記得關燈。開咗窗就關返。(gei3 dak1 gwaan1 dang1. hoi1 zo2 coeng1 zau6 gwaan1 faan1)",en:"Remember to turn off the light. If you opened the window, close it."},
{pattern:"Verb + 唔 + 到",desc:"Can't succeed. 搵唔到, 聽唔到, 睇唔到.",ex:"搵唔到。(wan2 m4 dou2)",en:"Can't find it."}
],
quiz:[
{q:'"畀" means:',opts:["to give / let","to steal","to close","to wait"],ans:0},
{q:'"拎" means:',opts:["put down","carry in hand","forget","open"],ans:1},
{q:'"攞" means:',opts:["throw away","pick up / get","sleep","sell"],ans:1},
{q:'"搵唔到" means:',opts:["found it","can't find it","don't look","lost forever always"],ans:1},
{q:'"關燈" means:',opts:["turn on the light","turn off the light","buy a lamp","open the window"],ans:1},
{q:'"借" means:',opts:["buy","borrow / lend","sell","throw"],ans:1},
{q:'"還" (waan4) means:',opts:["still","return (something)","play","run"],ans:1},
{q:'"帶" means:',opts:["put down","bring along","close","forget"],ans:1}
]},

{id:137,title:"L37 拍拖",subtitle:"Dating · 鍾意、分手、見家長",

dialogue:[
{speaker:"A",c:"你哋拍拖幾耐啊？",j:"nei5 dei6 paak3 to1 gei2 noi6 aa3?",e:"How long have you two been dating?"},
{speaker:"B",c:"一年。我認真，唔係玩。",j:"jat1 nin4. ngo5 jing6 zan1, m4 hai6 waan2.",e:"A year. I'm serious — not playing around."},
{speaker:"A",c:"見家長未啊？",j:"gin3 gaa1 zoeng2 mei6 aa3?",e:"Met the parents yet?"},
{speaker:"B",c:"未。我有啲尷尬，怕佢屋企人唔鍾意我。",j:"mei6. ngo5 jau5 di1 gaam3 gaai3, paa3 keoi5 uk1 kei2 jan4 m4 zung1 ji3 ngo5.",e:"Not yet. I'm a bit awkward — afraid their family won't like me."},
{speaker:"A",c:"情人節送花得唔得？",j:"cing4 jan4 zit3 sung3 faa1 dak1 m4 dak1?",e:"Flowers on Valentine's OK?"},
{speaker:"B",c:"得。不過佢話唔好太閃。",j:"dak1. bat1 gwo3 keoi5 waa6 m4 hou2 taai3 sim2.",e:"Yes. But they said don't be too extra / PDA."},
{speaker:"A",c:"你有冇想過將來？",j:"nei5 jau5 mou5 soeng2 gwo3 zoeng1 loi4?",e:"Have you thought about the future?"},
{speaker:"B",c:"有。想一齊住。唔想分手。",j:"jau5. soeng2 jat1 cai4 zyu6. m4 soeng2 fan1 sau2.",e:"Yes. Want to live together. Don't want to break up."},
{speaker:"A",c:"如果當初被拒絕呢？",j:"jyu4 gwo2 dong1 co1 bei6 keoi5 zyut6 ne1?",e:"What if you'd been rejected at the start?"},
{speaker:"B",c:"都會關心佢。鍾意就表白，冇後悔。",j:"dou1 wui5 gwaan1 sam1 keoi5. zung1 ji3 zau6 biu2 baak6, mou5 hau6 fui3.",e:"I'd still care. If you like someone, confess — no regrets."}
],
grammar:[
{pattern:"拍拖 (paak3 to1)",desc:"Be a couple / go out. The default HK verb. Not 談戀愛 in speech.",ex:"你哋拍拖幾耐啊？(nei5 dei6 paak3 to1 gei2 noi6 aa3?)",en:"How long have you been dating?"},
{pattern:"認真 vs 玩",desc:"Serious vs casual. 我認真，唔係玩.",ex:"我認真，唔係玩。(ngo5 jing6 zan1, m4 hai6 waan2)",en:"I'm serious, not playing."},
{pattern:"見家長",desc:"Meet the parents — a relationship milestone in HK.",ex:"見家長未啊？未。我有啲尷尬。(gin3 gaa1 zoeng2 mei6 aa3? mei6. ngo5 jau5 di1 gaam3 gaai3)",en:"Met the parents yet? Not yet. I'm a bit awkward."},
{pattern:"閃 (sim2)",desc:"PDA / showing off couple-ness. 唔好太閃.",ex:"佢話唔好太閃。(keoi5 waa6 m4 hou2 taai3 sim2)",en:"They said don't be too extra."},
{pattern:"鍾意就表白",desc:"If you like them, say so. 就 = then.",ex:"鍾意就表白，冇後悔。(zung1 ji3 zau6 biu2 baak6, mou5 hau6 fui3)",en:"If you like them, confess — no regrets."}
],

dialogue:[
{speaker:"A",c:"唔好意思，我要投訴。呢碟餸冷咗，而且好生。",j:"m4 hou2 ji3 si1, ngo5 jiu3 tau4 sou3. ni1 dip6 sung3 laang5 zo2, ji4 ce2 hou2 saang1.",e:"Sorry, I need to complain. This dish is cold, and undercooked."},
{speaker:"B",c:"對唔住。我叫廚房換碟。",j:"deoi3 m4 zyu6. ngo5 giu3 cyu4 fong2 wun6 dip6.",e:"Sorry. I'll have the kitchen replace the plate."},
{speaker:"A",c:"我等咗好耐。可唔可以叫經理出嚟？",j:"ngo5 dang2 zo2 hou2 noi6. ho2 m4 ho2 ji5 giu3 ging1 lei5 ceot1 lai4?",e:"I've waited a long time. Can you get the manager?"},
{speaker:"B",c:"得。經理而家過嚟。我哋會處理。",j:"dak1. ging1 lei5 ji4 gaa1 gwo3 lai4. ngo5 dei6 wui5 cyu5 lei5.",e:"Yes. The manager is coming. We'll handle it."},
{speaker:"A",c:"服務員態度都唔好。我唔滿意。",j:"fuk6 mou6 jyun4 taai3 dou6 dou1 m4 hou2. ngo5 m4 mun5 ji3.",e:"The staff attitude wasn't good either. I'm not satisfied."},
{speaker:"B",c:"真係對唔住。我道歉。今次唔收錢得唔得？",j:"zan1 hai6 deoi3 m4 zyu6. ngo5 dou6 hip3. gam1 ci3 m4 sau1 cin2 dak1 m4 dak1?",e:"Really sorry. I apologise. This one's on the house?"},
{speaker:"A",c:"退錢定換都得。我要求品質好啲。",j:"teoi3 cin2 ding6 wun6 dou1 dak1. ngo5 jiu1 kau4 ban2 zat1 hou2 di1.",e:"Refund or exchange is fine. I want better quality."},
{speaker:"B",c:"下次一定改善。可唔可以解釋多句？",j:"haa6 ci3 jat1 ding6 goi2 sin6. ho2 m4 ho2 ji5 gaai2 sik1 do1 geoi3?",e:"Next time we'll improve. May I explain a bit more?"},
{speaker:"A",c:"唔使解釋。換碟就得。",j:"m4 sai2 gaai2 sik1. wun6 dip6 zau6 dak1.",e:"No need to explain. Replacing the dish is enough."},
{speaker:"B",c:"好，而家去。唔該你體諒。",j:"hou2, ji4 gaa1 heoi3. m4 goi1 nei5 tai2 loeng6.",e:"OK, going now. Thanks for your understanding."}
],
grammar:[
{pattern:"我要投訴",desc:"I want to complain. Direct and normal in HK service contexts.",ex:"唔好意思，我要投訴。(m4 hou2 ji3 si1, ngo5 jiu3 tau4 sou3)",en:"Sorry, I need to complain."},
{pattern:"而且 (ji4 ce2)",desc:"And also / moreover. Stacks complaints.",ex:"呢碟餸冷咗，而且好生。(ni1 dip6 sung3 laang5 zo2, ji4 ce2 hou2 saang1)",en:"This dish is cold, and also undercooked."},
{pattern:"今次唔收錢",desc:"This time we won't charge. Service recovery.",ex:"今次唔收錢得唔得？(gam1 ci3 m4 sau1 cin2 dak1 m4 dak1?)",en:"This one's free, OK?"},
{pattern:"定…都得",desc:"Either… is fine. 退錢定換都得.",ex:"退錢定換都得。(teoi3 cin2 ding6 wun6 dou1 dak1)",en:"Refund or exchange, either is fine."},
{pattern:"下次一定…",desc:"Next time we definitely… The recovery promise.",ex:"下次一定改善。(haa6 ci3 jat1 ding6 goi2 sin6)",en:"Next time we'll definitely improve."}
],
quiz:[
{q:'"投訴" means:',opts:["to praise","to complain","to order","to pay"],ans:1},
{q:'"唔滿意" means:',opts:["full","not satisfied","hungry","late"],ans:1},
{q:'"經理" means:',opts:["chef","manager","customer","driver"],ans:1},
{q:'"壞咗" means:',opts:["new","broken","cheap","hot"],ans:1},
{q:'"道歉" means:',opts:["to complain","to apologise","to refund","to shout"],ans:1},
{q:'"而且" means:',opts:["because","and also / moreover","or","never"],ans:1},
{q:"A's food was:",opts:["perfect","cold and undercooked","too spicy only","missing"],ans:1},
{q:'"處理" means:',opts:["ignore","handle / deal with","eat","leave"],ans:1}
]},

{id:139,title:"L39 搬家",subtitle:"Moving · 紙箱、電梯、按金、鄰居",
vocab:[
{c:"搬家",j:"bun1 gaa1",e:"to move house"},
{c:"紙箱",j:"zi2 soeng1",e:"cardboard box"},
{c:"行李",j:"hang4 lei5",e:"luggage / belongings"},
{c:"電梯",j:"din6 tai1",e:"lift / elevator"},
{c:"樓梯",j:"lau4 tai1",e:"stairs"},
{c:"按金",j:"on3 gam1",e:"deposit"},
{c:"房東",j:"fong4 dung1",e:"landlord"},
{c:"鄰居",j:"leon4 geoi1",e:"neighbour"},
{c:"鎖匙",j:"so2 si4",e:"keys"},
{c:"合約",j:"hap6 joek3",e:"contract"},
{c:"搬入",j:"bun1 jap6",e:"move in"},
{c:"搬出",j:"bun1 ceot1",e:"move out"},
{c:"裝修",j:"zong1 sau1",e:"renovation / fitting out"},
{c:"傢俬",j:"gaa1 si1",e:"furniture"},
{c:"垃圾",j:"laap6 saap3",e:"rubbish"},
{c:"幫手",j:"bong1 sau2",e:"to help out"},
{c:"重",j:"cung5",e:"heavy"},
{c:"小心",j:"siu2 sam1",e:"careful"},
{c:"到齊",j:"dou3 cai4",e:"all arrived"},
{c:"新屋",j:"san1 uk1",e:"the new place"}
],
dialogue:[
{speaker:"A",c:"聽日搬家，你可唔可以幫手？",j:"ting1 jat6 bun1 gaa1, nei5 ho2 m4 ho2 ji5 bong1 sau2?",e:"Moving tomorrow — can you help?"},
{speaker:"B",c:"得。幾點到齊？有冇電梯？",j:"dak1. gei2 dim2 dou3 cai4? jau5 mou5 din6 tai1?",e:"Yes. What time is everyone there? Is there a lift?"},
{speaker:"A",c:"朝早十點。有電梯，不過紙箱好重。",j:"ziu1 zou2 sap6 dim2. jau5 din6 tai1, bat1 gwo3 zi2 soeng1 hou2 cung5.",e:"Ten in the morning. There's a lift, but the boxes are heavy."},
{speaker:"B",c:"按金退咗未？合約簽咗未？",j:"on3 gam1 teoi3 zo2 mei6? hap6 joek3 cim1 zo2 mei6?",e:"Deposit back yet? Contract signed?"},
{speaker:"A",c:"新屋簽咗。舊屋按金房東話下個禮拜退。",j:"san1 uk1 cim1 zo2. gau6 uk1 on3 gam1 fong4 dung1 waa6 haa6 go3 lai5 baai3 teoi3.",e:"New place signed. Old landlord says the deposit comes back next week."},
{speaker:"B",c:"鄰居知唔知你搬？垃圾要分類。",j:"leon4 geoi1 zi1 m4 zi1 nei5 bun1? laap6 saap3 jiu3 fan1 leoi6.",e:"Do the neighbours know you're moving? Rubbish has to be sorted."},
{speaker:"A",c:"知。傢俬太大，樓梯搬唔到就拆。",j:"zi1. gaa1 si1 taai3 daai6, lau4 tai1 bun1 m4 dou2 zau6 caak3.",e:"Yes. If the furniture is too big for the stairs we'll dismantle it."},
{speaker:"B",c:"鎖匙交咗未？小心唔好搞錯。",j:"so2 si4 gaau1 zo2 mei6? siu2 sam1 m4 hou2 gaau2 co3.",e:"Keys handed over? Careful not to mix them up."},
{speaker:"A",c:"搬入先至交舊鎖匙。你幫我拎紙箱。",j:"bun1 jap6 sin1 zi3 gaau1 gau6 so2 si4. nei5 bong1 ngo5 ling1 zi2 soeng1.",e:"Hand over the old keys only after moving in. Help me carry boxes."},
{speaker:"B",c:"得。搬完請食飯啊。",j:"dak1. bun1 jyun4 ceng2 sik6 faan6 aa3.",e:"OK. After the move, you treat dinner."}
],
grammar:[
{pattern:"搬家 / 搬入 / 搬出",desc:"Move house / move in / move out.",ex:"聽日搬家。搬入先至交舊鎖匙。(ting1 jat6 bun1 gaa1. bun1 jap6 sin1 zi3 gaau1 gau6 so2 si4)",en:"Moving tomorrow. Hand over old keys only after moving in."},
{pattern:"Verb + 唔 + 到",desc:"Can't manage to. 樓梯搬唔到.",ex:"傢俬太大，樓梯搬唔到就拆。(gaa1 si1 taai3 daai6, lau4 tai1 bun1 m4 dou2 zau6 caak3)",en:"Furniture too big — if we can't move it via the stairs, dismantle it."},
{pattern:"退按金",desc:"Get the deposit back. 按金退咗未？",ex:"按金退咗未？房東話下個禮拜退。(on3 gam1 teoi3 zo2 mei6? fong4 dung1 waa6 haa6 go3 lai5 baai3 teoi3)",en:"Deposit back yet? Landlord says next week."},
{pattern:"到齊 (dou3 cai4)",desc:"Everyone has arrived. 齊 = complete/together.",ex:"幾點到齊？(gei2 dim2 dou3 cai4?)",en:"What time is everyone there?"},
{pattern:"搬完請食飯",desc:"After finishing X, treat a meal. Classic HK thanks.",ex:"搬完請食飯啊。(bun1 jyun4 ceng2 sik6 faan6 aa3)",en:"After the move you treat dinner."}
],
quiz:[
{q:'"搬家" means:',opts:["buy furniture","move house","renovate only","pay rent"],ans:1},
{q:'"按金" means:',opts:["salary","deposit","keys","lift"],ans:1},
{q:'"電梯" means:',opts:["stairs","lift / elevator","truck","door"],ans:1},
{q:'"鄰居" means:',opts:["landlord","neighbour","mover","lawyer"],ans:1},
{q:'"傢俬" means:',opts:["rubbish","furniture","boxes","contract"],ans:1},
{q:'"紙箱" means:',opts:["suitcase","cardboard box","envelope","bag"],ans:1},
{q:'"搬入" means:',opts:["move out","move in","visit","demolish"],ans:1},
{q:'"重" (cung5) means:',opts:["again","heavy","empty","new"],ans:1}
]},

{id:140,title:"L40 開口日",subtitle:"Review day · mix L1–L39 in one conversation",
vocab:[
{c:"複習",j:"fuk1 zaap6",e:"to review"},
{c:"進步",j:"zeon3 bou6",e:"progress"},
{c:"流利",j:"lau4 lei6",e:"fluent"},
{c:"口音",j:"hau2 jam1",e:"accent"},
{c:"文法",j:"man4 faat3",e:"grammar"},
{c:"生字",j:"saang1 zi6",e:"new words"},
{c:"練習",j:"lin6 zaap6",e:"practice"},
{c:"聽",j:"ting1",e:"to listen"},
{c:"講",j:"gong2",e:"to speak"},
{c:"讀",j:"duk6",e:"to read"},
{c:"寫",j:"se2",e:"to write"},
{c:"記住",j:"gei3 zyu6",e:"to keep in mind"},
{c:"用得",j:"jung6 dak1",e:"usable / can use"},
{c:"敢講",j:"gam2 gong2",e:"dare to speak"},
{c:"錯",j:"co3",e:"wrong"},
{c:"唔緊要",j:"m4 gan2 jiu3",e:"never mind"},
{c:"繼續",j:"gai3 zuk6",e:"to continue"},
{c:"每日",j:"mui5 jat6",e:"every day"},
{c:"已經",j:"ji5 ging1",e:"already"},
{c:"仲要",j:"zung6 jiu3",e:"still need to"}
],
dialogue:[
{speaker:"A",c:"你粵語學咗幾耐啊？有冇進步？",j:"nei5 jyut6 jyu5 hok6 zo2 gei2 noi6 aa3? jau5 mou5 zeon3 bou6?",e:"How long have you been learning Cantonese? Any progress?"},
{speaker:"B",c:"幾個月。識講日常，不過未夠流利。",j:"gei2 go3 jyut6. sik1 gong2 jat6 soeng4, bat1 gwo3 mei6 gau3 lau4 lei6.",e:"A few months. I can do daily stuff, but not fluent enough yet."},
{speaker:"A",c:"口音唔緊要。敢講就得。錯咗我哋明。",j:"hau2 jam1 m4 gan2 jiu3. gam2 gong2 zau6 dak1. co3 zo2 ngo5 dei6 ming4.",e:"Accent doesn't matter. Dare to speak and that's enough. If you're wrong, we still get it."},
{speaker:"B",c:"我最怕文法。生字又多。",j:"ngo5 zeoi3 paa3 man4 faat3. saang1 zi6 jau6 do1.",e:"Grammar scares me most. And so many new words."},
{speaker:"A",c:"每日聽同講。複習舊課，然後用得先至記得。",j:"mui5 jat6 ting1 tung4 gong2. fuk1 zaap6 gau6 fo3, jin4 hau6 jung6 dak1 sin1 zi3 gei3 dak1.",e:"Listen and speak every day. Review old lessons, then you remember only once you can use it."},
{speaker:"B",c:"即係開口講，唔好淨係讀？",j:"zik1 hai6 hoi1 hau2 gong2, m4 hou2 zing6 hai6 duk6?",e:"So open my mouth — don't just read?"},
{speaker:"A",c:"係囉。讀寫都要，不過講先。",j:"hai6 lo1. duk6 se2 dou1 jiu3, bat1 gwo3 gong2 sin1.",e:"Exactly. Reading and writing too, but speaking first."},
{speaker:"B",c:"今日我已經複習咗聲調同助詞。仲要練數字。",j:"gam1 jat6 ngo5 ji5 ging1 fuk1 zaap6 zo2 sing1 diu6 tung4 zo6 ci4. zung6 jiu3 lin6 sou3 zi6.",e:"Today I already reviewed tones and particles. Still need to drill numbers."},
{speaker:"A",c:"搞掂。記住：唔該、對唔住、可唔可以講慢啲。",j:"gaau2 dim6. gei3 zyu6: m4 goi1, deoi3 m4 zyu6, ho2 m4 ho2 ji5 gong2 maan6 di1.",e:"Sorted. Remember: please, sorry, can you speak slower."},
{speaker:"B",c:"得。繼續練習。多謝你教我。",j:"dak1. gai3 zuk6 lin6 zaap6. do1 ze6 nei5 gaau3 ngo5.",e:"OK. Keep practising. Thanks for teaching me."}
],
grammar:[
{pattern:"有冇進步？",desc:"Any progress? 有冇 + noun/verb.",ex:"你粵語學咗幾耐啊？有冇進步？(nei5 jyut6 jyu5 hok6 zo2 gei2 noi6 aa3? jau5 mou5 zeon3 bou6?)",en:"How long have you learned Cantonese? Any progress?"},
{pattern:"未夠 + adj",desc:"Not [adj] enough. 未夠流利, 未夠膽.",ex:"識講日常，不過未夠流利。(sik1 gong2 jat6 soeng4, bat1 gwo3 mei6 gau3 lau4 lei6)",en:"Can do daily speech, but not fluent enough."},
{pattern:"敢講 (gam2 gong2)",desc:"Dare to speak. The whole course in two syllables.",ex:"口音唔緊要。敢講就得。(hau2 jam1 m4 gan2 jiu3. gam2 gong2 zau6 dak1)",en:"Accent doesn't matter. Dare to speak and that's enough."},
{pattern:"用得先至記得",desc:"Only once you can use it do you remember. 先至 again.",ex:"用得先至記得。(jung6 dak1 sin1 zi3 gei3 dak1)",en:"You only remember it once you can use it."},
{pattern:"淨係 (zing6 hai6)",desc:"Only / just. 唔好淨係讀.",ex:"即係開口講，唔好淨係讀？(zik1 hai6 hoi1 hau2 gong2, m4 hou2 zing6 hai6 duk6?)",en:"So speak — don't only read?"}
],
quiz:[
{q:'"進步" means:',opts:["give up","progress","homework","accent"],ans:1},
{q:'"流利" means:',opts:["broken","fluent","quiet","slow"],ans:1},
{q:'"敢講" means:',opts:["dare to speak","refuse to speak","speak English","whisper"],ans:1},
{q:'"生字" means:',opts:["raw fish","new words","grammar","tones"],ans:1},
{q:'"複習" means:',opts:["skip","review","forget","teach"],ans:1},
{q:'"淨係" means:',opts:["always","only / just","never","maybe"],ans:1},
{q:'"繼續" means:',opts:["stop","continue","start over","give up"],ans:1},
{q:"A says the most important thing is:",opts:["perfect accent first","dare to speak","only reading","never making mistakes"],ans:1}
]}
,
{id:141,title:"L41 過節",subtitle:"Festivals · 過年、紅包、中秋、放假",
vocab:[
{c:"過節",j:"gwo3 zit3",e:"to celebrate a festival"},
{c:"過年",j:"gwo3 nin4",e:"Chinese New Year"},
{c:"紅包",j:"hung4 baau1",e:"red packet"},
{c:"利是",j:"lai6 si6",e:"lai see (red packet, HK word)"},
{c:"恭喜發財",j:"gung1 hei2 faat3 coi4",e:"wishing you prosperity"},
{c:"團年飯",j:"tyun4 nin4 faan6",e:"reunion dinner"},
{c:"中秋",j:"zung1 cau1",e:"Mid-Autumn Festival"},
{c:"月餅",j:"jyut6 beng2",e:"moon cake"},
{c:"聖誕",j:"sing3 daan3",e:"Christmas"},
{c:"新年",j:"san1 nin4",e:"New Year"},
{c:"放假",j:"fong3 gaa3",e:"to have a holiday"},
{c:"拜年",j:"baai3 nin4",e:"New Year visits"},
{c:"煙花",j:"jin1 faa1",e:"fireworks"},
{c:"熱鬧",j:"jit6 naau6",e:"lively / bustling"},
{c:"傳統",j:"cyun4 tung2",e:"tradition"},
{c:"禮物",j:"lai5 mat6",e:"gift"},
{c:"團圓",j:"tyun4 jyun4",e:"reunion"},
{c:"恭喜",j:"gung1 hei2",e:"congratulations"},
{c:"身體健康",j:"san1 tai2 gin6 hong1",e:"good health (a wish)"},
{c:"如意",j:"jyu4 ji3",e:"as you wish (a wish)"}
],
dialogue:[
{speaker:"A",c:"過年你返唔返屋企食團年飯？",j:"gwo3 nin4 nei5 faan1 m4 faan1 uk1 kei2 sik6 tyun4 nin4 faan6?",e:"For New Year, are you going home for reunion dinner?"},
{speaker:"B",c:"返。仲要派利是俾小朋友。",j:"faan1. zung6 jiu3 paai3 lai6 si6 bei2 siu2 pang4 jau5.",e:"Yes. And I have to give lai see to the kids."},
{speaker:"A",c:"恭喜發財。今年利是幾厚啊？",j:"gung1 hei2 faat3 coi4. gam1 nin4 lai6 si6 gei2 hau5 aa3?",e:"Gong hei fat choy. How thick are the packets this year?"},
{speaker:"B",c:"唔好問啦。傳統嘛，開心就得。",j:"m4 hou2 man6 laa1. cyun4 tung2 maa3, hoi1 sam1 zau6 dak1.",e:"Don't ask. It's tradition — as long as people are happy."},
{speaker:"A",c:"中秋你食唔食月餅？我覺得太甜。",j:"zung1 cau1 nei5 sik6 m4 sik6 jyut6 beng2? ngo5 gok3 dak1 taai3 tim4.",e:"Do you eat mooncakes at Mid-Autumn? I find them too sweet."},
{speaker:"B",c:"食少少。主要係團圓。夜晚睇唔睇煙花？",j:"sik6 siu2 siu2. zyu2 jiu3 hai6 tyun4 jyun4. je6 maan5 tai2 m4 tai2 jin1 faa1?",e:"A little. It's mainly about reunion. Watch fireworks at night?"},
{speaker:"A",c:"維港好熱鬧。聖誕又去唔去睇燈？",j:"wai4 gong2 hou2 jit6 naau6. sing3 daan3 jau6 heoi3 m4 heoi3 tai2 dang1?",e:"The harbour is packed. Christmas — going to see the lights too?"},
{speaker:"B",c:"去。送禮物俾屋企人。身體健康，萬事如意。",j:"heoi3. sung3 lai5 mat6 bei2 uk1 kei2 jan4. san1 tai2 gin6 hong1, maan6 si6 jyu4 ji3.",e:"Yes. Gifts for family. Health, and may all go as you wish."},
{speaker:"A",c:"你放假去邊啊？",j:"nei5 fong3 gaa3 heoi3 bin1 aa3?",e:"Where are you going on holiday?"},
{speaker:"B",c:"今年唔出街。喺屋企拜年就得。",j:"gam1 nin4 m4 ceot1 gaai1. hai2 uk1 kei2 baai3 nin4 zau6 dak1.",e:"Not going out this year. New Year visits at home is enough."}
],
grammar:[
{pattern:"利是 vs 紅包",desc:"HK says 利是 lai6 si6. 紅包 is understood but more Mandarin/written.",ex:"仲要派利是俾小朋友。(zung6 jiu3 paai3 lai6 si6 bei2 siu2 pang4 jau5)",en:"And I have to give lai see to the kids."},
{pattern:"恭喜發財",desc:"The New Year greeting. Reply 恭喜發財, 利是逗來.",ex:"恭喜發財。身體健康，萬事如意。(gung1 hei2 faat3 coi4. san1 tai2 gin6 hong1, maan6 si6 jyu4 ji3)",en:"Wishing you prosperity. Health, and may all go as you wish."},
{pattern:"返唔返屋企",desc:"A-not-A with 返. Festival travel question.",ex:"過年你返唔返屋企食團年飯？(gwo3 nin4 nei5 faan1 m4 faan1 uk1 kei2 sik6 tyun4 nin4 faan6?)",en:"Going home for reunion dinner at New Year?"},
{pattern:"主要係 (zyu2 jiu3 hai6)",desc:"It's mainly… 主要係團圓.",ex:"食少少。主要係團圓。(sik6 siu2 siu2. zyu2 jiu3 hai6 tyun4 jyun4)",en:"Eat a little. It's mainly about reunion."},
{pattern:"就得",desc:"That's enough / that'll do. 拜年就得.",ex:"喺屋企拜年就得。(hai2 uk1 kei2 baai3 nin4 zau6 dak1)",en:"New Year visits at home is enough."}
],

{id:142,title:"L42 畀人",subtitle:"Passive · 畀人讚、畀人鬧、好彩",
vocab:[
{c:"畀人",j:"bei2 jan4",e:"by someone (passive)"},
{c:"讚",j:"zaan3",e:"to praise"},
{c:"鬧",j:"naau6",e:"to scold"},
{c:"騙",j:"pin3",e:"to cheat / trick"},
{c:"偷",j:"tau1",e:"to steal"},
{c:"打",j:"daa2",e:"to hit"},
{c:"選",j:"syun2",e:"to choose / elect"},
{c:"請",j:"ceng2",e:"to treat; to invite"},
{c:"逼",j:"bik1",e:"to force"},
{c:"影響",j:"jing2 hoeng2",e:"to affect; influence"},
{c:"好彩",j:"hou2 coi2",e:"luckily"},
{c:"唔好彩",j:"m4 hou2 coi2",e:"unluckily"},
{c:"無辜",j:"mou4 gwu1",e:"innocent"},
{c:"誤會",j:"ng6 wui6",e:"misunderstanding"},
{c:"解釋",j:"gaai2 sik1",e:"to explain"},
{c:"原諒",j:"jyun4 loeng6",e:"to forgive"},
{c:"責任",j:"zaak3 jam6",e:"responsibility"},
{c:"唔關事",j:"m4 gwaan1 si6",e:"not relevant / not my fault"},
{c:"搞錯",j:"gaau2 co3",e:"to mix up / get wrong"},
{c:"唔關我事",j:"m4 gwaan1 ngo5 si6",e:"not my business / not my fault"}
],
dialogue:[
{speaker:"A",c:"你做咩面色咁差？",j:"nei5 zou6 me1 min6 sik1 gam3 caa1?",e:"Why do you look so off?"},
{speaker:"B",c:"畀人鬧。老闆以為我搞錯數。",j:"bei2 jan4 naau6. lou5 baan2 ji5 wai4 ngo5 gaau2 co3 sou3.",e:"I got scolded. The boss thought I mixed up the figures."},
{speaker:"A",c:"你有解釋未？定係畀人誤會？",j:"nei5 jau5 gaai2 sik1 mei6? ding6 hai6 bei2 jan4 ng6 wui6?",e:"Have you explained? Or were you misunderstood?"},
{speaker:"B",c:"解釋咗。好彩同事幫我。最後畀人原諒。",j:"gaai2 sik1 zo2. hou2 coi2 tung4 si6 bong1 ngo5. zeoi3 hau6 bei2 jan4 jyun4 loeng6.",e:"I did. Luckily a colleague helped. In the end I was forgiven."},
{speaker:"A",c:"唔好彩今朝。不過唔關你事就得。",j:"m4 hou2 coi2 gam1 ziu1. bat1 gwo3 m4 gwaan1 nei5 si6 zau6 dak1.",e:"Unlucky morning. But it's fine if it wasn't your fault."},
{speaker:"B",c:"我怕再畀人逼加班。",j:"ngo5 paa3 zoi3 bei2 jan4 bik1 gaa1 baan1.",e:"I'm afraid of being forced to OT again."},
{speaker:"A",c:"責任要分清楚。唔好成日畀人影響心情。",j:"zaak3 jam6 jiu3 fan1 cing1 co2. m4 hou2 sing4 jat6 bei2 jan4 jing2 hoeng2 sam1 cing4.",e:"Get the responsibility clear. Don't always let others affect your mood."},
{speaker:"B",c:"我知。下次小心啲。",j:"ngo5 zi1. haa6 ci3 siu2 sam1 di1.",e:"I know. I'll be more careful next time."},
{speaker:"A",c:"係囉。你唔關事就唔使攬晒上身。",j:"hai6 lo1. nei5 m4 gwaan1 si6 zau6 m4 sai2 laam2 saai3 soeng5 san1.",e:"Right. If it's not your fault, don't take it all on."},
{speaker:"B",c:"係囉。下次畀人讚我請食飯。",j:"hai6 lo1. haa6 ci3 bei2 jan4 zaan3 ngo5 ceng2 sik6 faan6.",e:"Right. Next time I get praised, dinner's on me."}
],
grammar:[
{pattern:"畀人 + verb",desc:"The Cantonese passive. 畀人鬧 = get scolded. 畀人讚 = get praised. Agent can follow 畀.",ex:"畀人鬧。最後畀人原諒。(bei2 jan4 naau6. zeoi3 hau6 bei2 jan4 jyun4 loeng6)",en:"Got scolded. In the end got forgiven."},
{pattern:"畀 + person + verb",desc:"Name the agent. 畀老闆鬧, 畀同事幫.",ex:"老闆以為我搞錯。好彩同事幫我。(lou5 baan2 ji5 wai4 ngo5 gaau2 co3. hou2 coi2 tung4 si6 bong1 ngo5)",en:"Boss thought I mixed it up. Luckily a colleague helped."},
{pattern:"好彩 / 唔好彩",desc:"Luckily / unluckily. Spoken every day.",ex:"好彩同事幫我。唔好彩今朝。(hou2 coi2 tung4 si6 bong1 ngo5. m4 hou2 coi2 gam1 ziu1)",en:"Luckily a colleague helped. Unlucky this morning."},
{pattern:"畀人影響",desc:"Let people affect (you). 唔好畀人影響心情.",ex:"唔好成日畀人影響心情。(m4 hou2 sing4 jat6 bei2 jan4 jing2 hoeng2 sam1 cing4)",en:"Don't always let others affect your mood."},
{pattern:"唔關…事",desc:"Not X's business / fault. 唔關你事, 唔關我事.",ex:"唔關你事就得。(m4 gwaan1 nei5 si6 zau6 dak1)",en:"It's fine as long as it isn't your fault."}
],
quiz:[
{q:'"畀人鬧" means:',opts:["scold someone","get scolded","praise someone","get paid"],ans:1},
{q:'"畀人讚" means:',opts:["get praised","praise others","get fired","get lost"],ans:0},
{q:'"好彩" means:',opts:["colourful","luckily","expensive","early"],ans:1},
{q:'"唔好彩" means:',opts:["lucky","unluckily","colourless","never"],ans:1},
{q:'"原諒" means:',opts:["blame","forgive","forget","fine"],ans:1},
{q:'The Cantonese passive uses:',opts:["被 only","畀人 + verb","了","着"],ans:1},
{q:'"逼" means:',opts:["invite","force","help","wait"],ans:1},
{q:'"誤會" means:',opts:["meeting","misunderstanding","overtime","gift"],ans:1}
]}
,
{id:143,title:"L43 上網",subtitle:"Internet · WiFi、下載、中伏、截圖",
vocab:[
{c:"上網",j:"soeng5 mong5",e:"to go online"},
{c:"WiFi",j:"waai1 faai1",e:"Wi‑Fi"},
{c:"密碼",j:"mat6 maa5",e:"password"},
{c:"下載",j:"haa6 zoi3",e:"to download"},
{c:"上傳",j:"soeng5 cyun4",e:"to upload"},
{c:"App",j:"ep1",e:"app"},
{c:"帳號",j:"zoeng3 hou6",e:"account"},
{c:"登入",j:"dang1 jap6",e:"to log in"},
{c:"斷網",j:"tyun5 mong5",e:"connection dropped"},
{c:"中伏",j:"zung1 fuk6",e:"to get scammed / fall for a trap"},
{c:"騙徒",j:"pin3 tou4",e:"scammer"},
{c:"連結",j:"lin4 git3",e:"a link"},
{c:"截圖",j:"zit6 tou4",e:"screenshot"},
{c:"forward",j:"fo1 waa2",e:"to forward (a message)"},
{c:"viral",j:"vai1 lou4",e:"gone viral (loan)"},
{c:"更新",j:"gang1 san1",e:"to update"},
{c:"當機",j:"dong3 gei1",e:"to crash (phone/computer)"},
{c:"充電",j:"cung1 din6",e:"to charge (battery)"},
{c:"流量",j:"lau4 loeng6",e:"mobile data quota"},
{c:"假消息",j:"gaa2 siu1 sik1",e:"fake news / false info"}
],
dialogue:[
{speaker:"A",c:"WiFi密碼幾號啊？我流量唔夠。",j:"waai1 faai1 mat6 maa5 gei2 hou6 aa3? ngo5 lau4 loeng6 m4 gau3.",e:"What's the Wi‑Fi password? I'm out of data."},
{speaker:"B",c:"寫咗喺雪櫃度。你登入未？",j:"se2 zo2 hai2 syut3 kei4 dou6. nei5 dang1 jap6 mei6?",e:"It's written on the fridge. Logged in yet?"},
{speaker:"A",c:"登入咗。不過個App當機，下載唔到。",j:"dang1 jap6 zo2. bat1 gwo3 go3 ep1 dong3 gei1, haa6 zoi3 m4 dou2.",e:"Yes. But the app crashed — can't download."},
{speaker:"B",c:"更新下。小心連結，好易中伏。",j:"gang1 san1 haa5. siu2 sam1 lin4 git3, hou2 ji6 zung1 fuk6.",e:"Update it. Careful with links — easy to get scammed."},
{speaker:"A",c:"有人forward假消息俾我。我截圖咗。",j:"jau5 jan4 fo1 waa2 gaa2 siu1 sik1 bei2 ngo5. ngo5 zit6 tou4 zo2.",e:"Someone forwarded me fake news. I screenshotted it."},
{speaker:"B",c:"唔好再forward。騙徒最鍾意呢啲。",j:"m4 hou2 zoi3 fo1 waa2. pin3 tou4 zeoi3 zung1 ji3 ni1 di1.",e:"Don't forward it on. Scammers love that."},
{speaker:"A",c:"我電量都冇。充電先。",j:"ngo5 din6 loeng6 dou1 mou5. cung1 din6 sin1.",e:"I'm out of battery too. Charge first."},
{speaker:"B",c:"我啱啱斷網。可能人太多。",j:"ngo5 ngaam1 ngaam1 tyun5 mong5. ho2 nang4 jan4 taai3 do1.",e:"I just dropped offline. Maybe too many people."},
{speaker:"A",c:"上網都幾煩。有時真係想唔使手機。",j:"soeng5 mong5 dou1 gei2 faan4. jau5 si4 zan1 hai6 soeng2 m4 sai2 sau2 gei1.",e:"Being online is tiring. Sometimes I really don't want a phone."},
{speaker:"B",c:"得啦，用得就得。唔好成日中伏就得。",j:"dak1 laa1, jung6 dak1 zau6 dak1. m4 hou2 sing4 jat6 zung1 fuk6 zau6 dak1.",e:"Enough — use it if it works. Just don't keep falling for traps."}
],
grammar:[
{pattern:"中伏 (zung1 fuk6)",desc:"Fall for a scam / trap. Extremely HK. 好易中伏.",ex:"小心連結，好易中伏。(siu2 sam1 lin4 git3, hou2 ji6 zung1 fuk6)",en:"Careful with links — easy to get scammed."},
{pattern:"Verb + 唔 + 到",desc:"Can't succeed. 下載唔到, 登入唔到.",ex:"個App當機，下載唔到。(go3 ep1 dong3 gei1, haa6 zoi3 m4 dou2)",en:"The app crashed, can't download."},
{pattern:"forward as a verb",desc:"HK texts mix English. 唔好再forward.",ex:"有人forward假消息俾我。唔好再forward。(jau5 jan4 fo1 waa2 gaa2 siu1 sik1 bei2 ngo5. m4 hou2 zoi3 fo1 waa2)",en:"Someone forwarded fake news. Don't forward it on."},
{pattern:"斷網 (tyun5 mong5)",desc:"The network dropped. 啱啱斷網.",ex:"我啱啱斷網。可能人太多。(ngo5 ngaam1 ngaam1 tyun5 mong5. ho2 nang4 jan4 taai3 do1)",en:"I just dropped offline. Maybe too many people."},
{pattern:"充電先",desc:"Charge first. 先 at the end = do this first.",ex:"我電量都冇。充電先。(ngo5 din6 loeng6 dou1 mou5. cung1 din6 sin1)",en:"No battery. Charge first."}
],
quiz:[
{q:'"中伏" means:',opts:["charge the phone","get scammed / fall for a trap","go viral","log in"],ans:1},
{q:'"斷網" means:',opts:["buy Wi-Fi","connection dropped","upload","update"],ans:1},
{q:'"當機" means:',opts:["turn on","crash (device)","download","charge"],ans:1},
{q:'"下載" means:',opts:["upload","download","delete","forward"],ans:1},
{q:'"假消息" means:',opts:["a true story","fake news / false info","a password","an app"],ans:1},
{q:'"流量" here means:',opts:["a river","mobile data quota","Wi-Fi password","a screenshot"],ans:1},
{q:'"登入" means:',opts:["log out","log in","shut down","forward"],ans:1},
{q:"B says don't:",opts:["charge the phone","forward the fake news","use Wi-Fi","update"],ans:1}
]},

{id:144,title:"L44 屋邨",subtitle:"Estate life · 樓下、保安、垃圾、鄰居",
vocab:[
{c:"屋邨",j:"uk1 cyun1",e:"public housing estate"},
{c:"樓下",j:"lau4 haa6",e:"downstairs"},
{c:"樓上",j:"lau4 soeng6",e:"upstairs"},
{c:"保安",j:"bou2 on1",e:"security guard"},
{c:"大廈",j:"daai6 haa6",e:"building (block)"},
{c:"單位",j:"daan1 wai2",e:"a flat / unit"},
{c:"走廊",j:"zau2 long4",e:"corridor"},
{c:"垃圾房",j:"laap6 saap3 fong2",e:"refuse room"},
{c:"回收",j:"wui4 sau1",e:"recycling"},
{c:"嘈",j:"cou4",e:"noisy"},
{c:"投訴",j:"tau4 sou3",e:"to complain"},
{c:"街市",j:"gaai1 si5",e:"wet market"},
{c:"公園",j:"gung1 jyun4",e:"park"},
{c:"商場",j:"soeng1 coeng4",e:"mall"},
{c:"巴士站",j:"baa1 si2 zaam6",e:"bus stop"},
{c:"郵箱",j:"jau4 soeng1",e:"letterbox"},
{c:"管理處",j:"gun2 lei5 cyu3",e:"management office"},
{c:"出入",j:"ceot1 jap6",e:"going in and out"},
{c:"方便",j:"fong1 bin6",e:"convenient"},
{c:"熟",j:"suk6",e:"familiar (people)"}
],
dialogue:[
{speaker:"A",c:"你住邊個屋邨啊？方便唔方便？",j:"nei5 zyu6 bin1 go3 uk1 cyun1 aa3? fong1 bin6 m4 fong1 bin6?",e:"Which estate do you live in? Is it convenient?"},
{speaker:"B",c:"樓下有街市同巴士站，好方便。",j:"lau4 haa6 jau5 gaai1 si5 tung4 baa1 si2 zaam6, hou2 fong1 bin6.",e:"Wet market and bus stop downstairs — very convenient."},
{speaker:"A",c:"樓上嘈唔嘈？我最怕嘈。",j:"lau4 soeng6 cou4 m4 cou4? ngo5 zeoi3 paa3 cou4.",e:"Are the upstairs neighbours noisy? I hate noise."},
{speaker:"B",c:"有時嘈。我同保安講過，管理處話會處理。",j:"jau5 si4 cou4. ngo5 tung4 bou2 on1 gong2 gwo3, gun2 lei5 cyu3 waa6 wui5 cyu5 lei5.",e:"Sometimes. I told security; management said they'd handle it."},
{speaker:"A",c:"垃圾要拎去垃圾房定走廊得？",j:"laap6 saap3 jiu3 ling1 heoi3 laap6 saap3 fong2 ding6 zau2 long4 dak1?",e:"Does rubbish go to the refuse room, or is the corridor OK?"},
{speaker:"B",c:"一定垃圾房。走廊唔准擺。回收分好。",j:"jat1 ding6 laap6 saap3 fong2. zau2 long4 m4 zeon2 baai2. wui4 sau1 fan1 hou2.",e:"Must be the refuse room. Nothing in the corridor. Sort the recycling."},
{speaker:"A",c:"郵箱喺邊？我成日收唔到信。",j:"jau4 soeng1 hai2 bin1? ngo5 sing4 jat6 sau1 m4 dou2 seon3.",e:"Where's the letterbox? I never get my mail."},
{speaker:"B",c:"大廈地下。出入同保安打聲招呼，熟咗就得。",j:"daai6 haa6 dei6 haa2. ceot1 jap6 tung4 bou2 on1 daa2 seng1 ziu1 fu1, suk6 zo2 zau6 dak1.",e:"Ground floor of the block. Say hi to security going in and out — once they know you, it's fine."},
{speaker:"A",c:"單位細唔細？有冇公園？",j:"daan1 wai2 sai3 m4 sai3? jau5 mou5 gung1 jyun4?",e:"Is the flat small? Is there a park?"},
{speaker:"B",c:"細，不過夠住。公園行五分鐘。",j:"sai3, bat1 gwo3 gau3 zyu6. gung1 jyun4 haang4 ng5 fan1 zung1.",e:"Small, but enough. Park is a five-minute walk."}
],
grammar:[
{pattern:"樓下 / 樓上",desc:"Downstairs / upstairs. Also the people: 樓上好嘈.",ex:"樓下有街市。樓上嘈唔嘈？(lau4 haa6 jau5 gaai1 si5. lau4 soeng6 cou4 m4 cou4?)",en:"There's a wet market downstairs. Are the upstairs noisy?"},
{pattern:"唔准 (m4 zeon2)",desc:"Not allowed. 走廊唔准擺.",ex:"走廊唔准擺。(zau2 long4 m4 zeon2 baai2)",en:"Not allowed to leave stuff in the corridor."},
{pattern:"打聲招呼 (daa2 seng1 ziu1 fu1)",desc:"Say a quick hello. 打聲 = let out a sound.",ex:"出入同保安打聲招呼。(ceot1 jap6 tung4 bou2 on1 daa2 seng1 ziu1 fu1)",en:"Say hi to security going in and out."},
{pattern:"熟咗就得",desc:"Once you're familiar, it's fine.",ex:"熟咗就得。(suk6 zo2 zau6 dak1)",en:"Once they know you, it's fine."},
{pattern:"夠住 (gau3 zyu6)",desc:"Big enough to live in. 細，不過夠住.",ex:"細，不過夠住。(sai3, bat1 gwo3 gau3 zyu6)",en:"Small, but enough to live in."}
],
quiz:[
{q:'"屋邨" means:',opts:["a hotel","a public housing estate","a mountain","an office"],ans:1},
{q:'"樓下" means:',opts:["upstairs","downstairs","next door","opposite"],ans:1},
{q:'"保安" means:',opts:["landlord","security guard","postman","chef"],ans:1},
{q:'"嘈" means:',opts:["quiet","noisy","clean","far"],ans:1},
{q:'"單位" here means:',opts:["a team","a flat / unit","a school","a bus"],ans:1},
{q:'"打聲招呼" means:',opts:["hit someone","say a quick hello","call the police","pay rent"],ans:1},
{q:'"夠住" means:',opts:["too small","enough to live in","too expensive","no lift"],ans:1},
{q:"Rubbish must go to the:",opts:["corridor","refuse room","park","letterbox"],ans:1}
]},

{id:145,title:"L45 以前",subtitle:"The past · 嗰陣、細個、而家唔同咗",
vocab:[
{c:"以前",j:"ji5 cin4",e:"before / in the past"},
{c:"嗰陣",j:"go2 zan6",e:"at that time"},
{c:"細個",j:"sai3 go3",e:"when (I was) little"},
{c:"長大",j:"zoeng2 daai6",e:"to grow up"},
{c:"而家",j:"ji4 gaa1",e:"now"},
{c:"已經",j:"ji5 ging1",e:"already"},
{c:"曾經",j:"cang4 ging1",e:"once / previously"},
{c:"咗",j:"zo2",e:"completed (aspect)"},
{c:"過",j:"gwo3",e:"have experienced"},
{c:"唔同咗",j:"m4 tung4 zo2",e:"has become different"},
{c:"改變",j:"goi2 bin3",e:"to change"},
{c:"記得",j:"gei3 dak1",e:"to remember"},
{c:"唔記得",j:"m4 gei3 dak1",e:"to forget"},
{c:"好似",j:"hou2 ci5",e:"seems like"},
{c:"原來",j:"jyun4 loi4",e:"it turns out"},
{c:"當時",j:"dong1 si4",e:"at that time (more formal)"},
{c:"後來",j:"hau6 loi4",e:"afterwards"},
{c:"直到",j:"zik6 dou3",e:"until"},
{c:"先至",j:"sin1 zi3",e:"only then"},
{c:"再",j:"zoi3",e:"again"}
],
dialogue:[
{speaker:"A",c:"你細個住邊度啊？",j:"nei5 sai3 go3 zyu6 bin1 dou6 aa3?",e:"Where did you live when you were little?"},
{speaker:"B",c:"以前住屋邨。嗰陣樓下成日有人玩。",j:"ji5 cin4 zyu6 uk1 cyun1. go2 zan6 lau4 haa6 sing4 jat6 jau5 jan4 waan2.",e:"Used to live on an estate. Back then there were always people playing downstairs."},
{speaker:"A",c:"而家仲係咁？",j:"ji4 gaa1 zung6 hai6 gam2?",e:"Still like that now?"},
{speaker:"B",c:"唔同咗。大家都好忙，樓下靜咗好多。",j:"m4 tung4 zo2. daai6 gaa1 dou1 hou2 mong4, lau4 haa6 zing6 zo2 hou2 do1.",e:"It's different. Everyone's busy — downstairs got a lot quieter."},
{speaker:"A",c:"你記得第一日上學咩？",j:"nei5 gei3 dak1 dai6 jat1 jat6 soeng5 hok6 me1?",e:"Do you remember the first day of school?"},
{speaker:"B",c:"記得。嗰陣好驚，後來先至慣。",j:"gei3 dak1. go2 zan6 hou2 geng1, hau6 loi4 sin1 zi3 gwaan3.",e:"Yes. I was scared then — only later did I get used to it."},
{speaker:"A",c:"我曾經以為自己唔會離開。",j:"ngo5 cang4 ging1 ji5 wai4 zi6 gei2 m4 wui5 lei4 hoi1.",e:"I once thought I'd never leave."},
{speaker:"B",c:"原來人長大就會改變。直到而家我先明白。",j:"jyun4 loi4 jan4 zoeng2 daai6 zau6 wui5 goi2 bin3. zik6 dou3 ji4 gaa1 ngo5 sin1 ming4 baak6.",e:"Turns out people change as they grow up. I only get it now."},
{speaker:"A",c:"好似尋日事。其實已經好多年。",j:"hou2 ci5 cam4 jat6 si6. kei4 sat6 ji5 ging1 hou2 do1 nin4.",e:"Feels like yesterday. Actually it's been many years."},
{speaker:"B",c:"係。所以而家珍惜。再細個一次都唔得。",j:"hai6. so2 ji5 ji4 gaa1 zan1 sik6. zoi3 sai3 go3 jat1 ci3 dou1 m4 dak1.",e:"Yes. So cherish it now. You can't be little again."}
],
grammar:[
{pattern:"細個 / 嗰陣 / 以前",desc:"When I was little / at that time / in the past. The three past-time workhorses.",ex:"你細個住邊度？以前住屋邨。嗰陣樓下成日有人玩。(nei5 sai3 go3 zyu6 bin1 dou6? ji5 cin4 zyu6 uk1 cyun1. go2 zan6 lau4 haa6 sing4 jat6 jau5 jan4 waan2)",en:"Where did you live as a kid? On an estate. Back then people always played downstairs."},
{pattern:"唔同咗 / Adj + 咗",desc:"Has become different / has become [adj]. 靜咗, 忙咗, 貴咗.",ex:"唔同咗。樓下靜咗好多。(m4 tung4 zo2. lau4 haa6 zing6 zo2 hou2 do1)",en:"It's changed. Downstairs got a lot quieter."},
{pattern:"後來先至…",desc:"Only afterwards then… 後來先至慣.",ex:"嗰陣好驚，後來先至慣。(go2 zan6 hou2 geng1, hau6 loi4 sin1 zi3 gwaan3)",en:"Scared then — only later got used to it."},
{pattern:"曾經 (cang4 ging1)",desc:"Once upon a time I… More narrative than 過.",ex:"我曾經以為自己唔會離開。(ngo5 cang4 ging1 ji5 wai4 zi6 gei2 m4 wui5 lei4 hoi1)",en:"I once thought I'd never leave."},
{pattern:"直到而家先…",desc:"Only until now do I…",ex:"直到而家我先明白。(zik6 dou3 ji4 gaa1 ngo5 sin1 ming4 baak6)",en:"Only now do I understand."}
],
quiz:[
{q:'"嗰陣" means:',opts:["tomorrow","at that time","always","never"],ans:1},
{q:'"細個" means:',opts:["a small flat","when (I was) little","a child seat","downstairs"],ans:1},
{q:'"唔同咗" means:',opts:["still the same","has become different","never changed","next year"],ans:1},
