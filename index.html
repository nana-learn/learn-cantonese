{id:146,title:"L46 口語",subtitle:"Spoken vs written · 係嘅咗唔好 不是的了不要",
vocab:[
{c:"係",j:"hai6",e:"to be (spoken) — not 是"},
{c:"嘅",j:"ge3",e:"possessive / modifier (spoken) — not 的"},
{c:"咗",j:"zo2",e:"completed (spoken) — not 了"},
{c:"唔",j:"m4",e:"not (spoken) — not 不"},
{c:"冇",j:"mou5",e:"not have — not 沒有"},
{c:"喺",j:"hai2",e:"at / in — not 在"},
{c:"嚟",j:"lai4",e:"to come — not 來"},
{c:"嗰",j:"go2",e:"that — not 那"},
{c:"呢",j:"ni1",e:"this — not 這"},
{c:"嘢",j:"je5",e:"thing — not 東西"},
{c:"而家",j:"ji4 gaa1",e:"now — not 現在"},
{c:"點",j:"dim2",e:"how — not 怎麼"},
{c:"邊",j:"bin1",e:"which / where — not 哪"},
{c:"佢",j:"keoi5",e:"he/she — not 他/她"},
{c:"佢哋",j:"keoi5 dei6",e:"they — not 他們"},
{c:"我哋",j:"ngo5 dei6",e:"we — not 我們"},
{c:"食",j:"sik6",e:"eat — not 吃"},
{c:"睇",j:"tai2",e:"look — not 看"},
{c:"畀",j:"bei2",e:"give — not 給"},
{c:"唔好",j:"m4 hou2",e:"don't — not 不要"}
],
dialogue:[
{speaker:"A",c:"書面語寫「他在看東西」，口語點講？",j:"syu1 min6 jyu5 se2 taa1 zoi6 hon3 dung1 sai1, hau2 jyu5 dim2 gong2?",e:"Written is 他在看東西. How do you say it out loud?"},
{speaker:"B",c:"佢喺度睇嘢。唔好講「他在看」。",j:"keoi5 hai2 dou6 tai2 je5. m4 hou2 gong2 taa1 zoi6 hon3.",e:"Keoi5 hai2 dou6 tai2 je5. Don't say the Mandarin out loud."},
{speaker:"A",c:"「沒有了」呢？",j:"mut6 jau5 liu5 ne1?",e:"What about 沒有了?"},
{speaker:"B",c:"冇咗。或者冇喇。",j:"mou5 zo2. waak6 ze2 mou5 laa3.",e:"Mou5 zo2. Or mou5 laa3."},
{speaker:"A",c:"「我們現在給他」？",j:"ngo5 mun4 jin6 zoi6 kap1 taa1?",e:"And 我們現在給他?"},
{speaker:"B",c:"我哋而家畀佢。記住：係、嘅、咗、唔、冇。",j:"ngo5 dei6 ji4 gaa1 bei2 keoi5. gei3 zyu6: hai6, ge3, zo2, m4, mou5.",e:"Ngo5 dei6 ji4 gaa1 bei2 keoi5. Remember: hai6, ge3, zo2, m4, mou5."},
{speaker:"A",c:"咁「怎麼辦」呢？",j:"gam2 zam2 mo1 baan6 ne1?",e:"Then how about 怎麼辦?"},
{speaker:"B",c:"點算。或者點做好。",j:"dim2 syun3. waak6 ze2 dim2 zou6 hou2.",e:"Dim2 syun3. Or dim2 zou6 hou2."},
{speaker:"A",c:"我成日講錯。好似講緊普通話。",j:"ngo5 sing4 jat6 gong2 co3. hou2 ci5 gong2 gan2 pou2 tung1 waa2.",e:"I keep getting it wrong. Like I'm speaking Mandarin."},
{speaker:"B",c:"正常。聽多啲，開口多啲，自然唔同咗。",j:"zing3 soeng4. teng1 do1 di1, hoi1 hau2 do1 di1, zi6 jin4 m4 tung4 zo2.",e:"Normal. Listen more, speak more — it changes on its own."}
],
grammar:[
{pattern:"是→係  的→嘅  了→咗  不→唔  沒有→冇",desc:"The five swaps that stop you sounding Mandarin. Tattoo these.",ex:"佢喺度睇嘢。冇咗。我哋而家畀佢。(keoi5 hai2 dou6 tai2 je5. mou5 zo2. ngo5 dei6 ji4 gaa1 bei2 keoi5)",en:"He's looking at something here. It's gone. We're giving it to him now."},
{pattern:"在→喺  這/那→呢/嗰  來→嚟",desc:"Location and pointing. 喺度, 呢個, 嗰個, 過嚟.",ex:"佢喺度。呢個。嗰個。過嚟。(keoi5 hai2 dou6. ni1 go3. go2 go3. gwo3 lai4)",en:"He's here. This one. That one. Come over."},
{pattern:"他/她→佢  們→哋",desc:"One 佢 for he/she/it. 我哋 你哋 佢哋.",ex:"我哋而家畀佢。(ngo5 dei6 ji4 gaa1 bei2 keoi5)",en:"We're giving it to him/her now."},
{pattern:"吃→食  看→睇  給→畀  不要→唔好",desc:"Daily verbs. Don't say 吃飯 out loud — 食飯.",ex:"食飯。睇戲。畀我。唔好走。(sik6 faan6. tai2 hei3. bei2 ngo5. m4 hou2 zau2)",en:"Eat. Watch a film. Give me. Don't go."},
{pattern:"怎麼→點",desc:"點算, 點做好, 點解, 點樣. Never 怎麼 in speech.",ex:"點算。點做好。(dim2 syun3. dim2 zou6 hou2)",en:"What now? How should we do it?"}
],
quiz:[
{q:"Spoken 'to be' is:",opts:["是 si6","係 hai6","在 zoi6","的 ge3"],ans:1},
{q:"Spoken possessive is:",opts:["的","嘅 ge3","了","不"],ans:1},
{q:"Completed aspect in speech is:",opts:["了 liu5","咗 zo2","過 gwo3 only","着"],ans:1},
{q:"'Don't have' in speech is:",opts:["沒有","冇 mou5","不有","無 always"],ans:1},
{q:"'He/she' in speech is:",opts:["他 and 她","佢 keoi5 for both","它","那"],ans:1},
{q:"'Eat' in speech is:",opts:["吃","食 sik6","用餐","進食"],ans:1},
{q:"'Look/watch' in speech is:",opts:["看","睇 tai2","視","望 only"],ans:1},
{q:"'Don't' in speech is:",opts:["不要","唔好 m4 hou2","別 always","勿"],ans:1}
]},

{id:147,title:"L47 比較",subtitle:"Comparing · 啲、過、最、冇咁、一樣",
vocab:[
{c:"啲",j:"di1",e:"-er / a bit more"},
{c:"過",j:"gwo3",e:"than"},
{c:"最",j:"zeoi3",e:"the most"},
{c:"冇咁",j:"mou5 gam3",e:"not as … as"},
{c:"一樣",j:"jat1 joeng6",e:"the same"},
{c:"差唔多",j:"caa1 m4 do1",e:"almost the same"},
{c:"更加",j:"gang3 gaa1",e:"even more"},
{c:"比較",j:"bei2 gaau3",e:"to compare; relatively"},
{c:"寧願",j:"ning4 jyun3",e:"would rather"},
{c:"不如",j:"bat1 jyu4",e:"not as good as; how about"},
{c:"好過",j:"hou2 gwo3",e:"better than"},
{c:"差過",j:"caa1 gwo3",e:"worse than"},
{c:"多過",j:"do1 gwo3",e:"more than"},
{c:"少過",j:"siu2 gwo3",e:"less than"},
{c:"快過",j:"faai3 gwo3",e:"faster than"},
{c:"慢過",j:"maan6 gwo3",e:"slower than"},
{c:"平過",j:"peng4 gwo3",e:"cheaper than"},
{c:"貴過",j:"gwai3 gwo3",e:"more expensive than"},
{c:"遠遠",j:"jyun5 jyun5",e:"by far"},
{c:"少少",j:"siu2 siu2",e:"a little bit"}
],
dialogue:[
{speaker:"A",c:"呢間餐廳好唔好啊？",j:"ni1 gaan1 caan1 teng1 hou2 m4 hou2 aa3?",e:"Is this restaurant any good?"},
{speaker:"B",c:"好過隔離嗰間。不過貴過少少。",j:"hou2 gwo3 gaak3 lei4 go2 gaan1. bat1 gwo3 gwai3 gwo3 siu2 siu2.",e:"Better than the one next door. A bit more expensive though."},
{speaker:"A",c:"有冇平啲？我寧願平過靚。",j:"jau5 mou5 peng4 di1? ngo5 ning4 jyun3 peng4 gwo3 leng3.",e:"Anything cheaper? I'd rather cheap than pretty."},
{speaker:"B",c:"對面嗰間冇咁貴，差唔多樣。",j:"deoi3 min6 go2 gaan1 mou5 gam3 gwai3, caa1 m4 do1 joeng6.",e:"The one opposite isn't as expensive — almost the same."},
{speaker:"A",c:"邊間最快？我趕時間。",j:"bin1 gaan1 zeoi3 faai3? ngo5 gon2 si4 gaan3.",e:"Which is fastest? I'm in a hurry."},
{speaker:"B",c:"茶餐廳遠遠快過呢度。服務好過好多。",j:"caa4 caan1 teng1 jyun5 jyun5 faai3 gwo3 ni1 dou6. fuk6 mou6 hou2 gwo3 hou2 do1.",e:"Cha chaan teng is way faster than here. Service is much better."},
{speaker:"A",c:"咁不如去茶餐廳。一樣係食飯。",j:"gam2 bat1 jyu4 heoi3 caa4 caan1 teng1. jat1 joeng6 hai6 sik6 faan6.",e:"Then how about cha chaan teng. It's eating either way."},
{speaker:"B",c:"得。呢度比較多人，更加慢。",j:"dak1. ni1 dou6 bei2 gaau3 do1 jan4, gang3 gaa1 maan6.",e:"OK. Here's relatively more people — even slower."},
{speaker:"A",c:"我覺得隔離差過對面。你呢？",j:"ngo5 gok3 dak1 gaak3 lei4 caa1 gwo3 deoi3 min6. nei5 ne1?",e:"I think next door is worse than opposite. You?"},
{speaker:"B",c:"同意。對面少過呢度貴，又快過。",j:"tung4 ji3. deoi3 min6 siu2 gwo3 ni1 dou6 gwai3, jau6 faai3 gwo3.",e:"Agreed. Opposite is less expensive than here, and faster."}
],
grammar:[
{pattern:"Adj + 過",desc:"Than. 好過, 快過, 貴過, 平過. The default spoken comparative.",ex:"好過隔離嗰間。貴過少少。(hou2 gwo3 gaak3 lei4 go2 gaan1. gwai3 gwo3 siu2 siu2)",en:"Better than the one next door. A bit more expensive."},
{pattern:"冇咁 + adj",desc:"Not as … 冇咁貴 = not as expensive. Soft comparison.",ex:"對面嗰間冇咁貴。(deoi3 min6 go2 gaan1 mou5 gam3 gwai3)",en:"The one opposite isn't as expensive."},
{pattern:"遠遠 + adj + 過",desc:"Way more … than. 遠遠快過.",ex:"茶餐廳遠遠快過呢度。(caa4 caan1 teng1 jyun5 jyun5 faai3 gwo3 ni1 dou6)",en:"Cha chaan teng is way faster than here."},
{pattern:"寧願 A 過 B",desc:"Would rather A than B.",ex:"我寧願平過靚。(ngo5 ning4 jyun3 peng4 gwo3 leng3)",en:"I'd rather cheap than pretty."},
{pattern:"更加 / 比較",desc:"更加 = even more. 比較 = relatively.",ex:"呢度比較多人，更加慢。(ni1 dou6 bei2 gaau3 do1 jan4, gang3 gaa1 maan6)",en:"Here has relatively more people — even slower."}
],
quiz:[
{q:'"好過" means:',opts:["worse than","better than","the same","not as"],ans:1},
{q:'"冇咁貴" means:',opts:["more expensive","not as expensive","the most expensive","free"],ans:1},
{q:'"寧願" means:',opts:["must","would rather","never","compare"],ans:1},
{q:'"遠遠快過" means:',opts:["a bit faster","way faster than","slower","the same speed"],ans:1},
{q:'"差唔多" means:',opts:["very different","almost the same","the worst","the best"],ans:1},
{q:'"更加" means:',opts:["less","even more","never","or"],ans:1},
{q:'Adj + 過 is the spoken way to say:',opts:["superlative","than / comparative","past tense","plural"],ans:1},
{q:'"不如" here suggests:',opts:["never go","how about (doing X)","because","although"],ans:1}
]},

{id:148,title:"L48 請求",subtitle:"Asking people · 麻煩你、可唔可以、唔該幫手",
vocab:[
{c:"麻煩你",j:"maa4 faan4 nei5",e:"could I trouble you to…"},
{c:"可唔可以",j:"ho2 m4 ho2 ji5",e:"can / may I"},
{c:"唔該幫手",j:"m4 goi1 bong1 sau2",e:"please give me a hand"},
{c:"勞駕",j:"lou4 gaa3",e:"excuse me (asking a stranger)"},
{c:"請問",j:"cing2 man6",e:"may I ask"},
{c:"對唔住打擾",j:"deoi3 m4 zyu6 daa2 jiu2",e:"sorry to bother you"},
{c:"得唔得",j:"dak1 m4 dak1",e:"is it OK"},
{c:"方唔方便",j:"fong1 m4 fong1 bin6",e:"is it convenient"},
{c:"等陣",j:"dang2 zan6",e:"just a moment"},
{c:"唔好意思",j:"m4 hou2 ji3 si1",e:"excuse me / sorry"},
{c:"唔該借借",j:"m4 goi1 ze3 ze3",e:"excuse me (passing)"},
{c:"幫我",j:"bong1 ngo5",e:"help me"},
{c:"同我",j:"tung4 ngo5",e:"for me / with me"},
{c:"代我",j:"doi6 ngo5",e:"on my behalf"},
{c:"麻煩",j:"maa4 faan4",e:"troublesome; to trouble"},
{c:"唔好意思啊",j:"m4 hou2 ji3 si1 aa3",e:"sorry about that"},
{c:"真係唔好意思",j:"zan1 hai6 m4 hou2 ji3 si1",e:"I'm really sorry"},
{c:"唔該晒",j:"m4 goi1 saai3",e:"thanks so much"},
{c:"唔使客氣",j:"m4 sai2 haak3 hei3",e:"you're welcome"},
{c:"小事",j:"siu2 si6",e:"it's nothing / no big deal"}
],
dialogue:[
{speaker:"A",c:"唔好意思，麻煩你幫我睇住啲行李得唔得？",j:"m4 hou2 ji3 si1, maa4 faan4 nei5 bong1 ngo5 tai2 zyu6 di1 hang4 lei5 dak1 m4 dak1?",e:"Sorry — could you watch my bags for me?"},
{speaker:"B",c:"得。你去幾耐？",j:"dak1. nei5 heoi3 gei2 noi6?",e:"OK. How long will you be?"},
{speaker:"A",c:"五分鐘。真係唔好意思。",j:"ng5 fan1 zung1. zan1 hai6 m4 hou2 ji3 si1.",e:"Five minutes. Really sorry."},
{speaker:"B",c:"小事。你去啦。",j:"siu2 si6. nei5 heoi3 laa1.",e:"No big deal. Go ahead."},
{speaker:"A",c:"勞駕，請問廁所喺邊度？",j:"lou4 gaa3, cing2 man6 ci3 so2 hai2 bin1 dou6?",e:"Excuse me, where's the toilet?"},
{speaker:"B",c:"轉右。方唔方便我同你行過去？",j:"zyun3 jau6. fong1 m4 fong1 bin6 ngo5 tung4 nei5 haang4 gwo3 heoi3?",e:"Turn right. Convenient if I walk you there?"},
{speaker:"A",c:"唔使，唔該晒。",j:"m4 sai2, m4 goi1 saai3.",e:"No need — thanks so much."},
{speaker:"B",c:"唔使客氣。唔該借借——後面有人。",j:"m4 sai2 haak3 hei3. m4 goi1 ze3 ze3 — hau6 min6 jau5 jan4.",e:"You're welcome. Excuse me — people behind."},
{speaker:"A",c:"可唔可以代我話俾佢知我遲到？",j:"ho2 m4 ho2 ji5 doi6 ngo5 waa6 bei2 keoi5 zi1 ngo5 ci4 dou3?",e:"Can you tell them on my behalf that I'll be late?"},
{speaker:"B",c:"得。你唔該幫手拎住先。",j:"dak1. nei5 m4 goi1 bong1 sau2 ling1 zyu6 sin1.",e:"OK. Please help hold this a second."}
],
grammar:[
{pattern:"麻煩你 + verb",desc:"Could I trouble you to… The polite request.",ex:"麻煩你幫我睇住啲行李得唔得？(maa4 faan4 nei5 bong1 ngo5 tai2 zyu6 di1 hang4 lei5 dak1 m4 dak1?)",en:"Could you watch my bags for me?"},
{pattern:"勞駕 (lou4 gaa3)",desc:"Excuse me to a stranger, slightly old-fashioned and very polite.",ex:"勞駕，請問廁所喺邊度？(lou4 gaa3, cing2 man6 ci3 so2 hai2 bin1 dou6?)",en:"Excuse me, where's the toilet?"},
{pattern:"睇住 (tai2 zyu6)",desc:"Keep an eye on. 住 = hold the state.",ex:"幫我睇住啲行李。(bong1 ngo5 tai2 zyu6 di1 hang4 lei5)",en:"Watch my bags for me."},
{pattern:"代我 (doi6 ngo5)",desc:"On my behalf. 代我話俾佢知.",ex:"可唔可以代我話俾佢知我遲到？(ho2 m4 ho2 ji5 doi6 ngo5 waa6 bei2 keoi5 zi1 ngo5 ci4 dou3?)",en:"Can you tell them for me that I'll be late?"},
{pattern:"小事 / 唔使客氣",desc:"How to receive thanks. 小事 = it's nothing.",ex:"小事。你去啦。唔使客氣。(siu2 si6. nei5 heoi3 laa1. m4 sai2 haak3 hei3)",en:"No big deal. Go ahead. You're welcome."}
],
quiz:[
{q:'"麻煩你" means:',opts:["go away","could I trouble you to…","you're late","how much"],ans:1},
{q:'"勞駕" is used to:',opts:["scold","politely stop a stranger","order food","hang up"],ans:1},
{q:'"睇住" means:',opts:["look down","keep an eye on","close eyes","read a book"],ans:1},
{q:'"代我" means:',opts:["instead of eating","on my behalf","after me","without me"],ans:1},
{q:'"小事" as a reply means:',opts:["a small shop","it's nothing / no big deal","wait a bit","too expensive"],ans:1},
{q:'"方唔方便" asks:',opts:["the price","if it's convenient","the time","the way"],ans:1},
{q:'"唔該晒" is:',opts:["please sit","thanks so much","sorry","excuse me passing"],ans:1},
{q:'"唔該借借" is for:',opts:["thanking a gift","passing through","ordering","apologising for being late"],ans:1}
]},

{id:149,title:"L49 過關",subtitle:"Airport and border · 護照、登機、行李",
vocab:[
{c:"機場",j:"gei1 coeng4",e:"airport"},
{c:"過關",j:"gwo3 gwaan1",e:"to go through immigration / customs"},
{c:"護照",j:"wu6 ziu3",e:"passport"},
{c:"登機",j:"dang1 gei1",e:"to board"},
{c:"登機證",j:"dang1 gei1 zing3",e:"boarding pass"},
{c:"航班",j:"hong4 baan1",e:"flight"},
{c:"延誤",j:"jin4 ng6",e:"delay"},
{c:"取消",j:"ceoi2 siu1",e:"cancel"},
{c:"行李",j:"hang4 lei5",e:"luggage"},
{c:"托運",j:"tok3 wan6",e:"to check in luggage"},
{c:"手提",j:"sau2 tai4",e:"carry-on"},
{c:"閘口",j:"zaap6 hau2",e:"gate"},
{c:"保安",j:"bou2 on1",e:"security"},
{c:"海關",j:"hoi2 gwaan1",e:"customs"},
{c:"申報",j:"san1 bou3",e:"to declare"},
{c:"轉機",j:"zyun3 gei1",e:"to transfer flights"},
{c:"入境",j:"jap6 ging2",e:"to enter (a country)"},
{c:"出境",j:"ceot1 ging2",e:"to exit (a country)"},
{c:"排隊",j:"paai4 deoi2",e:"to queue"},
{c:"準時",j:"zeon2 si4",e:"on time"}
],
dialogue:[
{speaker:"A",c:"航班準時定延誤啊？",j:"hong4 baan1 zeon2 si4 ding6 jin4 ng6 aa3?",e:"Is the flight on time or delayed?"},
{speaker:"B",c:"準時。不過要早啲過關，而家人好多。",j:"zeon2 si4. bat1 gwo3 jiu3 zou2 di1 gwo3 gwaan1, ji4 gaa1 jan4 hou2 do1.",e:"On time. But go through immigration early — lots of people now."},
{speaker:"A",c:"護照同登機證你帶咗未？",j:"wu6 ziu3 tung4 dang1 gei1 zing3 nei5 daai3 zo2 mei6?",e:"Got passport and boarding pass?"},
{speaker:"B",c:"帶咗。行李托運咗，手提得。",j:"daai3 zo2. hang4 lei5 tok3 wan6 zo2, sau2 tai4 dak1.",e:"Yes. Bags checked; carry-on is fine."},
{speaker:"A",c:"閘口幾號？要排隊過保安。",j:"zaap6 hau2 gei2 hou6? jiu3 paai4 deoi2 gwo3 bou2 on1.",e:"What gate? We have to queue for security."},
{speaker:"B",c:"二十五。轉機嘅話要再過一次關。",j:"ji6 sap6 ng5. zyun3 gei1 ge3 waa2 jiu3 zoi3 gwo3 jat1 ci3 gwaan1.",e:"25. If we transfer we go through again."},
{speaker:"A",c:"海關要唔要申報？我帶咗少少零食。",j:"hoi2 gwaan1 jiu3 m4 jiu3 san1 bou3? ngo5 daai3 zo2 siu2 siu2 ling4 sik6.",e:"Do we declare at customs? I brought a few snacks."},
{speaker:"B",c:"零食唔使。入境填表就得。",j:"ling4 sik6 m4 sai2. jap6 ging2 tin4 biu2 zau6 dak1.",e:"Snacks no need. Just fill in the form on entry."},
{speaker:"A",c:"如果取消呢？",j:"jyu4 gwo2 ceoi2 siu1 ne1?",e:"What if it's cancelled?"},
{speaker:"B",c:"去櫃位問。而家先登機，走啦。",j:"heoi3 gwai6 wai2 man6. ji4 gaa1 sin1 dang1 gei1, zau2 laa1.",e:"Ask at the counter. Boarding now — let's go."}
],
grammar:[
{pattern:"過關 (gwo3 gwaan1)",desc:"Immigration / the checkpoint. HK–Mainland and airport.",ex:"要早啲過關，而家人好多。(jiu3 zou2 di1 gwo3 gwaan1, ji4 gaa1 jan4 hou2 do1)",en:"Go through immigration early — lots of people now."},
{pattern:"托運 vs 手提",desc:"Check in vs carry-on.",ex:"行李托運咗，手提得。(hang4 lei5 tok3 wan6 zo2, sau2 tai4 dak1)",en:"Bags checked; carry-on is fine."},
{pattern:"嘅話 (ge3 waa2)",desc:"If… (as for the case that…). 轉機嘅話.",ex:"轉機嘅話要再過一次關。(zyun3 gei1 ge3 waa2 jiu3 zoi3 gwo3 jat1 ci3 gwaan1)",en:"If we transfer, we go through immigration again."},

{id:150,title:"L50 畢業",subtitle:"Capstone · you can speak — keep going",
vocab:[
{c:"畢業",j:"bat1 jip6",e:"to graduate"},
{c:"開始",j:"hoi1 ci2",e:"to start"},
{c:"繼續",j:"gai3 zuk6",e:"to continue"},
{c:"堅持",j:"gin1 ci4",e:"to persist"},
{c:"進步",j:"zeon3 bou6",e:"progress"},
{c:"流利",j:"lau4 lei6",e:"fluent"},
{c:"敢",j:"gam2",e:"to dare"},
{c:"錯",j:"co3",e:"wrong; a mistake"},
{c:"怕醜",j:"paa3 cau2",e:"shy / embarrassed"},
{c:"習慣",j:"zaap6 gwaan3",e:"habit; to get used to"},
{c:"聽歌",j:"teng1 go1",e:"listen to songs"},
{c:"睇劇",j:"tai2 kek6",e:"watch series"},
{c:"傾偈",j:"king1 gai2",e:"to chat"},
{c:"交朋友",j:"gaau1 pang4 jau5",e:"to make friends"},
{c:"用地道",j:"jung6 dei6 dou6",e:"use authentic (speech)"},
{c:"多謝",j:"do1 ze6",e:"thank you"},
{c:"一路順風",j:"jat1 lou6 seon6 fung1",e:"bon voyage / all the best"},
{c:"加油",j:"gaa1 jau4",e:"come on / keep it up"},
{c:"下次",j:"haa6 ci3",e:"next time"},
{c:"拜拜",j:"baai1 baai3",e:"bye"}
],
dialogue:[
{speaker:"A",c:"五十課喇。你敢唔敢出街講？",j:"ng5 sap6 fo3 laa3. nei5 gam2 m4 gam2 ceot1 gaai1 gong2?",e:"Lesson fifty. Dare you speak outside?"},
{speaker:"B",c:"敢。仲係怕醜，不過唔講就唔會進步。",j:"gam2. zung6 hai6 paa3 cau2, bat1 gwo3 m4 gong2 zau6 m4 wui5 zeon3 bou6.",e:"Yes. Still shy — but if I don't speak I won't improve."},
{speaker:"A",c:"錯咗唔緊要。習慣就流利。",j:"co3 zo2 m4 gan2 jiu3. zaap6 gwaan3 zau6 lau4 lei6.",e:"Mistakes don't matter. Once it's habit, you're fluent."},
{speaker:"B",c:"我每日聽歌睇劇，同人傾偈。",j:"ngo5 mui5 jat6 teng1 go1 tai2 kek6, tung4 jan4 king1 gai2.",e:"Every day I listen to songs, watch series, chat with people."},
{speaker:"A",c:"搞掂。用地道啲，唔好變返書面語。",j:"gaau2 dim6. jung6 dei6 dou6 di1, m4 hou2 bin3 faan1 syu1 min6 jyu5.",e:"Sorted. Keep it colloquial — don't slip back into written Chinese."},
{speaker:"B",c:"記住。係嘅咗唔冇。我哋而家畀佢。",j:"gei3 zyu6. hai6 ge3 zo2 m4 mou5. ngo5 dei6 ji4 gaa1 bei2 keoi5.",e:"Got it. Hai6 ge3 zo2 m4 mou5. We're giving it to them now."},
{speaker:"A",c:"畢業唔係完。繼續堅持。",j:"bat1 jip6 m4 hai6 jyun4. gai3 zuk6 gin1 ci4.",e:"Graduating isn't the end. Keep going."},
{speaker:"B",c:"下次出街你要同我講粵語。唔准英文。",j:"haa6 ci3 ceot1 gaai1 nei5 jiu3 tung4 ngo5 gong2 jyut6 jyu5. m4 zeon2 jing1 man2.",e:"Next time we go out you have to speak Cantonese with me. No English."},
{speaker:"A",c:"得。加油。一路順風。",j:"dak1. gaa1 jau4. jat1 lou6 seon6 fung1.",e:"OK. Keep it up. All the best."},
{speaker:"B",c:"多謝你教我。拜拜。",j:"do1 ze6 nei5 gaau3 ngo5. baai1 baai3.",e:"Thanks for teaching me. Bye."}
],
grammar:[
{pattern:"敢唔敢 (gam2 m4 gam2)",desc:"Dare you…? A-not-A of 敢.",ex:"你敢唔敢出街講？敢。(nei5 gam2 m4 gam2 ceot1 gaai1 gong2? gam2)",en:"Dare you speak outside? Yes."},
{pattern:"唔講就唔會進步",desc:"If you don't speak, you won't improve. 就 ties cause to result.",ex:"仲係怕醜，不過唔講就唔會進步。(zung6 hai6 paa3 cau2, bat1 gwo3 m4 gong2 zau6 m4 wui5 zeon3 bou6)",en:"Still shy, but if I don't speak I won't improve."},
{pattern:"習慣就流利",desc:"Once it's habit, fluency follows.",ex:"錯咗唔緊要。習慣就流利。(co3 zo2 m4 gan2 jiu3. zaap6 gwaan3 zau6 lau4 lei6)",en:"Mistakes don't matter. Habit, then fluency."},
{pattern:"唔准 + language",desc:"Not allowed to use X. 唔准英文.",ex:"下次出街你要同我講粵語。唔准英文。(haa6 ci3 ceot1 gaai1 nei5 jiu3 tung4 ngo5 gong2 jyut6 jyu5. m4 zeon2 jing1 man2)",en:"Next time out, Cantonese. No English."},
{pattern:"畢業唔係完",desc:"Graduating isn't finishing. Keep the five swaps alive.",ex:"畢業唔係完。繼續堅持。(bat1 jip6 m4 hai6 jyun4. gai3 zuk6 gin1 ci4)",en:"Graduating isn't the end. Keep persisting."}
],

{id:151,title:"L51 酒店",subtitle:"Hotel · 訂房、check-in、叫醒",
vocab:[

{c:"單人房",j:"daan1 jan4 fong2",e:"single room"},

{c:"叫醒",j:"giu3 seng2",e:"wake-up call"},

{c:"隔音",j:"gaak3 jam1",e:"soundproofing"},

dialogue:[
{speaker:"A",c:"你好，我訂咗房。姓陳，今晚入住。",j:"nei5 hou2, ngo5 deng6 zo2 fong2. sing3 can4, gam1 maan5 jap6 zyu6.",e:"Hi, I booked a room. Surname Chan, checking in tonight."},
{speaker:"B",c:"有嘅。雙人房，海景。早餐包唔包？",j:"jau5 ge3. soeng1 jan4 fong2, hoi2 ging2. zou2 caan1 baau1 m4 baau1?",e:"Yes. Double, sea view. Breakfast included?"},
{speaker:"A",c:"包。可唔可以加床？我哋三個人。",j:"baau1. ho2 m4 ho2 ji5 gaa1 cong4? ngo5 dei6 saam1 go3 jan4.",e:"Included. Can we add a bed? There are three of us."},
{speaker:"B",c:"得，二百蚊。房號一八零八。呢張鑰匙卡。",j:"dak1, ji6 baak3 man1. fong2 hou6 jat1 baat3 ling4 baat3. ni1 zoeng1 joek6 si4 kaat1.",e:"Yes, $200. Room 1808. Here's the key card."},
{speaker:"A",c:"隔音好唔好？我想朝早七點叫醒。",j:"gaak3 jam1 hou2 m4 hou2? ngo5 soeng2 ziu1 zou2 cat1 dim2 giu3 seng2.",e:"Soundproofing OK? I'd like a 7am wake-up call."},
{speaker:"B",c:"隔音唔錯。叫醒得。WiFi密碼喺檯度。",j:"gaak3 jam1 m4 co3. giu3 seng2 dak1. waai1 faai1 mat6 maa5 hai2 toi2 dou6.",e:"Soundproofing's fine. Wake-up OK. Wi‑Fi password on the desk."},
{speaker:"A",c:"聽日退房幾點？可唔可以延遲？",j:"ting1 jat6 teoi3 fong2 gei2 dim2? ho2 m4 ho2 ji5 jin4 ci4?",e:"What time is checkout tomorrow? Can we delay?"},
{speaker:"B",c:"十二點。延遲到兩點得，要加錢。",j:"sap6 ji6 dim2. jin4 ci4 dou3 loeng5 dim2 dak1, jiu3 gaa1 cin2.",e:"Twelve. Delay to two is OK, extra charge."},
{speaker:"A",c:"行李可唔可以寄存前台？",j:"hang4 lei5 ho2 m4 ho2 ji5 gei3 cyun4 cin4 toi4?",e:"Can we leave bags at the front desk?"},
{speaker:"B",c:"得。退房之後都得。歡迎入住。",j:"dak1. teoi3 fong2 zi1 hau6 dou1 dak1. fun1 jing4 jap6 zyu6.",e:"Yes. After checkout too. Welcome."}
],
grammar:[
{pattern:"訂咗房 / 入住 / 退房",desc:"Booked / check in / check out. The hotel trio.",ex:"我訂咗房。今晚入住。聽日退房。(ngo5 deng6 zo2 fong2. gam1 maan5 jap6 zyu6. ting1 jat6 teoi3 fong2)",en:"I booked. Checking in tonight. Checkout tomorrow."},
{pattern:"包唔包",desc:"Is it included? 早餐包唔包.",ex:"早餐包唔包？包。(zou2 caan1 baau1 m4 baau1? baau1)",en:"Breakfast included? Yes."},
{pattern:"叫醒 (giu3 seng2)",desc:"Wake-up call. 七點叫醒.",ex:"我想朝早七點叫醒。(ngo5 soeng2 ziu1 zou2 cat1 dim2 giu3 seng2)",en:"I'd like a 7am wake-up call."},
{pattern:"延遲到 + time",desc:"Delay until. 延遲到兩點.",ex:"延遲到兩點得，要加錢。(jin4 ci4 dou3 loeng5 dim2 dak1, jiu3 gaa1 cin2)",en:"Delay to two is OK, extra charge."},
{pattern:"寄存 (gei3 cyun4)",desc:"Leave bags. 行李寄存前台.",ex:"行李可唔可以寄存前台？(hang4 lei5 ho2 m4 ho2 ji5 gei3 cyun4 cin4 toi4?)",en:"Can we leave bags at the front desk?"}
],

{c:"防曬",j:"fong4 saai3",e:"sunscreen"},
{c:"泳褲",j:"wing6 fu3",e:"swim shorts"},
{c:"泳裝",j:"wing6 zong1",e:"swimsuit"},

{c:"拖鞋",j:"to1 haai4",e:"flip-flops"},

{c:"溺水",j:"nik1 seoi2",e:"to drown"},

dialogue:[
{speaker:"A",c:"今日去沙灘好唔好？天氣咁熱。",j:"gam1 jat6 heoi3 saa1 taan1 hou2 m4 hou2? tin1 hei3 gam3 jit6.",e:"Beach today? It's so hot."},
{speaker:"B",c:"好。你帶咗防曬同毛巾未？",j:"hou2. nei5 daai3 zo2 fong4 saai3 tung4 mou4 gan1 mei6?",e:"Yes. Sunscreen and towel packed?"},
{speaker:"A",c:"帶咗。我最怕曬傷。",j:"daai3 zo2. ngo5 zeoi3 paa3 saai3 soeng1.",e:"Yes. I hate getting sunburnt."},
{speaker:"B",c:"浪大唔大啊？會唔會危險？",j:"long6 daai6 m4 daai6 aa3? wui5 m4 wui5 ngai4 him2?",e:"Are the waves big? Dangerous?"},
{speaker:"A",c:"聽講今日細浪。不過要睇住救生員。",j:"teng1 gong2 gam1 jat6 sai3 long6. bat1 gwo3 jiu3 tai2 zyu6 gau3 saang1 jyun4.",e:"I heard small waves today. Still, watch the lifeguard."},
{speaker:"B",c:"我游水唔叻。浸下就得。",j:"ngo5 jau4 seoi2 m4 lek1. zam3 haa5 zau6 dak1.",e:"I'm not a strong swimmer. Just wading is enough."},
{speaker:"A",c:"得。潮水漲咗就返上嚟。小心溺水。",j:"dak1. ciu4 seoi2 zoeng3 zo2 zau6 faan1 soeng5 lai4. siu2 sam1 nik1 seoi2.",e:"OK. When the tide comes in, come back up. Careful of drowning."},
{speaker:"B",c:"拖鞋喺邊？風咁大，毛巾飛走。",j:"to1 haai4 hai2 bin1? fung1 gam3 daai6, mou4 gan1 fei1 zau2.",e:"Where are the flip-flops? Wind's so strong the towel's flying off."},
{speaker:"A",c:"喺袋。呢度景好靚。影相先。",j:"hai2 doi2. ni1 dou6 ging2 hou2 leng3. jing2 soeng2 sin1.",e:"In the bag. The view's beautiful. Photo first."},
{speaker:"B",c:"好。游完去食個雪糕。",j:"hou2. jau4 jyun4 heoi3 sik6 go3 syut3 gou1.",e:"OK. After swimming, ice cream."}
],
grammar:[
{pattern:"游水 vs 浸",desc:"Swim vs wade/soak. 我游水唔叻。浸下就得.",ex:"我游水唔叻。浸下就得。(ngo5 jau4 seoi2 m4 lek1. zam3 haa5 zau6 dak1)",en:"I'm not a strong swimmer. Just wading is enough."},
{pattern:"曬傷 / 防曬",desc:"Sunburn / sunscreen. 最怕曬傷.",ex:"你帶咗防曬未？我最怕曬傷。(nei5 daai3 zo2 fong4 saai3 mei6? ngo5 zeoi3 paa3 saai3 soeng1)",en:"Bring sunscreen? I hate getting sunburnt."},
{pattern:"潮水漲咗",desc:"The tide has come in. 漲 zoeng3.",ex:"潮水漲咗就返上嚟。(ciu4 seoi2 zoeng3 zo2 zau6 faan1 soeng5 lai4)",en:"When the tide comes in, come back up."},
{pattern:"唔叻 (m4 lek1)",desc:"Not good at it. 叻 = skilled. Very HK.",ex:"我游水唔叻。(ngo5 jau4 seoi2 m4 lek1)",en:"I'm not good at swimming."},
{pattern:"游完 + next",desc:"After swimming… 完 again.",ex:"游完去食個雪糕。(jau4 jyun4 heoi3 sik6 go3 syut3 gou1)",en:"After swimming, go have an ice cream."}
],

{speaker:"B",c:"贏多。教練好嚴，每日練習。",j:"jeng4 do1. gaau3 lin6 hou2 jim4, mui5 jat6 lin6 zaap6.",e:"Win more. Coach is strict — practice every day."},
{speaker:"A",c:"我寧願健身。一個人都得。",j:"ngo5 ning4 jyun3 gin6 san1. jat1 go3 jan4 dou1 dak1.",e:"I'd rather work out. Fine on my own."},
{speaker:"B",c:"健身好。不過踢波開心啲。一齊嚟啦。",j:"gin6 san1 hou2. bat1 gwo3 tek3 bo1 hoi1 sam1 di1. jat1 cai4 lai4 laa1.",e:"Gym is good. Football's more fun though. Come with us."},
{speaker:"A",c:"得。為咗健康。",j:"dak1. wai6 zo2 gin6 hong1.",e:"OK. For health."},
{speaker:"B",c:"搞掂。記住帶水。",j:"gaau2 dim6. gei3 zyu6 daai3 seoi2.",e:"Sorted. Remember to bring water."}
],
grammar:[
{pattern:"踢唔踢波",desc:"A-not-A with a verb-object. 踢波 is one activity.",ex:"今晚踢唔踢波啊？踢。(gam1 maan5 tek3 m4 tek3 bo1 aa3? tek3)",en:"Playing football tonight? Yes."},
{pattern:"出晒汗",desc:"Sweating all over. 晒 = completely.",ex:"而家出晒汗，好攰。(ji4 gaa1 ceot1 saai3 hon6, hou2 gui6)",en:"Soaked in sweat now, exhausted."},
{pattern:"贏多 / 輸多",desc:"Win more often / lose more often.",ex:"你哋隊贏定輸多啊？贏多。(nei5 dei6 deoi2 jeng4 ding6 syu1 do1 aa3? jeng4 do1)",en:"Win more or lose more? Win more."},
{pattern:"寧願 + activity",desc:"Would rather do X. 寧願健身.",ex:"我寧願健身。一個人都得。(ngo5 ning4 jyun3 gin6 san1. jat1 go3 jan4 dou1 dak1)",en:"I'd rather work out. Fine alone."},
{pattern:"為咗 (wai6 zo2)",desc:"For the sake of. 為咗健康.",ex:"為咗健康。(wai6 zo2 gin6 hong1)",en:"For health."}

{id:154,title:"L54 娛樂",subtitle:"Films and music · 睇戲、聽歌、推薦",
vocab:[
{c:"睇戲",j:"tai2 hei3",e:"watch a film"},
{c:"電影",j:"din6 jing2",e:"a film"},
{c:"聽歌",j:"teng1 go1",e:"listen to music"},
{c:"歌",j:"go1",e:"a song"},
{c:"演唱會",j:"jin2 coeng3 wui2",e:"concert"},
{c:"推薦",j:"teoi1 zin3",e:"to recommend"},
{c:"好看",j:"hou2 hon3",e:"(written) good to watch — say 好睇"},
{c:"好睇",j:"hou2 tai2",e:"good to watch"},
{c:"好聽",j:"hou2 teng1",e:"good to listen to"},
{c:"悶",j:"mun6",e:"boring"},
{c:"搞笑",j:"gaau2 siu3",e:"funny"},
{c:"恐怖",j:"hung2 bou3",e:"horror / scary"},
{c:"愛情",j:"oi3 cing4",e:"romance"},
{c:"字幕",j:"zi6 mok6",e:"subtitles"},
{c:"粵語",j:"jyut6 jyu5",e:"Cantonese"},
{c:"配音",j:"pui3 jam1",e:"dubbing"},
{c:"票",j:"piu3",e:"ticket"},
{c:"場",j:"coeng4",e:"a showing"},
{c:"鐘意",j:"zung1 ji3",e:"to like"},
{c:"收藏",j:"sau1 cong4",e:"to save / bookmark"}
],
dialogue:[
{speaker:"A",c:"今晚睇戲好唔好？有套粵語片好睇。",j:"gam1 maan5 tai2 hei3 hou2 m4 hou2? jau5 tou3 jyut6 jyu5 pin2 hou2 tai2.",e:"Film tonight? There's a Cantonese one that's good."},
{speaker:"B",c:"恐怖定搞笑？我怕恐怖。",j:"hung2 bou3 ding6 gaau2 siu3? ngo5 paa3 hung2 bou3.",e:"Horror or comedy? I'm scared of horror."},
{speaker:"A",c:"愛情。有字幕。你鍾意聽歌定睇戲多？",j:"oi3 cing4. jau5 zi6 mok6. nei5 zung1 ji3 teng1 go1 ding6 tai2 hei3 do1?",e:"Romance. Subtitles. You like music or films more?"},
{speaker:"B",c:"聽歌。有演唱會想去，票好貴。",j:"teng1 go1. jau5 jin2 coeng3 wui2 soeng2 heoi3, piu3 hou2 gwai3.",e:"Music. There's a concert I want — tickets are expensive."},
{speaker:"A",c:"你推薦吓歌。我收藏。",j:"nei5 teoi1 zin3 haa5 go1. ngo5 sau1 cong4.",e:"Recommend a song. I'll save it."},
{speaker:"B",c:"呢首好聽。粵語歌學嘢好有用。",j:"ni1 sau2 hou2 teng1. jyut6 jyu5 go1 hok6 je5 hou2 jau5 jung6.",e:"This one's good. Cantonese songs are useful for learning."},
{speaker:"A",c:"配音我唔鍾意。原聲好啲。",j:"pui3 jam1 ngo5 m4 zung1 ji3. jyun4 sing1 hou2 di1.",e:"I don't like dubbing. Original audio is better."},
{speaker:"B",c:"同意。嗰套悶唔悶啊？",j:"tung4 ji3. go2 tou3 mun6 m4 mun6 aa3?",e:"Agreed. Is that film boring?"},
{speaker:"A",c:"唔悶。好睇過上套。",j:"m4 mun6. hou2 tai2 gwo3 soeng6 tou3.",e:"Not boring. Better than the last one."},
{speaker:"B",c:"得。七點場見。",j:"dak1. cat1 dim2 coeng4 gin3.",e:"OK. See you at the 7 o'clock showing."}
],
grammar:[
{pattern:"好睇 / 好聽",desc:"Good to watch / good to listen to. Don't say 好看 out loud.",ex:"有套粵語片好睇。呢首好聽。(jau5 tou3 jyut6 jyu5 pin2 hou2 tai2. ni1 sau2 hou2 teng1)",en:"There's a good Cantonese film. This song is good."},
{pattern:"套 classifier for films",desc:"一套戲, 呢套, 上套.",ex:"好睇過上套。(hou2 tai2 gwo3 soeng6 tou3)",en:"Better than the last one."},
{pattern:"首 classifier for songs",desc:"一首歌, 呢首.",ex:"呢首好聽。(ni1 sau2 hou2 teng1)",en:"This one sounds good."},
{pattern:"鍾意 A 定 B 多",desc:"Like A or B more?",ex:"你鍾意聽歌定睇戲多？(nei5 zung1 ji3 teng1 go1 ding6 tai2 hei3 do1?)",en:"Do you like music or films more?"},
{pattern:"場 for a showing",desc:"七點場 = the 7 o'clock showing.",ex:"七點場見。(cat1 dim2 coeng4 gin3)",en:"See you at the 7 o'clock showing."}
],
quiz:[
{q:'Spoken "good to watch" is:',opts:["好看","好睇","好聽","好食"],ans:1},
{q:'"聽歌" means:',opts:["watch a film","listen to music","sing karaoke only","read lyrics"],ans:1},
{q:'"搞笑" means:',opts:["scary","funny","boring","romantic"],ans:1},
{q:'"恐怖" means:',opts:["comedy","horror / scary","romance","documentary"],ans:1},
{q:'Films use classifier:',opts:["首","套","隻","本"],ans:1},
{q:'Songs use classifier:',opts:["套","首","場","間"],ans:1},
{q:'"推薦" means:',opts:["delete","recommend","download","hate"],ans:1},
{q:'"字幕" means:',opts:["dubbing","subtitles","tickets","seats"],ans:1}
]},

{id:155,title:"L55 顏色",subtitle:"Colour and clothes · 紅藍黑白 襯唔襯",
vocab:[
{c:"顏色",j:"ngaan4 sik1",e:"colour"},
{c:"紅",j:"hung4",e:"red"},
{c:"藍",j:"laam4",e:"blue"},
{c:"黑",j:"hak1",e:"black"},
{c:"白",j:"baak6",e:"white"},
{c:"黃",j:"wong4",e:"yellow"},
{c:"綠",j:"luk6",e:"green"},
{c:"粉紅",j:"fan2 hung4",e:"pink"},
{c:"灰",j:"fui1",e:"grey"},
{c:"衫",j:"saam1",e:"clothes / top"},
{c:"褲",j:"fu3",e:"trousers"},
{c:"裙",j:"kwan4",e:"skirt / dress"},
{c:"鞋",j:"haai4",e:"shoes"},
{c:"襪",j:"mat6",e:"socks"},
{c:"襯",j:"can3",e:"to match (colours/style)"},
{c:"着",j:"zoek3",e:"to wear"},
{c:"換",j:"wun6",e:"to change (clothes)"},
{c:"淺",j:"cin2",e:"light (colour)"},
{c:"深",j:"sam1",e:"dark (colour)"},
{c:"鮮",j:"sin1",e:"bright (colour)"}
],
dialogue:[
{speaker:"A",c:"我着呢件紅衫襯唔襯啊？",j:"ngo5 zoek3 ni1 gin6 hung4 saam1 can3 m4 can3 aa3?",e:"Does this red top match?"},
{speaker:"B",c:"紅同黑襯。藍褲就唔襯。",j:"hung4 tung4 hak1 can3. laam4 fu3 zau6 m4 can3.",e:"Red matches black. Blue trousers don't."},
{speaker:"A",c:"咁換條黑褲。白鞋得唔得？",j:"gam2 wun6 tiu4 hak1 fu3. baak6 haai4 dak1 m4 dak1?",e:"Then I'll change to black trousers. White shoes OK?"},
{speaker:"B",c:"得。淺色鞋襯深色褲。",j:"dak1. cin2 sik1 haai4 can3 sam1 sik1 fu3.",e:"Yes. Light shoes match dark trousers."},
{speaker:"A",c:"粉紅裙呢？會唔會太鮮？",j:"fan2 hung4 kwan4 ne1? wui5 m4 wui5 taai3 sin1?",e:"What about the pink dress? Too bright?"},
{speaker:"B",c:"夜晚得。朝早我寧願灰同白。",j:"je6 maan5 dak1. ziu1 zou2 ngo5 ning4 jyun3 fui1 tung4 baak6.",e:"Fine at night. In the morning I'd rather grey and white."},
{speaker:"A",c:"綠襪同黃鞋呢？我覺得好笑。",j:"luk6 mat6 tung4 wong4 haai4 ne1? ngo5 gok3 dak1 hou2 siu3.",e:"Green socks and yellow shoes? I think it's funny."},
{speaker:"B",c:"唔好。太唔襯。換返黑襪。",j:"m4 hou2. taai3 m4 can3. wun6 faan1 hak1 mat6.",e:"Don't. Way too clashing. Change back to black socks."},
{speaker:"A",c:"得。你着藍色好睇。",j:"dak1. nei5 zoek3 laam4 sik1 hou2 tai2.",e:"OK. Blue looks good on you."},
{speaker:"B",c:"多謝。走啦。",j:"do1 ze6. zau2 laa1.",e:"Thanks. Let's go."}
],
grammar:[
{pattern:"襯唔襯",desc:"Does it match? 襯 = go together (colours/style).",ex:"呢件紅衫襯唔襯啊？紅同黑襯。(ni1 gin6 hung4 saam1 can3 m4 can3 aa3? hung4 tung4 hak1 can3)",en:"Does this red top match? Red matches black."},
{pattern:"着 (zoek3) + clothes",desc:"Wear. Not zyu3.",ex:"我着呢件紅衫。你着藍色好睇。(ngo5 zoek3 ni1 gin6 hung4 saam1. nei5 zoek3 laam4 sik1 hou2 tai2)",en:"I'm wearing this red top. Blue looks good on you."},
{pattern:"淺 / 深 / 鮮",desc:"Light / dark / bright colours.",ex:"淺色鞋襯深色褲。會唔會太鮮？(cin2 sik1 haai4 can3 sam1 sik1 fu3. wui5 m4 wui5 taai3 sin1?)",en:"Light shoes match dark trousers. Too bright?"},
{pattern:"條 for 褲 / 裙",desc:"Long things. 一條褲, 一條裙. 件 for 衫.",ex:"換條黑褲。(wun6 tiu4 hak1 fu3)",en:"Change to a pair of black trousers."},
{pattern:"換返",desc:"Change back to. 換返黑襪.",ex:"太唔襯。換返黑襪。(taai3 m4 can3. wun6 faan1 hak1 mat6)",en:"Way too clashing. Change back to black socks."}
],
quiz:[
{q:'"襯" means:',opts:["buy","match (colours)","wash","iron"],ans:1},
{q:'"着" (wear) is:',opts:["zyu3","zoek3","zoek6","cyu5"],ans:1},
{q:'"淺" for colour means:',opts:["dark","light","bright neon","ugly"],ans:1},
{q:'"深" for colour means:',opts:["light","dark","pink","white"],ans:1},
{q:'Trousers use classifier:',opts:["件","條","隻","本"],ans:1},
{q:'"粉紅" means:',opts:["dark red","pink","orange","grey"],ans:1},
{q:'"鮮" means:',opts:["faded","bright","black","brown"],ans:1},
{q:'Red matches:',opts:["blue trousers in this dialogue","black","green socks","yellow shoes"],ans:1}
]}
,
{id:156,title:"L56 學校",subtitle:"School · 上課、功課、考試、放學",
vocab:[
{c:"學校",j:"hok6 haau6",e:"school"},
{c:"上課",j:"soeng5 fo3",e:"to have class"},
{c:"放學",j:"fong3 hok6",e:"school's out"},
{c:"功課",j:"gung1 fo3",e:"homework"},
{c:"考試",j:"haau2 si3",e:"exam"},
{c:"溫書",j:"wan1 syu1",e:"to revise / study"},
{c:"老師",j:"lou5 si1",e:"teacher"},
{c:"同學",j:"tung4 hok6",e:"classmate"},
{c:"學期",j:"hok6 kei4",e:"term / semester"},
{c:"遲到",j:"ci4 dou3",e:"late"},
{c:"請假",j:"cing2 gaa3",e:"ask for leave"},
{c:"合格",j:"hap6 gaak3",e:"to pass"},
{c:"不合格",j:"bat1 hap6 gaak3",e:"to fail"},
{c:"分數",j:"fan1 sou3",e:"marks / score"},
{c:"堂",j:"tong4",e:"a lesson period"},
{c:"休息",j:"jau1 sik1",e:"break"},
{c:"小息",j:"siu2 sik1",e:"recess"},
{c:"書包",j:"syu1 baau1",e:"school bag"},
{c:"黑板",j:"hak1 baan2",e:"blackboard"},
{c:"舉手",j:"geoi2 sau2",e:"raise a hand"}
],
dialogue:[
{speaker:"A",c:"你今日幾堂課？放學幾點？",j:"nei5 gam1 jat6 gei2 tong4 fo3? fong3 hok6 gei2 dim2?",e:"How many periods today? What time is school out?"},
{speaker:"B",c:"六堂。四點放學。不過要留堂做功課。",j:"luk6 tong4. sei3 dim2 fong3 hok6. bat1 gwo3 jiu3 lau4 tong4 zou6 gung1 fo3.",e:"Six. Out at four. But I have to stay and do homework."},
{speaker:"A",c:"考試幾時？你溫咗書未？",j:"haau2 si3 gei2 si4? nei5 wan1 zo2 syu1 mei6?",e:"When's the exam? Have you revised?"},
{speaker:"B",c:"下個禮拜。未夠。我好怕不合格。",j:"haa6 go3 lai5 baai3. mei6 gau3. ngo5 hou2 paa3 bat1 hap6 gaak3.",e:"Next week. Not enough. I'm scared I'll fail."},
{speaker:"A",c:"舉手問老師啦。同學都肯教你。",j:"geoi2 sau2 man6 lou5 si1 laa1. tung4 hok6 dou1 hang2 gaau3 nei5.",e:"Put your hand up and ask the teacher. Classmates will teach you too."},
{speaker:"B",c:"今朝差啲遲到。書包都唔記得帶。",j:"gam1 ziu1 caa1 di1 ci4 dou3. syu1 baau1 dou1 m4 gei3 dak1 daai3.",e:"This morning I was almost late. Even forgot the school bag."},
{speaker:"A",c:"小息食咗嘢未？唔好空肚考試。",j:"siu2 sik1 sik6 zo2 je5 mei6? m4 hou2 hung1 tou5 haau2 si3.",e:"Eat anything at recess? Don't sit the exam on an empty stomach."},
{speaker:"B",c:"食咗。分數我唔計。合格就得。",j:"sik6 zo2. fan1 sou3 ngo5 m4 gai3. hap6 gaak3 zau6 dak1.",e:"Yes. I'm not chasing marks. A pass is enough."},
{speaker:"A",c:"學期完想做咩？",j:"hok6 kei4 jyun4 soeng2 zou6 me1?",e:"What do you want to do when term ends?"},
{speaker:"B",c:"放完學先至諗。而家溫書。",j:"fong3 jyun4 hok6 sin1 zi3 nam2. ji4 gaa1 wan1 syu1.",e:"Think after school's out. Revising now."}
],
grammar:[
{pattern:"堂 for periods",desc:"一堂課, 六堂. School unit of time.",ex:"你今日幾堂課？六堂。(nei5 gam1 jat6 gei2 tong4 fo3? luk6 tong4)",en:"How many periods today? Six."},
{pattern:"溫書 (wan1 syu1)",desc:"Revise / study for an exam. Not 複習 in speech as much.",ex:"你溫咗書未？未夠。(nei5 wan1 zo2 syu1 mei6? mei6 gau3)",en:"Have you revised? Not enough."},
{pattern:"留堂 (lau4 tong4)",desc:"Stay behind after class. Detention or extra work.",ex:"要留堂做功課。(jiu3 lau4 tong4 zou6 gung1 fo3)",en:"Have to stay and do homework."},
{pattern:"合格 / 不合格",desc:"Pass / fail. 合格就得 = a pass is enough.",ex:"我好怕不合格。合格就得。(ngo5 hou2 paa3 bat1 hap6 gaak3. hap6 gaak3 zau6 dak1)",en:"I'm scared I'll fail. A pass is enough."},
{pattern:"差啲 (caa1 di1)",desc:"Almost. 差啲遲到.",ex:"今朝差啲遲到。(gam1 ziu1 caa1 di1 ci4 dou3)",en:"This morning I was almost late."}
],
quiz:[
{q:'"放學" means:',opts:["start school","school's out","fail an exam","skip class"],ans:1},
{q:'"溫書" means:',opts:["write a letter","revise / study","eat lunch","play ball"],ans:1},
{q:'"功課" means:',opts:["exam","homework","recess","teacher"],ans:1},
{q:'"合格" means:',opts:["fail","pass","cheat","skip"],ans:1},
{q:'"小息" means:',opts:["exam week","recess","homework","graduation"],ans:1},
{q:'"舉手" means:',opts:["sit down","raise a hand","leave","run"],ans:1},
{q:'"差啲遲到" means:',opts:["very late","almost late","on time","absent"],ans:1},
{q:'A school period is a:',opts:["年","堂","場","套"],ans:1}
]},

{id:157,title:"L57 寵物",subtitle:"Pets · 狗、貓、餵、帶出去行",
vocab:[
{c:"寵物",j:"cung2 mat6",e:"pet"},
{c:"狗",j:"gau2",e:"dog"},
{c:"貓",j:"maau1",e:"cat"},
{c:"魚",j:"jyu2",e:"fish"},
{c:"餵",j:"wai3",e:"to feed"},
{c:"帶出去行",j:"daai3 ceot1 heoi3 haang4",e:"to take out for a walk"},
{c:"繩",j:"sing2",e:"lead / leash"},
{c:"疫苗",j:"jik6 miu4",e:"vaccine"},
{c:"獸醫",j:"sau3 ji1",e:"vet"},
{c:"乖",j:"gwaai1",e:"well-behaved"},
{c:"吠",j:"fai6",e:"to bark"},
{c:"抓",j:"zaau2",e:"to scratch"},
{c:"抱",j:"pou5",e:"to hold / hug (an animal)"},
{c:"可愛",j:"ho2 oi3",e:"cute"},
{c:"毛",j:"mou4",e:"fur"},
{c:"廁所",j:"ci3 so2",e:"toilet (also litter)"},
{c:"訓練",j:"fan3 lin6",e:"to train"},
{c:"領養",j:"ling5 joeng5",e:"to adopt"},
{c:"走失",j:"zau2 sat1",e:"to go missing"},
{c:"晶片",j:"zing1 pin2",e:"microchip"}
],
dialogue:[
{speaker:"A",c:"你隻貓乖唔乖啊？會唔會抓人？",j:"nei5 zek3 maau1 gwaai1 m4 gwaai1 aa3? wui5 m4 wui5 zaau2 jan4?",e:"Is your cat well-behaved? Does it scratch?"},
{speaker:"B",c:"乖。不過唔鍾意人抱。狗就鍾意出街。",j:"gwaai1. bat1 gwo3 m4 zung1 ji3 pou5. gau2 zau6 zung1 ji3 ceot1 gaai1.",e:"Yes. Doesn't like being held though. The dog loves going out."},
{speaker:"A",c:"你幾時帶出去行？",j:"nei5 gei2 si4 daai3 ceot1 heoi3 haang4?",e:"When do you walk it?"},
{speaker:"B",c:"朝早同夜晚。要戴繩。獸醫定期打疫苗。",j:"ziu1 zou2 tung4 je6 maan5. jiu3 daai3 sing2. sau3 ji1 ding6 kei4 daa2 jik6 miu4.",e:"Morning and evening. Lead on. Regular vaccines at the vet."},
{speaker:"A",c:"餵幾多啊？會唔會吠到鄰居投訴？",j:"wai3 gei2 do1 aa3? wui5 m4 wui5 fai6 dou3 leon4 geoi1 tau4 sou3?",e:"How much do you feed? Does it bark until the neighbours complain?"},
{speaker:"B",c:"朝早一餐。夜晚少少。訓練咗就唔亂吠。",j:"ziu1 zou2 jat1 caan1. je6 maan5 siu2 siu2. fan3 lin6 zo2 zau6 m4 lyun6 fai6.",e:"One meal in the morning. A bit at night. Once trained it doesn't bark randomly."},
{speaker:"A",c:"好可愛。領養定買啊？",j:"hou2 ho2 oi3. ling5 joeng5 ding6 maai5 aa3?",e:"So cute. Adopted or bought?"},
{speaker:"B",c:"領養。有晶片，怕走失。",j:"ling5 joeng5. jau5 zing1 pin2, paa3 zau2 sat1.",e:"Adopted. Microchipped, in case it goes missing."},
{speaker:"A",c:"毛多唔多？我過敏。",j:"mou4 do1 m4 do1? ngo5 gwo3 man5.",e:"Lots of fur? I'm allergic."},
{speaker:"B",c:"有啲。你唔好抱就得。",j:"jau5 di1. nei5 m4 hou2 pou5 zau6 dak1.",e:"Some. Just don't hold it and you're fine."}
],
grammar:[
{pattern:"隻 for animals",desc:"一隻貓, 一隻狗. Never 個 for pets.",ex:"你隻貓乖唔乖啊？(nei5 zek3 maau1 gwaai1 m4 gwaai1 aa3?)",en:"Is your cat well-behaved?"},
{pattern:"帶出去行",desc:"Take out for a walk. 帶 + 出去 + 行.",ex:"你幾時帶出去行？朝早同夜晚。(nei5 gei2 si4 daai3 ceot1 heoi3 haang4? ziu1 zou2 tung4 je6 maan5)",en:"When do you walk it? Morning and evening."},
{pattern:"吠到 + result",desc:"Bark until… 吠到鄰居投訴.",ex:"會唔會吠到鄰居投訴？(wui5 m4 wui5 fai6 dou3 leon4 geoi1 tau4 sou3?)",en:"Does it bark until the neighbours complain?"},
{pattern:"領養 vs 買",desc:"Adopt vs buy. HK conversation often asks this.",ex:"領養定買啊？領養。(ling5 joeng5 ding6 maai5 aa3? ling5 joeng5)",en:"Adopted or bought? Adopted."},
{pattern:"唔好 + verb + 就得",desc:"Just don't X and you're fine.",ex:"你唔好抱就得。(nei5 m4 hou2 pou5 zau6 dak1)",en:"Just don't hold it and you're fine."}
],

{c:"筷子",j:"faai3 zi2",e:"chopsticks"},
{c:"碗",j:"wun2",e:"bowl"},
{c:"碟",j:"dip6",e:"plate"},

{c:"叉",j:"caa1",e:"fork"},

{c:"爐",j:"lou4",e:"stove"},

{c:"洗乾淨",j:"sai2 gon1 zeng6",e:"wash clean"},

],
dialogue:[
{speaker:"A",c:"刀同砧板喺邊啊？我想切菜。",j:"dou1 tung4 zam1 baan2 hai2 bin1 aa3? ngo5 soeng2 cit3 coi3.",e:"Where are the knife and board? I want to cut veg."},
{speaker:"B",c:"雪櫃隔離。鑊洗乾淨未？",j:"syut3 gwai6 gaak3 lei4. wok6 sai2 gon1 zeng6 mei6?",e:"Next to the fridge. Is the wok washed?"},
{speaker:"A",c:"洗咗。開火未得，等水滾。",j:"sai2 zo2. hoi1 fo2 mei6 dak1, dang2 seoi2 gwan2.",e:"Yes. Don't turn on the stove yet — wait for the water to boil."},
{speaker:"B",c:"煲湯用個煲，炒菜用鑊。唔好搞錯。",j:"bou1 tong1 jung6 go3 bou1, caau2 coi3 jung6 wok6. m4 hou2 gaau2 co3.",e:"Soup in the pot, stir-fry in the wok. Don't mix them up."},
{speaker:"A",c:"筷子碗碟我擺咗檯度。匙羹呢？",j:"faai3 zi2 wun2 dip6 ngo5 baai2 zo2 toi2 dou6. ci4 gang1 ne1?",e:"Chopsticks, bowls, plates are on the table. Spoons?"},
{speaker:"B",c:"微波爐上面。你抹咗檯未？",j:"mei4 bo1 lou4 soeng6 min6. nei5 maat3 zo2 toi2 mei6?",e:"On the microwave. Did you wipe the table?"},
{speaker:"A",c:"未。食完一齊洗碗。",j:"mei6. sik6 jyun4 jat1 cai4 sai2 wun2.",e:"Not yet. After eating we wash up together."},
{speaker:"B",c:"得。爐唔好離開太耐。",j:"dak1. lou4 m4 hou2 lei4 hoi1 taai3 noi6.",e:"OK. Don't leave the stove too long."},
{speaker:"A",c:"知。叉同杯都夠。",j:"zi1. caa1 tung4 bui1 dou1 gau3.",e:"Got it. Forks and cups are enough too."},
{speaker:"B",c:"搞掂。開飯。",j:"gaau2 dim6. hoi1 faan6.",e:"Sorted. Let's eat."}
],
grammar:[
{pattern:"鑊 vs 煲",desc:"Wok vs pot. 炒菜用鑊，煲湯用煲. Don't call a wok 鍋 in HK speech.",ex:"煲湯用個煲，炒菜用鑊。(bou1 tong1 jung6 go3 bou1, caau2 coi3 jung6 wok6)",en:"Soup in the pot, stir-fry in the wok."},
{pattern:"雪櫃 (syut3 gwai6)",desc:"HK fridge. 冰箱 is understood but 雪櫃 is local.",ex:"雪櫃隔離。(syut3 gwai6 gaak3 lei4)",en:"Next to the fridge."},
{pattern:"洗乾淨",desc:"Wash until clean. 乾淨 is the result.",ex:"鑊洗乾淨未？洗咗。(wok6 sai2 gon1 zeng6 mei6? sai2 zo2)",en:"Is the wok washed clean? Yes."},
{pattern:"開火 / 開飯",desc:"Turn on the stove / start the meal. Same 開, different objects.",ex:"開火未得。開飯。(hoi1 fo2 mei6 dak1. hoi1 faan6)",en:"Don't light the stove yet. Let's eat."},
{pattern:"唔好離開太耐",desc:"Don't leave (it) too long. Kitchen safety line.",ex:"爐唔好離開太耐。(lou4 m4 hou2 lei4 hoi1 taai3 noi6)",en:"Don't leave the stove too long."}
],

{q:'"鑊" is a:',opts:["fridge","wok","spoon","cup"],ans:1},
{q:'"雪櫃" means:',opts:["microwave","fridge","stove","sink"],ans:1},

{q:'"抹" means:',opts:["chop","wipe","boil","fry"],ans:1},
{q:'"開飯" means:',opts:["turn on stove","start the meal","wash rice","leave"],ans:1}
]},

{c:"天台",j:"tin1 toi4",e:"rooftop"},

{c:"地區",j:"dei6 keoi1",e:"district"},
{c:"九龍",j:"gau2 lung4",e:"Kowloon"},
{c:"香港島",j:"hoeng1 gong2 dou2",e:"Hong Kong Island"},
{c:"新界",j:"san1 gaai3",e:"New Territories"},
{c:"郵寄",j:"jau4 gei3",e:"to post / mail"},
{c:"收件人",j:"sau1 gin2 jan4",e:"recipient"},
{c:"門牌",j:"mun4 paai4",e:"street number / door plate"},

{c:"地標",j:"dei6 biu1",e:"landmark"}
],
dialogue:[
{speaker:"A",c:"你地址點寫啊？我想郵寄。",j:"nei5 dei6 zi2 dim2 se2 aa3? ngo5 soeng2 jau4 gei3.",e:"How do I write your address? I want to post something."},
{speaker:"B",c:"九龍旺角彌敦道一二三號。",j:"gau2 lung4 wong6 gok3 nei4 deon1 dou6 jat1 ji6 saam1 hou6.",e:"123 Nathan Road, Mong Kok, Kowloon."},
{speaker:"A",c:"幾樓幾室？邊座？",j:"gei2 lau2 gei2 sat1? bin1 zo6?",e:"Which floor and flat? Which block?"},
{speaker:"B",c:"A座十二樓 C室。唔係地下。",j:"A zo6 sap6 ji6 lau2 C sat1. m4 hai6 dei6 haa2.",e:"Block A, 12th floor, flat C. Not ground floor."},
{speaker:"A",c:"收件人寫邊個名？",j:"sau1 gin2 jan4 se2 bin1 go3 meng2?",e:"Whose name as recipient?"},
{speaker:"B",c:"寫我全名。附近有間7-11，當地標。",j:"se2 ngo5 cyun4 meng2. fu6 gan6 jau5 gaan1 cat1 sap6 jat1, dong3 dei6 biu1.",e:"My full name. There's a 7-Eleven nearby — use it as the landmark."},
{speaker:"A",c:"香港島定新界好寄？",j:"hoeng1 gong2 dou2 ding6 san1 gaai3 hou2 gei3?",e:"Easier to post to the Island or the New Territories?"},
{speaker:"B",c:"都得。郵政編碼而家唔使填咁多。",j:"dou1 dak1. jau4 zing3 pin1 maa5 ji4 gaa1 m4 sai2 tin4 gam3 do1.",e:"Either's fine. You don't need to fill in so much postcode now."},
{speaker:"A",c:"天台可唔可以上？",j:"tin1 toi4 ho2 m4 ho2 ji5 soeng5?",e:"Can you go up to the roof?"},
{speaker:"B",c:"得。門牌就係一二三號，唔好睇錯。",j:"dak1. mun4 paai4 zau6 hai6 jat1 ji6 saam1 hou6, m4 hou2 tai2 co3.",e:"Yes. The door number is 123 — don't misread it."}
],
grammar:[
{pattern:"District + street + 號",desc:"HK order: 九龍 + 旺角 + 彌敦道 + 號. Big to small.",ex:"九龍旺角彌敦道一二三號。(gau2 lung4 wong6 gok3 nei4 deon1 dou6 jat1 ji6 saam1 hou6)",en:"123 Nathan Road, Mong Kok, Kowloon."},
{pattern:"座 / 樓 / 室",desc:"Block / floor / flat. A座十二樓C室.",ex:"A座十二樓 C室。唔係地下。(A zo6 sap6 ji6 lau2 C sat1. m4 hai6 dei6 haa2)",en:"Block A, 12F, flat C. Not G/F."},
{pattern:"地下 (dei6 haa2)",desc:"Ground floor. Tone change haa2. Not 一樓 (that's 1/F).",ex:"唔係地下。(m4 hai6 dei6 haa2)",en:"Not ground floor."},
{pattern:"幾樓幾室",desc:"Which floor and which flat? Packed question.",ex:"幾樓幾室？邊座？(gei2 lau2 gei2 sat1? bin1 zo6?)",en:"Which floor and flat? Which block?"},
{pattern:"當 + landmark",desc:"Treat X as the landmark. 當地下標.",ex:"附近有間7-11，當地標。(fu6 gan6 jau5 gaan1 cat1 sap6 jat1, dong3 dei6 biu1)",en:"There's a 7-Eleven nearby — use it as the landmark."}
],

{q:'"幾樓" means:',opts:["which street","which floor","which district","which bus"],ans:1},
{q:'"座" in an address is the:',opts:["flat","block","street","roof"],ans:1},

{q:'"天台" means:',opts:["ground floor","rooftop","kitchen","lift"],ans:1},
{q:'"門牌" means:',opts:["passport","street / door number","key card","postcode"],ans:1},
{q:'HK address order is:',opts:["flat first","big area → street → number","number only","country last in speech always"],ans:1},
{q:'"九龍" is:',opts:["HK Island","Kowloon","New Territories","Macau"],ans:1}
]},

{id:160,title:"L60 端午",subtitle:"Festivals 2 · 糉、龍舟、清明",
vocab:[
{c:"端午",j:"dyun1 ng5",e:"Dragon Boat Festival"},
{c:"糉",j:"zung2",e:"rice dumpling (zong)"},
{c:"龍舟",j:"lung4 zau1",e:"dragon boat"},
{c:"划龍舟",j:"waa1 lung4 zau1",e:"to paddle dragon boats"},
{c:"清明",j:"cing1 ming4",e:"Ching Ming (tomb-sweeping)"},
{c:"掃墓",j:"sou3 mou6",e:"to sweep the tomb / pay respects"},
{c:"香",j:"hoeng1",e:"incense"},
{c:"燭",j:"zuk1",e:"candle"},
{c:"紙錢",j:"zi2 cin2",e:"joss paper"},
{c:"祖先",j:"zou2 sin1",e:"ancestors"},
{c:"鹹糉",j:"haam4 zung2",e:"savoury zong"},
{c:"甜糉",j:"tim4 zung2",e:"sweet zong"},
{c:"豆沙",j:"dau6 saa1",e:"bean paste"},
{c:"咸肉",j:"haam4 juk6",e:"cured pork"},
{c:"傳統",j:"cyun4 tung2",e:"tradition"},
{c:"假期",j:"gaa3 kei4",e:"holiday period"},
{c:"人多",j:"jan4 do1",e:"crowded"},
{c:"塞車",j:"sak1 ce1",e:"traffic jam"},
{c:"紀念",j:"gei2 nim6",e:"to commemorate"},
{c:"屈原",j:"wat1 jyun4",e:"Qu Yuan"}
],
dialogue:[
{speaker:"A",c:"端午食鹹糉定甜糉？",j:"dyun1 ng5 sik6 haam4 zung2 ding6 tim4 zung2?",e:"Dragon Boat — savoury zong or sweet?"},
{speaker:"B",c:"鹹。有咸肉。甜嗰啲豆沙我嫌膩。",j:"haam4. jau5 haam4 juk6. tim4 go2 di1 dau6 saa1 ngo5 jim4 nei6.",e:"Savoury. With cured pork. The sweet bean-paste ones are too rich for me."},
{speaker:"A",c:"去唔去睇划龍舟？",j:"heoi3 m4 heoi3 tai2 waa1 lung4 zau1?",e:"Going to watch the dragon boats?"},
{speaker:"B",c:"想。不過假期人多，塞車。",j:"soeng2. bat1 gwo3 gaa3 kei4 jan4 do1, sak1 ce1.",e:"Want to. But the holiday is packed — traffic."},
{speaker:"A",c:"清明返唔返鄉下掃墓？",j:"cing1 ming4 faan1 m4 faan1 hoeng1 haa6 sou3 mou6?",e:"Ching Ming — going back to the village to sweep the tomb?"},
{speaker:"B",c:"返。帶香燭紙錢。紀念祖先。",j:"faan1. daai3 hoeng1 zuk1 zi2 cin2. gei2 nim6 zou2 sin1.",e:"Yes. Bring incense, candles, joss paper. Remember the ancestors."},
{speaker:"A",c:"傳統你覺得重唔重要？",j:"cyun4 tung2 nei5 gok3 dak1 cung4 m4 cung4 jiu3?",e:"Do you think tradition matters?"},
{speaker:"B",c:"重要。唔係為屈原背書，係屋企人一齊。",j:"cung4 jiu3. m4 hai6 wai6 wat1 jyun4 bui3 syu1, hai6 uk1 kei2 jan4 jat1 cai4.",e:"Yes. Not to recite Qu Yuan — it's family together."},
{speaker:"A",c:"今年糉我自己包。你教唔教得？",j:"gam1 nin4 zung2 ngo5 zi6 gei2 baau1. nei5 gaau3 m4 gaau3 dak1?",e:"I'm wrapping zong myself this year. Can you teach me?"},
{speaker:"B",c:"教。不過第一次會醜樣。唔緊要。",j:"gaau3. bat1 gwo3 dai6 jat1 ci3 wui5 cau2 joeng2. m4 gan2 jiu3.",e:"Yes. The first ones will look ugly. Doesn't matter."}
],
grammar:[
{pattern:"鹹 vs 甜",desc:"Savoury vs sweet. 鹹糉 / 甜糉. 嫌膩 = find it too rich.",ex:"端午食鹹糉定甜糉？鹹。嫌膩。(dyun1 ng5 sik6 haam4 zung2 ding6 tim4 zung2? haam4. jim4 nei6)",en:"Savoury or sweet zong? Savoury. Too rich."},
{pattern:"返鄉下",desc:"Go back to the ancestral village. Ching Ming collocation.",ex:"清明返唔返鄉下掃墓？(cing1 ming4 faan1 m4 faan1 hoeng1 haa6 sou3 mou6?)",en:"Ching Ming — going back to the village to sweep the tomb?"},
{pattern:"重唔重要",desc:"A-not-A of 重要. Note 重 is cung4 here (important), not cung5 (heavy).",ex:"傳統你覺得重唔重要？(cyun4 tung2 nei5 gok3 dak1 cung4 m4 cung4 jiu3?)",en:"Do you think tradition is important?"},
{pattern:"教唔教得",desc:"Can you teach (me)? 得 after A-not-A = is it possible.",ex:"你教唔教得？教。(nei5 gaau3 m4 gaau3 dak1? gaau3)",en:"Can you teach me? Yes."},
{pattern:"醜樣 (cau2 joeng2)",desc:"Ugly-looking. Soften with 唔緊要.",ex:"第一次會醜樣。唔緊要。(dai6 jat1 ci3 wui5 cau2 joeng2. m4 gan2 jiu3)",en:"The first ones will look ugly. Doesn't matter."}
],
quiz:[
{q:'"糉" is a:',opts:["moon cake","rice dumpling","wonton","egg tart"],ans:1},
{q:'"划龍舟" means:',opts:["eat zong","paddle dragon boats","sweep tombs","burn incense"],ans:1},
{q:'"清明" is for:',opts:["dragon boats","tomb-sweeping","Christmas","payday"],ans:1},
{q:'"掃墓" means:',opts:["clean the kitchen","pay respects at the tomb","row a boat","wrap zong"],ans:1},
{q:'"鹹糉" is:',opts:["sweet","savoury","spicy","sour"],ans:1},
{q:'"鄉下" here means:',opts:["the countryside / ancestral village","a shopping mall","the MTR","school"],ans:1},
{q:'Important 重 is pronounced:',opts:["cung5 (heavy)","cung4 (important)","zung6","cung1"],ans:1},
{q:'"紙錢" is:',opts:["salary","joss paper","a bill at yum cha","a red packet"],ans:1}
]},

{id:161,title:"L61 身體",subtitle:"Body parts · 頭手脚 痛邊度",
vocab:[
{c:"頭",j:"tau4",e:"head"},
{c:"眼",j:"ngaan5",e:"eye"},
{c:"耳",j:"ji5",e:"ear"},
{c:"鼻",j:"bei6",e:"nose"},
{c:"口",j:"hau2",e:"mouth"},
{c:"牙",j:"ngaa4",e:"tooth"},
{c:"頸",j:"geng2",e:"neck"},
{c:"肩",j:"gin1",e:"shoulder"},
{c:"手",j:"sau2",e:"hand / arm"},
{c:"手指",j:"sau2 zi2",e:"finger"},
{c:"胸",j:"hung1",e:"chest"},
{c:"肚",j:"tou5",e:"belly / stomach"},
{c:"背",j:"bui3",e:"back"},
{c:"腰",j:"jiu1",e:"waist / lower back"},
{c:"腳",j:"goek3",e:"foot / leg"},
{c:"膝頭",j:"sat1 tau4",e:"knee"},
{c:"痛",j:"tung3",e:"to hurt"},
{c:"痕",j:"han4",e:"itchy"},
{c:"腫",j:"zung2",e:"swollen"},
{c:"瘀",j:"jyu2",e:"bruised"}
],
dialogue:[
{speaker:"A",c:"你邊度痛啊？",j:"nei5 bin1 dou6 tung3 aa3?",e:"Where does it hurt?"},
{speaker:"B",c:"腰同膝頭。行山行親。",j:"jiu1 tung4 sat1 tau4. haang4 saan1 haang4 can1.",e:"Lower back and knees. Tweaked them hiking."},
{speaker:"A",c:"手得唔得？肩呢？",j:"sau2 dak1 m4 dak1? gin1 ne1?",e:"Hands OK? Shoulders?"},
{speaker:"B",c:"手得。肩有啲痕，唔係痛。",j:"sau2 dak1. gin1 jau5 di1 han4, m4 hai6 tung3.",e:"Hands fine. Shoulders a bit itchy, not painful."},
{speaker:"A",c:"頭暈唔暈？眼花唔花？",j:"tau4 wan4 m4 wan4? ngaan5 faa1 m4 faa1?",e:"Dizzy? Blurry vision?"},
{speaker:"B",c:"唔暈。牙倒是有啲痛，可能上火。",j:"m4 wan4. ngaa4 dou6 si6 jau5 di1 tung3, ho2 nang4 soeng5 fo2.",e:"Not dizzy. Teeth hurt a bit though — maybe 'heatiness'."},
{speaker:"A",c:"腳腫咗未？有冇瘀？",j:"goek3 zung2 zo2 mei6? jau5 mou5 jyu2?",e:"Feet swollen? Any bruise?"},
{speaker:"B",c:"冇腫。膝頭有少少瘀。",j:"mou5 zung2. sat1 tau4 jau5 siu2 siu2 jyu2.",e:"Not swollen. A small bruise on the knee."},
{speaker:"A",c:"背同胸呢？深呼吸試下。",j:"bui3 tung4 hung1 ne1? sam1 fu1 kap1 si3 haa5.",e:"Back and chest? Try a deep breath."},
{speaker:"B",c:"得。頸有啲硬。休息就得。",j:"dak1. geng2 jau5 di1 ngaang6. jau1 sik1 zau6 dak1.",e:"OK. Neck's a bit stiff. Rest will do."}
],
grammar:[
{pattern:"邊度痛",desc:"Where does it hurt? Point and name the body part.",ex:"你邊度痛啊？腰同膝頭。(nei5 bin1 dou6 tung3 aa3? jiu1 tung4 sat1 tau4)",en:"Where does it hurt? Lower back and knees."},
{pattern:"Verb + 親 (can1)",desc:"Got hurt doing it. 行親, 撞親, 冷親.",ex:"行山行親。(haang4 saan1 haang4 can1)",en:"Tweaked it hiking."},
{pattern:"痕 vs 痛 vs 腫 vs 瘀",desc:"Itchy / painful / swollen / bruised. Four states of 'something's wrong'.",ex:"肩有啲痕，唔係痛。膝頭有少少瘀。(gin1 jau5 di1 han4, m4 hai6 tung3. sat1 tau4 jau5 siu2 siu2 jyu2)",en:"Shoulder a bit itchy, not pain. Small bruise on the knee."},
{pattern:"暈 / 花",desc:"頭暈 = dizzy. 眼花 = blurry / seeing stars.",ex:"頭暈唔暈？眼花唔花？(tau4 wan4 m4 wan4? ngaan5 faa1 m4 faa1?)",en:"Dizzy? Blurry vision?"},
{pattern:"上火 (soeng5 fo2)",desc:"Heatiness — HK/Chinese medicine talk, very common.",ex:"牙有啲痛，可能上火。(ngaa4 jau5 di1 tung3, ho2 nang4 soeng5 fo2)",en:"Teeth hurt a bit — maybe heatiness."}
],

{q:'"腰" means:',opts:["neck","waist / lower back","knee","finger"],ans:1},
{q:'"膝頭" means:',opts:["elbow","knee","ankle","shoulder"],ans:1},
{q:'"痕" means:',opts:["painful","itchy","swollen","bruised"],ans:1},
{q:'"腫" means:',opts:["itchy","swollen","broken","numb"],ans:1},
{q:'"瘀" means:',opts:["cut","bruised","burned","itchy"],ans:1},
{q:'"行親" means:',opts:["walked well","got hurt while walking/hiking","ran fast","got lost"],ans:1},
{q:'"頭暈" means:',opts:["headache only","dizzy","smart","asleep"],ans:1},
{q:'"牙" means:',opts:["tongue","tooth","lip","chin"],ans:1}
]},

{id:162,title:"L62 味道",subtitle:"Taste · 甜鹹酸辣 鮮淡",
vocab:[
{c:"味道",j:"mei6 dou6",e:"taste / flavour / smell"},
{c:"甜",j:"tim4",e:"sweet"},
{c:"鹹",j:"haam4",e:"salty"},
{c:"酸",j:"syun1",e:"sour"},
{c:"辣",j:"laat6",e:"spicy"},
{c:"苦",j:"fu2",e:"bitter"},
{c:"鮮",j:"sin1",e:"fresh (seafood/taste)"},
{c:"淡",j:"taam5",e:"bland / not salty enough"},
{c:"膩",j:"nei6",e:"rich / greasy"},
{c:"香",j:"hoeng1",e:"fragrant / aromatic"},
{c:"臭",j:"cau3",e:"stinky"},
{c:"燶",j:"nung1",e:"burnt"},
{c:"好食",j:"hou2 sik6",e:"tasty"},
{c:"難食",j:"naan4 sik6",e:"tastes bad"},
{c:"入味",j:"jap6 mei6",e:"well seasoned / flavour has gone in"},
{c:"夠味",j:"gau3 mei6",e:"enough flavour"},
{c:"太",j:"taai3",e:"too"},
{c:"少少",j:"siu2 siu2",e:"a little"},
{c:"加",j:"gaa1",e:"to add"},
{c:"減",j:"gaam2",e:"to reduce"}
],
dialogue:[
{speaker:"A",c:"試下。味道點啊？",j:"si3 haa5. mei6 dou6 dim2 aa3?",e:"Try it. How's the taste?"},
{speaker:"B",c:"有啲淡。可唔可以加鹽？",j:"jau5 di1 taam5. ho2 m4 ho2 ji5 gaa1 jim4?",e:"A bit bland. Can we add salt?"},
{speaker:"A",c:"加咗。而家鹹唔鹹？",j:"gaa1 zo2. ji4 gaa1 haam4 m4 haam4?",e:"Added. Salty enough now?"},
{speaker:"B",c:"夠味。酸辣都有，唔膩。",j:"gau3 mei6. syun1 laat6 dou1 jau5, m4 nei6.",e:"Enough flavour. Sour and spicy both there, not greasy."},
{speaker:"A",c:"湯會唔會太甜？我放咗少少糖。",j:"tong1 wui5 m4 wui5 taai3 tim4? ngo5 fong3 zo2 siu2 siu2 tong4.",e:"Is the soup too sweet? I put a little sugar."},
{speaker:"B",c:"唔甜。魚好鮮。有冇燶到？",j:"m4 tim4. jyu2 hou2 sin1. jau5 mou5 nung1 dou3?",e:"Not sweet. Fish is fresh. Did anything burn?"},
{speaker:"A",c:"冇。苦瓜就苦，你食唔食得？",j:"mou5. fu2 gwaa1 zau6 fu2, nei5 sik6 m4 sik6 dak1?",e:"No. The bitter melon is bitter — can you eat it?"},
{speaker:"B",c:"食得。入味就得。難食我就剩。",j:"sik6 dak1. jap6 mei6 zau6 dak1. naan4 sik6 ngo5 zau6 cing4.",e:"Yes. As long as the flavour's in. If it tastes bad I'll leave it."},
{speaker:"A",c:"臭豆腐你呢？",j:"cau3 dau6 fu6 nei5 ne1?",e:"Stinky tofu?"},
{speaker:"B",c:"香過臭。我鍾意。減辣就完美。",j:"hoeng1 gwo3 cau3. ngo5 zung1 ji3. gaam2 laat6 zau6 jyun4 mei5.",e:"More fragrant than stinky. I like it. Less chilli and it's perfect."}
],
grammar:[
{pattern:"淡 / 夠味 / 入味",desc:"Not salty enough / enough flavour / the seasoning has gone in.",ex:"有啲淡。夠味。入味就得。(jau5 di1 taam5. gau3 mei6. jap6 mei6 zau6 dak1)",en:"A bit bland. Enough flavour. Once it's gone in, it's fine."},
{pattern:"太 + taste",desc:"Too sweet/salty/spicy. 太甜, 太鹹, 太辣.",ex:"會唔會太甜？唔甜。(wui5 m4 wui5 taai3 tim4? m4 tim4)",en:"Too sweet? Not sweet."},
{pattern:"食唔食得",desc:"Can you eat (this)? Tolerance, not permission.",ex:"苦瓜你食唔食得？食得。(fu2 gwaa1 nei5 sik6 m4 sik6 dak1? sik6 dak1)",en:"Can you eat bitter melon? Yes."},
{pattern:"燶到",desc:"Burnt (as a result). 有冇燶到？",ex:"有冇燶到？冇。(jau5 mou5 nung1 dou3? mou5)",en:"Did it burn? No."},
{pattern:"減辣 / 加鹽",desc:"Reduce chilli / add salt. Kitchen A-not-A cousins.",ex:"可唔可以加鹽？減辣就完美。(ho2 m4 ho2 ji5 gaa1 jim4? gaam2 laat6 zau6 jyun4 mei5)",en:"Can we add salt? Less chilli and it's perfect."}
],
quiz:[
{q:'"淡" for food means:',opts:["too salty","bland / not salty enough","spicy","burnt"],ans:1},
{q:'"膩" means:',opts:["fresh","rich / greasy","sour","bitter"],ans:1},
{q:'"鮮" here means:',opts:["bright colour","fresh (taste)","spicy","cheap"],ans:1},
{q:'"燶" means:',opts:["raw","burnt","frozen","sweet"],ans:1},
{q:'"入味" means:',opts:["no flavour","well seasoned / flavour has gone in","too spicy","too sweet"],ans:1},
{q:'"苦" means:',opts:["sweet","bitter","salty","sour"],ans:1},
{q:'"夠味" means:',opts:["not enough taste","enough flavour","burnt","stinky"],ans:1},
{q:'"難食" means:',opts:["delicious","tastes bad","too hot to eat","not cooked"],ans:1}
]},

{id:163,title:"L63 介紹",subtitle:"Introducing people · 呢位、認識、做咩",
vocab:[
{c:"介紹",j:"gaai3 siu6",e:"to introduce"},
{c:"呢位",j:"ni1 wai2",e:"this (person, polite)"},
{c:"認識",j:"jing6 sik1",e:"to know (someone); to meet"},
{c:"久仰",j:"gau2 joeng5",e:"I've heard a lot about you"},
{c:"請多指教",j:"cing2 do1 zi2 gaau3",e:"please teach me / be kind to me"},
{c:"同事",j:"tung4 si6",e:"colleague"},
{c:"朋友",j:"pang4 jau5",e:"friend"},
{c:"同學",j:"tung4 hok6",e:"classmate"},
{c:"老闆",j:"lou5 baan2",e:"boss"},
{c:"做咩嘅",j:"zou6 me1 ge3",e:"what do you do (work)"},
{c:"做",j:"zou6",e:"to do / to work as"},
{c:"公司",j:"gung1 si1",e:"company"},
{c:"行業",j:"hong4 jip6",e:"industry"},
{c:"邊度人",j:"bin1 dou6 jan4",e:"where are you from"},
{c:"住",j:"zyu6",e:"to live"},
{c:"好開心識到你",j:"hou2 hoi1 sam1 sik1 dou2 nei5",e:"glad to meet you"},
{c:"交換",j:"gaau1 wun6",e:"to exchange"},
{c:"名片",j:"ming4 pin2",e:"name card"},
{c:"聯絡",j:"lyun4 lok3",e:"to contact"},
{c:"保持聯絡",j:"bou2 ci4 lyun4 lok3",e:"keep in touch"}
],
dialogue:[
{speaker:"A",c:"呢位係我同事阿文。阿文，呢位係美美。",j:"ni1 wai2 hai6 ngo5 tung4 si6 aa3 man4. aa3 man4, ni1 wai2 hai6 mei5 mei5.",e:"This is my colleague Man. Man, this is Meimei."},
{speaker:"B",c:"你好。好開心識到你。",j:"nei5 hou2. hou2 hoi1 sam1 sik1 dou2 nei5.",e:"Hi. Glad to meet you."},
{speaker:"A",c:"美美做咩嘅？",j:"mei5 mei5 zou6 me1 ge3?",e:"Meimei, what do you do?"},
{speaker:"B",c:"我做設計。你呢？邊度人啊？",j:"ngo5 zou6 cit3 gai3. nei5 ne1? bin1 dou6 jan4 aa3?",e:"I do design. You? Where are you from?"},
{speaker:"A",c:"我廣州人，而家住九龍。行業都係設計。",j:"ngo5 gwong2 zau1 jan4, ji4 gaa1 zyu6 gau2 lung4. hong4 jip6 dou1 hai6 cit3 gai3.",e:"Guangzhou, live in Kowloon now. Same industry — design."},
{speaker:"B",c:"久仰。請多指教。交換名片？",j:"gau2 joeng5. cing2 do1 zi2 gaau3. gaau1 wun6 ming4 pin2?",e:"I've heard about you. Please be kind to me. Exchange cards?"},
{speaker:"A",c:"得。之後保持聯絡。",j:"dak1. zi1 hau6 bou2 ci4 lyun4 lok3.",e:"Yes. Keep in touch after."},
{speaker:"B",c:"你哋點認識啊？",j:"nei5 dei6 dim2 jing6 sik1 aa3?",e:"How did you two meet?"},
{speaker:"A",c:"公司聚會。阿文係老闆介紹。",j:"gung1 si1 zeoi6 wui2. aa3 man4 hai6 lou5 baan2 gaai3 siu6.",e:"A company gathering. The boss introduced Man."},
{speaker:"B",c:"原來。今晚多謝你介紹。",j:"jyun4 loi4. gam1 maan5 do1 ze6 nei5 gaai3 siu6.",e:"I see. Thanks for the intro tonight."}
],
grammar:[
{pattern:"呢位係…",desc:"This is… (polite 位). Don't point with 呢個 for people you respect.",ex:"呢位係我同事阿文。(ni1 wai2 hai6 ngo5 tung4 si6 aa3 man4)",en:"This is my colleague Man."},
{pattern:"做咩嘅？",desc:"What do you do? 嘅 turns it into a type/kind question.",ex:"美美做咩嘅？我做設計。(mei5 mei5 zou6 me1 ge3? ngo5 zou6 cit3 gai3)",en:"What do you do? I do design."},
{pattern:"邊度人",desc:"Where are you from (origin). Not 你是哪裡人.",ex:"你邊度人啊？我廣州人。(nei5 bin1 dou6 jan4 aa3? ngo5 gwong2 zau1 jan4)",en:"Where are you from? Guangzhou."},
{pattern:"點認識",desc:"How did you meet / know each other?",ex:"你哋點認識啊？公司聚會。(nei5 dei6 dim2 jing6 sik1 aa3? gung1 si1 zeoi6 wui2)",en:"How did you meet? A company gathering."},
{pattern:"保持聯絡",desc:"Keep in touch. Closing line after cards.",ex:"之後保持聯絡。(zi1 hau6 bou2 ci4 lyun4 lok3)",en:"Keep in touch after."}
],
quiz:[
{q:'"呢位" is a polite way to say:',opts:["this thing","this person","that street","my boss only"],ans:1},
{q:'"做咩嘅" asks:',opts:["what you ate","what you do (work)","where you live","your age"],ans:1},
{q:'"邊度人" asks:',opts:["where you live now","where you're from","your job","your age"],ans:1},
{q:'"認識" means:',opts:["forget","know / meet someone","hate","hire"],ans:1},
{q:'"名片" means:',opts:["credit card","name card","passport","ticket"],ans:1},
{q:'"保持聯絡" means:',opts:["hang up","keep in touch","delete the number","move away"],ans:1},
{q:'"介紹" means:',opts:["introduce","insult","ignore","interview"],ans:1},
{q:'"請多指教" is:',opts:["a complaint","a polite 'please be kind to me'","an order","a goodbye only"],ans:1}
]},

{id:164,title:"L64 電話",subtitle:"On the phone · 喂、搵邊個、唔喺度",
vocab:[
{c:"喂",j:"wai3",e:"hello (on the phone)"},
{c:"搵",j:"wan2",e:"looking for (someone)"},
{c:"唔喺度",j:"m4 hai2 dou6",e:"not in / not here"},
{c:"聽錯",j:"teng1 co3",e:"misheard"},
{c:"訊號差",j:"seon3 hou6 caa1",e:"bad signal"},
{c:"聽唔清",j:"teng1 m4 cing1",e:"can't hear clearly"},
{c:"遲啲打返",j:"ci4 di1 daa2 faan1",e:"call back later"},
{c:"留言",j:"lau4 jin4",e:"leave a message"},
{c:"內線",j:"noi6 sin3",e:"extension"},
{c:"轉駁",j:"zyun3 bok3",e:"to transfer (a call)"},
{c:"收線",j:"sau1 sin3",e:"hang up"},
{c:"未接",j:"mei6 zip3",e:"missed (call)"},
{c:"來電",j:"loi4 din6",e:"incoming call"},
{c:"接通",j:"zip3 tung1",e:"got through"},
{c:"忙線",j:"mong4 sin3",e:"line busy"},
{c:"錯號",j:"co3 hou6",e:"wrong number"},
{c:"公司電話",j:"gung1 si1 din6 waa2",e:"office number"},
{c:"私人電話",j:"si1 jan4 din6 waa2",e:"personal number"},
{c:"而家方便",j:"ji4 gaa1 fong1 bin6",e:"convenient now"},
{c:"唔方便講",j:"m4 fong1 bin6 gong2",e:"can't talk (now)"}
],
dialogue:[
{speaker:"A",c:"喂，請問阿文喺唔喺度？",j:"wai3, cing2 man6 aa3 man4 hai2 m4 hai2 dou6?",e:"Hello, is Man there?"},
{speaker:"B",c:"唔喺度。佢出咗去。你邊位啊？",j:"m4 hai2 dou6. keoi5 ceot1 zo2 heoi3. nei5 bin1 wai2 aa3?",e:"Not in. He's gone out. Who's calling?"},
{speaker:"A",c:"我姓陳。可唔可以留言？",j:"ngo5 sing3 can4. ho2 m4 ho2 ji5 lau4 jin4?",e:"Surname Chan. Can I leave a message?"},
{speaker:"B",c:"得。定我轉駁內線？訊號有啲差。",j:"dak1. ding6 ngo5 zyun3 bok3 noi6 sin3? seon3 hou6 jau5 di1 caa1.",e:"Yes. Or I transfer to the extension? Signal's a bit bad."},
{speaker:"A",c:"聽唔清。你慢啲講。",j:"teng1 m4 cing1. nei5 maan6 di1 gong2.",e:"Can't hear clearly. Speak slower."},
{speaker:"B",c:"對唔住。而家方便講唔方便？",j:"deoi3 m4 zyu6. ji4 gaa1 fong1 bin6 gong2 m4 fong1 bin6?",e:"Sorry. Convenient to talk now?"},
{speaker:"A",c:"我唔方便講。遲啲打返俾佢。",j:"ngo5 m4 fong1 bin6 gong2. ci4 di1 daa2 faan1 bei2 keoi5.",e:"I can't talk. I'll call him back later."},
{speaker:"B",c:"好。如果忙線就留低。唔好收線太快。",j:"hou2. jyu4 gwo2 mong4 sin3 zau6 lau4 dai1. m4 hou2 sau1 sin3 taai3 faai3.",e:"OK. If it's busy, leave a message. Don't hang up too fast."},
{speaker:"A",c:"頭先聽錯，以為錯號。",j:"tau4 sin1 teng1 co3, ji5 wai4 co3 hou6.",e:"I misheard just now — thought it was a wrong number."},
{speaker:"B",c:"唔係錯號。公司電話打呢條。拜拜。",j:"m4 hai6 co3 hou6. gung1 si1 din6 waa2 daa2 ni1 tiu4. baai1 baai3.",e:"Not a wrong number. Office line is this one. Bye."}
],
grammar:[
{pattern:"喂 (wai3)",desc:"Phone hello. Not 你好 as the first sound. Tone 3.",ex:"喂，請問阿文喺唔喺度？(wai3, cing2 man6 aa3 man4 hai2 m4 hai2 dou6?)",en:"Hello, is Man there?"},
{pattern:"喺唔喺度",desc:"Is (he) in? A-not-A of 喺度.",ex:"阿文喺唔喺度？唔喺度。(aa3 man4 hai2 m4 hai2 dou6? m4 hai2 dou6)",en:"Is Man in? Not in."},
{pattern:"你邊位啊？",desc:"Who's calling? Polite 位.",ex:"你邊位啊？我姓陳。(nei5 bin1 wai2 aa3? ngo5 sing3 can4)",en:"Who's calling? Surname Chan."},
{pattern:"聽唔清 vs 聽錯",desc:"Can't hear clearly vs heard the wrong thing.",ex:"聽唔清。頭先聽錯。(teng1 m4 cing1. tau4 sin1 teng1 co3)",en:"Can't hear clearly. I misheard just now."},
{pattern:"打返俾佢",desc:"Call him back. 返 = back.",ex:"遲啲打返俾佢。(ci4 di1 daa2 faan1 bei2 keoi5)",en:"I'll call him back later."}
],
quiz:[
{q:'On the phone, hello is:',opts:["你好 only","喂 wai3","早晨","拜拜"],ans:1},
{q:'"唔喺度" means:',opts:["busy line","not in","wrong number","hang up"],ans:1},
{q:'"聽唔清" means:',opts:["don't want to hear","can't hear clearly","misdialled","busy"],ans:1},
{q:'"留言" means:',opts:["hang up","leave a message","transfer","shout"],ans:1},
{q:'"忙線" means:',opts:["free line","line busy","wrong number","voicemail"],ans:1},
{q:'"錯號" means:',opts:["right number","wrong number","extension","signal"],ans:1},
{q:'"轉駁" means:',opts:["hang up","transfer the call","redial","whisper"],ans:1},
{q:'"你邊位啊" asks:',opts:["where you live","who's calling","the time","the weather"],ans:1}
]},

{id:165,title:"L65 數字",subtitle:"Numbers 2 · 第、幾多、半、成、零",
vocab:[
{c:"第",j:"dai6",e:"ordinal (第一)"},
{c:"幾多",j:"gei2 do1",e:"how many / how much"},
{c:"幾",j:"gei2",e:"a few / how many (with classifier)"},
{c:"半",j:"bun3",e:"half"},
{c:"成",j:"seng4",e:"about / around (成十個)"},
{c:"零",j:"ling4",e:"zero; and (一百零八)"},
{c:"幾多錢",j:"gei2 do1 cin2",e:"how much money"},
{c:"幾多歲",j:"gei2 do1 seoi3",e:"how old"},
{c:"幾個",j:"gei2 go3",e:"how many (items)"},
{c:"十幾",j:"sap6 gei2",e:"ten-odd / around 10–19"},
{c:"二十幾",j:"ji6 sap6 gei2",e:"twenty-odd"},
{c:"一百",j:"jat1 baak3",e:"one hundred"},
{c:"一千",j:"jat1 cin1",e:"one thousand"},
{c:"一萬",j:"jat1 maan6",e:"ten thousand"},
{c:"一半",j:"jat1 bun3",e:"one half"},
{c:"大部分",j:"daai6 bou6 fan6",e:"most / the majority"},
{c:"全部",j:"cyun4 bou6",e:"all"},
{c:"有啲",j:"jau5 di1",e:"some"},
{c:"冇幾個",j:"mou5 gei2 go3",e:"not many"},
{c:"差唔多",j:"caa1 m4 do1",e:"about / roughly"}
],
dialogue:[
{speaker:"A",c:"你今年幾多歲？",j:"nei5 gam1 nin4 gei2 do1 seoi3?",e:"How old are you this year?"},
{speaker:"B",c:"二十幾。你呢？",j:"ji6 sap6 gei2. nei5 ne1?",e:"Twenty-something. You?"},
{speaker:"A",c:"三十半。班入面第幾啊？",j:"saam1 sap6 bun3. baan1 jap6 min6 dai6 gei2 aa3?",e:"Thirty and a half. Which number in the class?"},
{speaker:"B",c:"我第十六。成二十個人。",j:"ngo5 dai6 sap6 luk6. seng4 ji6 sap6 go3 jan4.",e:"I'm 16th. Around twenty people."},
{speaker:"A",c:"幾多錢啊，嗰個課程？",j:"gei2 do1 cin2 aa3, go2 go3 fo3 cing4?",e:"How much is that course?"},
{speaker:"B",c:"一萬零八百。有啲貴。",j:"jat1 maan6 ling4 baat3 baak3. jau5 di1 gwai3.",e:"10,800. A bit expensive."},
{speaker:"A",c:"大部分人報未？",j:"daai6 bou6 fan6 jan4 bou3 mei6?",e:"Have most people signed up yet?"},
{speaker:"B",c:"冇幾個。差唔多一半。",j:"mou5 gei2 go3. caa1 m4 do1 jat1 bun3.",e:"Not many. About half."},
{speaker:"A",c:"十幾個人都唔報，我都再諗。",j:"sap6 gei2 go3 jan4 dou1 m4 bou3, ngo5 dou1 zoi3 nam2.",e:"If ten-odd people aren't signing up, I'll think again too."},
{speaker:"B",c:"全部報就平啲。你決定啦。",j:"cyun4 bou6 bou3 zau6 peng4 di1. nei5 kyut3 ding6 laa1.",e:"If everyone signs up it's cheaper. You decide."}
],
grammar:[
{pattern:"幾多 vs 幾 + classifier",desc:"幾多錢 / 幾多歲 need 多. 幾個人 drops 多. Don't say 幾多人 for count of people — 幾多個人 or 幾個人.",ex:"你幾多歲？成二十個人。(nei5 gei2 do1 seoi3? seng4 ji6 sap6 go3 jan4)",en:"How old are you? Around twenty people."},
{pattern:"第 + number",desc:"Ordinal. 第十六, 第幾.",ex:"班入面第幾啊？我第十六。(baan1 jap6 min6 dai6 gei2 aa3? ngo5 dai6 sap6 luk6)",en:"Which number in the class? I'm 16th."},
{pattern:"成 + number",desc:"About. 成二十個 ≈ around 20. Vague on purpose.",ex:"成二十個人。(seng4 ji6 sap6 go3 jan4)",en:"Around twenty people."},
{pattern:"零 in large numbers",desc:"一百零八, 一萬零八百. The 零 marks a gap.",ex:"一萬零八百。(jat1 maan6 ling4 baat3 baak3)",en:"10,800."},
{pattern:"十幾 / 二十幾",desc:"Ten-odd / twenty-something. 幾 = a few unspecified.",ex:"二十幾。十幾個人都唔報。(ji6 sap6 gei2. sap6 gei2 go3 jan4 dou1 m4 bou3)",en:"Twenty-something. Ten-odd people aren't signing up."}
],

{q:'"第十六" means:',opts:["16 dollars","16th","60th","6th"],ans:1},
{q:'"二十幾" means:',opts:["exactly 20","twenty-something","200","12"],ans:1},
{q:'"成二十個" means:',opts:["exactly 20","around 20","2","200"],ans:1},
{q:'"一萬零八百" is:',opts:["1,800","10,800","18,000","108"],ans:1},
{q:'"冇幾個" means:',opts:["too many","not many","all of them","zero always"],ans:1},
{q:'"一半" means:',opts:["all","one half","a few","none"],ans:1},
{q:'"大部分" means:',opts:["none","most","exactly half","one person"],ans:1},
{q:'"幾多歲" asks:',opts:["price","age","floor","time"],ans:1}
]}

{id:166,title:"L66 日子",subtitle:"Days and weeks · 今個禮拜、平日、週末",

{c:"禮拜五",j:"lai5 baai3 ng5",e:"Friday"},
{c:"禮拜六",j:"lai5 baai3 luk6",e:"Saturday"},
{c:"禮拜日",j:"lai5 baai3 jat6",e:"Sunday"},
{c:"平日",j:"ping4 jat6",e:"weekdays"},
{c:"週末",j:"zau1 mut6",e:"weekend"},
{c:"每日",j:"mui5 jat6",e:"every day"},
{c:"成日",j:"sing4 jat6",e:"always / all day"},

{c:"很少",j:"han2 siu2",e:"rarely (also 好少)"},
{c:"好少",j:"hou2 siu2",e:"rarely"},

{c:"隔日",j:"gaak3 jat6",e:"every other day"},

{c:"今年",j:"gam1 nin4",e:"this year"}
],
dialogue:[
{speaker:"A",c:"今個禮拜你得唔得閒？",j:"gam1 go3 lai5 baai3 nei5 dak1 m4 dak1 haan4?",e:"Are you free this week?"},
{speaker:"B",c:"平日唔得。禮拜六禮拜日得。",j:"ping4 jat6 m4 dak1. lai5 baai3 luk6 lai5 baai3 jat6 dak1.",e:"Weekdays no. Saturday and Sunday yes."},
{speaker:"A",c:"上個禮拜見唔到你。去咗邊？",j:"soeng6 go3 lai5 baai3 gin3 m4 dou2 nei5. heoi3 zo2 bin1?",e:"Didn't see you last week. Where'd you go?"},
{speaker:"B",c:"出咗差。日日開會。好少出街。",j:"ceot1 zo2 caai1. jat6 jat6 hoi1 wui2. hou2 siu2 ceot1 gaai1.",e:"Work trip. Meetings every single day. Rarely went out."},
{speaker:"A",c:"下個禮拜一五得唔得？",j:"haa6 go3 lai5 baai3 jat1 ng5 dak1 m4 dak1?",e:"Next week Monday or Friday OK?"},
{speaker:"B",c:"禮拜一唔得。禮拜五夜晚得。",j:"lai5 baai3 jat1 m4 dak1. lai5 baai3 ng5 je6 maan5 dak1.",e:"Monday no. Friday evening yes."},
{speaker:"A",c:"你間中運動？定成日宅？",j:"nei5 gaan3 zung1 wan6 dung6? ding6 sing4 jat6 zaak6?",e:"Do you exercise occasionally, or stay in all the time?"},
{speaker:"B",c:"隔日跑。週末行山。今個月開始。",j:"gaak3 jat6 paau2. zau1 mut6 haang4 saan1. gam1 go3 jyut6 hoi1 ci2.",e:"Run every other day. Hike at the weekend. Started this month."},
{speaker:"A",c:"今年你有冇放年假？",j:"gam1 nin4 nei5 jau5 mou5 fong3 nin4 gaa3?",e:"Taking annual leave this year?"},
{speaker:"B",c:"有。下個禮拜開始。每日都想瞓。",j:"jau5. haa6 go3 lai5 baai3 hoi1 ci2. mui5 jat6 dou1 soeng2 fan3.",e:"Yes. Starts next week. I want to sleep every day."}
],
grammar:[
{pattern:"今個 / 上個 / 下個 + 禮拜",desc:"This / last / next week. 個 is required.",ex:"今個禮拜你得唔得閒？上個禮拜見唔到你。(gam1 go3 lai5 baai3 nei5 dak1 m4 dak1 haan4? soeng6 go3 lai5 baai3 gin3 m4 dou2 nei5)",en:"Free this week? Didn't see you last week."},
{pattern:"禮拜一 … 禮拜日",desc:"Days of the week. 禮拜日 = Sunday (not 禮拜七).",ex:"平日唔得。禮拜六禮拜日得。(ping4 jat6 m4 dak1. lai5 baai3 luk6 lai5 baai3 jat6 dak1)",en:"Weekdays no. Sat and Sun yes."},
{pattern:"日日 / 每日 / 成日 / 間中 / 好少",desc:"Every single day / every day / always / occasionally / rarely.",ex:"日日開會。間中運動。好少出街。(jat6 jat6 hoi1 wui2. gaan3 zung1 wan6 dung6. hou2 siu2 ceot1 gaai1)",en:"Meetings every single day. Exercise occasionally. Rarely go out."},
{pattern:"隔日",desc:"Every other day.",ex:"隔日跑。週末行山。(gaak3 jat6 paau2. zau1 mut6 haang4 saan1)",en:"Run every other day. Hike at the weekend."},
{pattern:"見唔到",desc:"Didn't get to see. 到 = succeed in seeing.",ex:"上個禮拜見唔到你。(soeng6 go3 lai5 baai3 gin3 m4 dou2 nei5)",en:"Didn't see you last week."}
],
quiz:[

{q:'"間中" means:',opts:["always","occasionally","never","tomorrow"],ans:1},
{q:'"日日" means:',opts:["sometimes","every single day","last week","rarely"],ans:1},
{q:'"好少" means:',opts:["often","rarely","always","this week"],ans:1},
{q:'"下個禮拜" means:',opts:["last week","next week","this week","yesterday"],ans:1}
]},

{id:167,title:"L67 東南西北",subtitle:"Compass · 東西北南 去邊邊",

{c:"九龍",j:"gau2 lung4",e:"Kowloon"},

{c:"離島",j:"lei4 dou2",e:"outlying islands"},
{c:"中環",j:"zung1 waan4",e:"Central"},

{c:"荃灣",j:"cyun4 waan1",e:"Tsuen Wan"},

dialogue:[
{speaker:"A",c:"你住港島定九龍？",j:"nei5 zyu6 gong2 dou2 ding6 gau2 lung4?",e:"Do you live on the Island or Kowloon?"},
{speaker:"B",c:"九龍。尖沙咀。你呢？",j:"gau2 lung4. zim1 saa1 zeoi2. nei5 ne1?",e:"Kowloon. TST. You?"},
{speaker:"A",c:"港島中環。過海就到對面海。",j:"gong2 dou2 zung1 waan4. gwo3 hoi2 zau6 dou3 deoi3 min6 hoi2.",e:"Central, HK Island. Cross the harbour and you're on the other side."},
{speaker:"B",c:"銅鑼灣喺東定西啊？",j:"tung4 lo4 waan1 hai2 dung1 ding6 sai1 aa3?",e:"Is Causeway Bay east or west?"},
{speaker:"A",c:"中環以東。上環就西多。",j:"zung1 waan4 ji5 dung1. soeng6 waan4 zau6 sai1 do1.",e:"East of Central. Sheung Wan is more west."},
{speaker:"B",c:"沙田同荃灣呢？新界邊邊？",j:"saa1 tin4 tung4 cyun4 waan1 ne1? san1 gaai3 bin1 bin1?",e:"Sha Tin and Tsuen Wan? Which part of the New Territories?"},
{speaker:"A",c:"沙田東北啲。荃灣西。離島更遠。",j:"saa1 tin4 dung1 bak1 di1. cyun4 waan1 sai1. lei4 dou2 gang3 jyun5.",e:"Sha Tin a bit northeast. Tsuen Wan west. Islands even further."},
{speaker:"B",c:"往機場搭邊條線？",j:"wong5 gei1 coeng4 daap3 bin1 tiu4 sin3?",e:"Which line towards the airport?"},
{speaker:"A",c:"機場快線。方向睇車頭。",j:"gei1 coeng4 faai3 sin3. fong1 hoeng3 tai2 ce1 tau4.",e:"Airport Express. Check the direction on the front of the train."},
{speaker:"B",c:"得。今日去邊？",j:"dak1. gam1 jat6 heoi3 bin1?",e:"OK. Where to today?"}
],
grammar:[
{pattern:"港島 / 九龍 / 新界 / 離島",desc:"The four big pieces of HK. First question: 你住邊？",ex:"你住港島定九龍？九龍。尖沙咀。(nei5 zyu6 gong2 dou2 ding6 gau2 lung4? gau2 lung4. zim1 saa1 zeoi2)",en:"Island or Kowloon? Kowloon. TST."},
{pattern:"對面海",desc:"The other side of the harbour. Island people saying Kowloon and vice versa.",ex:"過海就到對面海。(gwo3 hoi2 zau6 dou3 deoi3 min6 hoi2)",en:"Cross the harbour and you're on the other side."},
{pattern:"以東 / 西多",desc:"East of X / more on the west side.",ex:"中環以東。上環就西多。(zung1 waan4 ji5 dung1. soeng6 waan4 zau6 sai1 do1)",en:"East of Central. Sheung Wan is more west."},
{pattern:"往 + place",desc:"Bound for. 往機場.",ex:"往機場搭邊條線？(wong5 gei1 coeng4 daap3 bin1 tiu4 sin3?)",en:"Which line towards the airport?"},
{pattern:"去邊",desc:"Where to? Short and spoken.",ex:"今日去邊？(gam1 jat6 heoi3 bin1?)",en:"Where to today?"}
],

{id:168,title:"L68 講價",subtitle:"Bargaining · 平啲得唔得、當熟客",
vocab:[
{c:"講價",j:"gong2 gaa3",e:"to bargain"},
{c:"平啲",j:"peng4 di1",e:"a bit cheaper"},
{c:"再平",j:"zoi3 peng4",e:"even cheaper"},
{c:"最低",j:"zeoi3 dai1",e:"the lowest (price)"},
{c:"實價",j:"sat6 gaa3",e:"firm price / no bargaining"},
{c:"當熟客",j:"dong3 suk6 haak3",e:"treat as a regular"},
{c:"幫襯",j:"bong1 can3",e:"to patronise (a shop)"},
{c:"買多啲",j:"maai5 do1 di1",e:"buy more"},
{c:"包郵",j:"baau1 jau4",e:"free postage"},
{c:"減",j:"gaam2",e:"to reduce (price)"},
{c:"折",j:"zit3",e:"discount (九折 = 10% off)"},
{c:"九折",j:"gau2 zit3",e:"10% off"},
{c:"半價",j:"bun3 gaa3",e:"half price"},
{c:"抵",j:"dai2",e:"good value"},
{c:"唔抵",j:"m4 dai2",e:"not worth it"},
{c:"算啦",j:"syun3 laa1",e:"forget it"},
{c:"當唔到",j:"dong3 m4 dou3",e:"can't treat it as…"},
{c:"最後價",j:"zeoi3 hau6 gaa3",e:"final price"},
{c:"現金",j:"jin6 gam1",e:"cash"},
{c:"走貨",j:"zau2 fo3",e:"clear stock"}
],
dialogue:[
{speaker:"A",c:"呢件平啲得唔得？",j:"ni1 gin6 peng4 di1 dak1 m4 dak1?",e:"Can this be a bit cheaper?"},
{speaker:"B",c:"已經九折。再平就冇。",j:"ji5 ging1 gau2 zit3. zoi3 peng4 zau6 mou5.",e:"Already 10% off. No cheaper."},
{speaker:"A",c:"我買多兩件。當熟客啦。",j:"ngo5 maai5 do1 loeng5 gin6. dong3 suk6 haak3 laa1.",e:"I'll take two more. Treat me as a regular."},
{speaker:"B",c:"買三件就八折。現金再減十蚊。",j:"maai5 saam1 gin6 zau6 baat3 zit3. jin6 gam1 zoi3 gaam2 sap6 man1.",e:"Three pieces is 20% off. Cash, another ten dollars off."},
{speaker:"A",c:"抵啲。最後價係幾多？",j:"dai2 di1. zeoi3 hau6 gaa3 hai6 gei2 do1?",e:"Better value. What's the final price?"},
{speaker:"B",c:"二百四。走貨價。",j:"ji6 baak3 sei3. zau2 fo3 gaa3.",e:"$240. Clearance."},
{speaker:"A",c:"包郵唔包？",j:"baau1 jau4 m4 baau1?",e:"Postage included?"},
{speaker:"B",c:"店舖自取。郵寄唔包。",j:"dim3 pou3 zi6 ceoi2. jau4 gei3 m4 baau1.",e:"Pick up in store. Postage not included."},
{speaker:"A",c:"唔抵郵費。我自取。",j:"m4 dai2 jau4 fai3. ngo5 zi6 ceoi2.",e:"Postage isn't worth it. I'll pick up."},
{speaker:"B",c:"得。多謝幫襯。",j:"dak1. do1 ze6 bong1 can3.",e:"OK. Thanks for your custom."}
],
grammar:[
{pattern:"平啲得唔得",desc:"Can it be cheaper? The bargain opener.",ex:"呢件平啲得唔得？已經九折。(ni1 gin6 peng4 di1 dak1 m4 dak1? ji5 ging1 gau2 zit3)",en:"A bit cheaper? Already 10% off."},
{pattern:"九折 / 八折",desc:"HK discounts: 九折 = pay 90% (10% off). 八折 = 20% off. Not '9% off'.",ex:"已經九折。買三件就八折。(ji5 ging1 gau2 zit3. maai5 saam1 gin6 zau6 baat3 zit3)",en:"Already 10% off. Three pieces is 20% off."},
{pattern:"當熟客",desc:"Treat me as a regular — the social bargain.",ex:"我買多兩件。當熟客啦。(ngo5 maai5 do1 loeng5 gin6. dong3 suk6 haak3 laa1)",en:"I'll take two more. Treat me as a regular."},
{pattern:"抵 / 唔抵",desc:"Worth it / not worth it.",ex:"抵啲。唔抵郵費。(dai2 di1. m4 dai2 jau4 fai3)",en:"Better value. Postage isn't worth it."},
{pattern:"多謝幫襯",desc:"Thanks for shopping here. Shopkeeper close.",ex:"多謝幫襯。(do1 ze6 bong1 can3)",en:"Thanks for your custom."}
],
quiz:[
{q:'"講價" means:',opts:["pay full price","bargain","return an item","complain to a manager"],ans:1},
{q:'"九折" means:',opts:["90% off","10% off (pay 90%)","9 dollars","buy 9"],ans:1},
{q:'"八折" means:',opts:["8% off","20% off (pay 80%)","half price","free"],ans:1},
{q:'"抵" means:',opts:["too expensive","good value","broken","fake"],ans:1},
{q:'"當熟客" means:',opts:["ignore me","treat me as a regular","call the police","give a receipt"],ans:1},
{q:'"幫襯" means:',opts:["complain","patronise / shop here","steal","bargain only"],ans:1},
{q:'"走貨" means:',opts:["run away","clear stock","import","repair"],ans:1},
{q:'"最後價" means:',opts:["first offer","final price","original price","tax"],ans:1}
]},

{id:169,title:"L69 颱風",subtitle:"Typhoon signals · 幾號波、停工、掛",
vocab:[
{c:"颱風",j:"toi4 fung1",e:"typhoon"},
{c:"掛波",j:"gwaa3 bo1",e:"typhoon signal is up"},
{c:"幾號波",j:"gei2 hou6 bo1",e:"which signal"},
{c:"一號",j:"jat1 hou6",e:"T1 (standby)"},
{c:"三號",j:"saam1 hou6",e:"T3"},
{c:"八號",j:"baat3 hou6",e:"T8 (typically off work/school)"},
{c:"九號",j:"gau2 hou6",e:"T9"},
{c:"十號",j:"sap6 hou6",e:"T10"},
{c:"除下",j:"ceoi4 haa5",e:"to lower / cancel (a signal)"},
{c:"停工",j:"ting4 gung1",e:"stop work"},
{c:"停課",j:"ting4 fo3",e:"classes suspended"},
{c:"大風",j:"daai6 fung1",e:"strong wind"},
{c:"危險",j:"ngai4 him2",e:"danger / dangerous"},
{c:"逞強",j:"cing2 koeng4",e:"to tough it out / be a hero"},
{c:"儲水",j:"cyu5 seoi2",e:"to store water"},
{c:"儲糧",j:"cyu5 loeng4",e:"to store food"},
{c:"政府",j:"zing3 fu2",e:"government"},
{c:"指引",j:"zi2 jan5",e:"guidance / guidelines"},
{c:"改",j:"goi2",e:"to change (to another signal)"},
{c:"最勁",j:"zeoi3 ging6",e:"the fiercest / strongest"}
],
dialogue:[
{speaker:"A",c:"而家幾號波啊？",j:"ji4 gaa1 gei2 hou6 bo1 aa3?",e:"What's the signal now?"},
{speaker:"B",c:"三號。聽講話今晚改八號。",j:"saam1 hou6. teng1 gong2 waa6 gam1 maan5 goi2 baat3 hou6.",e:"T3. Heard it may go T8 tonight."},
{speaker:"A",c:"八號就停工停課。你返唔返？",j:"baat3 hou6 zau6 ting4 gung1 ting4 fo3. nei5 faan1 m4 faan1?",e:"T8 means work and school stop. Are you going in?"},
{speaker:"B",c:"掛八號之前返到屋企就得。",j:"gwaa3 baat3 hou6 zi1 cin4 faan1 dou3 uk1 kei2 zau6 dak1.",e:"Get home before T8 goes up and you're fine."},
{speaker:"A",c:"十號就唔好出街。大風危險。",j:"sap6 hou6 zau6 m4 hou2 ceot1 gaai1. daai6 fung1 ngai4 him2.",e:"T10, don't go out. Strong wind is dangerous."},
{speaker:"B",c:"係。除下先至出。唔好逞強。",j:"hai6. ceoi4 haa5 sin1 zi3 ceot1. m4 hou2 cing2 koeng4.",e:"Yes. Only go out after it's lowered. Don't be a hero."},
{speaker:"A",c:"一號得閒。三號開始買餸。",j:"jat1 hou6 dak1 haan4. saam1 hou6 hoi1 ci2 maai5 sung3.",e:"T1 is still free time. From T3, start buying groceries."},
{speaker:"B",c:"九號十號最勁。記得儲水儲糧。",j:"gau2 hou6 sap6 hou6 zeoi3 ging6. gei3 dak1 cyu5 seoi2 cyu5 loeng4.",e:"T9 and T10 are the fiercest. Remember to store water and food."},
{speaker:"A",c:"你公司八號仲要你返？",j:"nei5 gung1 si1 baat3 hou6 zung6 jiu3 nei5 faan1?",e:"Does your company still want you in at T8?"},
{speaker:"B",c:"唔使。政府指引跟。",j:"m4 sai2. zing3 fu2 zi2 jan5 gan1.",e:"No. Follow government guidance."}
],
grammar:[
{pattern:"幾號波",desc:"Which typhoon signal? 波 = the hoisted signal ball, still how people talk.",ex:"而家幾號波啊？三號。(ji4 gaa1 gei2 hou6 bo1 aa3? saam1 hou6)",en:"What's the signal now? T3."},
{pattern:"掛 / 除下",desc:"Hoist / lower the signal.",ex:"掛八號之前返到屋企。除下先至出。(gwaa3 baat3 hou6 zi1 cin4 faan1 dou3 uk1 kei2. ceoi4 haa5 sin1 zi3 ceot1)",en:"Get home before T8 is hoisted. Only go out after it's lowered."},
{pattern:"八號就停工停課",desc:"T8 → work and school stop. The practical rule.",ex:"八號就停工停課。(baat3 hou6 zau6 ting4 gung1 ting4 fo3)",en:"T8 means work and school stop."},
{pattern:"先至出",desc:"Only then go out. Safety 先至.",ex:"除下先至出。唔好逞強。(ceoi4 haa5 sin1 zi3 ceot1. m4 hou2 cing2 koeng4)",en:"Only go out after it's down. Don't be a hero."},
{pattern:"聽講話…",desc:"I heard that… Rumour mill during typhoons.",ex:"聽講話今晚改八號。(teng1 gong2 waa6 gam1 maan5 goi2 baat3 hou6)",en:"I heard it may go T8 tonight."}
],
quiz:[
{q:'"幾號波" asks:',opts:["the bus number","which typhoon signal","the floor","the price"],ans:1},
{q:'T8 in HK usually means:',opts:["go to the beach","work and school stop","only T1","fireworks"],ans:1},
{q:'"掛波" means:',opts:["play ball","the signal is up","cancel the signal","go shopping"],ans:1},
{q:'"除下" here means:',opts:["put on a coat","lower / cancel the signal","go upstairs","take a photo"],ans:1},
{q:'"停課" means:',opts:["extra class","classes suspended","exam","homework"],ans:1},
{q:'The fiercest signals are:',opts:["T1 only","T9 and T10","T3 only","no signal"],ans:1},
{q:'"停工" means:',opts:["overtime","stop work","start work","resign"],ans:1},
{q:'Get home:',opts:["after T10","before T8 is hoisted","never","at T1 only"],ans:1}
]}
