<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantonese Learner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--accent:#6c5ce7;--accent2:#a29bfe;--text:#e8e8f0;--text2:#9a9ab0;--green:#00b894;--red:#e17055;--yellow:#fdcb6e;--blue:#74b9ff;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:20px}
header{text-align:center;padding:30px 0;border-bottom:1px solid var(--surface2);margin-bottom:30px}
header h1{font-size:2em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--text2);margin-top:5px}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:10px 20px;background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:.95em;transition:all .2s}
#lessonTabs{gap:6px}
#lessonTabs .tab{padding:7px 12px;font-size:.82em}
#lessonBand{justify-content:center;margin-bottom:8px}
#lessonBand .tab{padding:6px 14px;font-size:.8em}
#lessonTabs .tab.done{border-color:var(--green)}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.lesson-nav .action-btn{flex:1;min-width:140px;text-align:center}
.ex-line{margin-top:8px;font-size:.85em;color:var(--text);line-height:1.4}
.ex-en{color:var(--text2);font-size:.8em;margin-top:2px}
.study-tip{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;color:var(--text2);font-size:.85em}
.study-tip b{color:var(--accent2)}
.due-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--surface2);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:.9em}
.due-row:hover{border-color:var(--accent)}
.due-n{color:var(--yellow);font-weight:700;min-width:3.5em;text-align:right}
.due-n.zero{color:var(--text2);font-weight:400}

.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mode-row{justify-content:center;margin-bottom:12px}
.mode-row .tab{font-weight:600}
.section{display:none;margin-bottom:30px}
.section.active{display:block}
h2{font-size:1.4em;margin-bottom:16px}
.dialogue-line{margin-bottom:16px;padding:12px 16px;border-radius:8px;border-left:3px solid var(--accent)}
.dialogue-line .speaker{font-weight:700;color:var(--accent2);margin-bottom:4px}
.dialogue-line .cantonese{font-size:1.15em;margin-bottom:6px}
.dialogue-line .jyutping{color:var(--text2);font-style:italic;font-size:.9em;margin-bottom:4px;display:none}
.dialogue-line .english{color:var(--yellow);font-size:.9em;display:none}
.toggle-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.toggle-btn{padding:6px 14px;background:var(--surface2);border:1px solid transparent;border-radius:20px;cursor:pointer;color:var(--text2);font-size:.85em;transition:all .2s}
.toggle-btn:hover{color:var(--text)}
.toggle-btn.on{background:var(--accent);color:#fff}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.vocab-card{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .3s;position:relative}
.vocab-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.vocab-card .front,.vocab-card .back{transition:opacity .3s}
.vocab-card .back{display:none}
.vocab-card.flipped .front{display:none}
.vocab-card.flipped .back{display:block}
.vocab-card .word{font-size:1.3em;font-weight:700;margin-bottom:2px}
.vocab-card .jp{color:var(--accent2);font-size:.85em;margin-bottom:4px}
.vocab-card .meaning{color:var(--text2);font-size:.9em}
.vocab-card .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7em;margin-top:6px;background:var(--surface2);color:var(--text2)}
.mastery-dots{display:flex;gap:3px;margin-top:6px}
.mastery-dots .dot{width:8px;height:8px;border-radius:50%;background:var(--surface2);transition:background .3s}
.mastery-dots .dot.f1{background:var(--red)}
.mastery-dots .dot.f2{background:var(--yellow)}
.mastery-dots .dot.f3{background:var(--blue)}
.mastery-dots .dot.f4{background:var(--green)}
.mastery-dots .dot.f5{background:var(--accent2)}
.grammar-card{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.grammar-card .pattern{color:var(--accent2);font-weight:700;margin-bottom:6px}
.grammar-card .example{color:var(--text);margin-bottom:4px}
.grammar-card .explanation{color:var(--text2);font-size:.9em;margin-top:6px}
.score-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-radius:var(--radius);margin-bottom:20px}
.score-bar .score{font-size:1.2em;font-weight:700;color:var(--green)}
.score-bar .total{color:var(--text2)}
.progress{height:4px;background:var(--surface2);border-radius:2px;flex:1}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.flashcard-area{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:16px}
.flashcard{width:100%;max-width:400px;height:220px;perspective:1000px;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.flashcard-front{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--surface2)}
.flashcard-back{background:linear-gradient(135deg,#2d1b69,#1a1d27);border:1px solid var(--accent);transform:rotateY(180deg)}
.flashcard-face .big{font-size:2em;font-weight:700}
.flashcard-face .sub{color:var(--accent2);font-size:1.1em;margin-top:4px}
.flashcard-face .hint{color:var(--text2);font-size:.85em;margin-top:8px}
.fc-controls{display:flex;gap:10px}
.fc-btn{padding:10px 20px;border-radius:8px;border:1px solid var(--surface2);background:var(--surface);color:var(--text);cursor:pointer;font-size:.9em;transition:all .2s}
.fc-btn:hover{border-color:var(--accent)}
.fc-btn.skip{border-color:var(--red);color:var(--red)}
.fc-btn.got-it{border-color:var(--green);color:var(--green)}
.fc-btn:disabled{opacity:.35;cursor:default}
.fc-counter{color:var(--text2);font-size:.85em}
.fc-mode-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.kb-hint{color:var(--text2);font-size:.75em;text-align:center}
.session-summary{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:24px;text-align:center;max-width:420px}
.session-summary h3{font-size:1.3em;margin-bottom:8px}
.session-stats{display:flex;justify-content:center;gap:24px;margin:16px 0}
.session-stats .stat{display:flex;flex-direction:column;align-items:center}
.session-stats .num{font-size:2em;font-weight:700}
.session-stats .label{color:var(--text2);font-size:.85em}
.quiz-container{margin-top:10px}
.quiz-q{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.quiz-q .q-text{font-size:1.05em;margin-bottom:12px}
.quiz-options{display:flex;flex-direction:column;gap:8px}
.quiz-opt{padding:10px 14px;background:var(--surface2);border:1px solid transparent;border-radius:8px;cursor:pointer;transition:all .2s;font-size:.95em}
.quiz-opt:hover{border-color:var(--accent)}
.quiz-opt.correct{background:var(--green);color:#fff;border-color:var(--green)}
.quiz-opt.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.quiz-opt.disabled{pointer-events:none;opacity:.7}
.quiz-modes{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.qmode-btn{padding:6px 14px;background:var(--surface2);border:1px solid transparent;border-radius:20px;cursor:pointer;color:var(--text2);font-size:.85em;transition:all .2s}
.qmode-btn:hover{color:var(--text)}
.qmode-btn.active{background:var(--accent);color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card .num{font-size:1.8em;font-weight:700}
.stat-card .label{color:var(--text2);font-size:.85em;margin-top:2px}
.stat-card.green .num{color:var(--green)}
.stat-card.yellow .num{color:var(--yellow)}
.stat-card.accent .num{color:var(--accent)}
.stat-card.blue .num{color:var(--blue)}
.stat-card.red .num{color:var(--red)}
.streak-display{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);margin-bottom:20px}
.streak-display .fire{font-size:1.5em}
.streak-display .count{font-size:1.3em;font-weight:700;color:var(--yellow)}
.streak-display .label{color:var(--text2)}
.mastery-chart{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:16px;margin-bottom:20px}
.mastery-chart h3{font-size:1.1em;margin-bottom:12px}
.chart-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chart-row .box-label{width:80px;color:var(--text2);font-size:.85em}
.chart-row .bar-track{flex:1;height:20px;background:var(--surface2);border-radius:4px;overflow:hidden}
.chart-row .bar-fill{height:100%;border-radius:4px;transition:width .3s}
.chart-row .count{color:var(--text);font-size:.85em;min-width:30px;text-align:right;font-weight:600}
.action-row{display:flex;gap:10px;flex-wrap:wrap}
.action-btn{padding:10px 18px;border-radius:8px;border:1px solid var(--surface2);background:var(--surface);color:var(--text);cursor:pointer;font-size:.9em;transition:all .2s}
.action-btn:hover{border-color:var(--accent)}
.action-btn.danger{border-color:var(--red);color:var(--red)}
.hidden-input{display:none}
.speak-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--surface2);background:var(--surface);cursor:pointer;font-size:.8em;transition:all .2s;vertical-align:top;margin-left:4px;line-height:1}
.speak-btn:hover{border-color:var(--accent);background:var(--accent)}
.speak-btn.speaking{background:var(--accent);animation:pulse .5s ease-in-out infinite}
.tone-1{color:#ff6b6b}.tone-2{color:#feca57}.tone-3{color:#48dbfb}.tone-4{color:#0abde3}.tone-5{color:#a29bfe}.tone-6{color:#55efc4}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* Matching Game */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.match-col{display:flex;flex-direction:column;gap:8px}
.match-col h3{font-size:.85em;color:var(--text2);margin-bottom:4px;padding-left:4px}
.match-card{padding:12px 16px;border-radius:8px;border:2px solid var(--surface2);background:var(--surface);cursor:pointer;transition:all .2s;text-align:center;font-size:1em}
.match-card:hover{border-color:var(--accent)}
.match-card.selected{border-color:var(--accent2);background:rgba(108,92,231,0.15)}
.match-card.matched{opacity:.4;border-color:var(--green);cursor:default}
.match-card.wrong{border-color:var(--red);animation:shake .3s}
.match-card.correct{border-color:var(--green);background:rgba(0,184,148,0.15);animation:pop .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.match-score{padding:12px 16px;background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.match-score .pairs{color:var(--green);font-weight:700;font-size:1.2em}
.match-score .attempts{color:var(--text2)}

/* Writing Grid Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-content{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:24px;max-width:420px;width:90%;text-align:center}
.modal-content h3{font-size:1.8em;margin-bottom:2px;color:var(--text)}
.modal-content .sub{color:var(--text2);font-size:.85em;margin-bottom:14px}
.modal-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:0 auto;max-width:320px}
.modal-cell{aspect-ratio:1;border:1px solid var(--surface2);border-radius:4px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--text)}
.modal-cell.ref{background:rgba(108,92,231,0.2);border-color:var(--accent);font-size:1.6em;font-weight:700}
.modal-cell.empty{background:transparent;border-color:var(--surface2)}
.modal-close-btn{padding:10px 28px;border-radius:8px;border:1px solid var(--surface2);background:var(--surface2);color:var(--text);cursor:pointer;font-size:.9em;margin-top:16px;transition:all .2s}
.modal-close-btn:hover{border-color:var(--accent);background:var(--accent);color:#fff}
.char-link{cursor:pointer;transition:all .2s;display:inline-block;padding:1px 3px;border-radius:3px;font-weight:700}
.char-link:hover{background:rgba(108,92,231,0.25)}

/* Achievements */
.achievement-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.achievement{padding:12px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--surface2);text-align:center;transition:all .3s}
.achievement.unlocked{border-color:var(--accent);background:rgba(108,92,231,0.08)}
.achievement .icon{font-size:1.6em;margin-bottom:2px}
.achievement .name{font-size:.75em;color:var(--text);font-weight:600}
.achievement .desc{font-size:.6em;color:var(--text2);margin-top:1px}
.achievement.locked{opacity:.35}
.spk-a{color:#ff6b6b}.spk-b{color:#48dbfb}

/* ── Writing Practice (word-based) ── */
.word-section{border:1px solid var(--surface2);border-radius:var(--radius);padding:16px;margin-bottom:14px;background:var(--surface)}
.word-header{display:flex;align-items:baseline;gap:6px;margin-bottom:2px}
.word-header .ch{font-size:1.3em;font-weight:700;color:var(--text)}
.word-header .jp{font-size:.85em;color:var(--text2)}
.word-meaning{font-size:.8em;color:var(--text2);font-style:italic;margin-bottom:8px}
.char-row{display:flex;gap:3px;margin-bottom:3px}
.char-row-center{justify-content:center}
.write-cell{width:34px;height:34px;border:1px solid var(--surface2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.2em;background:var(--surface2);color:var(--text);transition:all .1s}
.write-cell.ref{background:rgba(108,92,231,0.12);border-color:var(--accent);color:rgba(255,255,255,0.4);font-size:1.3em;font-weight:700;cursor:pointer}
.write-cell.ref:hover{background:rgba(108,92,231,0.25)}
.write-cell.prac{background:transparent;border-color:var(--surface2)}
.write-cell.prac:hover{border-color:var(--accent)}
.write-hint{font-size:.65em;color:var(--text2);text-align:center;margin-top:6px;opacity:.5}

/* Writing Modal - expanded */
.modal-grid-big{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:0 auto;max-width:340px}
.modal-cell-big{aspect-ratio:1;border:2px solid var(--surface2);border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--text);font-size:1.8em;font-weight:700}
.modal-cell-big.ref{background:rgba(108,92,231,0.15);border-color:var(--accent);color:rgba(255,255,255,0.4);cursor:pointer}
.modal-cell-big.prac{background:transparent;border-color:var(--surface2)}
.modal-cell-big.prac:hover{border-color:var(--accent)}


/* ── Matching Game ── */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.match-col{display:flex;flex-direction:column;gap:8px}
.match-col h3{font-size:.9em;color:var(--text2);margin-bottom:6px}
.match-card{padding:12px 16px;border-radius:8px;border:2px solid var(--surface2);background:var(--surface);cursor:pointer;transition:all .2s;text-align:center;font-size:1em}
.match-card:hover{border-color:var(--accent)}
.match-card.selected{border-color:var(--accent2);background:rgba(108,92,231,0.15)}
.match-card.matched{opacity:.4;border-color:var(--green);cursor:default}
.match-card.wrong{border-color:var(--red);animation:shake .3s}
.match-card.correct{border-color:var(--green);background:rgba(0,184,148,0.15)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.match-score{padding:12px 16px;background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.match-score .pairs{color:var(--green);font-weight:700}
.match-score .attempts{color:var(--text2)}

/* ── Writing Grid Modal ── */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-content{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:24px;max-width:420px;width:90%;text-align:center}
.modal-content h3{font-size:1.4em;margin-bottom:4px}
.modal-content .sub{color:var(--text2);font-size:.9em;margin-bottom:16px}
.modal-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:0 auto;max-width:280px}
.modal-cell{aspect-ratio:1;border:1px solid var(--surface2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.8em;background:var(--surface2);color:var(--text)}
.modal-cell.ref{background:rgba(108,92,231,0.2);border-color:var(--accent);font-size:2.2em}
.modal-cell.empty{background:transparent;border-color:var(--surface2)}
.modal-close{padding:10px 24px;border-radius:8px;border:1px solid var(--surface2);background:var(--surface2);color:var(--text);cursor:pointer;font-size:.9em;margin-top:16px;transition:all .2s}
.modal-close:hover{border-color:var(--accent)}
.char-btn{cursor:pointer;transition:all .2s;display:inline-block;padding:0 2px;border-radius:4px}
.char-btn:hover{background:rgba(108,92,231,0.2)}

/* ── Achievements ── */
.achievements-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.achievement{padding:14px 10px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--surface2);text-align:center;transition:all .3s}
.achievement.unlocked{border-color:var(--accent);background:rgba(108,92,231,0.08)}
.achievement .icon{font-size:1.8em;margin-bottom:4px}
.achievement .name{font-size:.8em;color:var(--text)}
.achievement .desc{font-size:.65em;color:var(--text2);margin-top:2px}
.achievement.locked{opacity:.45}

/* ── Speaker colors ── */
.speaker-a{color:#ff6b6b}.speaker-b{color:#48dbfb}

/* ── Progress tips ── */
.tip-box{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:16px;margin-bottom:20px}
.tip-box h4{font-size:.95em;color:var(--accent2);margin-bottom:6px}
.tip-box p{color:var(--text2);font-size:.85em}
.sentence-mode-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sentence-mode-btn{padding:5px 12px;background:var(--surface2);border:1px solid transparent;border-radius:16px;cursor:pointer;color:var(--text2);font-size:.8em;transition:all .2s}
.sentence-mode-btn:hover{color:var(--text)}
.sentence-mode-btn.active{background:var(--accent);color:#fff}
.sentence-card{background:var(--surface);border:1px solid var(--surface2);border-radius:8px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px}
.sentence-card .sn-num{color:var(--accent);font-weight:700;min-width:20px;font-size:.85em;padding-top:1px}
.sentence-card .sn-text{flex:1}
.sentence-card .sn-zh{font-size:1.1em;margin-bottom:3px}

{speaker:"A",c:"好耐冇見喇，聽講你最近喺度搵緊工，上個禮拜係咪去咗面試啊？",j:"hou2 noi6 mou5 gin3 laa3, teng1 gong2 nei5 zeoi3 gan6 hai2 dou6 wan2 gan2 gung1, soeng6 go3 lai6 baai3 hai6 mai6 heoi3 zo2 min6 si5 aa3",e:"Long time no see! I heard you've been job hunting lately. Did you go for an interview last week?"},

dialogue:[
{speaker:"A",c:"最近見你成日加班，面色又唔係幾好，係咪工作壓力好大啊？",j:"zeoi3 gan6 gin3 nei5 sing4 jat6 gaa1 baan1, min6 sik1 jau6 m4 hai6 gei2 hou2, hai6 mai6 gung1 zok3 aat3 lik6 hou2 daai6 aa3",e:"Recently I see you working overtime every day, and your complexion doesn't look great. Is work pressure really high?"},
{speaker:"B",c:"係啊，呢排工作項目特別多，每日都要處理好多嘢，真係覺得壓力好大。",j:"hai6 aa3, ni1 paai4 gung1 zok3 hong6 muk6 dak6 bit6 do1, mui5 jat6 dou1 jiu3 cyu5 lei5 hou2 do1 je5, zan1 hai6 gok3 dak1 aat3 lik6 hou2 daai6",e:"Yes, there are especially many work projects lately. I have to handle a lot every day, and I really feel the pressure."},
{speaker:"A",c:"噉你平時點樣應付呢啲壓力啊？",j:"gam2 nei5 ping4 si4 dim2 joeng2 jing3 fu6 ni1 di1 aat3 lik6 aa3",e:"So how do you usually cope with this pressure?"},
{speaker:"B",c:"一開始我只係硬撐，點知效率越嚟越差，仲成日失眠。後來我發現噉樣唔得，就開始調整自己嘅工作節奏。",j:"jat1 hoi1 ci2 ngo5 zi2 hai6 ngaang6 caang3, dim2 zi1 haau6 leot6 jyut6 lai4 jyut6 caa1, zung6 sing4 jat6 sat1 min6. hau6 loi4 ngo5 faat3 jin6 gam2 joeng2 m4 dak1, zau6 hoi1 ci2 tiu4 zing2 zi6 gei2 ge3 gung1 zok3 zit3 zau3",e:"At first I just toughed it out, but then efficiency got worse and worse, and I even had insomnia. Later I realized this wasn't working, so I started adjusting my work rhythm."},
{speaker:"A",c:"噉你做咗啲乜嘢改變啊？",j:"gam2 nei5 zou6 zo2 di1 mat1 je5 goi2 bin3 aa3",e:"So what changes did you make?"},
{speaker:"B",c:"我會先將啲任務按輕重緩急排好次序，重要嘅事優先做，唔再乜都一齊嚟。另外，落班之後盡量唔再處理工作方面嘅嘢。",j:"ngo5 wui5 sin1 zoeng1 di1 jam6 mou6 on3 hing1 cung5 wun6 gap1 paai4 hou2 ci3 zeoi6, zung6 jiu3 ge3 si6 jau1 sin1 zou6, m4 zoi6 mat1 dou1 jat1 cai4 lai4. ling6 ngoi6, lok6 baan1 zi1 hau6 zeon6 loeng6 m4 zoi6 cyu5 lei5 gung1 zok3 fong1 min6 ge3 je5",e:"I first arrange tasks by priority and urgency — important things first, and I don't try to do everything at once. Also, after work I try not to deal with work-related matters anymore."},
{speaker:"A",c:"聽落又幾有道理喎。噉你有冇用其他方法嚟放鬆下自己啊？",j:"teng1 lok6 jau6 gei2 jau5 dou6 lei5 wo3. gam2 nei5 jau5 mou5 jung6 kei4 taa1 fong1 faat3 lai4 fong3 sung1 haa5 zi6 gei2 aa3",e:"That sounds quite reasonable. Do you also use other methods to relax?"},
{speaker:"B",c:"有啊。我開始每日抽時間做運動，例如跑步或者瑜伽，仲會同朋友傾偈，轉移下注意力。",j:"jau5 aa3, ngo5 hoi1 ci2 mui5 jat6 cau1 si4 gaan3 zou6 wan6 dung6, lai6 jyu4 paau2 bou6 waak6 ze2 jyu4 gaa1, zung6 wui5 tung4 pang4 jau5 king1 gai2, zyun3 ji4 haa5 zyu3 ji3 lik6",e:"Yes. I started making time for exercise every day — like running or yoga — and I also chat with friends to shift my focus."},
{speaker:"A",c:"呢啲方法效果點啊？",j:"ni1 di1 fong1 faat3 haau6 gwo2 dim2 aa3",e:"How effective are these methods?"},
{speaker:"B",c:"效果都幾唔錯㗎，雖然壓力仲喺度，但心態比以前穩定好多，做嘢都更加專心啲。",j:"haau6 gwo2 dou1 gei2 m4 co3 gaa3, seoi1 jin4 aat3 lik6 zung6 hai2 dou6, daan6 sam1 taai3 bei2 ji5 cin4 wan2 ding6 hou2 do1, zou6 je5 dou1 gang3 gaa1 zyun1 sam1 di1",e:"Pretty good actually. The pressure is still there, but my mindset is much more stable than before, and I work more focused."},
{speaker:"A",c:"睇嚟學識管理工作壓力真係好重要。",j:"tai2 lai4 hok6 sik1 gun2 lei5 gung1 zok3 aat3 lik6 zan1 hai6 hou2 zung6 jiu3",e:"It seems learning to manage work pressure is really important."},
{speaker:"B",c:"冇錯，工作再忙，都要照顧好自己嘅身體同埋情緒，噉樣先可以行得更遠。",j:"mou5 co3, gung1 zok3 zoi3 mong4, dou1 jiu3 ziu3 gu3 hou2 zi6 gei2 ge3 san1 tai2 tung4 maai4 cing4 seoi5, gam2 joeng2 sin1 ho2 ji5 haang4 dak1 gang3 jyun5",e:"That's right. No matter how busy work is, you still need to take care of your body and emotions — only then can you go further."}

dialogue:[
{speaker:"A",c:"最近見你哋部門好似喺度做緊一個新項目喎？進展得點啊？聽講話個項目規模都唔細。",j:"zeoi3 gan6 gin3 nei5 dei6 bou6 mun4 hou2 ci5 hai2 dou6 zou6 gan2 jat1 go3 san1 hong6 muk6 wo3? zeon3 zin2 dak1 dim2 aa3? teng1 gong2 waa6 go3 hong6 muk6 kwai1 mou4 dou1 m4 sai3",e:"Recently I see your department seems to be working on a new project? How's the progress? I heard the project scale is quite large."},
{speaker:"B",c:"係啊，呢個項目規模確實幾大下，需要多個部門一齊配合完成，所以團隊合作特別重要。如果大家配合得唔好，好容易影響整體進度。",j:"hai6 aa3, ni1 go3 hong6 muk6 kwai1 mou4 kok6 sat6 gei2 daai6 haa5, seoi1 jiu3 do1 go3 bou6 mun4 jat1 cai4 pui3 hap6 jyun4 sing4, so2 ji5 tyun4 deoi2 hap6 zok3 dak6 bit6 zung6 jiu3. jyu4 gwo2 daai6 gaa1 pui3 hap6 dak1 m4 hou2, hou2 jung4 ji6 jing2 hoeng2 zing2 tai2 zeon3 dou6",e:"Yes, this project is indeed quite large and requires multiple departments to coordinate together, so teamwork is especially important. If people don't coordinate well, it easily affects the overall progress."},
{speaker:"A",c:"噉喺實際合作嘅過程中，有冇遇到啲乜嘢問題啊？",j:"gam2 hai2 sat6 zai3 hap6 zok3 ge3 gwo3 cing4 zung1, jau5 mou5 jyu6 dou2 di1 mat1 je5 man6 tai4 aa3",e:"So in the actual collaboration process, did you encounter any problems?"},
{speaker:"B",c:"一開始真係有啲困難，因為大家嘅工作方式同諗法都唔一樣，有啲人做事比較快，有啲人就比較謹慎，再加上溝通唔夠順暢，成個流程都慢咗落嚟，效率亦都唔算高。",j:"jat1 hoi1 ci2 zan1 hai6 jau5 di1 kwan3 naan4, jan1 wai6 daai6 gaa1 ge3 gung1 zok3 fong1 sik1 tung4 nam2 faat3 dou1 m4 jat1 joeng6, jau5 di1 jan4 zou6 si6 bei2 gaau3 faai3, jau5 di1 jan4 zau6 bei2 gaau3 gan2 san6, zoi3 gaa1 soeng5 kau1 tung1 m4 gau3 seon6 coeng3, sing4 go3 lau4 cing4 dou1 maan6 zo2 lok6 lai4, haau6 leot6 jik6 dou1 m4 syun3 gou1",e:"At first there were some difficulties because everyone's working style and thinking were different. Some people work fast, others are more cautious. Plus communication wasn't smooth enough, so the whole workflow slowed down and efficiency wasn't high."},
{speaker:"A",c:"聽落壓力都唔細喎。後來你哋係點樣處理同解決呢啲問題嘅？",j:"teng1 lok6 aat3 lik6 dou1 m4 sai3 wo3. hau6 loi4 nei5 dei6 hai6 dim2 joeng2 cyu5 lei5 tung4 gaai2 kyut3 ni1 di1 man6 tai4 ge2",e:"That sounds stressful too. How did you handle and solve these problems later?"},
{speaker:"B",c:"後來我哋開咗幾次團隊會議，大家坐低慢慢傾，先清楚分工，再將每個人嘅職責講清楚，避免重複或者漏做。同時，主管亦都鼓勵大家多啲表達自己嘅諗法，唔好怕講錯。",j:"hau6 loi4 ngo5 dei6 hoi1 zo2 gei2 ci3 tyun4 deoi2 wui6 ji5, daai6 gaa1 co5 dai1 maan6 maan2 king1, sin1 cing1 co2 fan1 gung1, zoi3 zoeng1 mui5 go3 jan4 ge3 zik1 zaak3 gong2 cing1 co2, bei6 min5 cung4 fuk1 waak6 ze2 lau6 zou6. tung4 si4, zyu2 gun2 jik6 dou1 gu2 lai6 daai6 gaa1 do1 di1 biu2 daat6 zi6 gei2 ge3 nam2 faat3, m4 hou2 paa3 gong2 co3",e:"Later we held several team meetings. Everyone sat down and talked slowly. First we clarified the division of work, then clearly explained everyone's responsibilities to avoid duplication or omissions. At the same time, the supervisor encouraged everyone to express their ideas more and not be afraid of saying something wrong."},
{speaker:"A",c:"噉樣做之後，情況有冇好轉啊？",j:"gam2 joeng2 zou6 zi1 hau6, cing4 fong3 jau5 mou5 hou2 zyun2 aa3",e:"After doing that, did the situation improve?"},
{speaker:"B",c:"有啊，改善咗好多。溝通順暢咗之後，大家嘅配合都好咗，誤會少咗，做起嘢嚟都有效率啲。慢慢大家都學識互相支持，遇到問題會主動幫手。",j:"jau5 aa3, goi2 sin6 zo2 hou2 do1. kau1 tung1 seon6 coeng3 zo2 zi1 hau6, daai6 gaa1 ge3 pui3 hap6 dou1 hou2 zo2, ng6 wui6 siu2 zo2, zou6 hei2 je5 lai4 dou1 jau5 haau6 leot6 di1. maan6 maan2 daai6 gaa1 dou1 hok6 sik1 wu6 soeng1 zi1 ci4, jyu6 dou2 man6 tai4 wui5 zyu2 dung6 bong1 sau2",e:"Yes, it improved a lot. After communication became smoother, coordination among everyone improved, misunderstandings decreased, and working became more efficient. Gradually everyone learned to support each other and proactively help when encountering problems."},
{speaker:"A",c:"聽落溝通真係起咗好大作用。",j:"teng1 lok6 kau1 tung1 zan1 hai6 hei2 zo2 hou2 daai6 zok3 jung6",e:"It sounds like communication really played a huge role."},
{speaker:"B",c:"冇錯。透過多啲交流，我哋唔單止減少咗誤會，仲更加了解彼此嘅長處。有啲同事擅長策劃，有啲就擅長執行，大家分工合作，優勢互補，效果明顯好咗。",j:"mou5 co3. tau3 gwo3 do1 di1 gaau1 lau4, ngo5 dei6 m4 daan1 zi2 gaam2 siu2 zo2 ng6 wui6, zung6 gang3 gaa1 liu5 gaai2 bei2 ci2 ge3 coeng4 cyu3. jau5 di1 tung4 si6 sin3 coeng4 caak3 waak6, jau5 di1 zau6 sin3 coeng4 zap1 hang4, daai6 gaa1 fan1 gung1 hap6 zok3, jau1 sai3 wu6 bou2, haau6 gwo2 ming4 hin2 hou2 zo2",e:"That's right. Through more communication, we not only reduced misunderstandings but also got to know each other's strengths better. Some colleagues are good at planning, others at execution. Everyone divides work and collaborates, complementing each other's strengths — the results were clearly better."},
{speaker:"A",c:"噉你自己喺團隊入面主要負責邊一方面嘅工作啊？",j:"gam2 nei5 zi6 gei2 hai2 tyun4 deoi2 jap6 min6 zyu2 jiu3 fu6 zaak3 bin1 jat1 fong1 min6 ge3 gung1 zok3 aa3",e:"So what aspect of work are you mainly responsible for in the team?"},
{speaker:"B",c:"我主要負責協調進度同整理資料，確保每一個階段嘅資訊都可以及時傳達畀每位成員，等大家清楚知道而家做到邊一步。",j:"ngo5 zyu2 jiu3 fu6 zaak3 hip3 tiu4 zeon3 dou6 tung4 zing2 lei5 zi1 liu2, kok3 bou2 mui5 jat1 go3 gaai1 dyun6 ge3 zi1 seon3 dou1 ho2 ji5 kap6 si4 cyun4 daat6 bei2 mui5 wai2 sing4 jyun4, dang2 daai6 gaa1 cing1 co2 zi1 dou3 ji4 gaa1 zou6 dou3 bin1 jat1 bou6",e:"I'm mainly responsible for coordinating progress and organizing information, ensuring that information at each stage is conveyed to every member in time, so everyone knows clearly which step we're at."},
{speaker:"A",c:"經過今次合作，你自己有冇乜嘢特別嘅體會或者收穫啊？",j:"ging1 gwo3 gam1 ci3 hap6 zok3, nei5 zi6 gei2 jau5 mou5 mat1 je5 dak6 bit6 ge3 tai2 wui6 waak6 ze2 sau1 wok6 aa3",e:"Through this collaboration, do you have any special insights or gains?"},
{speaker:"B",c:"有㗎。我真係深刻體會到，一個人嘅能力就算再強都好，都係有限嘅；只有大家互相信任、願意溝通，同心協力去做，團隊先至可以發揮最大嘅力量，最後取得更好嘅成果。",j:"jau5 gaa3, ngo5 zan1 hai6 sam1 hak1 tai2 wui6 dou2, jat1 go3 jan4 ge3 nang4 lik6 zau6 syun3 zoi3 koeng4 dou1 hou2, dou1 hai6 jau5 haan6 ge3; zi2 jau5 daai6 gaa1 wu6 soeng1 soen3 jam6, jyun6 ji3 kau1 tung1, tung4 sam1 hip3 lik6 hei3 zou6, tyun4 deoi2 sin1 zi3 ho2 ji5 faat3 fai1 zeoi3 daai6 ge3 lik6 loeng6, zeoi3 hau6 ceoi2 dak1 gang3 hou2 ge3 sing4 gwo2",e:"Yes. I truly deeply realized that one person's ability, no matter how strong, is limited. Only when everyone trusts each other, is willing to communicate, and works together with one heart, can the team unleash its greatest strength and achieve better results."}
],
grammar:[
{pattern:"聽講話... (teng1 gong2 waa6...)",desc:"I heard that... — reporting second-hand information",ex:"聽講話個項目規模都唔細 (teng1 gong2 waa6 go3 hong6 muk6 kwai1 mou4 dou1 m4 sai3)",en:"I heard that the project scale is quite large."},
{pattern:"如果...好容易... (jyu4 gwo2... hou2 jung4 ji6...)",desc:"If... easily... — warning conditional",ex:"如果大家配合得唔好，好容易影響整體進度 (jyu4 gwo2 daai6 gaa1 pui3 hap6 dak1 m4 hou2, hou2 jung4 ji6 jing2 hoeng2 zing2 tai2 zeon3 dou6)",en:"If people don't coordinate well, it easily affects the overall progress."},
{pattern:"先...再... (sin1... zoi3...)",desc:"first... then... — sequential steps",ex:"先清楚分工，再將每個人嘅職責講清楚 (sin1 cing1 co2 fan1 gung1, zoi3 zoeng1 mui5 go3 jan4 ge3 zik1 zaak3 gong2 cing1 co2)",en:"First clarify division of work, then explain everyone's responsibilities."},
{pattern:"唔單止...仲... (m4 daan1 zi2... zung6...)",desc:"not only... but also... — additive",ex:"我哋唔單止減少咗誤會，仲更加了解彼此嘅長處 (ngo5 dei6 m4 daan1 zi2 gaam2 siu2 zo2 ng6 wui6, zung6 gang3 gaa1 liu5 gaai2 bei2 ci2 ge3 coeng4 cyu3)",en:"We not only reduced misunderstandings, but also got to know each other's strengths better."},
{pattern:"就算...都... (zau6 syun3... dou1...)",desc:"even if... still... — concessive",ex:"一個人嘅能力就算再強都好，都係有限嘅 (jat1 go3 jan4 ge3 nang4 lik6 zau6 syun3 zoi3 koeng4 dou1 hou2, dou1 hai6 jau5 haan6 ge3)",en:"No matter how strong one person's ability is, it's still limited."},
{pattern:"只有...先至可以... (zi2 jau5... sin1 zi3 ho2 ji5...)",desc:"only... then can... — exclusive condition",ex:"只有大家互相信任，團隊先至可以發揮最大嘅力量 (zi2 jau5 daai6 gaa1 wu6 soeng1 soen3 jam6, tyun4 deoi2 sin1 zi3 ho2 ji5 faat3 fai1 zeoi3 daai6 ge3 lik6 loeng6)",en:"Only when everyone trusts each other can the team unleash its greatest strength."},
{pattern:"透過... (tau3 gwo3...)",desc:"through / by means of... — method expression",ex:"透過多啲交流，我哋減少咗誤會 (tau3 gwo3 do1 di1 gaau1 lau4, ngo5 dei6 gaam2 siu2 zo2 ng6 wui6)",en:"Through more communication, we reduced misunderstandings."}
],

{id:4,title:"第四課：成功與失敗",subtitle:"sing4 gung1 jyu5 sat1 baai6 — Success and Failure",

dialogue:[
{speaker:"A",c:"最近公司總結上半年嘅工作成果，你覺得自己算係成功定係失敗？",j:"zeoi3 gan6 gung1 si1 zung2 git3 soeng6 bun3 nin4 ge3 gung1 zok3 sing4 gwo2, nei5 gok3 dak1 zi6 gei2 syun3 hai6 sing4 gung1 ding6 hai6 sat1 baai6",e:"Recently the company summarized the first half's work results. Do you consider yourself a success or a failure?"},
{speaker:"B",c:"我覺得唔可以簡單噉用成功或者失敗嚟判斷。呢半年嚟我確實完成咗一啲目標，但亦都遇到唔少挫折。",j:"ngo5 gok3 dak1 m4 ho2 ji5 gaan2 daan1 gam2 jung6 sing4 gung1 waak6 ze2 sat1 baai6 lei4 pun3 dyun6. ni1 bun3 nin4 lai4 ngo5 koek3 sat6 jyun4 sing4 zo2 jat1 di1 muk6 biu1, daan6 jik6 dou1 jyu6 dou3 m4 siu2 co3 zit3",e:"I don't think you can simply judge by success or failure. This half year I did accomplish some goals, but also encountered quite a few setbacks."},
{speaker:"A",c:"咁你係點樣睇待呢啲失敗嘅經歷嘅？",j:"gam2 nei5 hai6 dim2 joeng2 tai2 doi6 ni1 di1 sat1 baai6 ge3 ging1 lik6 ge2",e:"So how do you view these experiences of failure?"},
{speaker:"B",c:"一開始我都好沮喪，覺得付出咗好多，卻冇達到預期。不過冷靜落嚟之後，我發現失敗其實令我更加睇清自己嘅不足。",j:"jat1 hoi1 ci2 ngo5 dou1 hou2 zeoi2 song3, gok3 dak1 fu6 ceot1 zo2 hou2 do1, koek3 mou5 daat6 dou3 jyu6 kei4. bat1 gwo3 laang5 zing6 lok6 lei4 zi1 hau6, ngo5 faat3 jin6 sat1 baai6 kei4 sat6 ling6 ngo5 gang3 gaa1 tai2 cing1 zi6 gei2 ge3 bat1 zuk1",e:"At first I was also very dejected — felt I had put in so much but didn't meet expectations. But after calming down, I discovered that failure actually helped me see my shortcomings more clearly."},
{speaker:"A",c:"可唔可以舉個實際啲嘅例子？",j:"ho2 m4 ho2 ji5 geoi2 go3 sat6 zai3 di1 ge3 lai6 zi2",e:"Can you give a concrete example?"},
{speaker:"B",c:"譬如有一次個項目冇按時完成，原因係我高估咗自己嘅能力，亦都冇同團隊充分溝通。",j:"pei3 jyu4 jau5 jat1 ci3 go3 hong6 muk6 mou5 on3 si4 jyun4 sing4, jyun4 jan1 hai6 ngo5 gou1 gu3 zo2 zi6 gei2 ge3 nang4 lik6, jik6 dou1 mou5 tung4 tyun4 deoi2 cung1 fan6 kau1 tung1",e:"For example, there was a project that wasn't completed on time. The reason was I overestimated my own ability and didn't communicate sufficiently with the team."},
{speaker:"A",c:"噉後來你又點樣調整嘅？",j:"gam2 hau6 loi4 nei5 jau6 dim2 joeng2 tiu4 zing2 ge2",e:"So how did you adjust later?"},
{speaker:"B",c:"我重新制定咗計劃，將任務分得更細，亦都主動向同事請教經驗，慢慢噉效果就好咗。",j:"ngo5 cung4 san1 zai3 ding6 zo2 gai3 waak6, zoeng1 jam6 mou6 fan1 dak1 gang3 sai3, jik6 dou1 zyu2 dung6 hoeng3 tung4 si6 cing2 gaau3 ging1 jim6, maan6 maan2 gam2 haau6 gwo2 zau6 hou2 zo2",e:"I re-made my plan, broke down tasks into smaller pieces, and proactively sought advice from colleagues. Gradually the results improved."},
{speaker:"A",c:"噉你而家對「成功」有冇啲新嘅理解？",j:"gam2 nei5 ji4 gaa1 deoi3 'sing4 gung1' jau5 mou5 di1 san1 ge3 lei5 gaai2",e:"So do you have any new understanding of 'success' now?"},
{speaker:"B",c:"喺我睇嚟，成功唔單止係結果，更加係不斷嘗試同改進嘅過程。",j:"hai2 ngo5 tai2 lei4, sing4 gung1 m4 daan1 zi2 hai6 git3 gwo2, gang3 gaa1 hai6 bat1 dyun6 soeng4 si3 tung4 goi2 zeon3 ge3 gwo3 cing4",e:"In my view, success is not just the result — it is even more the process of continuously trying and improving."},
{speaker:"A",c:"聽你噉講，失敗反而變成咗一種財富。",j:"teng1 nei5 gam2 gong2, sat1 baai6 faan2 ji4 bin3 sing4 zo2 jat1 zung2 coi4 fu3",e:"Hearing you say that, failure has instead become a kind of wealth."},
{speaker:"B",c:"係啊，只要可以喺失敗之中吸取經驗，佢就會成為走向成功重要嘅一步。",j:"hai6 aa3, zi2 jiu3 ho2 ji5 hai2 sat1 baai6 zi1 zung1 kap1 ceoi2 ging1 jim6, keoi5 zau6 wui5 sing4 wai4 zau2 hoeng3 sing4 gung1 zung6 jiu3 ge3 jat1 bou6",e:"That's right. As long as you can learn from failure, it becomes an important step toward success."}
],

{c:"事業",j:"si6 jip6",e:"career; enterprise",summary:"Seek 歸屬感 (gwai1 suk6 gam2 — belonging) and 使命感 (si5 ming6 gam2 — purpose) in your work | Do not sacrifice your 初心 (co1 sam1 — original aspiration) for others' expectations | 隨遇而安 (ceoi4 jyu6 ji4 on1) — go with the flow and be content; walk your own path | Career twists and turns are not failures; they are the shape of real life",intro:"A paycheck is not a purpose. This lesson challenges you to reflect on what makes work meaningful — examining the tension between security and passion, and why following your heart may be the only sustainable career strategy.",summary:"Seek 歸屬感 (belonging) and 使命感 (purpose) in your work | Do not sacrifice your 初心 for others' expectations | 隨遇而安 — walk your own path with contentment"},

dialogue:[
{speaker:"A",c:"最近我成日喺度諗，做咗呢行咁多年，係時候反思一下自己嘅事業方向。你有冇試過對住份工覺得好迷茫？",j:"zeoi3 gan6 ngo5 sing4 jat6 hai2 dou6 nam2 zou6 zo2 ne1 hong6 gam3 do1 nin4 hai6 si4 hau6 faan2 si1 jat1 haa6 zi6 gei2 ge3 si6 jip6 fong1 hoeng3 nei5 jau5 mou5 si3 gwo3 deoi3 zyu6 fan6 gung1 gok3 dak1 hou2 mai4 mong4",e:"Recently I keep reflecting — after so many years in this field, it's time to reconsider my career direction. Have you ever felt lost in your job?"},
{speaker:"B",c:"有呀，尤其係遇到瓶頸嗰陣，日日做住同樣嘅嘢，就會開始懷疑自己究竟係為咗乜嘢。係為咗成就感、定係只係為咗份人工？",j:"jau5 aa4 jau4 kei4 hai6 jyu6 dou3 ping4 geng2 go2 zan6 jat6 jat6 zou6 zyu6 tung4 joeng6 ge3 je5 zau6 wui2 hoi1 ci2 waai4 ji4 zi6 gei2 gau3 ging2 hai6 wai6 zo2 mat1 je5 hai6 wai6 zo2 sing4 zau6 gam2 ding6 hai6 zi2 hai6 wai6 zo2 fan6 jan4 gung1",e:"Yes, especially when you hit a bottleneck — doing the same thing every day, you start asking yourself what it's all for. Is it for a sense of achievement, or just for the paycheck?"},
{speaker:"A",c:"我覺得最難嘅係喺理想同現實之間搵平衡。大家都想追求有意義嘅工作，但係現實中好多時候要妥協，有啲嘢唔係你話想點就點。",j:"ngo5 gok3 dak1 zeoi3 naan4 ge3 hai6 hai2 lei5 soeng2 tung4 jin6 sat6 zi1 gaan1 wan2 ping4 hang4 daai6 gaa1 dou1 soeng2 zeoi1 kau4 jau5 ji3 ji6 ge3 gung1 zok3 daan6 hai6 jin6 sat6 zung1 hou2 do1 si4 hau6 jiu3 to5 hip3 jau5 di1 je5 m4 hai6 nei5 waa6 soeng2 dim2 zau6 dim2",e:"I think the hardest part is finding balance between ideals and reality. Everyone wants meaningful work, but in reality you often have to compromise — things don't always go the way you want."},
{speaker:"B",c:"咁你覺得咩先算係一份好工？係咪一定要功成名就先算成功？",j:"gam3 nei5 gok3 dak1 me1 sin1 syun3 hai6 jat1 fan6 hou2 gung1 hai6 mi1 jat1 ding6 jiu3 gung1 sing4 ming4 zau6 sin1 syun3 sing4 gung1",e:"So what do you think makes a good job? Is it necessary to be accomplished and successful to count as success?"},
{speaker:"A",c:"我而家覺得唔係咁睇。一份好工應該俾到你歸屬感同使命感，令你願意投入同付出，而唔係每日返工就等收工，純粹虛耗時間。當然，合理嘅回報都好重要，但係如果淨係為錢而做，好容易就會燃盡。",j:"ngo5 ji4 gaa1 gok3 dak1 m4 hai6 gam3 tai2 jat1 fan6 hou2 gung1 jing1 goi1 bei2 dou3 nei5 gwai1 suk6 gam2 tung4 si2 ming6 gam2 ling6 nei5 jyun6 ji3 tau4 jap6 tung4 fu6 ceot1 ji4 m4 hai6 mui5 jat6 faan1 gung1 zau6 dang2 sau1 gung1 seon4 seoi6 heoi1 hou3 si4 gaan3 dong1 jin4 hap6 lei5 ge3 wui4 bou3 dou1 hou2 zung6 jiu3 daan6 hai6 jyu4 gwo2 zing6 hai6 wai6 cin2 ji4 zou6 hou2 jung4 ji6 zau6 wui2 jin4 zeon6",e:"I now think differently. A good job should give you a sense of belonging and purpose, making you willing to invest and give — not just clocking in and out every day, purely wasting time. Of course fair rewards matter, but if you're only in it for money, burnout comes easily."},
{speaker:"B",c:"講得好有道理。我以前就係淨係追求高人工，結果搞到自己身心俱疲，完全冇咗對工作嘅熱情。後來轉型去做自己真正有興趣嘅嘢，雖然收入少咗，但係活得充實好多，每日都有動力起身。",j:"gong2 dak1 hou2 jau5 dou6 lei5 ngo5 ji5 cin4 zau6 hai6 zing6 hai6 zeoi1 kau4 gou1 jan4 gung1 git3 gwo2 gaau2 dou3 zi6 gei2 san1 sam1 keoi1 pei4 jyun4 cyun4 mou5 zo2 deoi3 gung1 zok3 ge3 jit6 cing4 hau6 loi4 zyun2 jing4 heoi3 zou6 zi6 gei2 zan1 zing3 jau5 hing3 ceoi3 ge3 je5 seoi1 jin4 sau1 jap6 siu2 zo2 daan6 hai6 wut6 dak1 cung1 sat6 hou2 do1 mui5 jat6 dou1 jau5 dung6 lik6 hei2 san1",e:"That makes a lot of sense. I used to only chase a high salary, and ended up physically and mentally exhausted, losing all passion for work. Later I pivoted to do what I'm genuinely interested in — even though the income decreased, my life is much more fulfilling. Every day I wake up motivated."},
{speaker:"A",c:"魚與熊掌不可兼得，有時候確實要作出取捨。不過我覺得最重要係唔好忘記自己嘅初心，唔好為咗迎合別人嘅期望而放棄自己真正想要嘅生活。踏實咁行自己嘅路，隨遇而安，先至係長遠之道。",j:"jyu2 jyu5 hung4 zoeng2 bat1 ho2 gim1 dak1 jau5 si4 hau6 kok3 sat6 jiu3 zok3 ceot1 ceoi2 se2 bat1 gwo3 ngo5 gok3 dak1 zeoi3 zung6 jiu3 hai6 m4 hou2 mong4 gei3 zi6 gei2 ge3 co1 sam1 m4 hou2 wai6 zo2 jing4 hap6 bit6 jan4 ge3 kei4 mong6 ji4 fong3 hei3 zi6 gei2 zan1 zing3 soeng2 jiu3 ge3 sang1 wut6 daap6 sat6 gam3 hong6 zi6 gei2 ge3 lou6 ceoi4 jyu6 ji4 on1 sin1 zi3 hai6 coeng4 jyun5 zi1 dou6",e:"You can't have both fish and bear's paw — sometimes you really have to make trade-offs. But I think the most important thing is not to forget your original aspiration, not to abandon the life you truly want just to meet others' expectations. Walk your own path with grounded steps, go with the flow and be content — that's the long-term way."},
{speaker:"B",c:"呢個諗法好難得。事業唔係淨係一條直路，有彎有拐先至係真正嘅人生。最緊要係每一個選擇都係跟住自己嘅心去做，咁樣先至無悔。",j:"ne1 go3 nam2 faat3 hou2 naan4 dak1 si6 jip6 m4 hai6 zing6 hai6 jat1 tiu4 zik6 lou6 jau5 waan1 jau5 gwaai2 sin1 zi3 hai6 zan1 zing3 ge3 jan4 sang1 zeoi3 gan2 jiu3 hai6 mui5 jat1 go3 syun2 zaak6 dou1 hai6 gan1 zyu6 zi6 gei2 ge3 sam1 heoi3 zou6 gam3 joeng6 sin1 zi3 mou4 fui3",e:"That's a precious way of thinking. A career isn't just a straight road — twists and turns are what real life is about. The most important thing is that every choice follows your heart. That way, you'll have no regrets."}
],

{pattern:"咁你覺得咩先算係... (gam3 nei5 gok3 dak1 me1 sin1 syun3 hai6...)",desc:"so what do you think counts as... — opinion inquiry",ex:"咁你覺得咩先算係一份好工？ (gam3 nei5 gok3 dak1 me1 sin1 syun3 hai6 jat1 fan6 hou2 gung1)",en:"So what do you think makes a good job?"},
{pattern:"唔好為咗...而... (m4 hou2 wai6 zo2... ji4...)",desc:"don't... just for the sake of... — caution against trade-offs",ex:"唔好為咗迎合別人嘅期望而放棄自己想要嘅生活 (m4 hou2 wai6 zo2 jing4 hap6 bit6 jan4 ge3 kei4 mong6 ji4 fong3 hei3 zi6 gei2 soeng2 jiu3 ge3 sang1 wut6)",en:"Don't abandon the life you want just to meet others' expectations"},
{pattern:"先至係... (sin1 zi3 hai6...)",desc:"is truly the real... — emphatic assertion",ex:"先至係真正嘅人生 (sin1 zi3 hai6 zan1 zing3 ge3 jan4 sang1)",en:"That is truly real life"},

],

dialogue:[
{speaker:"A",c:"最近我喺度諗，人越大，朋友好似越嚟越少。以前讀書嗰陣成日一大班人出去玩，而家個個都各忙各，連約食餐飯都要約成個月先至約到。你有冇同樣嘅感覺？",j:"zeoi3 gan6 ngo5 hai2 dou6 nam2 jan4 jyut6 daai6 pang4 jau5 hou2 ci5 jyut6 lai4 jyut6 siu2 ji5 cin4 duk6 syu1 go2 zan6 sing4 jat6 jat1 daai6 baan1 jan4 ceot1 heoi3 waan2 ji4 gaa1 go3 go3 dou1 gok3 mong4 gok3 lin4 joek3 sik6 caan1 faan6 dou1 jiu3 joek3 seng4 go3 jyut6 sin1 zi3 joek3 dou3 nei5 jau5 mou5 tung4 joeng6 ge3 gam2 gok3",e:"Lately I've been thinking: the older we get, the fewer friends we seem to have. Back in school we'd always go out in big groups, now everyone is busy with their own stuff — even arranging a meal takes a whole month to book. Do you feel the same?"},
{speaker:"B",c:"當然有啦，呢個係人生必經嘅階段。隨住年紀大咗，時間有限，你就會開始篩選邊啲關係係真正值得投入嘅。朋友嘅質素遠比數量重要，一個知己好過十個泛泛之交。",j:"dong1 jin4 jau5 laa1 ne1 go3 hai6 jan4 sang1 bit1 ging1 ge3 gaai1 dyun6 ceoi4 zyu6 nin4 gei2 daai6 zo2 si4 gaan3 jau5 haan6 nei5 zau6 wui2 hoi1 ci2 sai1 syun2 bin1 di1 gwaan1 hai6 hai6 zan1 zing3 zik6 dak1 tau4 jap6 ge3 pang4 jau5 ge3 zat1 sou3 jyun5 bei2 sou3 loeng6 zung6 jiu3 jat1 go3 zi1 gei2 hou2 gwo3 sap6 go3 faan6 faan6 zi1 gaau1",e:"Of course. This is an inevitable stage of life. As you get older and time becomes limited, you start filtering which relationships are truly worth investing in. The quality of friends far outweighs quantity — one true bosom friend beats ten casual acquaintances."},
{speaker:"A",c:"講得好啱，深交嘅朋友真係好難得。我同一個老友識咗十幾年，平時大家都好忙，可能幾個月先見一次，但係每次一坐低傾偈，就好似完全冇隔膜咁，嗰種默契真係好珍貴。",j:"gong2 dak1 hou2 ngaam1 sam1 gaau1 ge3 pang4 jau5 zan1 hai6 hou2 naan4 dak1 ngo5 tung4 jat1 go3 lou5 jau5 sik1 zo2 sap6 gei2 nin4 ping4 si4 daai6 gaa1 dou1 hou2 mong4 ho2 nang4 gei2 go3 jyut6 sin1 gin3 jat1 ci3 daan6 hai6 mui5 ci3 jat1 co5 dai1 king1 gai2 zau6 hou2 ci5 jyun4 cyun4 mou5 gaak3 mok6 gam3 go2 zung3 mak6 kai3 zan1 hai6 hou2 zan1 gwai3",e:"So true. Deep friendships are rare. I've known an old friend for over ten years. Usually we're both busy — maybe we only see each other once every few months. But every time we sit down to chat, it's like there's no barrier at all. That kind of tacit understanding is truly precious."},
{speaker:"B",c:"呢種就係「君子之交淡如水」啦。真正嘅友誼唔係成日黐埋一齊，而係心入面有個位係畀對方嘅，有需要嘅時候一定會第一個企出嚟幫忙。",j:"ne1 zung3 zau6 hai6 gwan1 zi2 zi1 gaau1 taam5 jyu4 seoi2 laa1 zan1 zing3 ge3 jau5 ji6 m4 hai6 sing4 jat6 ci1 maai4 jat1 cai4 ji4 hai6 sam1 jap6 min6 jau5 go3 wai6 hai6 bei2 deoi3 fong1 ge3 jau5 seoi1 jiu3 ge3 si4 hau6 jat1 ding6 wui2 dai6 jat1 go3 kei5 ceot1 lai4 bong1 mong4",e:"That's exactly 'a gentleman's friendship is as plain as water.' True friendship isn't about being stuck together all the time — it's about having a place in your heart for the other person, and when they need you, you'll be the first to step up and help."},
{speaker:"A",c:"不過而家社交媒體咁普及，好多人以為喺網上留個言、讚個好就叫做維持友誼。但係呢啲互動好多時候都好表面，取代唔到面對面嘅溝通同真實嘅連結。",j:"bat1 gwo3 ji4 gaa1 se5 gaau1 mui4 tai2 gam3 pou2 kap6 hou2 do1 jan4 ji5 wai4 hai2 mong5 soeng6 lau4 go3 jin4 zaan3 go3 hou2 zau6 giu3 zou6 wai4 ci4 jau5 ji6 daan6 hai6 ne1 di1 wu6 dung6 hou2 do1 si4 hau6 dou1 hou2 biu2 min6 ceoi2 doi6 m4 dou3 min6 deoi3 min6 ge3 kau1 tung1 tung4 zan1 sat6 ge3 lin4 git3",e:"But nowadays with social media so prevalent, many people think leaving a comment or liking a post online counts as maintaining friendship. However, these interactions are often quite superficial — they can't replace face-to-face communication and genuine connection."},
{speaker:"B",c:"冇錯，網絡可以幫我哋保持聯絡，但係冇辦法取代嗰種面對面傾偈嘅溫度。我有時候會刻意約啲好耐冇見嘅朋友出嚟食飯，就咁坐低傾下近況，感覺真係好唔同。",j:"mou5 co3 mong5 lok6 ho2 ji5 bong1 ngo5 dei6 bou2 ci4 lyun4 lok6 daan6 hai6 mou5 baan6 faat3 ceoi2 doi6 go2 zung3 min6 deoi3 min6 king1 gai2 ge3 wan1 dou6 ngo5 jau5 si4 hau6 wui2 hak1 ji3 joek3 di1 hou2 noi6 mou5 gin3 ge3 pang4 jau5 ceot1 lai4 sik6 faan6 zau6 gam3 co5 dai1 king1 haa6 gan6 fong3 gam2 gok3 zan1 hai6 hou2 m4 tung4",e:"Exactly. The internet can help us stay in touch, but it can't replace the warmth of face-to-face conversation. Sometimes I deliberately invite friends I haven't seen in a long time out for a meal — just sitting down and catching up feels so different."},
{speaker:"A",c:"患難見真情呢句話從來都冇錯。真正嘅友誼唔係喺你風光嘅時候有幾多人圍住你，而係喺你最困難嘅時候有邊個願意扶你一把。日久見人心，時間會幫你篩選邊個係真正嘅朋友。",j:"waan6 naan4 gin3 zan1 cing4 ne1 geoi3 waa6 cung4 loi4 dou1 mou5 co3 zan1 zing3 ge3 jau5 ji6 m4 hai6 hai2 nei5 fung1 gwong1 ge3 si4 hau6 jau5 gei2 do1 jan4 wai4 zyu6 nei5 ji4 hai6 hai2 nei5 zeoi3 kwan3 naan4 ge3 si4 hau6 jau5 bin1 go3 jyun6 ji3 fu4 nei5 jat1 baa2 jat6 gau2 gin3 jan4 sam1 si4 gaan3 wui2 bong1 nei5 sai1 syun2 bin1 go3 hai6 zan1 zing3 ge3 pang4 jau5",e:"'True feelings are revealed in hardship' — this saying is never wrong. Real friendship isn't about how many people surround you when you're doing well, but who is willing to lend you a hand when you're at your lowest. Time reveals a person's heart — time will help filter who your true friends are."},
{speaker:"B",c:"你講得好有智慧。友誼其實同植物一樣，要用心去灌溉先至會生長得好。疏忽咗就會慢慢枯萎。所以我而家會更加珍惜身邊每一個真心對我嘅朋友，唔好等到失去咗先至後悔。",j:"nei5 gong2 dak1 hou2 jau5 zi3 wai3 jau5 ji6 kei4 sat6 tung4 zik6 mat6 jat1 joeng6 jiu3 jung6 sam1 heoi3 gun3 koi3 sin1 zi3 wui2 sang1 zoeng6 dak1 hou2 so1 fat1 zo2 zau6 wui2 maan6 maan2 fu1 wai2 so2 ji5 ngo5 ji4 gaa1 wui2 gang3 gaa1 zan1 sik1 san1 bin1 mui5 jat1 go3 zan1 sam1 deoi3 ngo5 ge3 pang4 jau5 m4 hou2 dang2 dou3 sat1 heoi3 zo2 sin1 zi3 hau6 fui3",e:"You speak with such wisdom. Friendship is actually like a plant — it needs heartfelt nurturing to grow well. Neglect it and it'll slowly wither. So now I cherish every friend who is genuinely good to me even more. Don't wait until you lose them to regret it."}
],
grammar:[
{pattern:"隨住...就會... (ceoi4 zyu6...zau6 wui2...)",desc:"as... (something happens)... then (result) — natural progression",ex:"隨住年紀大咗，你就會開始篩選關係 (ceoi4 zyu6 nin4 gei2 daai6 zo2 nei5 zau6 wui2 hoi1 ci2 sai1 syun2 gwaan1 hai6)",en:"As you get older, you will start filtering relationships"},
{pattern:"唔係...而係... (m4 hai6...ji4 hai6...)",desc:"it is not... but rather... — redirection",ex:"友誼唔係成日黐埋一齊，而係心入面有個位畀對方 (jau5 ji6 m4 hai6 sing4 jat6 ci1 maai4 jat1 cai4 ji4 hai6 sam1 jap6 min6 jau5 go3 wai6 bei2 deoi3 fong1)",en:"Friendship is not sticking together all the time, but having a place in your heart for the other"},
{pattern:"有...嘅時候...就... (jau5...ge3 si4 hau6...zau6...)",desc:"when there is (something)... then... — conditional response",ex:"有需要嘅時候一定會企出嚟幫忙 (jau5 seoi1 jiu3 ge3 si4 hau6 jat1 ding6 wui2 kei5 ceot1 lai4 bong1 mong4)",en:"When there is a need, you will definitely step up to help"},
{pattern:"以為...就叫做... (ji5 wai4...zau6 giu3 zou6...)",desc:"mistakenly think... counts as... — exposing false belief",ex:"好多人以為留個言就叫做維持友誼 (hou2 do1 jan4 ji5 wai4 lau4 go3 jin4 zau6 giu3 zou6 wai4 ci4 jau5 ji6)",en:"Many mistakenly think leaving a comment counts as maintaining friendship"},
{pattern:"要...先至會... (jiu3...sin1 zi3 wui6...)",desc:"need to... only then will... — conditional cause-effect",ex:"要用心灌溉先至會生長得好 (jiu3 jung6 sam1 gun3 koi3 sin1 zi3 wui2 sang1 zoeng6 dak1 hou2)",en:"Need to nurture it with heart before it will grow well"},
{pattern:"唔好等到...先至... (m4 hou2 dang2 dou3...sin1 zi3...)",desc:"don't wait until... before... — advice against delay",ex:"唔好等到失去咗先至後悔 (m4 hou2 dang2 dou3 sat1 heoi3 zo2 sin1 zi3 hau6 fui3)",en:"Don't wait until you have lost them before regretting"}
],

{id:7,title:"第七課：表達意見同討論",subtitle:"biu2 daat6 ji3 gin3 tung4 tou2 leon6 — Expressing Opinions and Discussion",
vocab:[
{c:"建議",j:"gin3 ji5",e:"suggestion; to suggest",summary:"Different viewpoints lead to more comprehensive analysis, not worse outcomes | 達成共識 (daat6 sing4 gung6 sik1 — reaching consensus) matters more than winning the argument | Appropriate 妥協 (to5 hip3 — compromise) is wisdom, not weakness | Discussion is for finding the best solution, not for proving you are right",intro:"Disagreement does not have to mean conflict. This lesson teaches you how to express opinions respectfully, listen to opposing views, and reach consensus without compromising your integrity — skills essential in any workplace.",summary:"Different viewpoints lead to better analysis | 達成共識 matters more than winning | Appropriate 妥協 is wisdom, not weakness | Discussion is for finding the best solution"},
{c:"觀點",j:"gun1 dim2",e:"viewpoint; perspective"},
{c:"批評",j:"pai1 ping4",e:"criticism; to criticize"},
{c:"改善",j:"goi2 sin6",e:"to improve"},
{c:"妥協",j:"to5 hip3",e:"to compromise"},
{c:"堅持",j:"gin1 ci4",e:"to insist; persist"},
{c:"討論",j:"tou2 leon6",e:"to discuss; discussion"},
{c:"分析",j:"fan1 sik1",e:"to analyze"},
{c:"考慮",j:"haau2 leoi6",e:"to consider"},
{c:"決定",j:"kyut3 ding6",e:"to decide"},
{c:"傾向",j:"king1 hoeng3",e:"tendency; inclination"},
{c:"反映",j:"faan2 jing2",e:"to reflect; reflection"},
{c:"接受",j:"zip3 sau6",e:"to accept"},
{c:"拒絕",j:"keoi5 zyut6",e:"to refuse; reject"},
{c:"態度",j:"taai3 dou6",e:"attitude"},
{c:"立場",j:"lap6 coeng4",e:"standpoint"},
{c:"共識",j:"gung6 sik1",e:"consensus"},
{c:"爭論",j:"zang1 leon6",e:"to argue; dispute"},
{c:"讓步",j:"joeng6 bou6",e:"to concede; give way"},
{c:"協商",j:"hip3 soeng1",e:"to negotiate"},
{c:"達成",j:"daat6 sing4",e:"to reach; achieve"},
{c:"睇法",j:"tai2 faat3",e:"view; opinion"},
{c:"諗法",j:"nam2 faat3",e:"thought; idea"},
{c:"贊成",j:"zaan3 sing4",e:"to approve; agree with"}
],
dialogue:[
{speaker:"A",c:"聽日我哋要開會討論新項目嘅方案，你對呢件事有咩睇法啊？",j:"ting1 jat6 ngo5 dei6 jiu3 hoi1 wui2 tou2 leon6 san1 hong6 muk6 ge3 fong1 on3 nei5 deoi3 ne1 gin6 si6 jau5 me1 tai2 faat3 aa3",e:"Tomorrow we have a meeting to discuss the new project proposal. What's your view on this?"},
{speaker:"B",c:"我個人傾向用比較保守嘅方案，雖然進展會慢啲，但係風險相對細好多。之前我哋試過太急進，結果反而出咗問題。",j:"ngo5 go3 jan4 king1 hoeng3 jung6 bei2 gaau3 bou2 sau2 ge3 fong1 on3 seoi1 jin4 zeon3 zin2 wui2 maan6 di1 daan6 hai6 fung1 him2 soeng1 deoi3 sai3 hou2 do1 zi1 cin4 ngo5 dei6 si3 gwo3 taai3 gap1 zeon3 git3 gwo2 faan2 ji4 ceot1 zo2 man6 tai4",e:"I personally lean toward a more conservative approach. Although progress would be slower, the risks are much smaller. Before we tried being too aggressive and it backfired."},
{speaker:"A",c:"我理解你嘅考慮，不過我覺得我哋應該要大膽啲嘗試。市場競爭咁激烈，如果我哋唔創新，好容易就會被淘汰。",j:"ngo5 lei5 gaai2 nei5 ge3 haau2 leoi6 bat1 gwo3 ngo5 gok3 dak1 ngo5 dei6 jing1 goi1 jiu3 daai6 daam2 di1 soeng4 si3 si5 coeng4 ging6 zang1 gam3 gik1 lit6 jyu4 gwo2 ngo5 dei6 m4 cong3 san1 hou2 jung4 ji6 zau6 wui2 bei6 tou4 taai3",e:"I understand your concerns, but I think we should be bolder. Market competition is so intense — if we don't innovate, we'll be quickly eliminated."},
{speaker:"B",c:"咁我哋不如各自準備一個方案，聽日開會嘅時候詳細分析兩邊嘅優點同缺點，再一齊決定點樣做。唔好爭論邊個啱，最重要係達成共識。",j:"gam3 ngo5 dei6 bat1 jyu4 gok3 zi6 zeon2 bei6 jat1 go3 fong1 on3 ting1 jat6 hoi1 wui2 ge3 si4 hau6 coeng4 sai3 fan1 sik1 loeng5 bin1 ge3 jau1 dim2 tung4 kyut3 dim2 zoi3 jat1 cai4 kyut3 ding6 dim2 joeng2 zou6 m4 hou2 zang1 leon6 bin1 go3 ngaam1 zeoi3 zung6 jiu3 hai6 daat6 sing4 gung6 sik1",e:"Then why don't we each prepare a proposal? At the meeting tomorrow we'll analyze the pros and cons of both sides in detail, then decide together. Don't argue about who's right — the most important thing is reaching consensus."},
{speaker:"A",c:"好提議！其實就算我哋嘅觀點唔同，都唔係一件壞事。唔同嘅角度可以先至更全面嘅分析。最緊要係大家保持開放嘅態度，願意接受不同意見。",j:"hou2 tai4 ji5 kei4 sat6 zau6 syun3 ngo5 dei6 ge3 gun1 dim2 m4 tung4 dou1 m4 hai6 jat1 gin6 waai6 si6 m4 tung4 ge3 gok3 dou6 ho2 ji5 sin1 zi3 gang3 cyun4 min6 ge3 fan1 sik1 zeoi3 gan2 jiu3 hai6 daai6 gaa1 bou2 ci4 hoi1 fong3 ge3 taai3 dou6 jyun6 ji3 zip3 sau6 bat1 tung4 ji3 gin3",e:"Great suggestion! Actually, even if our views differ, it's not a bad thing. Different perspectives enable a more comprehensive analysis. The key is maintaining an open attitude and being willing to accept different opinions."},
{speaker:"B",c:"無錯，討論唔係為咗贏，而係為咗搵出最好嘅解決方案。有時候需要適當咁讓步，咁先至可以協商到一個大家都接受到嘅結果。",j:"mou4 co3 tou2 leon6 m4 hai6 wai6 zo2 jeng4 ji4 hai6 wai6 zo2 wan2 ceot1 zeoi3 hou2 ge3 gaai2 kyut3 fong1 on3 jau5 si4 hau6 seoi1 jiu3 sik1 dong3 gam3 joeng6 bou6 gam3 sin1 zi3 ho2 ji5 hip3 soeng1 dou3 jat1 go3 daai6 gaa1 dou1 zip3 sau6 dou3 ge3 git3 gwo2",e:"Exactly. Discussion isn't about winning — it's about finding the best solution. Sometimes you need to make appropriate concessions so you can negotiate a result that everyone can accept."},
{speaker:"A",c:"原來一個好嘅討論唔單止係講道理，仲要識得聽人哋嘅角度。接受批評同反映返自己嘅立場，先至可以真正改善團隊嘅決策質素。",j:"jyun4 loi4 jat1 go3 hou2 ge3 tou2 leon6 m4 daan1 zi2 hai6 gong2 dou6 lei5 zung6 jiu3 sik1 dak1 ting3 jan4 dei6 ge3 gok3 dou6 zip3 sau6 pai1 ping4 tung4 faan2 jing2 faan2 zi6 gei2 ge3 lap6 coeng4 sin1 zi3 ho2 ji5 zan1 zing3 goi2 sin6 tyun4 deoi6 ge3 kyut3 caak3 zat1 sou3",e:"So a good discussion isn't just about making your case — you also need to know how to listen to others' perspectives. Accept criticism and reflect back your own position, only then can you truly improve the team's decision-making quality."},
{speaker:"B",c:"學到嘢啊，今日嘅討論令我明白到，團隊合作裏面，達成共識比堅持己見更加重要。適當嘅妥協，其實係一種智慧。",j:"hok6 dou3 je5 aa3 gam1 jat6 ge3 tou2 leon6 ling6 ngo5 ming4 baak6 dou3 tyun4 deoi2 hap6 zok3 leoi5 min6 daat6 sing4 gung6 sik1 bei2 gin1 ci4 gei2 gin3 gang3 gaa1 zung6 jiu3 sik1 dong3 ge3 to5 hip3 kei4 sat6 hai6 jat1 zung3 zi3 wai3",e:"I learned something today. This discussion made me realize that in teamwork, reaching consensus is more important than sticking to your own views. Appropriate compromise is actually a form of wisdom."}
],
grammar:[
{pattern:"傾向 + verb (king1 hoeng3)",desc:"tend to; lean toward — expressing inclination",ex:"我傾向用保守嘅方案 (ngo5 king1 hoeng3 jung6 bou2 sau2 ge3 fong1 on3)",en:"I tend to favor a conservative approach"},
{pattern:"就算...都唔係... (zau6 syun3...dou1 m4 hai6...)",desc:"even if... it is still not... — downplaying contrast",ex:"就算觀點唔同，都唔係一件壞事 (zau6 syun3 gun1 dim2 m4 tung4 dou1 m4 hai6 jat1 gin6 waai6 si6)",en:"Even if views differ, it is still not a bad thing"},
{pattern:"唔好...最重要係... (m4 hou2...zeoi3 zung6 jiu3 hai6...)",desc:"don't... the most important thing is... — priority framing",ex:"唔好爭論邊個啱，最重要係達成共識 (m4 hou2 zang1 leon6 bin1 go3 ngaam1 zeoi3 zung6 jiu3 hai6 daat6 sing4 gung6 sik1)",en:"Don't argue about who is right — the most important thing is reaching consensus"},
{pattern:"唔單止...仲要... (m4 daan1 zi2...zung6 jiu3...)",desc:"not only... but also need to... — dual requirement",ex:"唔單止講道理，仲要識得聽人哋嘅角度 (m4 daan1 zi2 gong2 dou6 lei5 zung6 jiu3 sik1 dak1 ting3 jan4 dei6 ge3 gok3 dou6)",en:"Not just making your case, but also knowing how to listen to others' perspectives"},
{pattern:"比...更加... (bei2...gang3 gaa1...)",desc:"more than... even more... — comparison of importance",ex:"達成共識比堅持己見更加重要 (daat6 sing4 gung6 sik1 bei2 gin1 ci4 gei2 gin3 gang3 gaa1 zung6 jiu3)",en:"Reaching consensus is more important than insisting on your own view"},
{pattern:"唔係為咗...而係為咗... (m4 hai6 wai6 zo2...ji4 hai6 wai6 zo2...)",desc:"not for... but for... — clarifying true purpose",ex:"討論唔係為咗贏，而係為咗搵出最好嘅方案 (tou2 leon6 m4 hai6 wai6 zo2 jeng4 ji4 hai6 wai6 zo2 wan2 ceot1 zeoi3 hou2 ge3 fong1 on3)",en:"Discussion is not for winning, but for finding the best solution"}
],

{q:'The dialogue says about different viewpoints:',opts:["they are always bad","they can lead to more comprehensive analysis","they should be suppressed","they cause confusion always"],ans:1},

]},
{id:8,title:"第八課：人際關係",subtitle:"jan4 zai3 gwaan1 hai6 — Interpersonal Relationships",
vocab:[
{c:"人際關係",j:"jan4 zai3 gwaan1 hai6",e:"interpersonal relationships",summary:"拿捏分寸 (naa4 nip6 fan1 cyun3) — learn to judge appropriate limits in every interaction | Direct speech does not always equal ill will; consider context first | Respect and sincerity build lasting relationships; flattery does not | 逃避只會令到問題越嚟越大 — avoiding problems only makes them grow",intro:"Interpersonal friction is inevitable, but how you handle it defines your relationships. This lesson covers navigating misunderstandings, the art of judging appropriate boundaries, and why respect and sincerity matter more than being right.",summary:"拿捏分寸 — learn to judge appropriate limits | Direct speech does not always equal ill will | Respect and sincerity build lasting relationships | Avoiding problems only makes them grow"},
{c:"壓力",j:"aat3 lik6",e:"pressure, stress"},
{c:"溝通",j:"kau1 tung1",e:"communication"},
{c:"誤會",j:"ng6 wui6",e:"misunderstanding"},
{c:"冷靜",j:"laang5 zing6",e:"calm down"},
{c:"尊重",j:"zyun1 zung6",e:"respect"},
{c:"理解",j:"lei5 gaai2",e:"understand"},
{c:"逃避",j:"tou4 bei6",e:"escape, avoid"},
{c:"包容",j:"baau1 jung4",e:"tolerate"},
{c:"體諒",j:"tai2 loeng6",e:"empathize"},
{c:"真誠",j:"zan1 sing4",e:"sincere"},
{c:"直接",j:"zik6 zip3",e:"direct"},
{c:"語氣",j:"jyu5 hei3",e:"tone of voice"},
{c:"矛盾",j:"maau4 teon5",e:"contradiction, conflict"},
{c:"坦白",j:"taan2 baak6",e:"frank, honest"},
{c:"穩固",j:"wan2 gu3",e:"stable, firm"},
{c:"經驗",j:"ging1 jim6",e:"experience"},
{c:"拿捏分寸",j:"naa4 nip6 fan1 cyun3",e:"judge appropriate limits"},
{c:"鑽牛角尖",j:"zyun3 ngau4 gok3 zim1",e:"overthink, split hairs"},
{c:"針對",j:"zam1 deoi3",e:"to target, aim at"}
],
dialogue:[
{speaker:"A",c:"最近你好似有啲煩喎，成個人都有啲悶悶不樂咁，係咪喺人際關係方面遇到啲乜嘢問題啊？",j:"zeoi3 gan6 nei5 hou2 ci5 jau5 di1 faan4 wo3 seng4 go3 jan4 dou1 jau5 di1 mun6 mun6 bat1 lok6 gam3 hai6 mi1 hai2 jan4 zai3 gwaan1 hai6 fong1 min6 jyu6 dou3 di1 mat1 je5 man6 tai4 aa3",e:"Recently you seem a bit troubled, you seem unhappy. Have you encountered some problem in interpersonal relationships?"},
{speaker:"B",c:"係啊，最近同啲同事相處嗰陣，間中都會覺得有啲壓力，都唔係好知道點樣先可以拿捏好分寸，驚講多錯多。",j:"hai6 aa3 zeoi3 gan6 tung4 di1 tung4 si6 soeng1 cyu3 go2 zan6 gaan3 zung1 dou1 wui2 gok3 dak1 jau5 di1 aat3 lik6 dou1 m4 hai6 hou2 zi1 dou3 dim2 joeng2 sin1 ho2 ji5 naa4 nip6 hou2 fan1 cyun3 ging1 gong2 do1 co3 do1",e:"Yes, recently when getting along with colleagues I sometimes feel pressure. I don't really know how to judge the appropriate limits — afraid the more I speak, the more mistakes."},
{speaker:"A",c:"咁係邊一方面令到你覺得最困擾呢？係溝通嘅問題定係大家做嘢方式唔同嘅問題？",j:"gam3 hai6 bin1 jat1 fong1 min6 ling6 dou3 nei5 gok3 dak1 zeoi3 kwan3 jiu5 ne1 hai6 kau1 tung1 ge3 man6 tai4 ding6 hai6 daai6 gaa1 zou6 je5 fong1 sik1 m4 tung4 ge3 man6 tai4",e:"So which aspect troubles you most? Is it a communication problem, or different ways of doing things?"},
{speaker:"B",c:"主要係有啲同事講嘢比較直接，有時語氣比較衝，我就會喺度諗，佢哋係咪針對緊我呢，搞到自己心入面有啲唔舒服，甚至會亂咁諗嘢。",j:"zyu2 jiu3 hai6 jau5 di1 tung4 si6 gong2 je5 bei2 gaau3 zik6 zip3 jau5 si4 jyu5 hei3 bei2 gaau3 cung1 ngo5 zau6 wui2 hai2 dou6 nam2 keoi5 dei6 hai6 mi1 zam1 deoi3 gan2 ngo5 ne1 gaau2 dou3 zi6 gei2 sam1 jap6 min6 jau5 di1 m4 syu1 fuk6 sam6 zi3 wui2 lyun6 gam3 nam2 je5",e:"Mainly some colleagues speak quite directly, sometimes their tone is blunt. I wonder if they're targeting me, making myself uncomfortable inside, even overthinking things."},
{speaker:"A",c:"首先我會試下先令自己冷靜落嚟，唔好即刻有情緒反應，然後試下企喺對方嘅立場諗一諗。後來發現，其實好多時候都只係因為工作需要，講嘢直接啲，未必真係有惡意。",j:"sau2 sin1 ngo5 wui2 si3 haa6 sin1 ling6 zi6 gei2 laang5 zing6 lok6 lai4 m4 hou2 zik1 hak1 jau5 cing4 seoi5 faan2 jing3 jin4 hau6 si3 haa6 kei5 hai2 deoi3 fong1 ge3 lap6 coeng4 nam2 jat1 nam2 hau6 loi4 faat3 jin6 kei4 sat6 hou2 do1 si4 hau6 dou1 zi2 hai6 jan1 wai6 gung1 zok3 seoi1 jiu3 gong2 je5 zik6 zip3 di1 mei6 bit1 zan1 hai6 jau5 ok3 ji3",e:"First I'd try to calm down, not react emotionally, then try to stand in their position. Later I discovered most of the time it's just work needs — speaking directly doesn't necessarily mean ill will."},
{speaker:"B",c:"我覺得最重要係尊重同埋理解，大家都要試下企喺對方嘅角度諗下。另外都要保持真誠，唔好一味迎合或者討好人，咁樣反而唔長久。",j:"ngo5 gok3 dak1 zeoi3 zung6 jiu3 hai6 zyun1 zung6 tung4 maai4 lei5 gaai2 daai6 gaa1 dou1 jiu3 si3 haa6 kei5 hai2 deoi3 fong1 ge3 gok3 dou6 nam2 haa6 ling6 ngoi6 dou1 jiu3 bou2 ci4 zan1 sing4 m4 hou2 jat1 mei6 jing4 hap6 waak6 ze2 tou2 hou2 jan4 gam3 joeng6 faan2 ji4 m4 zoeng6 gau2",e:"I think the most important things are respect and understanding. Everyone needs to try thinking from the other's perspective. Also maintain sincerity — don't just cater to or flatter people, that won't last."},
{speaker:"A",c:"我覺得逃避只會令到問題越嚟越大，不如適當咁溝通，大家坦白啲講出自己嘅諗法，再互相包容同體諒，反而可以令關係變得更加穩固。",j:"ngo5 gok3 dak1 tou4 bei6 zi2 wui2 ling6 dou3 man6 tai4 jyut6 lai4 jyut6 daai6 bat1 jyu4 sik1 dong3 gam3 kau1 tung1 daai6 gaa1 taan2 baak6 di1 gong2 ceot1 zi6 gei2 ge3 nam2 faat3 zoi3 wu6 soeng1 baau1 jung4 tung4 tai2 loeng6 faan2 ji4 ho2 ji5 ling6 gwaan1 hai6 bin3 dak1 gang3 gaa1 wan2 gu3",e:"I think avoiding only makes problems bigger. Better to communicate appropriately, everyone speak frankly about their thoughts, then mutually tolerate and empathize — this can instead make the relationship more stable."},
{speaker:"B",c:"冇錯，真係要慢慢累積經驗，先會做得越嚟越好。",j:"mou5 co3 zan1 hai6 jiu3 maan6 maan2 leoi6 zik1 ging1 jim6 sin1 wui2 zou6 dak1 jyut6 lai4 jyut6 hou2",e:"That's right. You really need to slowly accumulate experience before you can do better and better."}
],
grammar:[
{pattern:"有啲...咁 (jau5 di1...gam2)",desc:"seems a bit... — describing state or appearance",ex:"成個人都有啲悶悶不樂咁 (seng4 go3 jan4 dou1 jau5 di1 mun6 mun6 bat1 lok6 gam3)",en:"The whole person seems a bit unhappy"},
{pattern:"係咪...啊？(hai6 mai6...aa3?)",desc:"is it that...? — confirming something",ex:"係咪喺人際關係方面遇到問題啊？ (hai6 mi1 hai2 jan4 zai3 gwaan1 hai6 fong1 min6 jyu6 dou3 man6 tai4 aa3)",en:"Is it that you have encountered problems in relationships?"},
{pattern:"點樣先可以... (dim2 joeng2 sin1 ho2 ji5...)",desc:"how to be able to... — asking how to achieve",ex:"點樣先可以拿捏好分寸？ (dim2 joeng2 sin1 ho2 ji5 naa4 nip6 hou2 fan1 cyun3)",en:"How to judge the appropriate limits?"},
{pattern:"驚... (geng1)",desc:"afraid that... — expressing worry",ex:"驚講多錯多 (ging1 gong2 do1 co3 do1)",en:"Afraid that the more I speak, the more mistakes"},
{pattern:"搞到... (gaau2 dou3)",desc:"making it so that... — causing a result",ex:"搞到自己心入面有啲唔舒服 (gaau2 dou3 zi6 gei2 sam1 jap6 min6 jau5 di1 m4 syu1 fuk6)",en:"Making myself feel uncomfortable inside"},
{pattern:"只會令到... (zi2 wui5 ling6 dou3)",desc:"will only make... — negative consequence",ex:"逃避只會令到問題越嚟越大 (tou4 bei6 zi2 wui2 ling6 dou3 man6 tai4 jyut6 lai4 jyut6 daai6)",en:"Avoiding will only make the problem bigger"}
],

{q:'What does "拿捏分寸" mean?',opts:["to measure things","to judge appropriate limits","to argue","to agree"],ans:1},
{q:'"講多錯多" means:',opts:["more speech, fewer mistakes","the more you speak, the more mistakes","speaking is always wrong","never speak"],ans:1},
{q:'The dialogue suggests handling tension by:',opts:["immediately arguing back","calming down and seeing the other perspective","ignoring the problem","complaining to others"],ans:1},
{q:'"逃避只會令到問題越嚟越大" means:',opts:["avoiding solves problems","avoiding only makes problems bigger","problems fix themselves","ignoring is the best solution"],ans:1},

{q:'The dialogue concludes relationships need:',opts:["constant arguing","accumulated experience and gradual improvement","always avoiding","instant perfection"],ans:1}
]},
{id:9,title:"第九課：禮貌與尊重",subtitle:"lai5 maau6 jyu5 zyun1 zung6 — Etiquette and Respect",
vocab:[
{c:"禮貌",j:"lai5 maau6",e:"etiquette, politeness",summary:"Real etiquette comes from the heart (發自內心 faat3 zi6 noi6 sam1), not from going through motions | Stay calm when facing rudeness; responding with emotion escalates conflict | 奔同而止 (sik1 ho2 ji4 zi2) — stop before going too far; avoid emotional confrontations | Respecting others is also protecting yourself — it prevents unnecessary escalation",intro:"True politeness comes from the heart, not from a rulebook. This lesson examines workplace etiquette, the difference between surface-level courtesy and genuine respect, and how handling disagreements calmly builds lasting professional relationships.",summary:"Real etiquette comes from the heart, not from going through motions | Stay calm when facing rudeness | Respecting others protects yourself from escalation | 體諒 builds lasting professional relationships"},
{c:"尊重",j:"zyun1 zung6",e:"respect"},
{c:"部門",j:"bou6 mun4",e:"department"},
{c:"合作",j:"hap6 zok3",e:"cooperate, collaborate"},
{c:"順利",j:"seon6 lei6",e:"smoothly"},
{c:"性格",j:"sing3 gaak3",e:"personality"},
{c:"謹慎",j:"gan2 san6",e:"cautious"},
{c:"缺乏",j:"kyut3 fat6",e:"lack"},
{c:"誤會",j:"ng6 wui6",e:"misunderstanding"},
{c:"衝突",j:"cung1 dat6",e:"conflict"},
{c:"影響",j:"jing2 hoeng2",e:"affect"},
{c:"團隊",j:"tyun4 deoi2",e:"team"},
{c:"氣氛",j:"hei3 fan1",e:"atmosphere"},
{c:"語氣",j:"jyu5 hei3",e:"tone of voice"},
{c:"認真",j:"jing6 zan1",e:"attentively, seriously"},
{c:"同意",j:"tung4 ji3",e:"agree"},
{c:"意見",j:"ji3 gin3",e:"opinion"},
{c:"理解",j:"lei5 gaai2",e:"understand"},
{c:"平和",j:"ping4 wo4",e:"peaceful, calm"},
{c:"回應",j:"wui4 jing3",e:"respond"},
{c:"委屈",j:"wai2 wat1",e:"feel wronged"},
{c:"保護",j:"bou2 wu6",e:"protect"},
{c:"升級",j:"sing1 kap1",e:"escalate"},
{c:"長遠",j:"coeng4 jyun5",e:"long-term"},
{c:"敷衍",j:"fu1 hin2",e:"half-hearted"},
{c:"信任",j:"seon3 jam6",e:"trust"},
{c:"舒服",j:"syu1 fuk6",e:"comfortable"},
{c:"穩定",j:"wan2 ding6",e:"stable"}
],
dialogue:[
{speaker:"A",c:"最近我哋部門嚟咗唔少新同事，你覺得平時同人相處嘅時候，最重要嘅係乜嘢啊？",j:"zeoi3 gan6 ngo5 dei6 bou6 mun4 lai4 zo2 m4 siu2 san1 tung4 si6 nei5 gok3 dak1 ping4 si4 tung4 jan4 soeng1 cyu3 ge3 si4 hau6 zeoi3 zung6 jiu3 ge3 hai6 mat1 je5 aa3",e:"Recently our department has gotten quite a few new colleagues. What do you think is the most important thing when getting along with people?"},
{speaker:"B",c:"我覺得禮貌同尊重真係好重要，尤其係喺工作環境入面。大家一齊做嘢，如果冇基本嘅尊重，其實好難合作得順利。",j:"ngo5 gok3 dak1 lai5 maau6 tung4 zyun1 zung6 zan1 hai6 hou2 zung6 jiu3 jau4 kei4 hai6 hai2 gung1 zok3 waan4 ging2 jap6 min6 daai6 gaa1 jat1 cai4 zou6 je5 jyu4 gwo2 mou5 gei1 bun2 ge3 zyun1 zung6 kei4 sat6 hou2 naan4 hap6 zok3 dak1 seon6 lei6",e:"Etiquette and respect are really important, especially at work. Without basic respect, it's hard to cooperate smoothly."},
{speaker:"B",c:"因為每個人嘅背景、性格同埋做嘢方式都唔一樣，有啲人做嘢快，有啲人就比較謹慎。如果缺乏尊重，好容易就會出現誤會，甚至引起衝突，影響成個團隊嘅氣氛。",j:"jan1 wai6 mui5 go3 jan4 ge3 bui3 ging2 sing3 gaak3 tung4 maai4 zou6 je5 fong1 sik1 dou1 m4 jat1 joeng6 jau5 di1 jan4 zou6 je5 faai3 jau5 di1 jan4 zau6 bei2 gaau3 gan2 san6 jyu4 gwo2 kyut3 fat6 zyun1 zung6 hou2 jung4 ji6 zau6 wui2 ceot1 jin6 ng6 wui6 sam6 zi3 jan5 hei2 cung1 dat6 jing2 hoeng2 seng4 go3 tyun4 deoi2 ge3 hei3 fan1",e:"Everyone's background, personality, and work style are different. Without respect, misunderstandings and conflicts easily arise, affecting the team atmosphere."},
{speaker:"B",c:"例如同同事傾偈嘅時候，我會特別注意語氣，盡量唔好太衝或者太直接；同時都會認真聽對方講嘢，唔會打斷人。就算我唔同意對方嘅意見，我都會先表示理解，再慢慢講返自己嘅睇法。",j:"lai6 jyu4 tung4 tung4 si6 king1 gai2 ge3 si4 hau6 ngo5 wui2 dak6 bit6 zyu3 ji3 jyu5 hei3 zeon6 loeng6 m4 hou2 taai3 cung1 waak6 ze2 taai3 zik6 zip3 tung4 si4 dou1 wui2 jing6 zan1 ting3 deoi3 fong1 gong2 je5 m4 wui2 daa2 dyun6 jan4 zau6 syun3 ngo5 m4 tung4 ji3 deoi3 fong1 ge3 ji3 gin3 ngo5 dou1 wui2 sin1 biu2 si6 lei5 gaai2 zoi3 maan6 maan2 gong2 faan2 zi6 gei2 ge3 tai2 faat3",e:"For example, I pay attention to my tone, listen without interrupting. Even if I disagree, I first show understanding, then share my view."},
{speaker:"B",c:"我通常都會盡量保持冷靜，用比較平和嘅方式回應，唔會用情緒去對抗情緒。因為一旦雙方都情緒化，事情只會越搞越差。",j:"ngo5 tung1 soeng4 dou1 wui2 zeon6 loeng6 bou2 ci4 laang5 zing6 jung6 bei2 gaau3 ping4 wo4 ge3 fong1 sik1 wui4 jing3 m4 wui2 jung6 cing4 seoi5 heoi3 deoi3 kong3 cing4 seoi5 jan1 wai6 jat1 daan3 soeng1 fong1 dou1 cing4 seoi5 faa3 si6 cing4 zi2 wui2 jyut6 gaau2 jyut6 caa1",e:"I stay calm and respond peacefully. If both sides get emotional, things only get worse."},
{speaker:"B",c:"真正嘅禮貌其實係發自內心嘅尊重，而唔係敷衍或者做戲。如果只係表面客氣，但內心唔尊重人，其實對方都感受到，反而會影響信任。",j:"zan1 zing3 ge3 lai5 maau6 kei4 sat6 hai6 faat3 zi6 noi6 sam1 ge3 zyun1 zung6 ji4 m4 hai6 fu1 hin2 waak6 ze2 zou6 hei3 jyu4 gwo2 zi2 hai6 biu2 min6 haak3 hei3 daan6 noi6 sam1 m4 zyun1 zung6 jan4 kei4 sat6 deoi3 fong1 dou1 gam2 sau6 dou3 faan2 ji4 wui2 jing2 hoeng2 seon3 jam6",e:"Real etiquette comes from the heart, not half-hearted actions. Superficial politeness without real respect destroys trust."}
],
grammar:[
{pattern:"尤其係 (jau4 kei4 hai6)",desc:"especially — emphasizes a particular case",ex:"尤其係喺工作環境入面 (jau4 kei4 hai6 hai2 gung1 zok3 waan4 ging2 jap6 min6)",en:"Especially in the work environment"},
{pattern:"就算...都... (zau6 syun3...dou1...)",desc:"even if... still... — concessive structure",ex:"就算我唔同意，我都會先表示理解 (zau6 syun3 ngo5 m4 tung4 ji3 ngo5 dou1 wui2 sin1 biu2 si6 lei5 gaai2)",en:"Even if I don't agree, I still first express understanding"},
{pattern:"而唔係 (ji4 m4 hai6)",desc:"rather than / not... but... — contrast",ex:"而唔係敷衍或者做戲 (ji4 m4 hai6 fu1 hin2 waak6 ze2 zou6 hei3)",en:"Rather than being half-hearted or putting on a show"},
{pattern:"長遠嚟講 (coeng4 jyun5 lai4 gong2)",desc:"in the long run — long-term perspective",ex:"長遠嚟講，對自己同對團隊都係一件好事 (coeng4 jyun5 lai4 gong2 deoi3 zi6 gei2 tung4 deoi3 tyun4 deoi6 dou1 hai6 jat1 gin6 hou2 si6)",en:"In the long run, it is a good thing for yourself and the team"},
{pattern:"反而 (faan2 ji4)",desc:"on the contrary / instead — unexpected result",ex:"反而會影響信任 (faan2 ji4 wui2 jing2 hoeng2 seon3 jam6)",en:"It will actually affect trust"},
{pattern:"如果...就... (jyu4 gwo2...zau6...)",desc:"if... then... — conditional",ex:"如果缺乏尊重，好容易就會出現誤會 (jyu4 gwo2 kyut3 fat6 zyun1 zung6 hou2 jung4 ji6 zau6 wui2 ceot1 jin6 ng6 wui6)",en:"If there is a lack of respect, misunderstandings can easily arise"}
],

{q:'"長遠嚟講" means:',opts:["in the short term","in the long run","right now","never"],ans:1}

dialogue:[
{speaker:"A",c:"最近開會嘅時候，我發現自己有啲諗法講得唔夠清楚，成日都好似表達唔到重點，搞到溝通效果唔係幾理想，有時仲會畀人誤會。",j:"zeoi3 gan6 hoi1 wui2 ge3 si4 hau6 ngo5 faat3 jin6 zi6 gei2 jau5 di1 nam2 faat3 gong2 dak1 m4 gau3 cing1 co2 sing4 jat6 dou1 hou2 ci5 biu2 daat6 m4 dou3 zung6 dim2 gaau2 dou3 kau1 tung1 haau6 gwo2 m4 hai6 gei2 lei5 soeng2 jau5 si4 zung6 wui2 bei2 jan4 ng6 wui6",e:"Lately during meetings, I've noticed my ideas aren't expressed clearly. It always feels like I can't get to the point, making communication less effective, and sometimes I even get misunderstood."},
{speaker:"B",c:"我都好有同感，其實好多時唔係我哋啲內容有問題，而係表達方式影響咗人哋點樣理解。如果講得唔夠清晰，對方好容易捉錯重點。",j:"ngo5 dou1 hou2 jau5 tung4 gam2 kei4 sat6 hou2 do1 si4 m4 hai6 ngo5 dei6 di1 noi6 jung4 jau5 man6 tai4 ji4 hai6 biu2 daat6 fong1 sik1 jing2 hoeng2 zo2 jan4 dei6 dim2 joeng2 lei5 gaai2 jyu4 gwo2 gong2 dak1 m4 gau3 cing1 sik1 deoi3 fong1 hou2 jung4 ji6 zuk1 co3 zung6 dim2",e:"I totally relate. A lot of times it's not that our content is wrong, but the way we express affects how people understand. If you don't speak clearly enough, the other person easily misses the point."},
{speaker:"A",c:"咁你覺得要提升溝通能力，最關鍵係乜嘢？",j:"gam3 nei5 gok3 dak1 jiu3 tai4 sing1 kau1 tung1 nang4 lik6 zeoi3 gwaan1 gin6 hai6 mat1 je5",e:"So what do you think is most crucial for improving communication skills?"},
{speaker:"B",c:"我覺得第一步一定要搞清楚自己嘅目的，即係你想對方明白啲乜嘢，而唔係諗到邊講到邊。如果冇方向，點講都會亂。",j:"ngo5 gok3 dak1 dai6 jat1 bou6 jat1 ding6 jiu3 gaau2 cing1 co2 zi6 gei2 ge3 muk6 dik1 zik1 hai6 nei5 soeng2 deoi3 fong1 ming4 baak6 di1 mat1 je5 ji4 m4 hai6 nam2 dou3 bin1 gong2 dou3 bin1 jyu4 gwo2 mou5 fong1 hoeng3 dim2 gong2 dou1 wui2 lyun6",e:"I think the first step is to be clear about your own purpose — what exactly you want the other person to understand — rather than just rambling. Without direction, no matter how you speak it'll be messy."},
{speaker:"A",c:"聽落好似好簡單，但實際做起上嚟真係唔容易，有時一緊張就亂曬。",j:"ting3 lok6 hou2 ci5 hou2 gaan2 daan1 daan6 sat6 zai3 zou6 hei2 soeng5 lei4 zan1 hai6 m4 jung4 ji6 jau5 si4 jat1 gan2 zoeng1 zau6 lyun6 saai3",e:"That sounds simple enough, but in practice it's really not easy. Sometimes as soon as you get nervous, everything falls apart."},
{speaker:"B",c:"我慢慢學識喺開口之前先整理好思路，例如諗清楚最重要嘅觀點係乜嘢，先講重點，再補充細節。另外我都會留意對方嘅反應，例如佢有冇跟得上，會唔會露出疑惑嘅表情。",j:"ngo5 maan6 maan2 hok6 sik1 hai2 hoi1 hau2 zi1 cin4 sin1 zing2 lei5 hou2 si1 lou6 lai6 jyu4 nam2 cing1 co2 zeoi3 zung6 jiu3 ge3 gun1 dim2 hai6 mat1 je5 sin1 gong2 zung6 dim2 zoi3 bou2 cung1 sai3 zit3 ling6 ngoi6 ngo5 dou1 wui2 lau4 ji3 deoi3 fong1 ge3 faan2 jing3 lai6 jyu4 keoi5 jau5 mou5 gan1 dak1 soeng5 wui2 m4 wui2 lou6 ceot1 ji4 waak6 ge3 biu2 cing4",e:"I gradually learned to organize my thoughts before opening my mouth — figuring out what the most important point is first, then adding details. I also pay attention to the other person's reactions, like whether they're keeping up or showing confused expressions."},
{speaker:"A",c:"咁如果對方嘅諗法同你唔一樣，甚至有啲分歧，你會點處理？",j:"gam3 jyu4 gwo2 deoi3 fong1 ge3 nam2 faat3 tung4 nei5 m4 jat1 joeng6 sam6 zi3 jau5 di1 fan1 kei4 nei5 wui2 dim2 cyu5 lei5",e:"So if the other person thinks differently from you, or there's even some disagreement, how do you handle it?"},
{speaker:"B",c:"我通常會先耐心聽對方講曬，了解清楚佢嘅立場同原因，之後先再回應，而唔會一聽到唔同意就即刻反駁。咁樣大家都會覺得被尊重，氣氛都會好啲。溝通係雙向嘅，如果只係顧住自己講而唔理對方點諗，其實好難達到真正理解。只有建立喺尊重同理解嘅基礎上，表達先會真正發揮到作用。",j:"ngo5 tung1 soeng4 wui2 sin1 noi6 sam1 ting3 deoi3 fong1 gong2 saai3 liu5 gaai2 cing1 co2 keoi5 ge3 lap6 coeng4 tung4 jyun4 jan1 zi1 hau6 sin1 zoi3 wui4 jing1 ji4 m4 wui2 jat1 ting3 dou3 m4 tung4 ji3 zau6 zik1 hak1 faan2 bok3 gam3 joeng6 daai6 gaa1 dou1 wui2 gok3 dak1 bei6 zyun1 zung6 hei3 fan1 dou1 wui2 hou2 di1 kau1 tung1 hai6 soeng1 hoeng3 ge3 jyu4 gwo2 zi2 hai6 gu3 zyu6 zi6 gei2 gong2 ji4 m4 lei5 deoi3 fong1 dim2 nam2 kei4 sat6 hou2 naan4 daat6 dou3 zan1 zing3 lei5 gaai2 zi2 jau5 gin3 lap6 hai2 zyun1 zung6 tung4 lei5 gaai2 ge3 gei1 co2 soeng6 biu2 daat6 sin1 wui2 zan1 zing3 faat3 fai1 dou3 zok3 jung6",e:"I usually first listen to the other person fully, understand their position and reasons, and only then respond — rather than rebutting as soon as I hear disagreement. That way everyone feels respected and the atmosphere improves. Communication is two-way — if you only focus on yourself and ignore what the other person thinks, it's really hard to reach true understanding. Only when expression is built on a foundation of respect and understanding can it truly serve its purpose."}
],
grammar:[
{pattern:"而唔係 (ji4 m4 hai6)",desc:"but rather / not... but... — contrast structure",ex:"表達方式影響咗人哋點樣理解，而唔係內容有問題 (biu2 daat6 fong1 sik1 jing2 hoeng2 zo2 jan4 dei6 dim2 joeng2 lei5 gaai2 ji4 m4 hai6 noi6 jung4 jau5 man6 tai4)",en:"It is how we express that affects understanding, not that the content is wrong"},
{pattern:"搞到 + result (gaau2 dou3)",desc:"causing / making it so that... — negative consequence",ex:"表達唔到重點，搞到溝通效果唔係幾理想 (biu2 daat6 m4 dou3 zung6 dim2 gaau2 dou3 kau1 tung1 haau6 gwo2 m4 hai6 gei2 lei5 soeng2)",en:"Can't express the point clearly, making communication less effective"},
{pattern:"喺...之前先... (hai2...zi1 cin4 sin1...)",desc:"before... first... — preparation emphasis",ex:"喺開口之前先整理好思路 (hai2 hoi1 hau2 zi1 cin4 sin1 zing2 lei5 hou2 si1 lou6)",en:"First organize your thoughts before opening your mouth"},
{pattern:"一...就... (jat1...zau6...)",desc:"as soon as... then... — immediate consequence",ex:"一緊張就亂曬 (jat1 gan2 zoeng1 zau6 lyun6 saai3)",en:"As soon as you get nervous, everything falls apart"},
{pattern:"唔會一聽到...就... (m4 wui2 jat1 ting3 dou3...zau6...)",desc:"won't immediately... upon hearing... — deliberate restraint",ex:"唔會一聽到唔同意就即刻反駁 (m4 wui2 jat1 ting3 dou3 m4 tung4 ji3 zau6 zik1 hak1 faan2 bok3)",en:"Won't immediately rebut upon hearing disagreement"},
{pattern:"只有...先會... (zi2 jau5...sin1 wui6...)",desc:"only when... then will... — strong conditional",ex:"只有建立喺尊重同理解嘅基礎上，表達先會真正發揮到作用 (zi2 jau5 gin3 lap6 hai2 zyun1 zung6 tung4 lei5 gaai2 ge3 gei1 co2 soeng6 biu2 daat6 sin1 wui2 zan1 zing3 faat3 fai1 dou3 zok3 jung6)",en:"Only when expression is built on respect and understanding can it truly serve its purpose"}
],
