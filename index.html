<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantonese Learner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--accent:#6c5ce7;--accent2:#a29bfe;--text:#e8e8f0;--text2:#9a9ab0;--green:#00b894;--red:#e17055;--yellow:#fdcb6e;--blue:#74b9ff;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:20px}
header{text-align:center;padding:30px 0;border-bottom:1px solid var(--surface2);margin-bottom:30px}
header h1{font-size:2em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--text2);margin-top:5px}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:10px 20px;background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:.95em;transition:all .2s}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.section{display:none;margin-bottom:30px}
.section.active{display:block}
h2{font-size:1.4em;margin-bottom:16px}
.dialogue-line{margin-bottom:16px;padding:12px 16px;border-radius:8px;border-left:3px solid var(--accent)}
.dialogue-line .speaker{font-weight:700;color:var(--accent2);margin-bottom:4px}
.dialogue-line .cantonese{font-size:1.15em;margin-bottom:6px}
.dialogue-line .jyutping{color:var(--text2);font-style:italic;font-size:.9em;margin-bottom:4px;display:none}
.dialogue-line .english{color:var(--yellow);font-size:.9em;display:none}
.toggle-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.toggle-btn{padding:6px 14px;background:var(--surface2);border:1px solid transparent;border-radius:20px;cursor:pointer;color:var(--text2);font-size:.85em;transition:all .2s}
.toggle-btn:hover{color:var(--text)}
.toggle-btn.on{background:var(--accent);color:#fff}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.vocab-card{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .3s;position:relative}
.vocab-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.vocab-card .front,.vocab-card .back{transition:opacity .3s}
.vocab-card .back{display:none}
.vocab-card.flipped .front{display:none}
.vocab-card.flipped .back{display:block}
.vocab-card .word{font-size:1.3em;font-weight:700;margin-bottom:2px}
.vocab-card .jp{color:var(--accent2);font-size:.85em;margin-bottom:4px}
.vocab-card .meaning{color:var(--text2);font-size:.9em}
.vocab-card .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7em;margin-top:6px;background:var(--surface2);color:var(--text2)}
.mastery-dots{display:flex;gap:3px;margin-top:6px}
.mastery-dots .dot{width:8px;height:8px;border-radius:50%;background:var(--surface2);transition:background .3s}
.mastery-dots .dot.f1{background:var(--red)}
.mastery-dots .dot.f2{background:var(--yellow)}
.mastery-dots .dot.f3{background:var(--blue)}
.mastery-dots .dot.f4{background:var(--green)}
.mastery-dots .dot.f5{background:var(--accent2)}
.grammar-card{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.grammar-card .pattern{color:var(--accent2);font-weight:700;margin-bottom:6px}
.grammar-card .example{color:var(--text);margin-bottom:4px}
.grammar-card .explanation{color:var(--text2);font-size:.9em;margin-top:6px}
.score-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-radius:var(--radius);margin-bottom:20px}
.score-bar .score{font-size:1.2em;font-weight:700;color:var(--green)}
.score-bar .total{color:var(--text2)}
.progress{height:4px;background:var(--surface2);border-radius:2px;flex:1}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.flashcard-area{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:16px}
.flashcard{width:100%;max-width:400px;height:220px;perspective:1000px;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.flashcard-front{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--surface2)}
.flashcard-back{background:linear-gradient(135deg,#2d1b69,#1a1d27);border:1px solid var(--accent);transform:rotateY(180deg)}
.flashcard-face .big{font-size:2em;font-weight:700}
.flashcard-face .sub{color:var(--accent2);font-size:1.1em;margin-top:4px}
.flashcard-face .hint{color:var(--text2);font-size:.85em;margin-top:8px}
.fc-controls{display:flex;gap:10px}
.fc-btn{padding:10px 20px;border-radius:8px;border:1px solid var(--surface2);background:var(--surface);color:var(--text);cursor:pointer;font-size:.9em;transition:all .2s}
.fc-btn:hover{border-color:var(--accent)}
.fc-btn.skip{border-color:var(--red);color:var(--red)}
.fc-btn.got-it{border-color:var(--green);color:var(--green)}
.fc-btn:disabled{opacity:.35;cursor:default}
.fc-counter{color:var(--text2);font-size:.85em}
.fc-mode-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.kb-hint{color:var(--text2);font-size:.75em;text-align:center}
.session-summary{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:24px;text-align:center;max-width:420px}
.session-summary h3{font-size:1.3em;margin-bottom:8px}
.session-stats{display:flex;justify-content:center;gap:24px;margin:16px 0}
.session-stats .stat{display:flex;flex-direction:column;align-items:center}
.session-stats .num{font-size:2em;font-weight:700}
.session-stats .label{color:var(--text2);font-size:.85em}
.quiz-container{margin-top:10px}
.quiz-q{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.quiz-q .q-text{font-size:1.05em;margin-bottom:12px}
.quiz-options{display:flex;flex-direction:column;gap:8px}
.quiz-opt{padding:10px 14px;background:var(--surface2);border:1px solid transparent;border-radius:8px;cursor:pointer;transition:all .2s;font-size:.95em}
.quiz-opt:hover{border-color:var(--accent)}
.quiz-opt.correct{background:var(--green);color:#fff;border-color:var(--green)}
.quiz-opt.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.quiz-opt.disabled{pointer-events:none;opacity:.7}
.quiz-modes{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.qmode-btn{padding:6px 14px;background:var(--surface2);border:1px solid transparent;border-radius:20px;cursor:pointer;color:var(--text2);font-size:.85em;transition:all .2s}
.qmode-btn:hover{color:var(--text)}
.qmode-btn.active{background:var(--accent);color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card .num{font-size:1.8em;font-weight:700}
.stat-card .label{color:var(--text2);font-size:.85em;margin-top:2px}
.stat-card.green .num{color:var(--green)}
.stat-card.yellow .num{color:var(--yellow)}
.stat-card.accent .num{color:var(--accent)}
.stat-card.blue .num{color:var(--blue)}
.stat-card.red .num{color:var(--red)}
.streak-display{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);margin-bottom:20px}
.streak-display .fire{font-size:1.5em}
.streak-display .count{font-size:1.3em;font-weight:700;color:var(--yellow)}
.streak-display .label{color:var(--text2)}
.mastery-chart{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:16px;margin-bottom:20px}
.mastery-chart h3{font-size:1.1em;margin-bottom:12px}
.chart-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chart-row .box-label{width:80px;color:var(--text2);font-size:.85em}
.chart-row .bar-track{flex:1;height:20px;background:var(--surface2);border-radius:4px;overflow:hidden}
.chart-row .bar-fill{height:100%;border-radius:4px;transition:width .3s}
.chart-row .count{color:var(--text);font-size:.85em;min-width:30px;text-align:right;font-weight:600}
.action-row{display:flex;gap:10px;flex-wrap:wrap}
.action-btn{padding:10px 18px;border-radius:8px;border:1px solid var(--surface2);background:var(--surface);color:var(--text);cursor:pointer;font-size:.9em;transition:all .2s}
.action-btn:hover{border-color:var(--accent)}
.action-btn.danger{border-color:var(--red);color:var(--red)}
.hidden-input{display:none}
@media(max-width:600px){.vocab-grid{grid-template-columns:1fr}.dialogue-line .cantonese{font-size:1em}.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>粵語學習</h1>
<p>Cantonese Learner — Interactive Study Tool</p>
</header>
<div class="tabs" id="lessonTabs"></div>
<div id="content"></div>
</div>
<script>
const LESSONS=[
{id:1,title:"第一課：時間管理同生活節奏",subtitle:"si4 gaan3 gun2 lei5 tung4 sang1 wut6 zik3 zau3 — Time Management and Life Rhythm",
vocab:[
{c:"分配",j:"fan1 pui3",e:"to allocate, distribute"},
{c:"取捨",j:"ceoi2 se3",e:"trade-off, make choices"},
{c:"優先",j:"jau1 sin1",e:"priority"},
{c:"規劃",j:"kwai1 waak6",e:"to plan, map out"},
{c:"專注",j:"zyun1 zyu3",e:"to focus, concentrate"},
{c:"干擾",j:"gon1 jiu5",e:"distraction, interference"},
{c:"拖延",j:"to1 jin4",e:"to procrastinate"},
{c:"自律",j:"zi6 leot6",e:"self-discipline"},
{c:"充電",j:"cung1 din6",e:"to recharge"},
{c:"緩衝",j:"wun4 cung1",e:"buffer, cushion"},
{c:"繃緊",j:"bang1 gan2",e:"tense, strained"},
{c:"減壓",j:"gaam2 aat3",e:"to relieve stress"},
{c:"充實",j:"cung1 sat1",e:"fulfilling, enriched"},
{c:"精力",j:"zing1 lik6",e:"energy, vigor"},
{c:"分心",j:"fan1 sam1",e:"to get distracted"},
{c:"次序",j:"ci3 seoi5",e:"order, sequence"},
{c:"突發",j:"dat6 faat3",e:"sudden, unexpected"},
{c:"持之以恆",j:"ci4 zi2 ji5 hang4",e:"persevere consistently"},
{c:"效率",j:"haau6 leot2",e:"efficiency"},
{c:"節奏",j:"zik3 zau3",e:"rhythm, pace"},
{c:"調整",j:"tiu4 zing2",e:"to adjust"},
{c:"培養",j:"pui4 joeng5",e:"to cultivate, develop"},
{c:"手忙腳亂",j:"sau2 mong4 goek3 lyun6",e:"in a frantic rush"}
],
dialogue:[
{speaker:"A",c:"最近我覺得時間永遠都唔夠用，做完一樣嘢又有下一樣，好似永遠都追唔上個節奏。你平時點樣分配時間㗎？",j:"zeoi3 gan6 ngo5 gok3 dak1 si4 gaan3 wing5 jyun5 dou1 m4 gau3 jung6, zou6 jyun4 jat1 joeng6 je5 jau6 jau5 haa6 jat1 joeng6, hou2 ci5 wing5 jyun5 dou1 zeoi1 m4 soeng5 go3 zik3 zau3. nei5 ping4 si4 dim2 joeng2 fan1 pui3 si4 gaan3 gaa3?",e:"I feel like time is never enough lately. After finishing one thing there's the next — like I can never catch up with the pace. How do you allocate your time?"},
{speaker:"B",c:"我以前都係咁，成日覺得唔夠時間用，後來發現問題唔係時間唔夠，而係唔識得做取捨。乜嘢都想做，結果乜嘢都做唔好，反而浪費咗好多精力。",j:"ngo5 ji5 cin4 dou1 hai6 gam2, seng4 jat6 gok3 dak1 m4 gau3 si4 gaan3 jung6, hau6 loi4 faat3 jin6 man6 tai4 m4 hai6 si4 gaan3 m4 gau3, ji4 hai6 m4 sik1 dak1 zou6 ceoi2 se3. me1 je5 dou1 soeng2 zou6, git3 gwo2 me1 je5 dou1 zou6 m4 hou2, faan2 ji4 long6 fai3 zo2 hou2 do1 zing1 lik6.",e:"I used to be like that too, always feeling short on time. Later I realized the problem wasn't not having enough time, but not knowing how to make trade-offs. Wanting to do everything, and ending up doing nothing well — actually wasted a lot of energy."},
{speaker:"A",c:"咁你而家係點樣做取捨㗎？我有時都知自己應該專注做最重要嘅嘢，但係好多時候都會被其他嘢干擾，容易分心。",j:"gam2 nei5 ji4 gaa1 hai6 dim2 joeng2 zou6 ceoi2 se3 gaa3? ngo5 jau5 si4 dou1 zi1 zi6 gei2 jing1 goi1 zyun1 zyu3 zou6 zeoi3 zung6 jiu3 ge3 je5, daan6 hai6 hou2 do1 si4 hau6 dou1 wui5 bei6 kei4 taa1 je5 gon1 jiu5, jung4 ji6 fan1 sam1.",e:"So how do you make trade-offs now? Sometimes I know I should focus on the most important things, but I often get distracted by other things and lose focus easily."},
{speaker:"B",c:"我學識咗將所有嘢按優先次序排列，最緊要嘅放最前。同埋我會規劃好每個禮拜嘅時間表，預留啲緩衝時間，唔好將每一分鐘都排得滿滿。咁樣就算有突發事情都唔會搞到手忙腳亂。",j:"ngo5 hok6 sik1 zo2 zoeng1 so2 jau5 je5 on3 jau1 sin1 ci3 seoi5 paai4 lit6, zeoi3 gan2 jiu3 ge3 fong3 zeoi3 cin4. tung4 maai4 ngo5 wui5 kwai1 waak6 hou2 mui5 go3 lai5 baai3 ge3 si4 gaan3 biu1, jyu6 lau4 di1 wun4 cung1 si4 gaan3, m4 hou2 zoeng3 mui5 jat1 fan1 zung1 dou1 paai4 dak1 mun5 mun5. gam2 joeng2 zau6 syun3 jau5 dat6 faat3 si6 cing4 dou1 m4 wui5 gaau2 dou3 sau2 mong4 goek3 lyun6.",e:"I learned to arrange everything by priority, putting the most important first. And I plan out a weekly schedule, leaving buffer time — not packing every minute full. That way even if something unexpected comes up, it won't throw everything into chaos."},
{speaker:"A",c:"聽落好有道理。不過我有個壞習慣就係容易拖延，明明知道要做，但係就係唔想開始，成日等到最後一刻先至做，搞到自己好大壓力。",j:"teng1 lok6 hou2 jau5 dou6 lei5. bat1 gwo3 ngo5 jau5 go3 waai6 zaap6 gwaan3 zau6 hai6 jung4 ji6 to1 jin4, ming4 ming4 zi1 dou3 jiu3 zou6, daan6 hai6 zau6 hai6 m4 soeng2 hoi1 ci2, seng4 jat6 dang3 dou3 zeoi3 hau6 jat1 hak1 sin1 zi3 zou6, gaau2 dou3 zi6 gei2 hou2 daai6 aat3 lik6.",e:"That sounds very reasonable. But I have a bad habit of procrastinating — I know I need to do something but just don't want to start. Always waiting until the last minute, putting myself under huge pressure."},
{speaker:"B",c:"拖延其實好多時候係因為驚做唔好，或者覺得任務太大唔知點開始。你可以試下將大任務拆細，每次只專注做一小部分，咁樣就冇咁容易覺得有壓力。最重要係培養自律，持之以恆。",j:"to1 jin4 kei4 sat6 hou2 do1 si4 hau6 hai6 jan1 wai6 geng1 zou6 m4 hou2, waak6 ze2 gok3 dak1 jam6 mou6 taai3 daai6 m4 zi1 dim2 hoi1 ci2. nei5 ho2 ji5 si3 haa5 zoeng1 daai6 jam6 mou6 caak3 sai3, mui5 ci3 zi2 zyun1 zyu3 zou6 jat1 siu2 bou6 fan6, gam2 joeng2 zau6 mou5 gam2 jung4 ji6 gok3 dak1 jau5 aat3 lik6. zeoi3 zung6 jiu3 hai6 pui4 joeng5 zi6 leot6, ci4 zi2 ji5 hang4.",e:"Procrastination is often because you're afraid of not doing well, or feel the task is too big to know where to start. Try breaking big tasks into smaller pieces, focusing on just one part at a time — that way it's less overwhelming. The key is cultivating self-discipline and sticking with it."},
{speaker:"A",c:"你講得啱，我都要學下點樣管理自己嘅時間同心態。唔通你又冇覺得累嘅時候咩？你點樣充電？",j:"nei5 gong2 dak1 ngaam1, ngo5 dou1 jiu3 hok6 haa5 dim2 joeng2 gun2 lei5 zi6 gei2 ge3 si4 gaan3 tung4 sam1 taai3. m4 tung1 nei5 jau6 mou5 gok3 dak1 leoi6 ge3 si4 hau6 me1? nei5 dim2 joeng2 cung1 din6?",e:"You're right, I need to learn how to manage my time and mindset too. But don't you ever feel tired? How do you recharge?"},
{speaker:"B",c:"當然有啦，人都係人。我每個禮拜都會預留一段時間俾自己完全放低工作，去做啲自己鍾意嘅嘢，譬如行下山、睇下書。適當嘅休息唔係浪費時間，而係為咗更長遠嘅效率。繃緊嘅弦係會斷㗎，要識得減壓先至行得更遠。",j:"dong1 jin4 jau5 laa1, jan4 dou1 hai6 jan4. ngo5 mui5 go3 lai5 baai3 dou1 wui5 jyu6 lau4 jat1 dyun6 si4 gaan3 bei2 zi6 gei2 jyun4 cyun4 fong3 dai1 gung1 zok3, heoi3 zou6 di1 zi6 gei2 zung1 ji3 ge3 je5, pei3 jyu2 haang4 haa5 saan1, tai2 haa5 syu1. sik1 dong3 ge3 jau1 sik1 m4 hai6 long6 fai3 si4 gaan3, ji4 hai6 wai6 zo2 gaa3 coeng4 jyun5 ge3 haau6 leot2. bang1 gan2 ge3 jin4 hai6 wui5 tyun5 gaa3, jiu3 sik1 dak1 gaam2 aat3 sin1 zi3 haang4 dak1 gaa3 jyun5.",e:"Of course I do, I'm only human. Every week I set aside time to completely put down work and do things I enjoy, like hiking or reading. Proper rest isn't wasting time — it's for longer-term efficiency. A taut string will break; you need to know how to relieve stress to go further."}
],
grammar:[
{pattern:"唔係...而係... (m4 hai6... ji4 hai6...)",desc:"not... but rather...",ex:"問題唔係時間唔夠，而係唔識得做取捨 (man6 tai4 m4 hai6 si4 gaan3 m4 gau3, ji4 hai6 m4 sik1 dak1 zou6 ceoi2 se3)",en:"The problem isn't not enough time, but not knowing how to make trade-offs"},
{pattern:"搞到 + result (gaau2 dou3)",desc:"causing / making it so that...",ex:"搞到自己好大壓力 (gaau2 dou3 zi6 gei2 hou2 daai6 aat3 lik6)",en:"Putting myself under huge pressure"},
{pattern:"按 + noun + 次序排列 (on3 ci3 seoi5 paai4 lit6)",desc:"arrange according to order/priority",ex:"按優先次序排列 (on3 jau1 sin1 ci3 seoi5 paai4 lit6)",en:"Arrange by priority"},
{pattern:"咁樣就算...都... (gam2 joeng2 zau6 syun3... dou1...)",desc:"that way, even if... still...",ex:"咁樣就算有突發事情都唔會手忙腳亂 (gam2 joeng2 zau6 syun3 jau5 dat6 faat3 si6 cing4 dou1 m4 wui5 sau2 mong4 goek3 lyun6)",en:"That way even if something unexpected happens, it won't cause chaos"},
{pattern:"唔通...咩？(m4 tung1... me1?)",desc:"rhetorical question — don't tell me...",ex:"唔通你又冇覺得累嘅時候咩？(m4 tung1 nei5 jau6 mou5 gok3 dak1 leoi6 ge3 si4 hau6 me1?)",en:"Don't tell me you never feel tired?"},
{pattern:"唔係 X 而係為咗 Y (m4 hai6 X ji4 hai6 wai6 zo2 Y)",desc:"not X, but for the purpose of Y",ex:"唔係浪費時間，而係為咗更長遠嘅效率 (m4 hai6 long6 fai3 si4 gaan3, ji4 hai6 wai6 zo2 gaa3 coeng4 jyun5 ge3 haau6 leot2)",en:"Not wasting time, but for longer-term efficiency"}
],
quiz:[
{q:'What does "取捨" mean?',opts:["to give up completely","trade-off, making choices","to arrange","to rush"],ans:1},
{q:'"拖延" means:',opts:["to focus","to relax","to procrastinate","to plan"],ans:2},
{q:'What does "持之以恆" mean?',opts:["occasionally","as quickly as possible","persevere consistently","temporarily"],ans:2},
{q:'"搞到自己好大壓力" means:',opts:["I feel very happy","I put myself under huge pressure","I solved the problem","I finished early"],ans:1},
{q:'What does "緩衝時間" mean?',opts:["wasted time","overtime","buffer time","deadline"],ans:2},
{q:'"繃緊嘅弦係會斷" is a metaphor meaning:',opts:["too much tension leads to breaking down","music helps you relax","strings are expensive","you should play an instrument"],ans:0},
{q:'What does "充電" mean in this context?',opts:["to charge a phone","to recharge oneself","to turn off","to sleep late"],ans:1},

dialogue:[
{speaker:"A",c:"今日想去邊度食飯呀？",j:"gam1 jat1 soeng2 heoi3 bin1 dou6 sik6 faan6 aa3?",e:"Where do you want to eat today?"},
{speaker:"B",c:"我都唔知呀，你好耐冇飲茶喇，不如去食點心啦。",j:"ngo5 dou1 m4 zi1 aa3, nei5 hou2 noi6 mou5 jam2 caa4 laa3, bat1 jyu4 heoi3 sik6 dim2 sam1 laa1.",e:"I'm not sure either. You haven't had dim sum in a while, how about we go for dim sum?"},
{speaker:"A",c:"好呀！你最鍾意食咩點心？蒸嘅定係炸嘅？",j:"hou2 aa3! nei5 zeoi3 zung1 ji3 sik6 me1 dim2 sam1? zing1 ge3 ding6 hai6 zaa3 ge3?",e:"Sure! What dim sum do you like the most? Steamed or deep-fried?"},
{speaker:"B",c:"我最鍾意蝦餃同埋燒賣，仲有腸粉。蒸嘅比較健康，炸嘅就熱氣啲。",j:"ngo5 zeoi3 zung1 ji3 haa1 gaau2 tung4 maai4 siu1 maai2, zung6 jau5 ceong4 fan2. zing1 ge3 bei2 gaau3 gin6 hong1, zaa3 ge3 zau6 jit6 hei3 di1.",e:"I like shrimp dumplings and siu mai the most, and also rice noodle rolls. Steamed ones are relatively healthier, deep-fried ones cause more internal heat."},
{speaker:"A",c:"你識唔識煮飯㗎？平時多數自己煮定係叫外賣？",j:"nei5 sik1 m4 sik1 zyu2 faan6 gaa3? ping4 si4 do1 sou3 zi6 gei2 zyu2 ding6 hai6 giu3 ngoi6 maai6?",e:"Do you know how to cook? Do you mostly cook at home or order delivery?"},
{speaker:"B",c:"我識煮少少，平時會煲湯同炒下菜。我最常煲蓮藕排骨湯，材料簡單又有營養。你下次嚟我屋企，我煮俾你食！",j:"ngo5 sik1 zyu2 siu2 siu2, ping4 si4 wui5 bou1 tong1 tung4 caau2 haa5 coi3. ngo5 zeoi3 soeng4 bou1 lin4 ngau5 paai4 gwat1 tong1, coi4 liu2 gaan2 daan1 jau6 jau5 jing4 joeng5. nei5 haa6 ci3 lei4 ngo5 uk1 kei2, ngo5 zyu2 bei2 nei5 sik6!",e:"I know how to cook a little. I usually make soup and stir-fry vegetables. The soup I make most often is lotus root and pork rib soup — simple and nutritious. Come over next time, I'll cook for you!"}
],
grammar:[
{pattern:"不如...啦 (bat1 jyu4...laa1)",desc:"how about / why don't we — makes a suggestion",ex:"不如去食點心啦 (bat1 jyu4 heoi3 sik6 dim2 sam1 laa1)",en:"How about we go eat dim sum?"},
{pattern:"最鍾意 (zeoi3 zung1 ji3)",desc:"like the most / favorite",ex:"你最鍾意食咩點心 (nei5 zeoi3 zung1 ji3 sik6 me1 dim2 sam1)",en:"What dim sum do you like the most?"},
{pattern:"...定係... (...ding6 hai6...)",desc:"or — used in alternative questions",ex:"蒸嘅定係炸嘅 (zing1 ge3 ding6 hai6 zaa3 ge3)",en:"Steamed ones or deep-fried ones?"},
{pattern:"比較 + adj (bei2 gaau3)",desc:"relatively / comparatively — softens a comparison",ex:"蒸嘅比較健康 (zing1 ge3 bei2 gaau3 gin6 hong1)",en:"Steamed ones are relatively healthier"},
{pattern:"識唔識 + verb (sik1 m4 sik1)",desc:"know how to (do something) or not",ex:"你識唔識煮飯 (nei5 sik1 m4 sik1 zyu2 faan6)",en:"Do you know how to cook?"},
{pattern:"俾 + person + verb (bei2)",desc:"for (someone) to (do) — doing something for someone",ex:"我煮俾你食 (ngo5 zyu2 bei2 nei5 sik6)",en:"I'll cook for you to eat"}
],

{q:'What does "飲茶" typically mean in Cantonese?',opts:["just drinking tea","a dim sum meal","cooking at home","ordering delivery"],ans:1},

{c:"耐用",j:"noi6 jung6",e:"durable"},
{c:"款式",j:"fun2 sik1",e:"style; model"},
{c:"選擇",j:"syun2 zaak6",e:"choice; to choose"},
{c:"評價",j:"ping4 gaa3",e:"review; evaluation"},

dialogue:[
{speaker:"A",c:"我最近想買部新電腦，但係唔知邊款好，你有咩推介啊？",j:"ngo5 zeoi3 gan6 soeng2 maai5 bou6 san1 din6 nou5, daan6 hai6 m4 zi1 bin1 fun2 hou2, nei5 jau5 me1 teoi1 gaai3 aa3?",e:"I've been wanting to buy a new laptop lately, but I don't know which model is good. Do you have any recommendations?"},
{speaker:"B",c:"你預算大約幾多錢啊？如果你主要係用嚟做嘢，我覺得 MacBook Air 幾抵買。",j:"nei5 jyu6 syun3 daai6 joek3 gei2 do1 cin4 aa3? jyu4 gwo2 nei5 zyu2 jiu3 hai6 jung6 lei4 zou6 je5, ngo5 gok3 dak1 MacBook Air gei2 dai2 maai5.",e:"What's your budget roughly? If you mainly use it for work, I think MacBook Air is quite worth buying."},
{speaker:"A",c:"大約一萬蚊左右啦。其實我都諗過，不過我想比較下唔同牌子嘅質素同價錢先。",j:"daai6 joek3 jat1 maan6 man1 zo2 jau6 laa1. kei4 sat6 ngo5 dou1 nam2 gwo3, bat1 gwo3 ngo5 soeng2 bei2 gaau3 haa5 m4 tung4 paai4 zi2 ge3 zat1 sou3 tung4 gaa3 cin4 sin1.",e:"Around ten thousand dollars. I've actually thought about it, but I want to compare the quality and prices of different brands first."},
{speaker:"B",c:"咁你可以去深水埗黃金電腦商場睇下，嗰度有好多選擇。你仲可以上網睇下其他用家嘅評價。",j:"gam2 nei5 ho2 ji5 heoi3 sam1 seoi2 pok2 wong4 gam1 din6 nou5 soeng1 coeng4 tai2 haa5, go2 dou6 jau5 hou2 do1 syun2 zaak6. nei5 zung6 ho2 ji5 soeng5 mong5 tai2 haa5 kei4 taa1 jung6 gaa1 ge3 ping4 gaa3.",e:"Then you can go check out the Golden Computer Arcade in Sham Shui Po, there are lots of choices. You can also look at online reviews from other users."},
{speaker:"A",c:"網購會唔會平啲啊？我見有啲網站打折扣，不過我怕退換唔方便。",j:"mong5 kau3 wui5 m4 wui5 peng4 di1 aa3? ngo5 gin3 jau5 di1 mong5 zaam6 daa2 zit3 kau3, bat1 gwo3 ngo5 paa3 teoi3 wun6 m4 fong1 bin6.",e:"Would online shopping be cheaper? I see some websites have discounts, but I'm worried that returns might not be convenient."},
{speaker:"B",c:"網購通常會平少少，但係你要留意退換政策。我建議你先去店鋪試用下，覺得啱用先至網上訂購，咁就穩陣啲。",j:"mong5 kau3 tung1 soeng4 wui5 peng4 siu2 siu2, daan6 hai6 nei5 jiu3 lau4 ji3 teoi3 wun6 zing3 caak3. ngo5 gin3 ji3 nei5 sin1 heoi3 dim3 pou3 si3 jung6 haa5, gok3 dak1 ngaam1 jung6 sin1 zi3 mong5 soeng6 ding3 kau3, gam2 zau6 wan2 zan6 di1.",e:"Online shopping is usually a bit cheaper, but you need to check the return policy. I suggest you go try it out in a store first, and only order online when you're sure it suits you — that's safer."}
],
grammar:[
{pattern:"想 + verb (soeng2)",desc:"expressing desire or intention",ex:"我想買部新電腦 (ngo5 soeng2 maai5 bou6 san1 din6 nou5)",en:"I want to buy a new computer"},
{pattern:"唔知 + question word + 好 (m4 zi1...hou2)",desc:"expressing uncertainty about which option is best",ex:"唔知邊款好 (m4 zi1 bin1 fun2 hou2)",en:"Don't know which model is good"},
{pattern:"如果... (jyu4 gwo2...)",desc:"if — expressing a condition",ex:"如果你主要係用嚟做嘢 (jyu4 gwo2 nei5 zyu2 jiu3 hai6 jung6 lei4 zou6 je5)",en:"If you mainly use it for work"},
{pattern:"會唔會 + verb/adj (wui5 m4 wui5)",desc:"forming a yes/no question about possibility",ex:"網購會唔會平啲啊？(mong5 kau3 wui5 m4 wui5 peng4 di1 aa3?)",en:"Would online shopping be cheaper?"},
{pattern:"先至 + verb (sin1 zi3)",desc:"only then / not until then",ex:"覺得啱用先至買 (gok3 dak1 ngaam1 jung6 sin1 zi3 maai5)",en:"Only buy it after you feel it suits you"},
{pattern:"用嚟 + verb (jung6 lei4)",desc:"used for / used to",ex:"主要係用嚟做嘢 (zyu2 jiu3 hai6 jung6 lei4 zou6 je5)",en:"Mainly used for work"}
],

{id:4,title:"第四課：健康同運動",subtitle:"gin6 hong1 tung4 wan6 dung6 — Health and Exercise",
vocab:[
{c:"運動",j:"wan6 dung6",e:"exercise; sports"},
{c:"跑步",j:"paau2 bou6",e:"running"},
{c:"游水",j:"jau4 seoi2",e:"swimming"},
{c:"健康",j:"gin6 hong1",e:"health"},
{c:"體能",j:"tai2 nang4",e:"physical fitness"},
{c:"作息",j:"zok3 zik1",e:"daily routine (work and rest)"},
{c:"維持",j:"wai4 ci4",e:"to maintain"},
{c:"拉筋",j:"laai1 gan1",e:"stretching"},
{c:"出汗",j:"ceot1 hong6",e:"to sweat"},
{c:"體力",j:"tai2 lik6",e:"physical strength; stamina"},
{c:"恢復",j:"fui1 fuk6",e:"to recover"},
{c:"毅力",j:"ngai6 lik6",e:"perseverance; willpower"},
{c:"適量",j:"sik1 loeng6",e:"in moderation"},
{c:"過度",j:"gwo3 dou6",e:"excessive; overdoing"},
{c:"傷害",j:"soeng1 hoi6",e:"injury; harm"},
{c:"暖身",j:"nyun5 san1",e:"warm up"},
{c:"消耗",j:"siu1 hou3",e:"to consume; deplete"},
{c:"補充",j:"bou2 cung1",e:"to supplement; replenish"},
{c:"狀態",j:"zong6 taai3",e:"condition; state"},
{c:"放鬆",j:"fong3 sung1",e:"to relax"},
{c:"規律",j:"kwai1 leot6",e:"regular pattern; routine"},
{c:"恆心",j:"hang4 sam1",e:"perseverance; persistence"}
],
dialogue:[
{speaker:"A",c:"我最近成日覺得好攰，返工冇咩精神，係唔係唔夠運動啊？",j:"ngo5 zeoi3 gan6 seng4 jat6 gok3 dak1 hou2 gui6, faan1 gung1 mou5 me1 zing1 san4, hai6 m4 hai6 m4 gau3 wan6 dung6 aa3?",e:"I've been feeling tired all the time lately, no energy at work. Is it because I'm not getting enough exercise?"},
{speaker:"B",c:"好有可能㗎。你平時有冇做運動㗎？我每朝早都會去跑步，做完之後成個人精神好多。",j:"hou2 ho2 nang4 gaa3. nei5 ping4 si4 jau5 mou5 zou6 wan6 dung6 gaa3? ngo5 mui5 ziu1 zou2 dou1 wui5 heoi3 paau2 bou6, zou6 jyun4 zi1 hau6 seng4 go3 jan4 zing1 san4 hou2 do1.",e:"Very likely. Do you normally exercise? I go running every morning, and I feel so much more energetic afterwards."},
{speaker:"A",c:"我好少做運動，返到屋企就淨係攤喺梳化睇電視。我都想開始做運動，但係唔知由咩開始好。",j:"ngo5 hou2 siu2 zou6 wan6 dung6, faan1 dou3 uk1 kei2 zau6 zing6 hai6 taan1 hai2 so1 faa2 tai2 din6 si6. ngo5 dou1 soeng2 hoi1 ci2 zou6 wan6 dung6, daan6 hai6 m4 zi1 jau4 me1 hoi1 ci2 hou2.",e:"I rarely exercise. When I get home I just lie on the sofa watching TV. I do want to start exercising, but I don't know where to begin."},
{speaker:"B",c:"你可以由跑步開始，每次跑二十分鐘就夠㗎啦。記住要做暖身同拉筋，唔係好容易受傷害㗎。",j:"nei5 ho2 ji5 jau4 paau2 bou6 hoi1 ci2, mui5 ci3 paau2 ji6 sap6 fan1 zung1 zau6 gau3 gaa3 laa1. gei3 zyu6 jiu3 zou6 nyun5 san1 tung4 laai1 gan1, m4 hai6 hou2 jung4 ji6 sau6 soeng1 hoi6 gaa3.",e:"You can start with running, twenty minutes each time is enough. Remember to warm up and stretch, otherwise it's easy to get injured."},
{speaker:"A",c:"跑步會唔會好辛苦啊？我怕我體力應付唔到。",j:"paau2 bou6 wui5 m4 wui5 hou2 san1 fu2 aa3? ngo5 paa3 ngo5 tai2 lik6 jing1 fu6 m4 dou3.",e:"Would running be too hard? I'm worried I won't have the stamina for it."},
{speaker:"B",c:"一開始唔使太過度，適量就得㗎啦。你仲要注意休息同營養，作息定時，咁先至可以恢復體力。我游水嗰陣都覺得好放鬆，你可以試下㗎。",j:"jat1 hoi1 ci2 m4 sai2 taai3 gwo3 dou6, sik1 loeng6 zau6 dak1 gaa3 laa1. nei5 zung6 jiu3 ziu3 ji3 jau1 sik1 tung4 jing4 joeng5, zok3 zik1 ding6 si4, gam2 sin1 zi3 ho2 ji5 fui1 fuk6 tai2 lik6. ngo5 jau4 seoi2 go2 zan6 dou1 gok3 dak1 hou2 fong3 sung1, nei5 ho2 ji5 si3 haa5 gaa3.",e:"You don't need to overdo it at first, moderate exercise is fine. You also need to pay attention to rest and nutrition, keep a regular routine, and only then can you recover your stamina. I feel really relaxed when swimming, you could give it a try."}
],
grammar:[
{pattern:"成日 + verb (seng4 jat6)",desc:"all the time / frequently",ex:"我最近成日覺得好攰 (ngo5 zeoi3 gan6 seng4 jat6 gok3 dak1 hou2 gui6)",en:"I've been feeling tired all the time lately"},
{pattern:"有冇 + verb (jau5 mou5)",desc:"forming a yes/no question about having done something",ex:"你平時有冇做運動？(nei5 ping4 si4 jau5 mou5 zou6 wan6 dung6?)",en:"Do you usually exercise?"},
{pattern:"唔使 + adj/verb (m4 sai2)",desc:"no need to / don't have to",ex:"一開始唔使太過度 (jat1 hoi1 ci2 m4 sai2 taai3 gwo3 dou6)",en:"You don't need to overdo it at the beginning"},
{pattern:"咁先至可以 + verb (gam2 sin1 zi3 ho2 ji5)",desc:"only then can (something happen)",ex:"作息定時，咁先至可以恢復體力 (zok3 zik1 ding6 si4, gam2 sin1 zi3 ho2 ji5 fui1 fuk6 tai2 lik6)",en:"Keep a regular routine, only then can you recover your stamina"},
{pattern:"由 + noun + 開始 (jau4...hoi1 ci2)",desc:"to start with / begin from",ex:"你可以由跑步開始 (nei5 ho2 ji5 jau4 paau2 bou6 hoi1 ci2)",en:"You can start with running"},
{pattern:"淨係 + verb (zing6 hai6)",desc:"only / just (doing something)",ex:"淨係攤喺梳化睇電視 (zing6 hai6 taan1 hai2 so1 faa2 tai2 din6 si6)",en:"Just lie on the sofa watching TV"}
],

dialogue:[
{speaker:"A",c:"你最近做緊咩工呀？我聽講你轉咗新工。",j:"nei5 zeoi3 gan6 zou6 gan2 me1 gung1 aa3? ngo5 teng1 gong2 nei5 zyun3 zo2 san1 gung1.",e:"What job are you doing recently? I heard you changed to a new job."},
{speaker:"B",c:"係呀，我依家喺一間科技公司做項目管理。工作量幾大，不過發展機會都唔錯。",j:"hai6 aa3, ngo5 ji1 gaa1 hai2 jat1 gaan1 fo1 gei6 gung1 si1 zou6 hong6 muk6 gun2 lei5. gung1 zok3 loeng6 gei2 daai6, bat1 gwo3 faat3 zin2 gei1 wui6 dou1 m4 co3.",e:"Yeah, I'm now doing project management at a tech company. The workload is quite heavy, but the development opportunities aren't bad."},
{speaker:"A",c:"咁就好啦！你個新上司點呀？對下屬好唔好？",j:"gam2 zau6 hou2 laa1! nei5 go3 san1 soeng6 si1 dim2 aa3? deoi3 haa6 suk6 hou2 m4 hou2?",e:"That's good then! How's your new boss? Are they good to subordinates?"},
{speaker:"B",c:"佢幾好，好有經驗，而且俾好多機會我哋。就係有時期限太緊，成日要加班。",j:"keoi5 gei2 hou2, hou2 jau5 ging1 jim6, ji4 ce2 bei2 hou2 do1 gei1 wui6 ngo5 dei6. zau6 hai6 jau5 si4 kei4 haan6 taai3 gan2, seng4 jat6 jiu3 gaa1 baan1.",e:"Pretty good, very experienced, and gives us lots of opportunities. It's just that sometimes deadlines are too tight, so we always have to work overtime."},
{speaker:"A",c:"咁辛苦！你有冇諗過爭取升職？定係想轉其他行業？",j:"gam2 san1 fu2! nei5 jau5 mou5 nam2 gwo3 zaang1 ceoi2 sing1 zik1? ding6 hai6 soeng2 zyun3 kei4 taa1 hong4 jip6?",e:"That's rough! Have you ever thought about going for a promotion? Or do you want to switch to another industry?"},
{speaker:"B",c:"我都想晉升，不過要考慮薪酬同待遇。最重要係想平衡到工作同生活，呢個先係我嘅目標。",j:"ngo5 dou1 soeng2 zeon3 sing1, bat1 gwo3 jiu3 haau2 leoi6 san1 cau4 tung4 doi6 jyu5. zeoi3 zung6 jiu3 hai6 soeng2 ping4 hang4 dou3 gung1 zok3 tung4 sang1 wut6, ni1 go3 sin1 hai6 ngo5 ge3 muk6 biu1.",e:"I do want to advance, but I need to consider salary and conditions. The most important thing is wanting to balance work and life — that's truly my goal."}
],

dialogue:[
{speaker:"A",c:"喂，你今個禮拜有冇空呀？我想約你出嚟聚下。",j:"wai3, nei5 gam1 go3 lai5 baai3 jau5 mou5 hung3 aa3? ngo5 soeng2 joek3 nei5 ceot1 lei4 zeoi6 haa5.",e:"Hey, are you free this week? I want to ask you out to catch up."},
{speaker:"B",c:"有呀！咁啱我都想搵人去行山。你有冇興趣？",j:"jau5 aa3! gam2 ngaam1 ngo5 dou1 soeng2 wan2 jan4 heoi3 haang4 saan1. nei5 jau5 mou5 hing1 ceoi3?",e:"I am! Coincidentally I also want to find someone to go hiking. Are you interested?"},
{speaker:"A",c:"好呀！幾時去？我想叫埋阿明同小玲一齊去。",j:"hou2 aa3! gei2 si4 heoi3? ngo5 soeng2 giu3 maai4 aa3 ming4 tung4 siu2 ling4 jat1 cai4 heoi3.",e:"Sure! When shall we go? I want to invite Ah Ming and Siu Ling to go together."},
{speaker:"B",c:"聽日朝早得唔得？我打電話聯絡佢哋先，睇下佢哋得唔得閒。",j:"ting1 jat6 ziu1 zou2 dak1 m4 dak1? ngo5 daa2 din6 waa6 lyun4 lok3 keoi5 dei6 sin1, tai2 haa5 keoi5 dei6 dak1 m4 dak1 haan4.",e:"Is tomorrow morning okay? I'll call them first, see if they're free."},
{speaker:"A",c:"得！行完山之後我哋去食晚餐啦，順便傾下近況。",j:"dak1! haang4 jyun4 saan1 zi1 hau6 ngo5 dei6 heoi3 sik6 maan5 caan1 laa1, seon6 bin6 king1 haa5 gan6 fong3.",e:"Sure! After hiking let's go have dinner, and catch up on how things are going."},
{speaker:"B",c:"好主意！我好耐冇見佢哋，友誼真係要用心維持。",j:"hou2 zyu2 ji3! ngo5 hou2 noi6 mou5 gin3 keoi5 dei6, jau5 ji4 zan1 hai6 jiu3 jung6 sam1 wai4 ci4.",e:"Good idea! I haven't seen them for a long time, friendship really needs to be maintained with effort."},
{speaker:"A",c:"係呀，定期聚會好重要。咁我哋約幾點呀？",j:"hai6 aa3, ding6 kei4 zeoi6 wui6 hou2 zung6 jiu3. gam2 ngo5 dei6 joek3 gei2 dim2 aa3?",e:"Yeah, regular gatherings are really important. So what time should we meet?"}

{id:7,title:"第七課：表達意見同討論",subtitle:"biu2 daat6 ji3 gin3 tung4 tou2 leon6 — Expressing Opinions and Discussion",
vocab:[

{c:"睇法",j:"tai2 faat3",e:"opinion, view (colloquial)"},

dialogue:[
{speaker:"A",c:"聽日我哋要開會討論新項目嘅方案，你對呢件事有咩睇法啊？",j:"ting1 jat6 ngo5 dei2 jiu3 hoi1 wui2 tou2 leon6 san1 hong6 muk6 ge3 fong1 on3, nei5 deoi3 ni1 gin6 si6 jau5 me1 tai2 faat3 aa3?",e:"We need to have a meeting tomorrow to discuss the new project proposal. What's your opinion on this?"},
{speaker:"B",c:"我個人傾向用比較保守嘅方案，雖然進展會慢啲，但係風險相對細好多。之前我哋試過太急進，結果反而出咗問題。",j:"ngo5 go3 jan4 king1 hoeng3 jung6 bei2 gaau3 bou2 sau2 ge3 fong1 on3, seoi1 jin4 zeon3 zin2 wui5 maan6 di1, daan6 hai6 fung1 him2 soeng1 deoi3 sai3 hou2 do1. zi1 cin4 ngo5 dei2 si3 gwo3 taai3 gap1 zeon3, git3 gwo2 faan2 ji4 ceot1 zo2 man6 tai4.",e:"I personally lean toward a more conservative approach. Though progress will be slower, the risk is much lower. We've tried being too aggressive before and it backfired."},
{speaker:"A",c:"我理解你嘅考慮，不過我覺得我哋應該要大膽啲嘗試。市場競爭咁激烈，如果我哋唔創新，好容易就會被淘汰。",j:"ngo5 lei5 gaai2 nei5 ge3 haau2 leoi6, bat1 gwo3 ngo5 gok3 dak1 ngo5 dei2 jing1 goi1 jiu3 daai6 dim2 di1 soeng4 si3. si5 coeng4 ging6 zau1 gam3 gik1 lit6, jyu4 gwo2 ngo5 dei2 m4 cong3 san1, hou2 jung4 ji6 zau6 wui5 bei6 tou4 taai3.",e:"I understand your concern, but I think we should be bolder. Market competition is fierce — if we don't innovate, we'll easily be eliminated."},
{speaker:"B",c:"咁我哋不如各自準備一個方案，聽日開會嘅時候詳細分析兩邊嘅優點同缺點，再一齊決定點樣做。唔好爭論邊個啱，最重要係達成共識。",j:"gam2 ngo5 dei2 bat1 jyu4 gok3 zi6 zeon2 bei6 jat1 go3 fong1 on3, ting1 jat6 hoi1 wui2 ge3 si4 hau6 joeng4 sik1 fan1 sik1 loeng5 bin1 ge3 jau1 dim2 tung4 kyut3 dim2, zoi3 jat1 cai4 kyut3 ding6 dim2 joeng2 zou6. m4 hou2 zaang1 leon6 bin1 go3 ngaam1, zeoi3 zung6 jiu3 hai6 daat6 sing4 gung6 sik1.",e:"How about we each prepare a proposal, then analyze the pros and cons in detail at tomorrow's meeting, and decide together. No need to argue about who's right — the key is reaching consensus."},
{speaker:"A",c:"好提議！其實就算我哋嘅觀點唔同，都唔係一件壞事。唔同嘅角度可以先至更全面嘅分析。最緊要係大家保持開放嘅態度，願意接受不同意見。",j:"hou2 tai4 ji3! kei4 sat6 zau6 syun3 ngo5 dei2 ge3 gun1 dim2 m4 tung4, dou1 m4 hai6 jat1 gin6 waai6 si6. m4 tung4 ge3 gok3 dou6 ho2 ji5 sin1 zi3 gaa3 cyun4 min6 ge3 fan1 sik1. zeoi3 gan2 jiu3 hai6 daai6 gaa1 bou2 ci4 hoi1 fong3 ge3 taai3 dou6, jyun6 ji3 zip3 sau6 m4 tung4 ji3 gin3.",e:"Good suggestion! Actually, having different viewpoints isn't a bad thing. Different angles lead to more comprehensive analysis. The most important thing is keeping an open attitude and being willing to accept different opinions."},
{speaker:"B",c:"無錯，討論唔係為咗贏，而係為咗搵出最好嘅解決方案。有時候需要適當咁讓步，咁先至可以協商到一個大家都接受到嘅結果。",j:"mou4 co3, tou2 leon6 m4 hai6 wai6 zo2 jeng4, ji4 hai6 wai6 zo2 wan2 ceot1 zeoi3 hou2 ge3 gaai2 kyut3 fong1 on3. jau5 si4 hau6 seoi1 jiu3 sik1 dong3 gam2 joeng6 bou6, gam2 sin1 zi3 ho2 ji5 hip6 soeng1 dou3 jat1 go3 daai6 gaa1 dou1 zip3 sau6 dou3 ge3 git3 gwo2.",e:"Exactly. Discussion isn't about winning, but about finding the best solution. Sometimes you need to make appropriate concessions — that's how you negotiate a result everyone can accept."}
],
grammar:[
{pattern:"傾向... (king1 hoeng3...)",desc:"tend to / lean toward",ex:"我個人傾向用比較保守嘅方案 (ngo5 go3 jan4 king1 hoeng3 jung6 bei2 gaau3 bou2 sau2 ge3 fong1 on3)",en:"I personally lean toward a more conservative approach"},
{pattern:"唔係...而係... (m4 hai6... ji4 hai6...)",desc:"not... but rather...",ex:"唔係為咗贏，而係為咗搵出最好嘅方案 (m4 hai6 wai6 zo2 jeng4, ji4 hai6 wai6 zo2 wan2 ceot1 zeoi3 hou2 ge3 fong1 on3)",en:"Not about winning, but about finding the best solution"},
{pattern:"最緊要係 (zeoi3 gan2 jiu3 hai6)",desc:"the most important thing is...",ex:"最緊要係大家保持開放嘅態度 (zeoi3 gan2 jiu3 hai6 daai6 gaa1 bou2 ci4 hoi1 fong3 ge3 taai3 dou6)",en:"The most important thing is everyone keeps an open attitude"},
{pattern:"咁先至可以... (gam2 sin1 zi3 ho2 ji5...)",desc:"only then can we...",ex:"咁先至可以協商到一個大家都接受到嘅結果 (gam2 sin1 zi3 ho2 ji5 hip6 soeng1 dou3 jat1 go3 daai6 gaa1 dou1 zip3 sau6 dou3 ge3 git3 gwo2)",en:"Only then can we negotiate a result everyone can accept"},
{pattern:"為咗... (wai6 zo2...)",desc:"for the purpose of / in order to",ex:"為咗搵出最好嘅解決方案 (wai6 zo2 wan2 ceot1 zeoi3 hou2 ge3 gaai2 kyut3 fong1 on3)",en:"In order to find the best solution"},
{pattern:"各自... (gok3 zi6...)",desc:"each on one's own / respectively",ex:"各自準備一個方案 (gok3 zi6 zeon2 bei6 jat1 go3 fong1 on3)",en:"Each prepare a proposal on our own"}
],

const INTERVALS=[0,86400000,259200000,604800000,1209600000];
const BOX_COLORS=['var(--red)','var(--yellow)','var(--blue)','var(--green)','var(--accent2)'];
const BOX_LABELS=['Box 1 — New','Box 2 — Soon','Box 3 — Familiar','Box 4 — Known','Box 5 — Mastered'];

let progress=loadProgress();
let currentLesson=0;
let showJp=false,showEn=false;
let currentSection='dialogue';
let fcMode='due',fcQueue=[],fcQueuePos=0,fcFlipped=false,fcSessionDone=false;
let fcSessionCorrect=0,fcSessionWrong=0,fcMistakes=[];

function loadProgress(){
  try{const d=JSON.parse(localStorage.getItem('cantonese_progress'));if(d&&d.version===1)return d}catch(e){}
  return{version:1,streak:{lastDate:'',count:0},words:{}};
}
function saveProgress(){localStorage.setItem('cantonese_progress',JSON.stringify(progress))}

function markWord(char,correct){
  if(!progress.words[char])progress.words[char]={box:1,lastReview:0,nextReview:0,correct:0,wrong:0};
  const w=progress.words[char];
  w.lastReview=Date.now();
  if(correct){w.box=Math.min(5,w.box+1);w.correct++}
  else{w.box=1;w.wrong++}
  w.nextReview=INTERVALS[w.box-1]===0?0:w.lastReview+INTERVALS[w.box-1];
  updateStreak();
  saveProgress();
}

function isDue(char){
  const w=progress.words[char];
  if(!w)return true;
  return Date.now()>=w.nextReview;
}

function getBox(char){
  const w=progress.words[char];
  return w?w.box:0;
}

function updateStreak(){
  const today=new Date().toDateString();
  const s=progress.streak;
  if(s.lastDate===today)return;
  const yesterday=new Date(Date.now()-86400000).toDateString();
  s.count=s.lastDate===yesterday?s.count+1:1;
  s.lastDate=today;
  saveProgress();
}

function masteryDots(char){
  const box=getBox(char);
  let h='<div class="mastery-dots">';
  for(let i=1;i<=5;i++){
    h+='<div class="dot'+(i<=box?' f'+box:'')+'"></div>';
  }
  return h+'</div>';
}

function getLessonStats(L){
  const boxes=[0,0,0,0,0];
  let newC=0;
  L.vocab.forEach(v=>{
    const w=progress.words[v.c];
    if(!w)newC++;else boxes[w.box-1]++;
  });
  return{total:L.vocab.length,new:newC,learning:boxes[0]+boxes[1]+boxes[2],mastered:boxes[3]+boxes[4],boxes};
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function init(){
  const tabs=document.getElementById('lessonTabs');
  LESSONS.forEach((l,i)=>{
    const t=document.createElement('div');
    t.className='tab'+(i===0?' active':'');
    t.textContent=l.title;
    t.onclick=()=>switchLesson(i);
    tabs.appendChild(t);
  });
  initFcSession();
  quizQuestions=LESSONS[0].quiz.map(q=>({...q}));
  render();
}

function switchLesson(i){
  currentLesson=i;
  document.querySelectorAll('#lessonTabs .tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));
  showJp=false;showEn=false;
  initFcSession();
  quizMode='meaning';
  quizQuestions=LESSONS[i].quiz.map(q=>({...q}));
  quizAnswered=0;quizCorrect=0;
  render();
}

function render(){
  const L=LESSONS[currentLesson];
  const s=currentSection;
  document.getElementById('content').innerHTML=
    '<div class="tabs" style="margin-bottom:16px">'+
    '<div class="tab'+(s==='dialogue'?' active':'')+'" onclick="showSection(\'dialogue\',this)">💬 Dialogue</div>'+
    '<div class="tab'+(s==='vocab'?' active':'')+'" onclick="showSection(\'vocab\',this)">📚 Vocabulary</div>'+
    '<div class="tab'+(s==='flashcards'?' active':'')+'" onclick="showSection(\'flashcards\',this)">🃏 Flashcards</div>'+
    '<div class="tab'+(s==='grammar'?' active':'')+'" onclick="showSection(\'grammar\',this)">🔑 Grammar</div>'+
    '<div class="tab'+(s==='quiz'?' active':'')+'" onclick="showSection(\'quiz\',this)">❓ Quiz</div>'+
    '<div class="tab'+(s==='progress'?' active':'')+'" onclick="showSection(\'progress\',this)">📊 Progress</div>'+
    '</div>'+
    '<div id="sec-dialogue" class="section'+(s==='dialogue'?' active':'')+'">'+renderDialogue(L)+'</div>'+
    '<div id="sec-vocab" class="section'+(s==='vocab'?' active':'')+'">'+renderVocab(L)+'</div>'+
    '<div id="sec-flashcards" class="section'+(s==='flashcards'?' active':'')+'">'+renderFlashcards(L)+'</div>'+
    '<div id="sec-grammar" class="section'+(s==='grammar'?' active':'')+'">'+renderGrammar(L)+'</div>'+
    '<div id="sec-quiz" class="section'+(s==='quiz'?' active':'')+'">'+renderQuiz(L)+'</div>'+
    '<div id="sec-progress" class="section'+(s==='progress'?' active':'')+'">'+renderProgress(L)+'</div>';
}

function showSection(id,el){
  currentSection=id;
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}

function toggleJp(){showJp=!showJp;document.querySelectorAll('.dialogue-line .jyutping').forEach(e=>e.style.display=showJp?'block':'none');document.getElementById('btn-jp').classList.toggle('on',showJp)}
function toggleEn(){showEn=!showEn;document.querySelectorAll('.dialogue-line .english').forEach(e=>e.style.display=showEn?'block':'none');document.getElementById('btn-en').classList.toggle('on',showEn)}

function renderDialogue(L){
  let h='<div class="toggle-row"><button id="btn-jp" class="toggle-btn'+(showJp?' on':'')+'" onclick="toggleJp()">Jyutping</button><button id="btn-en" class="toggle-btn'+(showEn?' on':'')+'" onclick="toggleEn()">English</button><button class="toggle-btn" onclick="toggleJp();toggleEn()">Toggle All</button></div>';
  L.dialogue.forEach(d=>{
    h+='<div class="dialogue-line"><div class="speaker">'+d.speaker+'</div><div class="cantonese">'+d.c+'</div><div class="jyutping" style="display:'+(showJp?'block':'none')+'">'+d.j+'</div><div class="english" style="display:'+(showEn?'block':'none')+'">'+d.e+'</div></div>';
  });
  return h;
}

function renderVocab(L){
  let h='<p style="color:var(--text2);margin-bottom:12px">Click a card to see the English meaning</p><div class="vocab-grid">';
  L.vocab.forEach(v=>{
    h+='<div class="vocab-card" onclick="this.classList.toggle(\'flipped\')"><div class="front"><div class="word">'+v.c+'</div><div class="jp">'+v.j+'</div>'+masteryDots(v.c)+'<div class="tag">click to flip</div></div><div class="back"><div class="word" style="color:var(--yellow)">'+v.e+'</div><div class="jp">'+v.c+'</div><div class="meaning">'+v.j+'</div></div></div>';
  });
  return h+'</div>';
}

function initFcSession(){
  const L=LESSONS[currentLesson];
  fcMode='due';fcFlipped=false;fcSessionDone=false;
  fcSessionCorrect=0;fcSessionWrong=0;fcMistakes=[];
  fcQueue=[];
  L.vocab.forEach((v,i)=>{if(isDue(v.c))fcQueue.push(i)});
  fcQueue=shuffle(fcQueue);
  fcQueuePos=0;
}

function startFcSession(mode){
  const L=LESSONS[currentLesson];
  fcMode=mode;fcFlipped=false;fcSessionDone=false;
  fcSessionCorrect=0;fcSessionWrong=0;fcMistakes=[];
  if(mode==='due'){
    fcQueue=[];
    L.vocab.forEach((v,i)=>{if(isDue(v.c))fcQueue.push(i)});
  }else{
    fcQueue=[...Array(L.vocab.length).keys()];
  }
  fcQueue=shuffle(fcQueue);
  fcQueuePos=0;
  document.getElementById('sec-flashcards').innerHTML=renderFlashcards(L);
}

function startFcMistakes(){
  if(fcMistakes.length===0)return;
  const L=LESSONS[currentLesson];
  fcQueue=shuffle(fcMistakes);
  fcMistakes=[];
  fcQueuePos=0;fcFlipped=false;fcSessionDone=false;
  fcSessionCorrect=0;fcSessionWrong=0;
  document.getElementById('sec-flashcards').innerHTML=renderFlashcards(L);
}

function renderFlashcards(L){
  const dueCount=L.vocab.filter(v=>isDue(v.c)).length;
  const totalCount=L.vocab.length;

  let h='<div class="fc-mode-row">'+
    '<button class="toggle-btn'+(fcMode==='due'?' on':'')+'" onclick="startFcSession(\'due\')">📋 Due ('+dueCount+')</button>'+
    '<button class="toggle-btn'+(fcMode==='all'?' on':'')+'" onclick="startFcSession(\'all\')">📚 All ('+totalCount+')</button>'+
    '</div>';

  if(fcQueue.length===0&&fcMode==='due'){
    h+='<div class="session-summary"><h3>All caught up!</h3><p style="color:var(--text2);margin:12px 0">No cards due for review right now. Great work!</p><div class="fc-controls" style="justify-content:center"><button class="fc-btn got-it" onclick="startFcSession(\'all\')">Review All</button></div></div>';
    return h;
  }

  if(fcSessionDone){
    const pct=fcQueue.length>0?Math.round(fcSessionCorrect/fcQueue.length*100):0;
    h+='<div class="session-summary"><h3>Session Complete!</h3><div class="session-stats">'+
      '<div class="stat"><div class="num" style="color:var(--green)">'+fcSessionCorrect+'</div><div class="label">Correct</div></div>'+
      '<div class="stat"><div class="num" style="color:var(--red)">'+fcSessionWrong+'</div><div class="label">Need Practice</div></div>'+
      '<div class="stat"><div class="num" style="color:var(--accent)">'+pct+'%</div><div class="label">Accuracy</div></div>'+
      '</div><div class="fc-controls" style="justify-content:center;gap:10px">';
    if(fcSessionWrong>0)h+='<button class="fc-btn skip" onclick="startFcMistakes()">Review Mistakes ('+fcSessionWrong+')</button>';
    h+='<button class="fc-btn got-it" onclick="startFcSession(\''+fcMode+'\')">Start Over</button></div></div>';
    return h;
  }

  const vi=fcQueue[fcQueuePos];
  const v=L.vocab[vi];
  const w=progress.words[v.c];
  const box=w?w.box:0;

  h+='<div class="flashcard-area"><div class="fc-counter">'+(fcQueuePos+1)+' / '+fcQueue.length+'</div>'+
    masteryDots(v.c)+
    '<div class="flashcard'+(fcFlipped?' flipped':'')+'" onclick="fcFlip(this)"><div class="flashcard-inner">'+
    '<div class="flashcard-face flashcard-front"><div class="big">'+v.c+'</div><div class="hint">Click to reveal</div></div>'+
    '<div class="flashcard-face flashcard-back"><div class="big">'+v.j+'</div><div class="sub">'+v.e+'</div></div>'+
    '</div></div>'+
    '<div class="fc-controls">'+
    '<button class="fc-btn skip" onclick="fcAnswer(false)"'+(fcFlipped?'':' disabled')+'>Don\'t Know</button>'+
    '<button class="fc-btn got-it" onclick="fcAnswer(true)"'+(fcFlipped?'':' disabled')+'>Got It</button>'+
    '</div><div class="kb-hint">Space: flip &middot; &larr; Don\'t Know &middot; &rarr; Got It</div></div>';
  return h;
}

function fcFlip(el){fcFlipped=!fcFlipped;el.classList.toggle('flipped',fcFlipped)}

function fcAnswer(correct){
  if(!fcFlipped||fcSessionDone)return;
  const L=LESSONS[currentLesson];
  const vi=fcQueue[fcQueuePos];
  const v=L.vocab[vi];
  markWord(v.c,correct);
  if(correct)fcSessionCorrect++;else{fcSessionWrong++;fcMistakes.push(vi)}
  fcQueuePos++;fcFlipped=false;
  if(fcQueuePos>=fcQueue.length)fcSessionDone=true;
  document.getElementById('sec-flashcards').innerHTML=renderFlashcards(L);
}

function renderGrammar(L){
  return L.grammar.map(g=>'<div class="grammar-card"><div class="pattern">'+g.pattern+'</div><div class="explanation">'+g.desc+'</div><div class="example">'+g.ex+'<br><span style="color:var(--yellow);font-size:.9em">'+g.en+'</span></div></div>').join('');
}

function generateAutoQuiz(L,mode){
  const picked=shuffle([...Array(L.vocab.length).keys()]).slice(0,10);
  return picked.map(vi=>{
    const v=L.vocab[vi];
    const others=shuffle(L.vocab.filter((_,j)=>j!==vi)).slice(0,3);
    let opts,q;
    if(mode==='reverse'){
      q='Which Cantonese word means "'+v.e+'"?';
      opts=[v.c,...others.map(d=>d.c)];
    }else{
      q='What is the Jyutping for "'+v.c+'"?';
      opts=[v.j,...others.map(d=>d.j)];
    }
    const correctOpt=opts[0];
    const shuffled=shuffle(opts);
    return{q,opts:shuffled,ans:shuffled.indexOf(correctOpt),wordKey:v.c};
  });
}

function setQuizMode(mode){
  quizMode=mode;quizAnswered=0;quizCorrect=0;
  const L=LESSONS[currentLesson];
  quizQuestions=mode==='meaning'?L.quiz.map(q=>({...q})):generateAutoQuiz(L,mode);
  document.getElementById('sec-quiz').innerHTML=renderQuiz(L);
}

function renderQuiz(L){
  let h='<div class="quiz-modes">'+
    '<button class="qmode-btn'+(quizMode==='meaning'?' active':'')+'" onclick="setQuizMode(\'meaning\')">Cantonese → English</button>'+
    '<button class="qmode-btn'+(quizMode==='reverse'?' active':'')+'" onclick="setQuizMode(\'reverse\')">English → Cantonese</button>'+
    '<button class="qmode-btn'+(quizMode==='jyutping'?' active':'')+'" onclick="setQuizMode(\'jyutping\')">Jyutping Match</button>'+
    '</div>';

  if(quizQuestions.length===0)return h+'<p style="color:var(--text2)">Select a quiz mode above.</p>';

  h+='<div class="score-bar"><span class="score">'+quizCorrect+'</span><span class="total">/ '+quizQuestions.length+'</span><div class="progress"><div class="progress-fill" style="width:'+quizAnswered/quizQuestions.length*100+'%"></div></div>';
  if(quizAnswered>=quizQuestions.length&&quizMode!=='meaning')h+='<button class="action-btn" onclick="setQuizMode(\''+quizMode+'\')" style="margin-left:auto;font-size:.8em">New Set</button>';
  h+='</div><div class="quiz-container">';

  quizQuestions.forEach((q,qi)=>{
    const answered=qi<quizAnswered;
    h+='<div class="quiz-q"><div class="q-text">'+(qi+1)+'. '+q.q+'</div><div class="quiz-options">';
    q.opts.forEach((o,oi)=>{
      let cls='quiz-opt';
      if(answered){cls+=' disabled';if(oi===q.ans)cls+=' correct'}
      h+='<div class="'+cls+'" onclick="answerQuiz('+qi+','+oi+')">'+o+'</div>';
    });
    h+='</div></div>';
  });
  return h+'</div>';
}

function answerQuiz(qi,oi){
  if(qi<quizAnswered)return;
  const q=quizQuestions[qi];
  const correct=oi===q.ans;
  if(correct)quizCorrect++;
  quizAnswered++;
  if(q.wordKey)markWord(q.wordKey,correct);
  const L=LESSONS[currentLesson];
  const sec=document.getElementById('sec-quiz');
  const opts=sec.querySelectorAll('.quiz-q:nth-child('+(qi+1)+') .quiz-opt');
  opts.forEach((o,i)=>{o.classList.add('disabled');if(i===q.ans)o.classList.add('correct');if(i===oi&&!correct)o.classList.add('wrong')});
  const bar=sec.querySelector('.progress-fill');
  if(bar)bar.style.width=quizAnswered/quizQuestions.length*100+'%';
  const score=sec.querySelector('.score');
  if(score)score.textContent=quizCorrect;
}

function renderProgress(L){
  const st=getLessonStats(L);
  const allTotal=LESSONS.reduce((s,l)=>s+l.vocab.length,0);
  const allMastered=LESSONS.reduce((s,l)=>s+getLessonStats(l).mastered,0);
  const allWords={};
  LESSONS.forEach(l=>l.vocab.forEach(v=>{const w=progress.words[v.c];if(w)allWords[v.c]=w}));
  const allUnique=Object.keys(allWords).length;

  let h='<h2>📊 Progress — '+L.title+'</h2>';

  h+='<div class="stats-grid">'+
    '<div class="stat-card accent"><div class="num">'+st.total+'</div><div class="label">Total Words</div></div>'+
    '<div class="stat-card green"><div class="num">'+st.mastered+'</div><div class="label">Mastered (Box 4-5)</div></div>'+
    '<div class="stat-card yellow"><div class="num">'+st.learning+'</div><div class="label">Learning (Box 1-3)</div></div>'+
    '<div class="stat-card blue"><div class="num">'+st.new+'</div><div class="label">Not Seen Yet</div></div>'+
    '</div>';

  const sk=progress.streak;
  h+='<div class="streak-display"><span class="fire">🔥</span><span class="count">'+sk.count+'</span><span class="label">day streak</span></div>';

  h+='<div class="mastery-chart"><h3>Mastery Distribution</h3>';
  const maxBox=Math.max(...st.boxes,1);
  for(let i=0;i<5;i++){
    const pct=Math.round(st.boxes[i]/maxBox*100);
    h+='<div class="chart-row"><div class="box-label">'+BOX_LABELS[i]+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+BOX_COLORS[i]+'"></div></div><div class="count">'+st.boxes[i]+'</div></div>';
  }
  h+='</div>';

  h+='<p style="color:var(--text2);margin-bottom:20px;font-size:.9em">Across all lessons: '+allMastered+' mastered out of '+allTotal+' total words ('+allUnique+' unique words studied).</p>';

  h+='<div class="action-row">'+
    '<button class="action-btn" onclick="exportProgress()">📥 Export Progress</button>'+
    '<button class="action-btn" onclick="document.getElementById(\'importFile\').click()">📤 Import Progress</button>'+
    '<button class="action-btn danger" onclick="resetProgress()">🗑 Reset All Progress</button>'+
    '<input type="file" id="importFile" class="hidden-input" accept=".json" onchange="importProgress(this)">'+
    '</div>';

  return h;
}

function exportProgress(){
  const blob=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='cantonese-progress-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

function importProgress(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const d=JSON.parse(e.target.result);
      if(d.version===1&&d.words){
        progress=d;saveProgress();
        initFcSession();
        quizQuestions=LESSONS[currentLesson].quiz.map(q=>({...q}));
        quizAnswered=0;quizCorrect=0;
        render();
      }else{alert('Invalid file format')}
    }catch(err){alert('Invalid file format')}
  };
  reader.readAsText(file);
}

function resetProgress(){
  if(!confirm('Reset all learning progress? This cannot be undone.'))return;
  progress={version:1,streak:{lastDate:'',count:0},words:{}};
  saveProgress();
  initFcSession();
  quizQuestions=LESSONS[currentLesson].quiz.map(q=>({...q}));
  quizAnswered=0;quizCorrect=0;
  render();
}

document.addEventListener('keydown',function(e){
  const fc=document.getElementById('sec-flashcards');
  if(!fc||!fc.classList.contains('active'))return;
  if((e.key===' '||e.key==='Enter')&&!fcSessionDone&&fcQueue.length>0){
    e.preventDefault();
    const card=fc.querySelector('.flashcard');
    if(card)fcFlip(card);
  }else if(e.key==='ArrowRight'&&fcFlipped&&!fcSessionDone){
    e.preventDefault();fcAnswer(true);
  }else if(e.key==='ArrowLeft'&&fcFlipped&&!fcSessionDone){
    e.preventDefault();fcAnswer(false);
  }
});

init();
</script>
</body>
</html>
